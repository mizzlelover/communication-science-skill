platform_name: 微信朋友圈（WeChat Moments）
last_updated: "2026-09"
fact_confidence_summary: >-
  信息基础：朋友圈为公开可见的产品形态——无自然内容算法、共同好友可见、
  时间流排列；文字折叠等具体阈值为行业观察而非官方数值。
  2026-09-08 已实取官方源并登记于 platform_sources（S1-S3）：腾讯客服《微信朋友圈怎么设置权限》
  （朋友权限/可见范围/不看他/陌生人十条）、腾讯客服《转发/分享内容到朋友圈》
  （分组可见/非双向好友不可见）、腾讯客服《发送朋友圈失败怎么办》（诱导分享行为与违规限制），
  正文均实际抓取核验。known_platform_patterns 已逐条标注 evidence_level（L1=官方文档实际读到并支持；
  L2=已验证观察；L3=行业共识；L4=推测）、source_ref 与 last_verified: "2026-09"。
  所有标注以平台最新公告为准，使用 update_platform_knowledge 流程复核。

