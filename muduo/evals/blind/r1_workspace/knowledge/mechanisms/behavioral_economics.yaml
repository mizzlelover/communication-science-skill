- id: present_bias
  canonical_name_en: Present Bias
  canonical_name_zh: 现时偏差
  aliases:
  - 现时偏误
  - 双曲贴现
  - hyperbolic discounting
  - β-δ 模型
  domain: behavioral_economics
  definition: 现时偏差指相对于『现在』的时间点，人们系统性地过度贴现近期与远期之间的权衡：今天与明天的差异被放大，而第 100 天与第 101 天几乎无差异（准双曲/β-δ 贴现结构，Laibson
    等的形式化）。O'Donoghue 与 Rabin 进一步区分天真型（naïve，低估自己未来的现时偏差）与老练型（sophisticated，会用承诺装置）。与 immediate_vs_delayed_rewards
    的关系：该节点是跨期决策的经济学形式化层，后者是奖励价值结构层。
  core_claim: 时间贴现不恒定：临近当下的贴现率陡峭，导致计划与执行系统性脱节，且多数人低估自己的偏差（天真型）。
  mechanism: 近期选项的感官可得性与竞争直接挤占远期价值表征；准双曲结构使『以后的我』承担计划成本而『现在的我』享受即时收益，产生自控的代际冲突；天真型因此不断重签计划而不执行，老练型采用承诺装置（锁定、罚款、公开承诺）对冲（S12、S11）。
  causal_chain: 奖励临近 → 贴现率陡增 → 即时替代选项胜出 → 计划-执行脱节 →（老练者）使用承诺装置纠偏
  variables:
    inputs:
    - 奖励时间结构
    - 即时替代可得性
    - 承诺装置可及性
    moderators:
    - 自我觉察（天真/老练）
    - 奖励规模
    - 环境稀缺状态
    mediators:
    - 贴现率的时间结构
    - 对未来自我的认同
    outputs:
    - 计划完成率
    - 储蓄与健康行为
    - 拖延频率
  evidence:
    supporting:
    - 双曲贴现的动物与人类实验证据（Ainslie 方向）与 Laibson 的准双曲形式化（S12 综合）
    - Thaler 与 Benartzi『明天多储蓄』计划的现场成功（承诺装置应用）
    conflicting:
    - Andreoni 与 Sprenger 的凸时间预算实验在特定设计下现时偏差证据有限，提示任务形式影响其显现（方法学争议）
    replication:
    - 计划-执行脱节与承诺需求的现象广泛记录；β-δ 作为精确参数模型仍有争议。评级按枚举记 B
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 选择涉及真实的跨期权衡且即时替代存在时最强
  - 对习惯化行为与情境剧变后的新计划尤其明显
  failure_conditions:
  - 把所有拖延归因现时偏差（动机不足、任务设计问题同样致拖延）
  - 承诺装置被绕过成本低（随时可解除）时失效
  common_misinterpretations:
  - 把现时偏差当道德缺陷（懒）；它是贴现结构问题，设计与制度干预（默认、承诺）比说教有效
  ethical_risks:
  - 金融产品反向利用现时偏差（先享受后重付的隐性负债结构）
  examples:
    original_cases:
    - Misbehaving（S12）中的储蓄与自控章节；Nudge（S11）中的『明天多储蓄』案例
    research_cases:
    - Ainslie 的贴现实验传统；『明天多储蓄』计划的评估研究
    modern_cases:
    - 会员年费打折 vs 月费、付费打卡承诺金、『先上课后付费』的教育分期
  communication_implications: 把远期收益转译为当下可见的小反馈，并提供可自选的承诺装置（押金打卡、公开进度），尊重自主同时降低偏差成本。
  community_implications: 社群挑战用群体承诺与固定时间锚对冲个体现时偏差；押金制需透明退还规则。
  content_applications:
    title: 把长期目标切成『今天可见』的里程碑标题
    cta: 『现在锁定位子，开课前可全额退』——承诺装置+低后悔路径
  platform_implications: 平台的 streak、冻结奖励等机制是现时偏差的制度化对冲；反向设计（先甜后苦的订阅结构）则成为消费者保护议题。
  related_nodes:
