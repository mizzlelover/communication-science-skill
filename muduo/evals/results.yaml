    演示数据），再按论证需要取舍——合并引流+内容、Cut 工具节、Expand 复购/转化；拒绝 等权结构+每节金句（完备性幻觉抛光）；向用户说明"全面"的代价：读者只为一个可转述的 判断停留。Platform（zhihu）：title_role"一文读懂"式收敛为具体主张；search_mechanism
