  - flow_state
  - self_efficacy
  - sense_of_community
  - participation_ladder
  - need_to_belong
  source_ids:
  - S14
  - S15
  - S118
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Deci & Ryan 2000 SDT 核心论文（S118，Psych Inquiry 11:227，abstract_only）+ Deci, Koestner
      & Ryan 1999 元分析（128 项实验）
    effect_size: 三需要满足→内在动机/幸福感；预期性有形奖励对内在动机的削弱（过度理由效应）
    replication_status: 三因素结构与需要满足-动机联结获大量跨文化重复；测量工具效度是主要争议
    context_dependency: 挤出效应依赖奖励预期性与任务内在趣味；自主支持情境是关键调节
    downgrade_upgrade_reason: 2026-09 补充 SDT 一手奠基论文（S118，abstract_only 如实标注），由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
  provenance:
