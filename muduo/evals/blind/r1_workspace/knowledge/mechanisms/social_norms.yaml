- id: norm_messaging_effects
  canonical_name_en: Normative Messaging Effects (incl. Boomerang Effect)
  canonical_name_zh: 规范信息传达（含回旋镖效应）
  aliases:
  - boomerang effect
  - 规范反馈干预
  domain: social_norms
  definition: 通过传达规范信息（他人实际在做什么、他人期待什么）改变行为的干预路径，代表应用是 Schultz 等 2007 年的居民能耗规范反馈实验；其核心警示是回旋镖效应（boomerang
    effect）：描述性规范信息会把低于均值者推向均值，产生与干预目标相反的行为。
  core_claim: 规范信息只对偏离目标行为者有效，且描述性信息单独使用时必然带来均值回归（回旋镖）；必须叠加指令性信号（认可/不认可）才能防止回旋镖。
  mechanism: 个体收到他人行为分布信息后，向均值回归——高消耗者降低、低消耗者提高（Schultz 等 2007 能耗实验中观察到的双向移动）；在描述性反馈上叠加指令性信号（笑脸/赞许标记），为低消耗者提供了保持现状的社会认可，回旋镖消失。Cialdini,
    Reno 与 Kallgren 的弄脏环境实验从另一角度证明：环境中的示范线索（多少人乱扔）直接改变个体乱扔概率——规范信息是被隐式读取的。
  causal_chain: 规范信息暴露 → 与自身行为比较 → 高偏离者向目标移动 + 低偏离者回旋镖 → 叠加指令性信号 → 回旋镖被抑制
  variables:
    inputs:
    - 描述性规范信息（分布/均值反馈）
    - 指令性规范信号（认可标记）
    moderators:
    - 个体位置相对均值的方向
    - 参照群体的相关性
    - 信息真实性
    mediators:
    - 社会比较
    - 认可/不认可的预期
    outputs:
    - 目标行为改变（方向不定）
    - 回旋镖效应（无指令性修正时）
    - 行为稳定改变（双信号叠加时）
  evidence:
    supporting:
    - Schultz 等 2007 能耗规范反馈实验：描述性反馈改变能耗，叠加赞许标记后回旋镖消失
    - Cialdini, Reno 与 Kallgren 1990 传单实验：示范线索显著改变行为
    - Nolan 等 2008 的研究：规范性信息的影响力被普遍低估而实际有效（经典文献，未建包；S38 EP 无该内容）
    conflicting:
    - 效应幅度中等且异质性高，跨领域推广需谨慎（nudge 类平均效应在控制发表偏差后缩水，见 EVIDENCE.md）
    - 部分情境中指令性信号引发逆反
    replication:
    - 回旋镖效应在能源领域重复良好
    - 规范信息干预在其他行为域（回收、节水）方向一致、幅度不一
    meta_analysis:
    - 规范信息干预的元整合支持平均有效性，但强调条件依赖（与 EVIDENCE.md 对 nudge 的 C 级评估一致）
  evidence_grade: B+
  boundary_conditions:
  - 受众能准确理解自身位置与分布的关系
  - 参照群体与受众相关（同城、同户型、同水平）
  - 信息真实且可持续（虚假规范很快穿帮）
  failure_conditions:
  - 对低于均值者只发描述性信息（回旋镖）
  - 参照群体无关或信息被识破
  - 受众处于逆反敏感期（刚被说教过）
  common_misinterpretations:
  - 把『突出问题严重性』当动员——『大多数人不储蓄』式信息会让不储蓄者心安理得
  - 把回旋镖效应与心理逆反混淆：回旋镖是均值回归机制，逆反是自由威胁反应，两者常同时出现但机制不同
  ethical_risks:
  - 以虚高均值制造焦虑或以虚低均值正当化现状
  - 在健康、财务领域滥用规范施压造成伤害
  examples:
    original_cases:
    - Schultz 等 2007 能耗规范信息实验（描述性反馈+赞许标记的组合）
    - Cialdini, Reno 与 Kallgren 1990 弄脏环境实验
    - Nolan 等 2008 规范性社会影响低估研究（经典文献，未建包；S38 EP 无该内容）
    research_cases:
    - 能耗反馈田野实验
    - 酒店毛巾重复使用实验（Goldstein 等，S38 收录）
    modern_cases:
    - 账单对比设计（与邻居均值比较）
    - 运动 App 好友平均步数对比
    - 社群打卡排行对落后者的回旋镖风险
  communication_implications: 规范型内容要写清三件事：谁在做（相关参照群体）、做到什么程度（真实分布）、为什么值得做（指令性认可）；对目标受众中的『先进者』要给保持的理由而非改变的动员。
  community_implications: 社群排行与对比类功能（打卡榜、成长榜）是回旋镖高发区：需为头部提供荣誉性指令信号（防止松懈）、为尾部提供进步性参照（与自己历史比），避免全员向均值回归的平淡化。
  content_applications:
    body: 规范信息三件套：『越来越多与你相似的伙伴在定投（描述性）+ 他们普遍获得社区认可（指令性）+ 你现在处于什么位置（对照）』
    cta: CTA 给先进者留保持路径：『已经做到的伙伴，这里有一条进阶路线』，防止先进者回旋镖
    title: 标题避免『大多数人不做X』框架，用『X 人群正在做什么』框架
    evidence: 引用真实分布数据并附赞许信号（认证、徽章、社区荣誉）双轨呈现
  platform_implications: 平台比较类功能（排行榜、平均线、好友对比）是规范信息的制度化载体；nudge 类平均效应在真实平台环境中因持续可见性而放大，但同样面临回旋镖与逆反，需要分位数分层设计。
