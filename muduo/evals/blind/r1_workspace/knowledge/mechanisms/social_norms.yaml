# social_norms — 社会规范（Social Norms）：非正式规则如何塑造行为，以及如何被感知、传达与执行
domain: social_norms
nodes:
- id: norm_perception_accuracy
  canonical_name_en: Norm Perception Accuracy / Misperception
  canonical_name_zh: 规范误知觉
  aliases:
  - 规范误知觉
  - norm misperception
  - 错误共识/错误独特性偏差（规范知觉维度）
  domain: social_norms
  definition: 人们对『多数人怎么想/怎么做』的知觉经常系统性偏离真实分布：既可能高估他人对某行为的认可（错误共识效应，false consensus），也可能低估他人对某行为的认可（错误独特性效应，false
    uniqueness）——多数无知（pluralistic_ignorance）与沉默螺旋都是规范误知觉的产物。Bicchieri 的规范诊断框架正是为纠正这种知觉失真而设计。
  core_claim: 规范干预的第一步不是传播规范，而是测量规范知觉的偏差方向；找错偏差方向会使干预无效甚至有害。
  mechanism: 个体无法直接观察他人的私下态度，只能依赖公开行为与自身立场做推断，产生系统性偏差：高自我相关行为者倾向于高估其普遍性（错误共识），低自我相关但社会赞许行为者倾向于低估其普遍性（错误独特性）。媒体与算法进一步放大可见的极端样本，使『多数』知觉偏离真实分布。基于错误知觉设计的规范信息（如『大家都违规』）会固化错误常态。
  causal_chain: 公开行为可见性有限 + 自我参照推断 → 系统性知觉偏差 → 基于偏差的规范判断 → 行为跟着错误规范走
  variables:
    inputs:
    - 公开行为样本的可见性
    - 自我行为与立场
    - 媒介与算法的曝光结构
    moderators:
    - 群体沟通密度
    - 匿名性
    - 话题敏感性
    mediators:
    - 对他人态度的推断策略（自我参照/可得性启发）
    outputs:
    - 规范误知觉（高估/低估）
    - 相应的从众行为偏移
    - 规范干预效果的方向性错误
  evidence:
    supporting:
    - 错误共识效应与错误独特性效应的多项实验（社会心理教科书综述）
    - Prentice 与 Miller 的饮酒规范研究：学生普遍高估同伴对饮酒的认可（经典文献，已建包 EP S213）
    - Bicchieri 的规范诊断田野研究：多处测量到规范知觉与真实分布的系统性错位（S28）
    conflicting:
    - 知觉偏差幅度随话题、群体、测量方法变化
    - 紧密小群体中因信息透明偏差较小
    replication:
    - 错误共识与错误独特性在多文化样本中重复
    - 规范误知觉的干预修正效果在部分田野研究中得到验证
    meta_analysis:
    - 无覆盖全域的权威 meta-analysis；以系列实验与田野诊断研究为主
  evidence_grade: B
  boundary_conditions:
  - 他人态度不可直接观察、须靠推断的场景
  - 公开行为样本受选择性表达污染的场景
  - 话题敏感、表态有成本时偏差更大
  failure_conditions:
  - 态度已充分公开表达且信息透明
  - 小规模高透明群体
  - 存在权威性态度分布数据且被广泛知晓
  common_misinterpretations:
  - 把错误共识与错误独特性混为一谈——两者方向相反，干预策略完全不同
  - 误以为公开表态多=真实支持多（忽略了多数无知与表达成本）
  ethical_risks:
  - 以错误规范知觉为基础的干预可能固化有害常态
  - 利用规范误知觉制造虚假多数
  examples:
    original_cases:
    - Ross 等的错误共识效应实验（社会心理教材综述传统）
    - Bicchieri《Norms in the Wild》的规范诊断框架（S28）
    research_cases:
    - 大学生饮酒规范知觉研究（Prentice 与 Miller，已建包 EP S213）
    - 社区回收规范知觉与实际回收率偏差的田野研究
    modern_cases:
    - 社交媒体热榜使用户高估极端立场的普遍性
    - 职场中对加班文化支持度的误判
    - 投资社群对『多数人看多/看空』的知觉失真
  communication_implications: 任何规范型内容发布前，应先确认受众对规范的知觉偏差方向：高估普遍性时做『其实没那么多人在做』的校准，低估时做『很多人和你一样』的揭示——方向搞反则回旋镖。
  community_implications: 社群运营应定期用匿名调查测量成员对规范（发言频率、消费水平、行为期待）的真实知觉与实际分布的差距，把差距作为内容选题与干预的输入，而非凭运营者直觉。
  content_applications:
    body: 用匿名调查数据校准内容中的规范陈述：『你可能以为身边没人在定投，实际上我们后台数据显示…』（真实数据）
    evidence: 呈现真实分布而非个案：以分布图、中位数替代极端案例作为规范证据
    opening: 以知觉校准开场：『先纠正一个错觉——』直接激活受众对自身判断的反思维
    comments: 用匿名投票收集真实态度后公开结果，持续纠正评论区规范知觉
  platform_implications: 算法把互动量当作规范信号，公开行为样本的偏差被推荐系统进一步放大（极端内容更易见），从结构上加剧规范误知觉；匿名投票等低表达成本组件是平台层纠偏工具。
  related_nodes:
  - pluralistic_ignorance
  - descriptive_injunctive_norms
  - norm_messaging_effects
  - social_proof
  - filter_bubble_echo_chambers
  - availability_heuristic
  source_ids:
  - S28
  - S27
