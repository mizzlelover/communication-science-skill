  grade_justification:
    independent_studies: Thaler 2015（S12，沉没成本与续投陷阱）+ Kahneman 2011（S01，损失厌恶解释）
    effect_size: 已投入使继续投入倾向上升（经典决策偏差）
    replication_status: 沉没成本谬误广泛复制（投资/项目/消费场景）
    context_dependency: 投入可逆性/问责制/决策显性调制
    downgrade_upgrade_reason: 2026-09 实取 S12 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
  provenance:
    primary_sources:
    - S12
