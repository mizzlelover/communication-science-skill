# community — 社群（Community）：从社区感到治理机制
domain: community
nodes:
- id: sense_of_community
  canonical_name_en: Sense of Community
  canonical_name_zh: 社区感
  aliases:
  - SOC
  - 心理社区感
  domain: community
  definition: 社区感（sense of community）由 McMillan 与 Chavis 于 1986 年提出，是「成员对群体的归属感、相互重要性与共同纽带」的体验。其经典四要素模型：membership（成员资格：边界、情感安全、归属与认同、个人投入、共同符号系统）、influence（相互影响：成员对群体的影响与群体对成员的影响）、integration
    and fulfillment of needs（需求整合与满足：共享资源、价值与需求满足）、shared emotional connection（共享情感联结：共同历史、时间、经历、重要事件与荣誉）。
  core_claim: 社区感由成员资格、相互影响、需求满足与共享情感联结四要素共同产生，缺一不可；只有四要素同时被设计进社群，成员才会从「用户」变成「我们」。
  mechanism: 社区感不是人群聚集的自然产物：清晰的边界与共同符号（membership）让人敢于投入与暴露，相互影响（influence）证明个体的参与能改变群体、群体的规范也能约束个体，需求整合（integration）让成员感到留在这里有实际收获，而共同经历的情感事件（shared
    emotional connection）把以上三者黏合成「我们」的叙事；McMillan & Chavis 将 influence 视为四要素中最重要者（S134）。四要素相互增强：投入产生联结，联结加深影响，影响留住成员。
  causal_chain: 边界与符号（membership）+ 相互影响（influence）+ 需求满足（integration）+ 共同情感事件（shared connection）→ 归属体验
    → 成员投入与留存
  variables:
    inputs:
    - 边界与符号系统的清晰度
    - 成员发言对群体的实际影响
    - 群体资源与需求匹配
    - 共同经历事件
    moderators:
    - 群体规模（影响可感知度）
    - 成员相似性
    - 沟通频率
    mediators:
    - 归属感
    - 认同感
    - 安全感
    outputs:
    - 成员留存
    - 投入意愿
    - 社区凝聚力与维护行为
  evidence:
    supporting:
    - McMillan & Chavis 1986 的理论与研究综述：四要素模型及其测量传统（经典论文与后续量表）
    - 基于 Sense of Community Index 的研究在邻里、学校、组织与在线社区多情境重复（量表研究传统，方向一致）
    conflicting:
    - 对四要素的因子结构存在多种测量分歧（不同研究提取出 1-4 因子不等）（测量文献讨论）
    - 在线社区中「共享情感联结」的达成路径与线下社区不同，直接移植线下结论存在偏差（在线社区研究讨论）
    replication:
    - 社区感与参与、留存、幸福感的正相关在多情境重复；四要素结构本身有测量层面的争议
    meta_analysis: []
  evidence_grade: B+
  boundary_conditions:
  - 四要素模型适用于有持续互动可能的群体；纯流量型「社区」（无重复互动）不适用
  - 群体规模影响要素结构：超大群体中 membership 退化为身份标签而非真实关系
  failure_conditions:
  - 只做归属感（membership）不做相互影响：成员感到温暖但无权力，最终沉寂
  - 只谈需求满足不建立情感联结：成员像消费者，价格战一来即散
  common_misinterpretations:
  - 「建个群就有社区感」——社区感需要四要素的制度化设计，人数与社区感无必然关系
  - 把社区感等同于满意度：满意度是消费者评价，社区感是成员认同，前者可被竞品替代，后者不能
  ethical_risks:
  - 利用归属感制造退出成本（情感绑架式运营）与群体压力（「真正的成员都会……」）
  examples:
    original_cases:
    - McMillan & Chavis 对邻里社区、互助团体等场景的理论建构与案例（1986 论文）
    research_cases:
    - Sense of Community Index 在邻里、宗教、学校与在线社区的应用研究（量表传统）
    modern_cases:
    - 跑团社群的入团仪式、配速文化与年度赛事共同经历（四要素齐全）
    - 品牌会员社区因只发优惠券而无相互影响而沦为优惠券群
  communication_implications: 传播话语使用「我们」叙事并讲共同历史（「三年前我们开始……」）；对外内容呈现真实成员互动而非官方单向广播，让旁观者看见一个「活着的我们」。
  community_implications: 以四要素做社群体检：边界是否清晰（入群门槛与身份符号）、成员是否真的影响社群（提案被采纳）、需求是否被整合（互助资源）、是否制造共同情感事件（仪式、战役、里程碑）。
  content_applications:
    body: 正文以「我们的共同问题」开头，引用具体成员的故事与贡献（强化 membership 与 integration）
    narrative: 定期发布社群编年史内容（本月大事记、成员高光），累积 shared emotional connection
    comments: 把优质成员发言纳入正式内容（精选、置顶），兑现 influence 要素
    sharing: 设计社群专属符号（梗、黑话、徽章）让分享自带身份标识
  platform_implications: 平台功能映射四要素：成员徽章（membership）、投票与共创（influence）、资源库（integration）、年度回顾（shared connection）；平台工具的完备度决定社区感的可实现上限（原则性判断）。
