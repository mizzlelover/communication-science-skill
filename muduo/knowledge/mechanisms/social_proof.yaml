# social_proof — 社会认同（Social Proof）：他人行为如何成为我们的信息
domain: social_proof
nodes:
- id: social_proof
  canonical_name_en: Social Proof
  canonical_name_zh: 社会认同（从众证据原则）
  aliases:
  - informational social influence
  - 社会认同原则
  domain: social_proof
  definition: Cialdini 六原则之一：在不确定情境中，人们把『许多人在做』本身当作正确性证据——他人的行为成为启发式信息流，尤其当情境模糊、他人与我们相似或人数众多时。它整合了信息性与规范性两种影响，是应用最广的从众证据原则。
  core_claim: 不确定性与相似性越高，『很多人在做』对行为的拉动越强；但该效应受规范类型与身份匹配调节，并非万能开关。
  mechanism: 面对不确定，个体以他人行为作为效度代理（他们大概知道我不知道的）——这是信息捷径；同时跟随多数可降低社交风险——这是规范压力。两者叠加使人数信息具备双重说服力。相似性提升参照群体与自我的关联（『这类人像我』），相似群体的行为证据比泛化人数更有效。当证据与受众身份不匹配或被识破伪造时，效应反转。
  causal_chain: 情境不确定 → 他人的行为可见 → 作为正确性启发式 + 规范压力 → 跟随行为 → 进一步放大可见人数（滚雪球）
  variables:
    inputs:
    - 他人行为可见性（人数、热度、销量）
    - 相似他人识别
    - 情境模糊度
    moderators:
    - 相似性（参照群体匹配）
    - 规范类型（描述性vs指令性）
    - 证据真实性
    - 竞争性vs合作性自我建构
    mediators:
    - 共识推断（大家都这么做应该没错）
    - 社会验证感
    outputs:
    - 跟随行为（购买/参与/转发）
    - 信任转移
    - 从众性口碑扩散
  evidence:
    supporting:
    - Asch 从众线段实验证明群体一致意见的强大压力（详见 conformity_asch）
    - Cialdini, Reno 与 Kallgren 1990 被丢弃传单实验：先行示范显著改变乱扔垃圾行为——规范线索可被设计
    - Schultz 等 2007 能耗规范信息实验：描述性规范反馈改变居民用电行为（与指令性规范结合可避免回旋镖效应）
    - Goldstein 等的酒店毛巾重复使用实验：『多数住客重复使用毛巾』的规范信息提升环保行为（S38 案例收录）
    conflicting:
    - 当受众身份与示范群体不匹配时，社会认同提示可反效果
    - 对独特性需求高的个体，跟随多数反而降低购买意愿
    replication:
    - 基础效应稳健（EVIDENCE.md 定级 A-），但效果受规范类型与身份匹配调节
    - 大田实验与实验室结果方向一致，效应量中等
    meta_analysis:
    - 规范信息干预的 meta 综合显示平均效应存在但幅度中等、异质性高
  evidence_grade: A-
  boundary_conditions:
  - 受众处于不确定、缺乏直接判断依据的情境
  - 示范他人与受众相似或属于 aspirational 群体
  - 证据可被感知为真实（非伪造热度）
  failure_conditions:
  - 受众对该领域有强既有态度或专业知识时，人数证据效力衰减
  - 示范群体被受众视为外群体或反感对象时反效果
  - 虚假热度被识破（水军曝光）引发信任崩塌
  common_misinterpretations:
  - 把『刷销量、刷好评』当社会认同——被识破的伪证会反噬并污染整个信源
  - 忽视相似性：展示与自己完全不同的人群（明星、极端头部）时说服力大幅衰减
  ethical_risks:
  - 伪造热度与虚假好评
  - 利用刷单制造虚假共识误导消费决策
  examples:
    original_cases:
    - Cialdini《Influence》对社会认同原则及罐头笑声、 bystander 案例的论述（S32）
    - Goldstein 等的酒店毛巾实验（收录于 S38）
    research_cases:
    - Cialdini, Reno 与 Kallgren 1990 弄脏环境实验：先行示范显著改变乱扔垃圾行为
    - Schultz 等 2007 能耗反馈实验：描述性规范+赞许提示的组合效果
    - Asch 线段实验中的从众压力
    modern_cases:
    - 电商『已售 X 万件』、直播间在线人数与滚动成交提示
    - 知识付费『XX 人正在学』
    - App Store 榜单与豆瓣评分作为消费决策代理
  communication_implications: 内容中要嵌入可见、可验证、与受众相似的『他人行为』：真实买家秀、真实参与进度、真实评价分布；比人数更有效的是『和你一样的人』的实证。
  community_implications: 社群冷启动阶段尤其依赖社会认同：可见的高质量问答、真实成员反馈与活跃示范是最强招募与留存信号；创始期应人工维护真实互动密度，而非买量填人数。
  content_applications:
    title: 标题嵌入真实集体信号：『三个月里 400 位会员写下的避坑笔记』
    evidence: 用真实用户行为数据（留存、复购、完课率）而非抽象形容词作为可信度锚点
    cta: CTA 强调正在进行的集体行动：『今天已有 XX 位加入』（必须真实）
    comments: 评论区置顶真实用户的使用细节与提问，让新访客看见活的使用现场
  platform_implications: 平台的评分、销量、在线人数等指标是社会认同的基础设施；同时刷量灰产与算法展示的博弈持续存在——算法对互动信号加权越高，伪造动机越强（参见 bot_amplified_social_proof）
