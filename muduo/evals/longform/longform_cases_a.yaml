    用户请求："这篇研究报告下周提交评审，帮我检查专业术语用得对不对。"
    材料信息：行业研究报告《零售企业数字化资产运营研究》，全文约 8500 字，共 7 节；全文中"用户资产""私域资产""客户资本"三个词交替出现合计 23 次，所指对象高度重叠但定义边界不一。（演示数据）
    节选（三处）：
    第 1 节："本文讨论的核心概念是用户资产：企业拥有的、可反复触达且无需额外付费的用户关系总和。"
    第 4 节："私域资产的质量决定了数字化转型的成败。这里私域资产指会员、社群粉丝与企业微信好友的总和。"
    第 6 节："客户资本的沉淀不是一日之功。客户资本除了可触达的关系之外，还包含品牌认知与情感联结，后者往往被低估。"
  context: {platform: wechat_official, goal: comprehension, audience: "行业评审专家与企业数字化负责人"}
  expected_behavior: >-
    必须产出 concept_registry：登记三个名字的出现位置与各自定义，判定为一概念多名 + 前后定义漂移（第 1 节"无需额外付费"→第 4 节"会员+社群+企微"→第 6 节"另含品牌认知与情感联结"，外延不一致）；
    必须给出统一决策建议：保留一个主名（评估哪个与评审语境最贴合）、在首次出现处给出唯一规范定义、其余两词列为别名或删除，并说明统一后需回改全文 23 处；
    必须引用 conceptual_coherence 与 schema_formation（术语漂移迫使读者反复重建图式）。
