- id: goal_gradient_effect
  canonical_name_en: Goal-Gradient Effect
  canonical_name_zh: 目标梯度效应
  aliases:
  - 目标梯度
  - goal gradient hypothesis
  domain: motivation
  definition: 目标梯度效应指投入动机随与目标距离缩短而加速：越接近完成，单位努力越大、速率越快。Hull 在动物学习中提出该假说，Kivetz、Urminsky 与 Zheng 于 2006
    年在人类忠诚计划中给出经典现场证据。与 endowed_progress_effect 的关系：目标梯度描述『距离-速率』函数，人为进度效应则通过前移起点操纵该函数。
  core_claim: 剩余距离越短，达成目标的行为速率越高；感知进度而非实际进度驱动加速。
  mechanism: 接近目标提升了完成价值的感知权重与失败厌恶，剩余努力显得更可承受；进度反馈将抽象目标变为可感差异，触发『差一点点』的完成张力（与 zeigarnik_effect 的未完成张力相通）；距离感知重新校准努力分配（S71、S72）。
  causal_chain: 感知剩余距离缩短 → 完成价值与失败厌恶权重上升 → 行为速率提升 → 目标达成
  variables:
    inputs:
    - 感知剩余距离
    - 进度可见性
    - 目标价值
    moderators:
    - 目标规模
    - 进度归因（努力 vs 意外）
    - 奖励吸引力
    mediators:
    - 完成张力
    - 沉没投入感
    - 期望-价值评估
    outputs:
    - 行为速率
    - 复购与续用
    - 任务完成率
  evidence:
    supporting:
    - Kivetz、Urminsky & Zheng 2006 咖啡忠诚卡现场实验：进度越快者后续购买越快（经典文献，未建包）
    - S146（Nunes & Drèze 2006，abstract_only）：效应取决于对任务完成度的感知而非沉没成本——支撑『感知进度驱动努力』半边（S146 仅摘要级支持）
    - Hull 1932 动物学习的目标梯度假说及后续学习理论传承（经典理论）
    conflicting:
    - 目标过大或进度缓慢时出现反向放弃；梯度效应在价值感低的目标上消失（边界研究）
    replication:
    - 现场实验与会员数据分析多次重复方向。评级按枚举记 B
    meta_analysis: []
  evidence_grade: B
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 目标对个体有价值且进度可被感知
  - 剩余距离处于『可完成』区间（过远则梯度不启动）
  failure_conditions:
  - 规则复杂到进度不可理解（跨年清零、复杂倍率）时，梯度感消失
  - 目标被感知为商家操纵（永远差一格）时触发抗拒
  common_misinterpretations:
  - 把目标梯度当成『把目标设大点更努力』；过大的目标只产生放弃，梯度发生在可完成区间内
  ethical_risks:
  - 用虚假进度或人为抬高门槛诱导过度消费（凑单、刷任务）
  examples:
    original_cases:
    - 营销管理（S71）等对忠诚计划积分设计的讨论
    research_cases:
    - Kivetz、Urminsky & Zheng 2006 忠诚卡实验；Hull 的动物学习研究
    modern_cases:
    - 会员成长进度条、打卡距下一奖励还差 N 次、众筹进度百分比
  communication_implications: 所有进度型沟通都应显示『还差多少』与『已完成多少』，并把中间里程碑做成可庆祝节点。
  community_implications: 社群挑战（如 21 天活动）公开成员集体进度，用群体接近感放大个体梯度。
  content_applications:
    title: 进度外显式标题：『已完成 80%，最后两步』
    body: 在内容中段与结尾重复显示进度反馈，维持完成张力
  platform_implications: 平台把任务进度做成默认可见组件（连续签到、等级条）即是在系统层面安装目标梯度；进度条设计质量直接决定留存曲线。
