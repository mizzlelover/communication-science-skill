      body: "呈现对立观点的公允转述可提升可信度（inoculation_theory 邻接）"
      sharing: "给转发者提供'表达观点而非站队攻击'的转发言口"
    platform_implications: 社交分发平台（朋友圈/视频号）茧房机制是人际的；算法平台是信号回环的。适配策略不同：前者靠关系链破局，后者靠搜索与探索流量。
