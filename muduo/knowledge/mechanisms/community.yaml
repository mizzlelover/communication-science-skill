- id: participation_ladder
  canonical_name_en: Participation Ladder / 90-9-1 Rule
  canonical_name_zh: 参与阶梯
  aliases:
  - 1% 法则
  - 90-9-1 规则
  - participation inequality（参与不平等）
  domain: community
  definition: 参与阶梯（participation ladder）指社群与线上社区的参与高度不均匀分布：大多数观测到的社区呈现「90% 潜水、9% 偶尔互动、1% 持续创作」的金字塔结构（90-9-1
    规则，Jakob Nielsen 提出的经验概括）。阶梯视角强调参与是分层的：潜水者 → 点赞者 → 评论者 → 贡献者 → 核心维护者，各层之间需要明确的上升通道。
  core_claim: 社群的绝大多数成员不产生可见内容，少数核心成员生产绝大多数价值；健康社群的关键不是消灭潜水（不可能也不必要），而是维护阶梯的完整性与各层之间的流动性。
  mechanism: 参与不平等的成因是行为成本与收益的结构性差异：潜水免费且安全（无被评价风险），创作昂贵且暴露（需要时间、才华与心理安全）；因此贡献集中于少数高投入、高身份收益的成员。阶梯各层的转换需要外部推力：从潜水到点赞（降低成本：一键即可）、从点赞到评论（给予回应激励）、从评论到创作（给予认可与编辑支持）、从创作到维护（给予权限与地位）。
  causal_chain: 行为成本/收益分层 → 参与金字塔形成 → 阶梯各层的转换成本决定流动性 → 流动性决定社群代谢健康
  variables:
    inputs:
    - 各层行为的成本结构
    - 各层的可见回报
    moderators:
    - 社群规模（大社群顶部更尖）
    - 创作工具门槛
    - 心理安全氛围
    mediators:
    - 成本-收益感知
    - 身份收益累积
    outputs:
    - 参与分布形态
    - 核心层规模与代谢率
    - 内容供给量
  evidence:
    supporting:
    - 多平台观测显示线上社区贡献分布高度偏斜（Jakob Nielsen 的经验概括与后续平台观测，方向一致）
    - Wikipedia 等大型协作社区的编辑分布研究重复确认头部集中（协作研究传统）
    conflicting:
    - 90-9-1 的具体比例因社区类型、平台与测量口径而显著波动，不是普适常数（测量讨论）
    - 一些社区实践显示潜水者通过阅读获得价值（潜水的正向价值），不应被简单视为待转化对象（社区研究讨论）
    replication:
    - 「贡献高度集中」的方向跨平台稳定；具体数字不可外推
    meta_analysis: []
  evidence_grade: C
  boundary_conditions:
  - 90-9-1 是经验法则：具体比例随平台互动成本（一键转发降低潜水层比例）与社群类型变化
  - 适用于开放社区；强门槛小社群（付费、审核）分布更均匀
  failure_conditions:
  - 把「消灭潜水」当运营目标：强行@潜水者、强制发言会触发 reactance 与流失
  - 只激励顶层（创作大赛）忽视中间层（评论者、点赞者）：阶梯断层，核心层失去基础观众与递补来源
  common_misinterpretations:
  - 「90-9-1 证明社群就该有 90% 死人」——它是描述性规律不是设计目标；各层比例可通过互动成本设计显著改变
  - 把参与不平等视为公平问题：阶梯的关键是流动性（想上来的人有通道），不是平均主义
  ethical_risks:
  - 以数据化排名公开羞辱低参与成员（强制活跃考核），把社群变成绩效监狱
  examples:
    original_cases:
    - Jakob Nielsen 对线上社区参与不平等的概括（经验法则的来源）
    research_cases:
    - Wikipedia 编辑贡献分布的研究（协作社区研究传统）
    modern_cases:
    - 微信群「潜水者占绝大多数、活跃者几十人、核心维护者三五人」的常见结构
    - B 站 UP 主（1%）— 弹幕党（9%）— 白嫖观众（90%）
  communication_implications: 内容应为各层设计参与入口：给潜水者可读的获得感（体系化正文）、给点赞者轻互动位（投票）、给评论者讨论题、给创作者二次创作素材（梗、模板）。
  community_implications: 运营重心是阶梯的「转换设计」：降低每层上升的边际成本（评论模板、选题池、代发服务），并公开认可每次层级跃迁（本周最佳首评、新人创作者）——核心层总会耗竭，阶梯流动性是社群的代谢系统。
  content_applications:
    body: 正文结尾按阶梯分层给行动选项：看懂即可 / 投个票 / 留个经验 / 投稿展开
    comments: 识别并置顶高质量首评（潜水者向评论层跃迁的样本），运营回应优先给首次发言者
    sharing: 为不同层准备不同分享物：转发即参与的轻量卡片 vs 可二次创作的模板素材
  platform_implications: 平台互动按钮的成本设计直接改写阶梯比例：一键三连、表情回复等轻互动把传统潜水者拉入最低可见层；平台实际在为社群设定参与成本曲线（原则性判断）。
