      effect_size: "默认选项显著影响选择（自动加入退休/器官捐献）；效应稳健但规模化幅度有限（DellaVigna & Linos 1.4pp）"
      replication_status: "默认效应多情境复制稳健；具体 nudge 类型差异大（S108 复核）"
      context_dependency: "默认需可轻易退出（非强制）；价值-行动差距场景最强"
      downgrade_upgrade_reason: "2026-09 实取 S11 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S11]
      supporting_evidence: [S12, S20, S108]
