platform_name: 跨平台基线（Generic Baseline）
last_updated: "2026-09"
fact_confidence_summary: >-
  本文件不描述任何具体平台，只提炼一切内容平台共有的结构事实：创作者—平台—受众三角、
  四种基本分发模型、互动信号的通用语义分层、内容元素的角色分工。概念层框架为行业共识
  （industry_consensus 级，evidence_level L3），不含任何具体平台的硬数字约束。
  2026-09 联网实取 3 个官方源交叉支撑通用机制声明：YouTube 官方博客（推荐驱动观看量
  超过订阅与搜索）、X 官方开源推荐算法仓库（In-Network/Out-of-Network 候选、
  显式+隐式互动信号、推荐架构覆盖全产品表面）、Meta 官方透明度中心（Feed 排序四步、
  "分享=高价值信号"）。据此 distribution_model / recommendation_model /
  interaction_signals 的机制层面描述获官方交叉支撑（L1 级），known_platform_patterns
  的内容策略归纳仍为行业共识（L3）；content_constraints 首条原标 [official_rule]
  因 generic 层未实取各平台格式约束官方文档而降为 [industry_consensus]。将本基线适配到
  具体平台时，必须替换 distribution_model / content_lifecycle / title_role /
  cover_role / sharing_mechanism / community_mechanism 等平台差异字段，并按
  update_platform_knowledge 流程对该平台事实做分级复核。

