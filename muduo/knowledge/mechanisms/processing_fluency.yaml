- id: rhyme_as_reason
  canonical_name_en: Rhyme-as-Reason Effect (Keats Heuristic)
  canonical_name_zh: 押韵即有理效应
  aliases:
  - 凯茨启发式
  - Keats heuristic —— 与 fluency_truth_effect 的区别：押韵是语音形式层面的流畅性来源，是真值效应的一个特例通道
  domain: processing_fluency
  definition: 押韵的陈述被评价为比语义相同但不押韵的陈述更准确。McGlone 与 Tofighbakhsh 2000 用非洲谚语材料展示了这一效应，称之为凯茨启发式——美即真（Beauty
    is truth）的语音版。
  core_claim: 语音形式的规律性（押韵）被误归因为语义正确性，形式美直接换算成可信度。
  mechanism: 押韵降低语音加工难度，产生流畅体验；与所有流畅性来源一样，该体验被误归因为内容属性。关键在于效应独立于语义：押韵的空话仍比不押韵的同义表述更可信，说明判断者并没有真正评估语义。
  causal_chain: 押韵 → 语音加工流畅 → 误归因为准确性 → 可信度上升
  variables:
    inputs:
    - 押韵与否
    - 音韵规律性
    moderators:
    - 陈述熟悉度
    - 受众背景知识
    - 判断时间压力
    mediators:
    - 语音流畅性
    outputs:
    - 准确性评价
    - 可信度
    - 传播性
  evidence:
    supporting:
    - McGlone 与 Tofighbakhsh 2000 的非洲谚语判断实验
    conflicting:
    - 效应限于不熟悉的陈述；受众有背景知识时减弱
    replication:
    - 原始范式直接复制有限，多作为流畅性家族的概念性证据被引用
    meta_analysis: []
  evidence_grade: B
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 主要对陌生陈述起效，熟悉谚语已携带既有可信度
  - 快节奏、低卷入判断环境最强
  failure_conditions:
  - 强行押韵损害语义时适得其反（音义冲突触发警觉）
  - 受众文化中该韵律无积极联想
  common_misinterpretations:
  - 押韵等于可信——它只影响判断，不改变真假，顺口溜谣言正是反向利用
  - 把押韵当万能文案术——语义空洞的押韵只能支撑一次性传播
  ethical_risks:
  - 伪健康信息的顺口溜化传播（三句韵文式偏方）
  examples:
    original_cases:
    - S70 讨论语言形式对说服的影响时引用押韵效应
    research_cases:
    - 谚语实验：押韵版本（如 woes unite foes）被评得更准，尽管语义与不押韵版本相同
    modern_cases:
    - 经典广告顺口溜的长期记忆资产；营销号用韵文包装观点
  communication_implications: 在低卷入场景（线下口号、音频广告、社群口号）中，押韵是低成本的记忆与可信度杠杆；高卷入内容则要把资源还给论证。
  community_implications: 社群口号与仪式用语押韵化能显著提升复述率与身份认同，但要确保内容本身站得住。
  content_applications:
    title: 标题主张可用对仗或押韵压缩（在不过度牺牲语义时）
    cta: 行动口号控制在一句韵文内
    body: 用韵文做章节小结的锚点，不用韵文承载复杂论证
  platform_implications: 音频与直播场景放大语音形式的作用；平台口播文化让韵律资产的回报高于纯文本时代。
