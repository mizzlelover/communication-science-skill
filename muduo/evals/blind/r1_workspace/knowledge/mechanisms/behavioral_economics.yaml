- id: gain_loss_framing
  canonical_name_en: Gain-Loss Framing
  canonical_name_zh: 收益-损失框架
  aliases:
  - 得失框架
  - risky choice framing
  - 亚洲疾病问题
  domain: behavioral_economics
  definition: 收益-损失框架指同一期望值的问题因被表述为『救活多少人』或『死去多少人』而翻转风险偏好：收益框架下风险规避、损失框架下风险寻求（Tversky 与 Kahneman 1981
    的亚洲疾病问题是经典）。与相邻节点的分工：loss_aversion 是价值函数性质（为什么损失重），本节点是选择问题表述层（参照点如何被措辞移动）；A3 的 framing_effects 是传播/说服层的讯息框架（强调框架与等价框架），本节点属于行为决策层的等价框架（equivalence
    framing）与目标框架。Levin、Schneider 与 Gaeth 1998 的三分类（风险选择/属性/目标框架）可用于精确归位。
  core_claim: 以收益或损失措辞同一事实，会移动参照点并翻转受众的风险偏好。
  mechanism: 措辞建立参照点：『救活』把现状设为全员死亡、结果被编码为得；『死去』把现状设为全员存活、结果被编码为失；价值函数损失侧更陡导致损失框架下人们愿意冒更大风险求翻盘（S01、S12）。健康传播研究（Rothman
    与 Salovey 方向）显示预防行为宜用收益框架、检测行为宜用损失框架。
  causal_chain: 收益/损失措辞 → 参照点设定 → 结果被编码为得/失 → 风险偏好翻转 → 选择差异
  variables:
    inputs:
    - 措辞的参照点
    - 结果的确定性结构
    - 行为类型（预防/检测/治疗）
    moderators:
    - 议题卷入度
    - 受众情绪状态
    - 数值透明度
    mediators:
    - 参照点编码
    - 风险感知
    outputs:
    - 选项选择
    - 行为接受率
    - 政策偏好
  evidence:
    supporting:
    - Kahneman 与 Tversky 1979 前景理论的反射效应与分离效应：问题表述移动参照点即翻转风险偏好（S113，机制级证据）
    - 命名经典研究（Tversky 与 Kahneman 1981 亚洲疾病问题、Levin 等 1998 三分类、Rothman-Salovey 健康框架）未建证据包，方向性转述
    conflicting:
    - 对专家与高卷入受众效应减弱；数值都给出时效应缩小（边界研究）
    replication:
    - 经典范式方向稳健，效应量随内容域变化。评级按枚举记 B
    meta_analysis: []
  evidence_grade: A-
  boundary_conditions:
  - 结果含风险成分（概率性结局）时最典型
  - 受众未同时看到两种表述（一旦对照，效应消失且显得操纵）
  failure_conditions:
  - 决策者计算期望值并核对数值后
  - 高风险议题中受众对措辞操纵保持警觉时
  common_misinterpretations:
  - 把收益-损失框架与 A3 的强调框架混为一谈：前者改参照点翻风险偏好，后者选侧面塑态度，机制不同
  - 以为损失框架永远更有力；预防类行为上收益框架更优
  ethical_risks:
  - 只呈现单侧框架隐瞒等价信息（如隐藏风险数值）构成误导性呈现
  examples:
    original_cases:
    - Thinking, Fast and Slow（S01）中的亚洲疾病问题讨论
    research_cases:
    - Tversky 与 Kahneman 1981 框架实验；健康讯息框架系列研究
    modern_cases:
    - 保险文案的『守护』（收益）vs『裸奔风险』（损失）对照；体检推广用检测率话术
  communication_implications: 先判断行为类型再选框架：鼓励坚持性预防行为用收益框架，促进筛查与止损行为用损失框架，并保持数值透明。
  community_implications: 社群危机沟通用收益框架（『已完成 80% 的保护措施』）维持稳定，止损动员才用损失框架。
  content_applications:
    title: 同一数据两版标题测试：『多赚 20%』vs『少亏 20%』，按行为目标选
    body: 正文同时给出等价数值，用框架定基调而非隐藏信息
  platform_implications: 广告平台的框架 A/B 测试能力使该机制被大规模优化；透明度规范要求关键数值不受框架隐藏。
  related_nodes:
  - loss_aversion
  - framing_effects
  - emphasis_vs_equivalence_framing
  - mental_accounting
  - fear_appeals_eppm
  source_ids:
