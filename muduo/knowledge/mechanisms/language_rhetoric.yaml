- id: politeness_face_theory
  canonical_name_en: Politeness and Face Theory
  canonical_name_zh: 面子与礼貌理论
  aliases:
  - 面子理论
  - politeness theory
  - Brown & Levinson 礼貌原则
  - 消极面子/积极面子
  domain: language_rhetoric
  definition: 源自 Goffman 的『面子』概念并由 Brown 与 Levinson 系统化的理论：面子是公开自我形象的社会价值——积极面子（希望被认可与喜爱）与消极面子（希望行动不被强加）。语言选择（直接vs间接、命令vs请求）在不断做面子工作：威胁对方面子的言语行为（批评、请求、拒绝）需要礼貌策略缓和。
  core_claim: 一切沟通都在管理双方面子：修复面子的语言（给台阶、给选择、给认可）降低防御，面子攻击（当众纠正、命令式要求）触发逆反与关系损伤——即使内容正确。
  mechanism: 面子威胁度（face-threatening act 的重量）由三个社会变量加权：社会距离（亲疏）、相对权力（上下位）、文化中的强加度（该行为的冒犯系数）。威胁越大，需要的缓和策略越多：消极礼貌（给选择、道歉、模糊限制语『可能、也许』）保护行动自由，积极礼貌（认可、共同点、玩笑）满足被喜爱需求。营销与社群语境中，硬广（强加）、当众纠错（面子攻击）、催单（权力越位）都是高威胁行为——它们的失败常不在内容而在面子账。
  causal_chain: 言语行为 → 面子威胁评估（距离×权力×强加度） → 礼貌策略（缓和/直接） → 面子结果（保全/受损） → 防御或合作
  variables:
    inputs:
    - 言语行为的面子威胁度
    - 双方社会距离与权力关系"
    - 公开性（当众vs私下）
    moderators:
    - 文化面子规范差异（集体主义语境面子权重更高）
    - 关系历史与信任存量"
    - 场景正式度"
    mediators:
    - 面子威胁知觉
    - 自我形象防御动机
    outputs:
    - 合作或防御
    - 关系资产增减"
    - 信息接受度（内容正确但面子受损仍被拒绝）"
    - 社群中的公开冲突与潜水"
  evidence:
    supporting:
    - Brown 与 Levinson 的礼貌理论及跨文化验证研究（语用学经典传统，经典文献，未建包）
    - Goffman 的前台/后台与印象管理框架（S24，拟剧理论）
    - 服务补救与危机沟通研究：道歉与给台阶对面子-信任的修复效应
    conflicting:
    - 理论的普适性受批评：不同文化对『面子』的构成差异大（自主性面子vs关系性面子）
    - 过度礼貌在亲密关系中反而制造距离（策略被识破）
    - 线上语境的面子规则仍在演化（公开纠正的规范变化）
    replication:
    - 核心区分（积极/消极面子与缓和策略）在语用学研究中广泛沿用
    - 跨文化外推需按本地面子规范校准
    meta_analysis:
    - 无统一 meta-analysis；以语用学与应用语言学综述为主
  evidence_grade: B
  boundary_conditions:
  - 威胁行为的面子账与关系存量匹配（熟人直说 vs 陌生人缓和）
  - 面子策略与真实意图一致（礼貌不等于操纵）
  - 公开性被恰当管理（敏感反馈私下化）
  failure_conditions:
  - 过度礼貌（绕弯到对方不知所云）
  - 策略被识破（礼貌被感知为套路）
  - 面子攻击已发生后仅靠语言补救（需要行为补偿）
  common_misinterpretations:
  - 把礼貌当客套废话——面子工作是信息能否被接受的管道工程：同样一句纠正，加不给台阶决定对方是收下还是反击
  - 以为面子只在中国文化重要——消极面子（选择自由）与 reactance 是同源机制，跨文化通用
  ethical_risks:
  - 利用面子压力实施公开处刑（挂人、当众羞辱式批评）
  - 以礼貌包装操纵（道德绑架式请求）
  - 利用他人怕丢面子的心理压制异议（谁质疑谁丢面子）
  examples:
    original_cases:
    - Goffman 对前台/后台与印象管理的分析（S24）
    - Brown 与 Levinson 的礼貌理论（语用学经典传统，经典文献，未建包）
    research_cases:
    - 面子威胁度与礼貌策略的语用实验
    - 服务失败的道歉-补偿研究（面子修复与信任恢复）
    - 线上社群冲突中的面子动力学观察研究
    modern_cases:
    - 社群管理的私聊先行原则（当众点名是面子攻击）
    - 客服话术的台阶设计（『可能是我们没说清楚』）
    - 知识社群的纠错礼仪（先肯定后商榷、私下更正公开致谢）
    - 直播间的催单面子压力（被识破后反噬）
  communication_implications: 批评与纠错遵循面子三律：私下化（公开纠错给双方都留疤）、给台阶（『很多人都会』的普遍化归因）、给选择（『你可以试试X，也可以按你的来』）；请求而非命令的句式降低强加感——内容说服同样要给读者留『不同意也没关系』的出口。
  community_implications: 社群治理的核心语言技术就是面子管理：警告走私信、公开表彰走大群、纠错用『共识引用』（引用群规而非指责个人）；当众处理违规是社群冲突的头号放大器——程序正义（先私下、再公示）保全面子也保住规则权威。
  content_applications:
    title: 标题避免指责式框架（『你还在犯的错』），用陪伴式（『我们都踩过的坑』）——面子安全的共鸣更利于传播
    body: 对读者既有做法的批评执行三明治：先认可合理性（当时那么做情有可原）→ 再给新信息 → 最后给选择权
    comments: 对错误评论的纠正用补充而非否定（『这里再补充一个角度：……』），当众保面子私下真纠正
    cta: CTA 去催促化：把『限时逼单』换成『随时欢迎』+真实理由（本期名额的确有限），强加感与真实信息兼顾
  platform_implications: 平台的公开互动结构（评论、弹幕、引用）天然放大面子事件——公开纠正与被公开纠正都留档可查；平台的私信组件、匿名反馈与评论折叠设计是面子管理的制度化工具，创作者的评论区礼仪成为人设资产的一部分。
