- id: memory_sins
  canonical_name_en: The Seven Sins of Memory
  canonical_name_zh: 记忆七宗罪框架
  aliases:
  - Schacter 七宗罪
  - memory failures taxonomy —— 与 gist_vs_verbatim_memory 的区别：七宗罪是失真的分类框架，模糊痕迹是其中细节丢失的机制解释
  domain: memory
  definition: Schacter《记忆七宗罪》（S05）对记忆系统性失真的分类：短暂性（transience）、心不在焉（absent-mindedness）、阻塞（blocking）、错认（misattribution）、暗示感受性（suggestibility）、偏差（bias）与纠缠（persistence）。每宗罪都是适应性系统的副产品而非随机故障。
  core_claim: 记忆失真是可预测、可分类、各有功能根源的系统性现象——七宗罪同时是记忆的代价与能力。
  mechanism: 每宗罪对应不同过程：痕迹随时间衰减（短暂）；注意失败导致未编码（心不在焉）；提取线索竞争导致话到嘴边说不出（阻塞）；来源混淆把想象当经历（错认）；外部信息改写记忆（暗示，Loftus
    范式）；当前知识重写过去（偏差）；负性事件反刍不散（纠缠）。前三种为遗漏之罪（omission：transience/absent-mindedness/blocking），后四种为佣金之罪（commission：misattribution/suggestibility/bias/persistence）——以
    S05 EP 原文口径为准（S152 摘要口径为 3 遗忘+3 失真+1 侵入，与之有出入）。
  causal_chain: 编码与提取的系统特性 → 七类失真机制 → 可预测的记忆偏差 → 传播与决策后果
  variables:
    inputs:
    - 时间间隔
    - 注意分配
    - 事后信息
    - 提问方式
    moderators:
    - 情绪状态
    - 年龄
    - 事件重要性
    mediators:
    - 衰减
    - 干扰
    - 来源监测
    - 重建过程
    outputs:
    - 记忆失真类型与幅度
    - 证词可靠性
    - 口碑变形
  evidence:
    supporting:
    - S05 对七宗罪的框架化综合与各实验室证据
    - Loftus 的错误记忆与误导信息范式（暗示感受性的支柱证据）
    conflicting:
    - 框架是分类工具而非单一机制，各宗罪证据强度不一（纠缠的适应性解释仍有争论）
    replication:
    - 各宗罪的底层实验（如误导信息效应）被广泛复制
    meta_analysis: []
  evidence_grade: A
  boundary_conditions:
  - 不同罪的强度因年龄、情绪与事件类型而异
  - 部分罪（如纠缠）在特定情境是保护机制而非缺陷
  failure_conditions:
  - 把七宗罪当记忆改进清单逐条修复——部分是特性不是缺陷
  - 以为提醒就能消除失真——错认与偏差在无意识层运作
  common_misinterpretations:
  - 用户证言与目击回忆就是事实——错认与暗示感受性要求对记忆证据做来源校验
  - 把记忆当存储硬盘——记忆是重建，每次提取都可能改写
  ethical_risks:
  - 诱导性提问植入虚假记忆（审讯式销售、引导式调研、伪回忆营销）
  - 利用偏差重写群体记忆（叙事劫持）
  examples:
    original_cases:
    - S05 全书即本节点的原始来源，各章对应一宗罪
    research_cases:
    - 误导信息范式：事后错误信息改变对原始事件的记忆报告
    modern_cases:
    - 社群集体记忆被后来叙事改写（当时我们其实说过……）；用户访谈中的记忆污染（提问即植入）
  communication_implications: 传播者要为受众的记忆失真负责：重复、提问方式与事后信息都会改写他们记得的版本——用这套机制建立正确记忆，也用它审查自己是否在制造错误记忆。
  community_implications: 社群的历史记录（公告存档、时间线）是对集体记忆七宗罪的工程补偿；用户调研必须培训无诱导提问。
  content_applications:
    evidence: 在关键事实首次出现时给出可回查的存档链接，对抗短暂性与错认
    comments: 调研与访谈用开放式提问，禁止预装情节
    body: 重要信息在结构上防阻塞（多重线索编码）
  platform_implications: 平台的搜索与存档功能部分补偿短暂性与阻塞，但截图文化的断章取义放大了错认与偏差；内容溯源（provenance）是对暗示感受性的制度回应。
  related_nodes:
