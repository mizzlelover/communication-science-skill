  信息基础：产品形态（弹幕、一键三连、投币、充电、专栏）为公开可见规则；
  推荐权重与分区流量构成为行业共识（官方未公开算法）。
  社区治理与创作激励规则已联网核验《哔哩哔哩社区公约》及创作激励官方公告（2026-09 实取），
  投币等互动指标获官方激励文档佐证；算法权重细节官方仍未公开。
  所有标注以平台最新公告为准，使用 update_platform_knowledge 流程复核。

