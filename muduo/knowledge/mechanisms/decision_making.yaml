  - id: anchoring_effect
    canonical_name_en: Anchoring Effect
    canonical_name_zh: 锚定效应
    aliases: [锚定与调整, anchoring-and-adjustment, 定锚]
    domain: decision_making
    definition: "锚定效应指数值估计与决策被初始参考值（锚）系统性拉动的现象，即使锚明显任意或无关。Tversky 与 Kahneman 1974 的转轮实验表明任意锚也能移动估计（S130，full_text 一手：起点 10 组中位估计 25，起点 65 组为 45）；Ariely, Loewenstein & Prelec 2003 的『连贯性任意』（coherent arbitrariness）研究显示初始锚可长期塑造支付意愿（经典文献，已建包 EP S189）。证据评级 A-（按枚举记 A）。"
    core_claim: "数值判断会被先呈现（或先想到）的参考值系统拉偏，且调整通常不足。"
    mechanism: "两条路径：锚定-调整不足（从锚出发调整但提前停止）与选择性可得性激活（锚使锚一致的信息更易被检索与采纳，S01）。Ariely, Loewenstein & Prelec 2003 系列实验补充任意锚可通过『愿意支付吗』的自问内化为个人价格标准（经典文献，已建包 EP S189）。"
    causal_chain: "呈现/激活参考值 → 调整不足或锚一致信息被优先激活 → 估计与支付意愿向锚偏移 → 决策被锚塑造"
    variables:
      inputs: [锚值高低与呈现顺序, 锚与判断域的相关性]
      moderators: [专业度, 锚的可信性, 认知负荷]
      mediators: [调整量, 锚一致信息的可得性, 内化的价格标准]
      outputs: [估值, 支付意愿, 价格感知与销量]
    evidence:
      supporting:
        - "Tversky 与 Kahneman 1974 转轮实验：任意随机数移动对非洲国家占比的估计（S130，full_text 一手）"
        - "Ariely、Loewenstein 与 Prelec 2003 的连贯性任意研究（经典文献，已建包 EP S189）"
      conflicting:
        - "专家在熟悉品类上锚定较弱；锚过于离谱且被识破时失效（边界研究）"
      replication:
        - "多范式（数字估计、支付意愿、量刑）复制稳健，幅度随范式波动。评级按枚举记 A（A- 水平）"
      meta_analysis: []
    evidence_grade: A
    boundary_conditions:
      - "判断对象存在数值或可比维度"
      - "锚先于判断出现且未被明确标注为无关"
    failure_conditions:
      - "受众有丰富品类经验与稳定内部标准时"
      - "锚被识别为营销套路（永久划线价）并引发反感"
    common_misinterpretations:
      - "把锚定效应等同于『标高价显得值』：锚同样适用于数量、时间、目标等一切数值判断"
      - "以为随便一个大数字都有效；锚需要被认真对待才有牵引力"
    ethical_risks:
      - "虚假原价与虚构对比锚（先涨后降）属价格欺诈，多国监管处罚"
    examples:
      original_cases: ["Thinking, Fast and Slow（S01）的锚定章节"]
      research_cases: ["转轮实验；Ariely 等的支付意愿实验"]
      modern_cases: ["划线价与折扣对比、榜单『Top 1』『Top 5』、会员年付价作为月付的锚"]
    communication_implications: "先呈现价值参照（解决的问题成本、竞品价格、时间花费）再呈现自家价格；锚的选择决定整个比较域。"
    community_implications: "社群活动目标用锚定塑形（『上期平均完成 12 天，你呢』），但锚需真实可查。"
    content_applications:
      title: "对比式标题自带锚：『别人花 3 小时，这套模板只要 30 分钟』"
      body: "列出锚值并解释其来源，让锚可信"
    platform_implications: "平台的排序与推荐位本身就是注意力锚（先看到的定义标准）；价格展示与补贴策略深度依赖锚定。"
    related_nodes: [dual_process_theory, mental_accounting, framing_effects, pre_suasion_attention_channeling]
    source_ids: [S130, S01, S189]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Tversky & Kahneman 1974（S130，full_text 一手：转盘实验等锚定范式）+ Kahneman 2011（S01，锚定章节叙述）"
      effect_size: "无关锚值影响数值估计（经典锚定效应）"
      replication_status: "锚定效应稳健但受锚的显性/可比性调制；复制研究确认方向"
      context_dependency: "锚的极端度/受众知识/计算能力调制"
      downgrade_upgrade_reason: "2026-09-09 补充一手论文 S130（full_text），provenance primary 升级；Ariely 2003 归属更正为未建包"
    provenance:
      primary_sources: [S130, S01, S189]
      supporting_evidence: []
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: availability_heuristic
    canonical_name_en: Availability Heuristic
    canonical_name_zh: 可得性启发式
    aliases: [可得性偏差, availability bias]
    domain: decision_making
    definition: "可得性启发式（Kahneman 与 Tversky，1973/1974）指以事例进入脑海的容易程度估计其频率或概率。媒体环境使其系统性失真：被报道的事件比被低估的日常风险显得更常见。证据评级 A-（按枚举记 A）。与 representativeness_heuristic 的区别：可得性用『想起来的难易』估频率，代表性用『像不像原型』估类别归属。"
    core_claim: "主观概率被事例的可得性（生动性、近因、曝光量）驱动，而非基率驱动。"
    mechanism: "检索流畅性作为频率线索（与 processing_fluency 家族相通）；媒体与算法放大极端事件的曝光，使可得性与真实分布脱钩；情绪生动的事件（空难、犯罪）检索更容易，日常风险（车祸、慢性病）被低估。Kuran 与 Sunstein 描述的『可得性级联』（availability cascade）说明该机制可自我强化成公共恐慌（经典文献，未建包）。"
    causal_chain: "事件被反复/生动呈现 → 检索更容易 → 主观概率上偏 → 风险感知与行为偏移（如规避、转发预警）"
    variables:
      inputs: [事件曝光量, 生动性, 时间临近性]
      moderators: [个人经历, 媒体环境, 情绪唤起强度]
      mediators: [检索流畅性, 情绪标记]
      outputs: [频率/概率估计, 风险感知, 传播与规避行为]
    evidence:
      supporting:
        - "Kahneman 与 Tversky 1973 起的可得性实验系列（经典实验）"
        - "风险感知研究中媒体报道与主观风险的关联证据（媒介效果研究，S46）"
      conflicting:
        - "人们对自身经验丰富领域的估计更准；可得性线索被察觉（如意识到是媒体渲染）时部分校正（边界研究）"
      replication:
        - "主效应稳健；幅度因领域与个体经验差异大。评级按枚举记 A（A- 水平）"
      meta_analysis: []
    evidence_grade: A
    boundary_conditions:
      - "估计对象难以从客观渠道即时核验时最强"
      - "个体无直接经验可对照"
    failure_conditions:
      - "受众具备领域统计素养或刚看过反例校正信息"
      - "事件过于久远导致检索困难，即使客观上高频"
    common_misinterpretations:
      - "把可得性偏差等同于『媒体说谎』；它更多是曝光量与真实分布的系统性脱钩"
    ethical_risks:
      - "制造或放大耸动案例（孤例放大为趋势）以操纵风险感知与政策情绪"
    examples:
      original_cases: ["Tversky & Kahneman 1974（S130）的知名度名单实验：更出名的名单被误判为出现更多"]
      research_cases: ["Kahneman 与 Tversky 的字母频率等经典实验（S130）；Kuran 与 Sunstein 的可得性级联分析（经典文献，未建包）"]
      modern_cases: ["社会事件刷屏后的安全焦虑与防御性消费；AI 灾难叙事对技术风险感知的塑造"]
    communication_implications: "用具体案例开路（提高可得性）再给基率数据（校正）；反之，驳斥谣言时警惕重复谣言本身反而提高其可得性。"
    community_implications: "社群辟谣与风险沟通要先管理曝光（置顶校正、集中讨论），避免碎片化重复。"
    content_applications:
      title: "用一个鲜活案例承载论点，紧跟一段基率校正"
      body: "引用近因、具体、可画面化的事例提高论证可得性"
    platform_implications: "算法按互动放大耸动内容，人为提高其可得性，是风险感知失真与虚假信息速度优势的结构性来源。"
    related_nodes: [representativeness_heuristic, affect_heuristic, misinformation_velocity, gatekeeping_dynamics, dual_process_theory]
    source_ids: [S01, S46, S41, S130]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Kahneman 2011《Thinking, Fast and Slow》（S01，book 级，substantial_excerpt：可得性启发+风险感知）+ Lippmann 1922《Public Opinion》（S41，拟态环境：媒体曝光塑造认知）"
      effect_size: "提取容易度→概率/频率判断偏移；媒体曝光放大耸动内容可得性"
      replication_status: "启发式方向稳健；被格式与文化调节（频率格式效应）"
      context_dependency: "事件检索困难时偏差更强；媒体曝光结构是关键情境变量"
      downgrade_upgrade_reason: "2026-09 实取 S01/S41 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S130, S01]
      supporting_evidence: [S41, S46]
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: representativeness_heuristic
    canonical_name_en: Representativeness Heuristic
    canonical_name_zh: 代表性启发式
    aliases: [代表性偏差, 原型匹配, base rate neglect]
    domain: decision_making
    definition: "代表性启发式（Kahneman 与 Tversky，1972 起）指以对象与某类别原型（或与因果脚本）的相似程度判断其类别归属或来源概率，常伴随基率忽视与合取谬误（如『琳达问题』：细节丰富的合取描述被评为比单一成分更可能——Tversky & Kahneman 1983，经典文献未建包）。与小数定律相关：把小样本特征当总体规律。"
    core_claim: "相似性判断常替代概率判断：越像原型的描述被评为越可能，即使基率相反。"
    mechanism: "原型与脚本是压缩的类别知识，匹配比计算省资源（S01）；生动的细节提高叙述的『代表性』从而提高被信度（与 anecdote_vs_statistics 的传播层面相通）；Gigerenzer 等对『何为正确规范』的批评提示：部分所谓错误在于任务设计混淆了频率与概率格式，边界需谨慎（S130 limitations）。"
    causal_chain: "描述与原型/脚本的相似性 → 相似度替代概率判断 → 基率被忽视 → 类别归属与预测出错"
    variables:
      inputs: [描述的典型性, 细节丰富度, 基率信息的可得性]
      moderators: [统计素养, 频率格式 vs 概率格式, 群体刻板印象强度]
      mediators: [原型匹配, 因果脚本激活]
      outputs: [类别判断, 概率估计, 人员/内容筛选偏差]
    evidence:
      supporting:
        - "Kahneman 与 Tversky 1972 起的琳达、Tom W. 等经典实验（合取谬误与基率忽视；经典文献，未建包）"
        - "小数定律的相关实验证据（经典研究）"
      conflicting:
        - "Gigerenzer 等的规范之争：以频率格式呈现任务时部分『谬误』消失，说明任务表述影响结论（S130 limitations 载其生态理性批评；理论争议）"
      replication:
        - "经典范式方向稳定，但对『人类不理性』的强解读有学术争论。评级按枚举记 B"
      meta_analysis: []
    evidence_grade: B
    boundary_conditions:
      - "判断对象有清晰社会原型或因果脚本时最强"
      - "以单一概率格式呈现抽象事件时更易出错"
    failure_conditions:
      - "任务改用自然频率格式或受众有统计训练时"
      - "原型与判断维度真正相关时，匹配反而有效"
    common_misinterpretations:
      - "把代表性启发式当成『刻板印象永远错』；它是高效但可错的捷径，问题在于与基率冲突时未被校正"
    ethical_risks:
      - "利用典型化人设诱导身份匹配消费（『你这种人也该……』）；筛选算法中放大原型偏差造成歧视"
    examples:
      original_cases: ["Thinking, Fast and Slow（S01）中的琳达问题与小数定律章节"]
      research_cases: ["Kahneman 与 Tversky 的类别预测实验系列"]
      modern_cases: ["用人设标签判断内容可信度；招聘与推荐算法中的原型匹配偏差"]
    communication_implications: "塑造符合受众原型的可信形象（专家、过来人）有效，但需以真实资历支撑；反原型内容要主动管理基率认知。"
    community_implications: "社群评价体系易被代表性绑架（‘大 V 说的都对’），需以事实核查流程对冲原型光环。"
    content_applications:
      title: "让主角『像目标读者』：相似性提高可信度，但要防止过度典型化"
      body: "关键论证同时给典型案例与基率，避免细节堆叠制造合取幻觉"
    platform_implications: "推荐系统按原型（历史相似用户）匹配内容，结构性复制代表性捷径；偏差在人群层面被规模化。"
    related_nodes: [availability_heuristic, anecdote_vs_statistics, social_identity_theory, in_group_favoritism, dual_process_theory]
    source_ids: [S130, S01]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Tversky & Kahneman 1974（S130，full_text 一手：代表性启发式+limitations 载 Gigerenzer 生态理性批评）+ Kahneman 2011（S01，代表性/基率忽视叙述）；琳达/合取谬误未建包"
      effect_size: "相似性替代概率判断；细节丰富度提高被信度"
      replication_status: "经典范式方向稳定；对『人类不理性』强解读有学术争论"
      context_dependency: "有清晰原型/脚本时最强；频率格式与统计训练减弱效应"
      downgrade_upgrade_reason: "2026-09 补充 S130 一手论文（full_text），Gigerenzer 批评归属由 S19 更正为 S130 limitations，provenance primary 升级"
    provenance:
      primary_sources: [S130, S01]
      supporting_evidence: []
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: status_quo_bias
    canonical_name_en: Status Quo Bias
    canonical_name_zh: 现状偏差
    aliases: [现状偏置, 维持现状倾向, omission bias]
    domain: decision_making
    definition: "现状偏差指在多选项决策中系统性地偏向维持当前状态的倾向，即使改变的成本很低且期望收益为正。Samuelson 与 Zeckhauser 1988 的实验（健康保险计划选择）是经典证据（经典文献，已建包 EP S207）。与 default_option_effect 的区别：默认效应是外部架构设定，现状偏差是决策者的内在倾向；默认之所以强大，部分正因为利用了现状偏差。"
    core_claim: "在收益不确定时，人们系统性地高估改变的成本与风险、低估维持现状的机会成本。"
    mechanism: "多重机制叠加：改变带来潜在后悔（作为损失的权重更大，与 loss_aversion 相通）、现有状态的禀赋（与 endowment_effect 相通）、改变的计算成本与执行摩擦、以及不作为比作为在道德上更『安全』的作为偏差（S11、S12）。"
    causal_chain: "改变选项存在不确定性 → 潜在损失/后悔权重放大 + 禀赋与摩擦 → 维持现状"
    variables:
      inputs: [改变的转换成本, 收益不确定性, 现状的持有时间]
      moderators: [后悔倾向, 决策自主性, 现状的历史成因（主动选择 vs 被动继承）]
      mediators: [后悔预期, 禀赋感, 计算成本]
      outputs: [维持率, 换用/迁移率, 延迟决策频率]
    evidence:
      supporting:
        - "Samuelson 与 Zeckhauser 1988 的健康保险选择实验（经典文献，已建包 EP S207）"
        - "Kahneman、Knetsch 与 Thaler 1990 的禀赋/现状实验（S131）"
        - "组织与消费领域的转换惰性观察（多来源现场研究）"
      conflicting:
