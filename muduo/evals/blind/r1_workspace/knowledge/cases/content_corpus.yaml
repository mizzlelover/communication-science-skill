    视频被强制关闭个性化广告与评论，即把儿童内容从互动优化函数中摘出，儿童频道的变现与社区互动能力被制度性压缩，Disney 误标动机正来自该收入差；适用条件为标记决策与广告收入直接挂钩。attention_economics（A-）：监管在注意力市场中对不可同意的受众（13
    岁以下）划定注意力变现禁区，儿童注意力的定向广告定价权被从平台/频道方收归合规约束之下；适用条件为法律对未成年注意力交易的边界清晰。单案例仅作 illustration（D 级）
