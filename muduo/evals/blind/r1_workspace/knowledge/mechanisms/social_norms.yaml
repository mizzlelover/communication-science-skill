  - S213
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Bicchieri 2017 Norms in the Wild 规范诊断框架（S28，substantial_excerpt，经学术书评全文+出版社简介+中文详评多源实取）+
      错误共识/错误独特性实验传统
    effect_size: 规范知觉与真实分布的系统性错位（实证/规范预期框架）
    replication_status: 错误共识与错误独特性多文化重复；规范误知觉干预修正效果在部分田野研究验证
    context_dependency: 他人态度不可直接观察、公开行为样本受选择性表达污染时偏差更大
    downgrade_upgrade_reason: 2026-09 补充规范诊断一手专著（S123，substantial_excerpt 如实标注），由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED；2026-09-09
