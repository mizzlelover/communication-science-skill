# behavioral_economics — 行为经济学（Behavioral Economics）：价值、损失与选择的经济心理学
domain: behavioral_economics
nodes:
- id: loss_aversion
  canonical_name_en: Loss Aversion
  canonical_name_zh: 损失厌恶
  aliases:
  - 损失规避
  - losses loom larger
  domain: behavioral_economics
  definition: 损失厌恶是 Kahneman 与 Tversky 1979 前景理论的核心要素：同等数量的损失带来的痛苦大于同等收益带来的快乐（『损失比收益显得更大』）。必须按 EVIDENCE.md
    携带降级说明：该效应存在但幅度争议大、个体差异显著；有学者（如 Gal 与 Rucker 方向的批评）认为部分证据实为框架效应或其他机制的产物。定级自 A 降为 B。与 gain_loss_framing
    的区别：损失厌恶是价值函数的性质假设，收益-损失框架是其在选择问题表述上的表现；与 framing_effects（A3）的区别在于后者是传播/说服层的讯息框架节点。
  core_claim: 在参照点附近，损失的心理权重系统性地大于同等收益；但该权重大小因人、因域而异，不是稳定常数。
  mechanism: 前景理论以参照点定义得失，价值函数在损失侧更陡；损失激活更强的威胁监测与生理反应；但常见叙述中的『损失权重约为收益两倍』来自早期估计的粗糙平均，后续研究显示权重随领域、经验与测量方法大幅波动，部分任务中『损失引发更多注意而非更大权重』（损失注意替代假说方向，待补一手来源）。
  causal_chain: 结果相对参照点被编码为得/失 → 损失侧价值函数更陡 → 损失规避选择 → 维持现状/拒绝公平赌局等行为
  variables:
    inputs:
    - 参照点位置
    - 得失幅度
    - 结果是否确定
    moderators:
    - 个体差异
    - 领域经验
    - 任务表述（频率/概率）
    mediators:
    - 价值函数斜率
    - 威胁监测唤醒
    outputs:
    - 拒绝混合赌局
    - 现状维持
    - 议价中的让步不对称
  evidence:
    supporting:
    - Kahneman 与 Tversky 1979 前景理论及其系列实验（经典理论）
    - Thaler 系列中的禀赋与损失现象研究（S12）
    conflicting:
    - EVIDENCE.md 登记的降级理由：幅度争议与个体差异大；Gal 与 Rucker 等批评认为『损失权重更大』的普遍性被高估，部分现象可由其他机制解释
    replication:
    - 方向性证据（损失敏感）总体可重复，但作为量化参数不稳健。评级按枚举记 B（降级自 A）
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 在参照点附近的小额得失中最明显；远离参照点的大额结果权重趋平
  - 测量方式（选择任务 vs 交易任务）会显著改变表现出的权重
  failure_conditions:
  - 高专业经验领域（职业交易员对小额波动）中损失敏感度下降
  - 损失被重构为投资或习得成本时
  common_misinterpretations:
  - 『人对损失的敏感度恒为收益的 2 倍』：这是对早期估计的刻板化，实际波动范围大且个体差异显著
  - 把一切『怕失去』都归因损失厌恶；现状偏差、承诺等机制常与之纠缠
  ethical_risks:
  - 恐吓式营销滥用损失框架（『再不买就永久失去』）制造焦虑交易
  examples:
    original_cases:
    - Thinking, Fast and Slow（S01）前景理论章节；Misbehaving（S12）中的应用案例
    research_cases:
    - Kahneman 与 Tversky 1979 的假想选择实验系列
    modern_cases:
    - 限时优惠的失去话术、免费试用到期提醒、持仓亏损时的不卖倾向
  communication_implications: 损失框架对『保住既有东西』类行为（续费、防流失）最有效；对新获得的推广应优先收益框架，且必须真实有据。
  community_implications: 会员流失预警用『你将失去的权益清单』比新优惠更有效；但频繁使用会训练出免疫。
  content_applications:
    title: 损失框架标题对既有用户有效：『你的等级权益将于 X 日失效』
    emotion: 损失唤醒控制在警示而非恐吓的程度，保留出路
  platform_implications: 平台的流失召回与订阅到期流程大量使用损失框架；监管与平台规范逐步限制虚假紧迫性话术。
  related_nodes:
