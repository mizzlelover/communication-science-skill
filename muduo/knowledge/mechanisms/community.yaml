- id: newcomer_onboarding
  canonical_name_en: Newcomer Onboarding
  canonical_name_zh: 新人融入
  aliases:
  - 新手引导
  - 社会化（socialization）
  domain: community
  definition: 新人融入（newcomer onboarding）指新成员从「合法边缘参与」到承担社群角色的过程。组织社会化研究（如 Van Maanen & Schein 的社会化战术框架）与社群实践共同指向：新人的早期体验决定其长期参与轨迹——最初几周是否获得第一个回应、第一个小任务、第一个可指认的同伴，比任何长期激励都更影响留存。
  core_claim: 新人是否留下，主要取决于其早期互动是否跨越了「可见性门槛」：第一次发言被回应、第一次贡献被认可、第一次建立具体关系；有设计的新人期显著提高长期留存。
  mechanism: 新成员进入社群时面临归属不确定性（「我适合这里吗」）与规范不确定性（「这里怎么做事情」），两者都随时间衰减但衰减速度依赖设计：明确的入群仪式（自我介绍模板、新人任务）降低规范不确定性，首个真实互动（被回应、被提及）缓解归属不确定性。没有设计时，沉默的新人经历「发帖—无人回应」后迅速流失，留下「潜水者」假象。早期小胜利（第一个被采纳的建议、第一次被感谢）启动投入升级的正循环。
  causal_chain: 入群 → 归属/规范不确定性 → 首个互动与首个贡献被回应 → 不确定性消解 + 早期小胜利 → 身份建立与持续参与
  variables:
    inputs:
    - 入群仪式设计
    - 首次互动的响应速度与质量
    - 新人可见任务
    moderators:
    - 社群规模（大群新人易被淹没）
    - 老成员的欢迎文化
    - 新人与社群的匹配度
    mediators:
    - 归属不确定性消解
    - 规范学习
    - 早期贡献认可
    outputs:
    - 新人留存率
    - 从潜水到发言的转化
    - 长期参与深度
  evidence:
    supporting:
    - 组织社会化研究：早期经验结构化影响长期承诺与留存（社会化学术传统）
    - 在线社区研究：新人的早期互动与被回应情况预测其后续参与（多平台研究，方向一致）
    - 社群实践方法论对新路径的设计经验（从业者文献，如《Get Together》《The Art of Community》）
    conflicting:
    - 强制性新人仪式可能触发反感与流失（过高门槛的边界条件）
    replication:
    - 早期互动质量预测留存的发现跨平台重复；具体最优仪式形态因社群类型而异
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 需要社群存在基本的欢迎文化；敌意社群中任何引导设计都无效
  - 适用于有持续互动的社群；一次性活动（打卡群、活动群）无融入问题只有转化问题
  failure_conditions:
  - 新人进群即领 200 条群规与三次考试：过强的仪式感把融入变成筛选过载
  - 没有老成员承接的新人引导流程：官方机器人回应无法替代真人关系建立
  common_misinterpretations:
  - 「新人多了自然就活跃」——新人留存是漏斗问题：未被承接的新人 90% 流失，与拉新量无关
  - 把 onboarding 等同于发资料包：信息接收不是融入，可见的被回应的互动才是
  ethical_risks:
  - 新人期的高压仪式（羞辱式入群考验、过度暴露个人信息）构成边界侵犯
  examples:
    original_cases:
    - Van Maanen & Schein 的组织社会化战术框架（学术起源）
    - 社群实践书籍中的新人旅程设计（《Get Together》《The Art of Community》）
    research_cases:
    - 在线社区对新用户早期发帖被回复情况的纵向研究（方向一致）
    modern_cases:
    - 知识社群的「新人三件事」模板（自我介绍 + 提一个问题 + 回应一个他人问题）
    - 游戏公会的入会任务与师徒制
  communication_implications: 面向新关注者的内容应包含「立即能做的第一个小行动」（评论打卡、领取资料并反馈），把内容触达转化为可见的首次参与。
  community_implications: 为新人设计 48 小时旅程：入群欢迎（真人而非机器人）→ 自我介绍模板 → 首个小任务（回答一个其擅长的问题）→ 老成员的一对一回应；把「新人第一周留存」作为社群核心指标。
  content_applications:
    body: 为新读者提供「上手指南」型内容（本社群是什么、如何开始、第一个动作），并放正文入口
    narrative: 讲述老成员的「第一次」故事（第一次发言多紧张、被怎样接住），给新人代入样本
    comments: 建立「新人首评必回」的运营守则，评论区是融入发生的第一现场
    sharing: 邀请者为被邀新人写一句介绍（关系背书），替代冷冰冰的入群通知
  platform_implications: 平台的新成员提示（「新朋友进来了」）与欢迎功能影响承接成本；无提示的大群里新人被承接几乎完全依赖运营人力（原则性判断）。
