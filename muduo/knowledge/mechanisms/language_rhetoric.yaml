    effect_size: 具体细节提高记忆与可信度（可感实体优于抽象概念）
    replication_status: 具体性优势在记忆与传播研究中稳健；框架本身未独立检验
    context_dependency: 需复述/记忆的公开信息最强；深度论证型内容另需结构
