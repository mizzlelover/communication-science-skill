      2024 元分析（607 项估算，系数均值 1.955 [1.820, 2.102]）
    effect_size: 损失域价值函数比收益域更陡（损失厌恶）；系数≈2 为范式参数而非普适常数
    replication_status: 损失厌恶存在但幅度有争议（EVIDENCE.md B）；元分析确认均值≈2；普适性受批判
    context_dependency: 参照点依赖；小损失/抽象损失不对称较弱；框架操纵是效应边界
