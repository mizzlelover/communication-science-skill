- id: behavior_model_bmap
  canonical_name_en: Fogg Behavior Model (B=MAP)
  canonical_name_zh: 福格行为模型（B=MAP）
  aliases:
  - B=MAP
  - 福格模型
  - Fogg Behavior Model
  domain: habit
  definition: Fogg 行为模型（S16、S37）主张行为（Behavior）在动机（Motivation）、能力（Ability）与提示（Prompt）三者同时到位时发生：B=MAP。动机不足时可通过降低难度（提升可及性）补偿；任何要素缺失，行为都不会发生。动机是不可靠的波浪，可靠的设计是简化+提示。定级
    C：模型整合的成分均有实证，但 B=MAP 作为整体模型的直接检验有限。
  core_claim: 行为发生需要动机、能力、提示三者同时满足；降低行为难度比提升动机更可靠。
  mechanism: 动机决定行为意愿的强度上限，且随时间波动；能力维度由简化因子（时间、金钱、体力、脑力、社交偏离、日程）构成，越简单越易发生（S16、S175）；提示是行为的触发器，只在动机与能力阈值之上才有效（S16）。设计含义：与其
    persuasion 动机，不如降低门槛并放置合适提示。
  causal_chain: 动机（≥阈值） + 能力（足够简单） + 提示（适时出现） → 行为发生
  variables:
    inputs:
    - 动机强度
    - 行为难度（时间/金钱/脑力/日程）
    - 提示时机与形式
    moderators:
    - 习惯水平
    - 竞争行为密度
    - 环境支持度
    mediators:
    - 行为阈值（动机-能力互补曲线）
    - 提示显著性
    outputs:
    - 目标行为发生率
    - 转化率
  evidence:
    supporting:
    - Fogg 2009 的模型化论述与说服技术领域应用（Persuasive Technology，S37）
    - Tiny Habits（S16）的实践方法体系（从业者证据）
    conflicting:
    - B=MAP 作为整体模型的实证检验有限；动机-能力的互补曲线在不同任务上形状不一（模型化争议）
    replication:
    - 成分（提示、简化、动机）各有独立证据；整体框架属整合性实践模型。评级按枚举记 C
    meta_analysis: []
  evidence_grade: C
  boundary_conditions:
  - 适用于可被单次触发的目标行为；对长期动机系统只是近似
  - 提示需在动机-能力阈值之上的时刻出现
  failure_conditions:
  - 只有提示而无简化（复杂的转化流程）时，转化率依然低
  - 动机被催熟（焦虑营销）但能力未跟上，行为短暂且伴随反噬
  common_misinterpretations:
  - 把 B=MAP 读成『三分天下等权重』；模型的实践重心恰恰是简化与提示，而非提升动机
  - 误当实证定律引用；它是整合性设计框架
  ethical_risks:
  - 利用焦虑抬升动机再配合高利润行为提示（恐惧式转化）
  examples:
    original_cases:
    - Tiny Habits（S16）中的微习惯设计与锚点提示案例
    research_cases:
    - Fogg 的说服技术实验与模型论文（S37）
    modern_cases:
    - 一键登录、表单分步化、推送时机的 A/B 实验
  communication_implications: 所有行动号召自检三问：动机是否在场？步骤是否已最简？提示是否出现在对的时间？三问不过关就改设计而非改话术。
  community_implications: 社群活动报名流程用 B=MAP 审计：砍步骤、明提示、降门槛，比动员话术更能提升参与率。
  content_applications:
    cta: CTA 落到单步动作（『点一下预约』）而非复合任务（『关注+转发+评论』）
    title: 标题承担动机，正文首段给出最短路径与下一步提示
  platform_implications: 平台的转化漏斗优化本质是 MAP 三要素的工程化；提示过载（推送轰炸）是各平台普遍的负外部性。
