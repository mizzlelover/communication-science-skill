research_question: "哪些语言形式能提高说服、激励与合作效果？数据驱动能发现什么'魔法词'？"
core_claims:
  - "六类语言（身份语言/具体性/连接词/情绪词/简洁/信任类等）能系统提高影响力——基于机器学习+计算语言学+数字化语料（求职信/对话/文案）的大规模分析"
  - "具体发现：身份语言（'你想要成为什么样的人'）比行动语言更能激励坚持（饮食目标）；'你' vs '我'的选择影响关系与说服；'could' 比 'should' 更激发创造力（自主性）；hedge 词削弱力量"
  - "同一本书（Contagious）的传播框架（社交货币/诱因/情绪/公开性/实用价值/故事，STEPPS）与 Magic Words 同源：情绪/实用价值驱动分享"
method: "实证营销科学（大规模数据+实验，Wharton）+ 应用案例"
results: "（应用实证）数据驱动语言影响力的流行科学代表（D 级实践框架成分）"
limitations: "公开演示性案例多、完整实验细节少（popular science）；效应量依场景而变"
boundary_conditions: "适用于语言选择的场景匹配（'锤子与螺丝刀'）；单一语言技巧非万能"
