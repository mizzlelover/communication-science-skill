- id: small_world_property
  canonical_name_en: Small-World Property
  canonical_name_zh: 小世界特性
  aliases:
  - 小世界网络
  - six degrees（六度分隔）
  domain: network_effects
  definition: 小世界（small world）指同时具备高聚类系数（朋友的朋友多为朋友）与短平均路径长度（任意两人间只需少量中间人）的网络结构。Watts 与 Strogatz 1998 年在《Nature》上的模型表明：在规则网络中随机重连少量边即可产生小世界结构——既有局部的紧密性，又有全局的可达性。
  core_claim: 真实社会与信息网络普遍呈小世界结构：局部高度抱团，同时任何两人之间只隔少数几跳，这使信息可以「远距离快速传播」而不牺牲局部信任。
  mechanism: 少量跨群「捷径边」（即弱连接式的长程连接）以极低的成本大幅缩短全局路径，而保留的高聚类维持局部信任与规范。Milgram 的小世界实验（让陌生人通过熟人链把信件寄给目标）在人际网络层面验证了短路径的存在；后续研究同时指出：路径「存在」不等于个体能「找到」路径——可搜索性（searchability）依赖对方向的有用线索（如职业、地理层级）（Kleinberg
    可搜索性，未建包，EP 待补）。
  causal_chain: 高聚类（局部信任）+ 少量捷径边（全局可达）→ 信息兼具局部深度与全局广度的传播潜力
  variables:
    inputs:
    - 网络聚类系数
    - 捷径边数量与分布
    moderators:
    - 个体对「方向线索」的掌握（可搜索性）
    - 平台是否提供跨群连接机制
    mediators:
    - 平均路径长度
    - 局部信任结构
    outputs:
    - 信息全局可达速度
    - 跨圈传播潜力
  evidence:
    supporting:
    - Watts & Strogatz 1998 对小世界网络的模型化与多类真实网络验证（经典论文）
    - Milgram 的连锁信实验显示陌生人间经由少量中介连通（经典研究，Watts 书中回顾与讨论其局限）
    conflicting:
    - 连锁信实验的完成率很低且样本有偏，被批评高估了「人人可及」的程度（Milgram 完成率批评，未建包，后续方法学讨论）
    replication:
    - 大规模在线社交网络数据反复确认平均路径极短（网络科学共识）
    meta_analysis: []
  evidence_grade: A-
  boundary_conditions:
  - 短路径是网络属性而非个体能力：普通人在没有平台辅助时往往找不到短路径
  - 结构成立依赖少量跨群捷径的存在；完全孤立的圈层结构会破坏小世界性
  failure_conditions:
  - 把「六度分隔」当成传播保证：可达性 ≠ 会被传递，长链上的每次转递都有衰减与扭曲
  - 在信息被算法按兴趣切断的平台上，物理连接存在但信息捷径未必被使用
  common_misinterpretations:
  - 「世界很小所以内容自然传遍全球」——小世界提供的是潜力结构，传播仍需经过每一跳的守门与意愿
  - 把 small_world 与 preferential_attachment 混淆：前者描述路径结构（多短、多聚），后者描述度分布形成机制（枢纽如何长出）
  ethical_risks:
  - 小世界结构同样是谣言与恐慌的快速通道：局部信任 + 全局可达 = 危险信息的高效组合
  examples:
    original_cases:
    - Watts & Strogatz 1998 的重连模型（从规则环状网络到小世界）
    - Milgram 连锁信实验
    research_cases:
    - 在线社交网络的大规模路径测量研究（网络科学文献，方向一致）
    modern_cases:
    - 「你转发的内容我三度人脉内必有人见过」的熟人圈重叠感
    - 行业会议上的「原来你们互相认识」现象
  communication_implications: 利用小世界结构做「接力传播」设计：内容在每跳都需保留可转递性（署名、可引用、无圈层黑话），让短路径真的被走通。
  community_implications: 社群网络的小世界性来自「每个成员自带圈外捷径」；鼓励成员把社群内容带回各自圈子，是低成本扩大全局可达性的方式。
  content_applications:
    body: 为接力设计：正文每个段落都包含独立可引用的完整信息点，防止链条传播中的意义衰减
    sharing: 分享物内嵌「下一个该转给谁」的提示（同行、家人、决策者），利用方向线索提高可搜索性
    comments: 鼓励评论区出现「我是从某某那里看到的」溯源互动，让传播链条可见、可经营
  platform_implications: 社交平台的关注与转发机制把小世界的「找路径」难题自动化（推荐跨圈内容、一键转发），实质性地提高了信息通过捷径的流量占比（原则性判断）。
