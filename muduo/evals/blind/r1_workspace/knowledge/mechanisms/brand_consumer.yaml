# brand_consumer — 品牌与消费者（Brand & Consumer）：心理可得性、购买结构与需求分布
domain: brand_consumer
nodes:
- id: mental_availability
  canonical_name_en: Mental Availability
  canonical_name_zh: 心理可得性
  aliases:
  - 心智可得性
  - mental penetration（心智渗透）
  domain: brand_consumer
  definition: 心理可得性（mental availability）是 Ehrenberg-Bass Institute（Byron Sharp《How Brands Grow》综合）基于大样本购买数据提出的概念：品牌被消费者在购买情境中「想起来」的容易程度与丰富程度——不是被记住，而是在正确的情境中被激活。它由品类进入点（category
    entry points）网络的广度决定：品牌与越多购买情境建立联想，被想起的概率越大。
  core_claim: 品牌增长主要由心理可得性（购买时被想起的概率×情境广度）驱动，而非忠诚度提升；约 50-80% 的销量来自购买频率很低的顾客（S76），且 80/20 被帕累托修正——头部 20%
    客户贡献约 50%+ 而非 80%（S76）；增长的杠杆是触达更多浅度购买者并提高情境激活广度。
  mechanism: 消费者的品类购买大多是低卷入、记忆驱动的决策：面对货架或搜索框时，被激活的品牌集合（retrieval cue 触发的联想网络）直接决定进入考虑范围的品牌。心理可得性高 = 品牌被存储在更多购买情境线索之下（「早餐缺奶→想起
    A」「朋友聚会→想起 B」）。Sharp 指出多数品类的购买者是轻购买者（偶尔买一次），因此增长来自「让更多人偶尔想起并买一次」，而非让少数铁粉买得更多——这构成对传统忠诚度营销的直接修正。
  causal_chain: 情境线索暴露 + 一致的 distinctive assets → 品牌联想网络建立 → 购买情境激活概率↑ → 进入考虑集 → 偶尔购买累积为市场份额增长
  variables:
    inputs:
    - 广告触达与频率
    - 品类进入点联想的建立与维护
    - distinctive assets 的使用一致性
    moderators:
    - 品类购买频率
    - 品牌规模（大品牌天然高可得性）
    - 竞品的声音份额
    mediators:
    - 品牌联想的情境覆盖广度
    - 记忆激活容易度
    outputs:
    - 考虑集进入率
    - 市场份额
    - 购买者数量（渗透率）
  evidence:
    supporting:
    - Ehrenberg-Bass 基于多国、多品类大样本扫描数据的发现：市场份额与心智渗透高度相关，购买频率分布呈双危机模式（书籍综合，见 double_jeopardy_law）
    - 购买者结构分析显示轻购买者贡献了品牌增长的多数增量（大样本数据传统）
    conflicting:
    - 「忠诚度完全不重要」是过度简化：在高卷入、高风险与 B2B 品类中，重度客户策略仍占重要地位（营销研究讨论）
    - 心智可得性的测量（联想网络广度）在实践上仍有难度，多依赖品牌追踪调查（方法讨论）
    replication:
    - 双危机定律与渗透主导增长的模式在大量品类的重复扫描数据中稳定复现
    meta_analysis: []
  evidence_grade: B+
  boundary_conditions:
  - 证据基础是快消品等重复购买品类；对耐用品、服务与高单价品类的适用性需谨慎
  - 心理可得性以「物理可得性」（渠道铺货）为前提：买不到的品牌再有名也不产生销售
  failure_conditions:
  - 追求知名度而非情境激活：高知名但无购买线索联想（「知道这个牌子但想不起什么时候买它」）不产生增长
  - 频繁更换品牌资产与定位信息：联想网络被反复重置，可得性积累被自我清零
  common_misinterpretations:
  - 「品牌=占领心智」——Ehrenberg-Bass 的重点是激活结构（什么情境想起你）而非印象强度（人们多熟悉你）；无情境锚点的知名度是空转资产
  - 把 mental_availability 与 brand awareness 混为一谈：awareness 测「认得」，availability 测「在购买时刻被想起」；后者才是行为相关变量
  ethical_risks:
  - 高频率心智轰炸对儿童与弱势群体的剥削性广告问题
  examples:
    original_cases:
    - 《How Brands Grow》基于大样本数据对品牌增长模式的重新论述（Ehrenberg-Bass 传统）
    research_cases:
    - 多品类扫描面板数据中份额与渗透的关系重复验证（数据研究传统）
    modern_cases:
    - 饮料品牌全年场景化投放（火锅配、加班配、出游配）扩大进入点覆盖
    - 电商搜索关键词布局本质是数字货架上的心理可得性竞争
  communication_implications: 内容策略应围绕品类进入点组织（一个内容绑定一个使用/购买情境），而非围绕品牌主张堆砌；所有触点重复使用一致的 distinctive assets，让每次曝光都在加深同一网络。
  community_implications: 社群内容定期把品牌与成员的真实使用情境绑定（成员故事：什么时刻用上了）；社群是低成本制造情境联想的场所——比广告更具体、更可信。
  content_applications:
    body: 正文以具体情境开头（「周五晚带娃出行时」），把品牌锚定在使用时刻而非抽象卖点
    narrative: 用户故事保留完整情境细节（时间、地点、契机），情境是联想网络的存储键
    sharing: 分享物突出品牌 distinctive assets（色彩、slogan、角色），确保转发也在积累资产一致性
    comments: 置顶「你上一次在什么场景用它」的提问，评论区成为进入点联想的素材库
  platform_implications: 搜索框与推荐位是数字时代的货架：心理可得性直接表现为搜索词联想与品牌词流量；平台的进入点也从「场景」扩展为「搜索意图」（原则性判断）。
