- id: pluralistic_ignorance
  canonical_name_en: Pluralistic Ignorance
  canonical_name_zh: 多数无知
  aliases:
  - 人众无知
  - pluralistic ignorance
  domain: social_proof
  definition: 群体成员多数私下不认同某规范，但错误地相信其他人都认同（因为没人公开反对），于是人人公开维持一个自己并不相信的立场。首例经典研究是 O'Gorman 1975 年对美国白人种族隔离态度的调查：多数白人私下反对隔离，但以为多数邻居支持，因而不公开反对（O'Gorman
    1975，已建包 EP S213）。
  core_claim: 公开沉默+私下怀疑的错配可以让一个大多数人都不再相信的规范长期自我维持。
  mechanism: 每个人观察他人的公开行为（沉默/顺从）来推断他人态度，但自己的怀疑因社会规范压力而未公开表达。于是『他人的沉默』被误读为『他人的认同』。该错误共识使旧规范获得表面多数支持，个体因害怕成为唯一异见者而不敢打破沉默。一旦有人公开质疑（与
    minority_influence 的关键少数效应衔接），多数无知迅速瓦解。
  causal_chain: 私下怀疑 + 公开沉默 → 他人沉默被误读为认同 → 错误的多数知觉 → 个体不敢率先表态 → 旧规范表面延续
  variables:
    inputs:
    - 公开沉默的可见性
    - 私下怀疑的存在
    - 公开表态的成本
    moderators:
    - 公开异见的社交成本
    - 群体规模（大群体更难打破）
    - 异见者出现的信号效应
    mediators:
    - 对他人态度的错误推断
    - 对孤立的恐惧
    outputs:
    - 规范的虚假延续
    - 公开行为的集体扭曲
    - 皇帝新衣效应（一旦破口即雪崩）
  evidence:
    supporting:
    - O'Gorman 1975 的种族态度调查：多数白人反对隔离却以为多数邻居支持（O'Gorman 1975，已建包 EP S213）
    - 饮酒规范研究：大学生普遍高估同伴对饮酒量的认可（Prentice 与 Miller 的系列研究，已建包 EP S213）
    - 课堂沉默研究：学生不提问因误以为只有自己不懂（多数无知的经典教学案例，已建包 EP S213）
    conflicting:
    - 效应依赖于公开表达的社交成本，在匿名平台上减弱
    - 少数情境下公开表态反而触发群体反感（对打破沉默者的惩罚）
    replication:
    - 饮酒规范研究在多校园样本重复
    - 课堂沉默与职场异议情境中的现象观察获得广泛支持
    - 多数无知的量化测量存在方法学挑战（难以直接测量私下信念的错配）
    meta_analysis:
    - 无权威 meta-analysis；以系列调查与实验研究为主
  evidence_grade: C
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 公开表态有较高社交成本（避免尴尬/排斥）
  - 群体成员相互可见但缺乏私下沟通渠道
  - 存在某个表面一致的多数立场
  failure_conditions:
  - 匿名或私下沟通充分的场景（私下对齐后错配消失）
  - 异见已被公开表达过（多数无知已被打破）
  - 群体规模小且关系紧密（信息透明度高）
  common_misinterpretations:
  - 与 false consensus（虚假同感偏差）混淆——多数无知是私下怀疑但以为他人认同；虚假同感是高估他人与自己观点的一致性
  - 误以为多数无知只发生在落后观念上——它同样维持着过度工作、过度消费等『进步』规范
  ethical_risks:
  - 利用沉默氛围让有害规范看起来被普遍接受
  - 压制公开表达以维持虚假共识
  examples:
    original_cases:
    - O'Gorman 1975 的多数无知经典调查（收录于社会影响与民意研究传统）
    - Prentice 与 Miller 的饮酒规范研究（收录于社会影响综述 S31）
    research_cases:
    - 大学生饮酒量知觉的错配研究
    - 课堂提问沉默的知觉研究
    modern_cases:
    - 公司内部没人反对加班但人人都不情愿的加班文化
    - 社群中对运营策略的集体沉默配合
    - 饭圈对偶像行程安排的沉默配合与突然脱粉雪崩
  communication_implications: 内容可以主动打破多数无知（『其实大多数人和你一样觉得不对劲』），这是一种高共鸣、低对抗的立场切入；产品评论区的匿名投票（真实态度分布）是打破多数无知的工具。
  community_implications: 社群运营要建立低成本私下反馈渠道（匿名问卷、私下吐槽区），打破多数无知；否则运营者会把沉默当认同，最终面临突然的大规模流失（皇帝新衣式崩塌）。
  content_applications:
    body: 用『你不是一个人这样想』框架开启敏感话题，为沉默多数提供公开表达的台阶
    opening: 『很多人不好意思承认这一点』——直接点破多数无知，制造安全表态氛围
    cta: 用匿名投票替代公开表态收集真实态度，再公开汇总结果
    comments: 置顶『其实我也…』式坦白评论，示范打破沉默的安全路径
  platform_implications: 平台的公开互动设计（公开点赞、评论）强化多数无知；匿名投票、匿名讨论区是平台层的破局工具；算法只放大公开行为，私下态度不可见，导致推荐内容系统性高估公开立场的真实支持度。
