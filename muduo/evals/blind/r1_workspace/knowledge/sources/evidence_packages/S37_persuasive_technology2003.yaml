# Evidence Package — S37 Fogg 2003（Persuasive Technology）
# 标准格式。access_level 如实标注。
source_id: S37
title: "Persuasive Technology: Using Computers to Change What We Think and Do"
authors: "B. J. Fogg"
year: 2003
journal: Morgan Kaufmann（专著；斯坦福说服技术实验室）
doi: "无 DOI（专著）"
url: "https://becisions.com/dictionary/terms/fogg-behavior-model"
access_level: substantial_excerpt
