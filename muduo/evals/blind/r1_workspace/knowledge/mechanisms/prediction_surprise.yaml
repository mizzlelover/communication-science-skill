- id: novelty_preference
  canonical_name_en: Novelty Preference
  canonical_name_zh: 新颖性偏好
  aliases:
  - 新异刺激偏好
  - novelty seeking —— 与 schema_violation 的区别：新颖性偏好是对新异刺激的一般性探索倾向，图式违背针对特定预期的破坏
  domain: prediction_surprise
  definition: 对新颖刺激的优先注意与探索倾向：Fantz 的视觉偏好范式显示婴儿注视新异图片更久，习惯化-去习惯化范式成为发展研究的标准工具（经典文献，未建包）。成人的探索行为同样受信息增益预期驱动。
  core_claim: 新颖性本身具有注意与动机价值——但价值来自预期信息增益，而非新异本身。
  mechanism: 新刺激携带更高的潜在信息量，探索它可能降低不确定性（Berlyne 的好奇传统与 S10 的预测框架一致）；但新颖同时意味着潜在威胁，因此探索与警觉并存。平台环境中新颖性供给过剩导致阈值攀升与习惯化加速。
  causal_chain: 新颖刺激出现 → 预期信息增益 → 探索与优先注意 → 习惯化后阈值攀升
  variables:
    inputs:
    - 刺激新颖度
    - 与已有知识的连接性
    - 不确定性水平
    moderators:
    - 个体开放性
    - 安全感
    - 接触历史
    mediators:
    - 信息增益预期
    - 习惯化过程
    outputs:
    - 注视时长
    - 探索行为
    - 分享意愿
  evidence:
    supporting:
    - Fantz 的婴儿视觉偏好实验与习惯化-去习惯化范式（经典文献，未建包）
    - Berlyne 对新颖性与探索行为的研究传统
    conflicting:
    - 纯新异而无意义的刺激迅速被习惯化；威胁性新颖引发回避而非探索
    replication:
    - 婴儿新颖性偏好是发展心理学最稳健的发现之一
    meta_analysis: []
  evidence_grade: A
  boundary_conditions:
  - 新颖需与已有图式可连接才有探索价值
  - 个体差异显著（开放性人格、安全感水平）
  failure_conditions:
  - 平台新颖性通胀：所有人都追新导致阈值同步攀升，新颖贬值（S100 的同质化悖论）
  - 伪新颖（换皮内容）被快速识破
  common_misinterpretations:
  - 追新等于增长——脱离信息增益的新颖只是噪音
  - 以为用户永远想要新东西——用户想要的是有意义的新
  ethical_risks:
  - 用伪新颖制造焦虑（最新研究颠覆……式标题的滥用）
  examples:
    original_cases:
    - S10 对探索与不确定性降低的论述；S100 对算法新颖性通胀的批判
    research_cases:
    - 婴儿习惯化实验：对重复刺激注视时间递减，新异图片重现注视回升
    modern_cases:
    - 短视频题材内卷与创新奖励；算法探索性推荐；新品营销的新鲜感周期管理
  communication_implications: 新颖要兑换成信息增益才可持续：每条内容至少提供一个受众真正不知道且能连上旧知的增量。
  community_implications: 社群内容矩阵需要新颖度的梯度管理——稳定栏目提供安全感，实验栏目供应新奇，比例失衡会同时流失两类成员。
  content_applications:
    title: 在熟悉框架里装一个真正的新增量（老话题新证据）
    body: 新概念出现时立刻挂靠已知概念
