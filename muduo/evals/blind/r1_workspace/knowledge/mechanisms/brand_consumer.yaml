- id: jobs_to_be_done
  canonical_name_en: Jobs to Be Done
  canonical_name_zh: 待办任务
  aliases:
  - JTBD
  - 焦点转移（switch 追问）
  domain: brand_consumer
  definition: 待办任务（Jobs to Be Done）由 Clayton Christensen 及合作者在《Competing Against Luck》等著作中理论化：顾客不是在「购买产品」，而是在特定情境下「雇用」（hire）产品去完成一个进步任务（job）——功能性、情感性与社会性维度的复合任务。经典的牛奶昔案例（早晨通勤者雇用奶昔打发无聊车程并抗饿）是其核心教学案例。
  core_claim: 产品的被选用由情境任务而非人口属性或产品特征预测：理解「顾客在什么情境下想取得什么进步、现有方案的不足」，是发现创新机会与增长的关键；任务相对稳定，完成任务的方案持续更迭。
  mechanism: JTBD 的因果逻辑：情境（situation）触发任务（我想从这里到那里取得进步），任务的完成受功能、情感、社会三重维度驱动，而现有方案（包括「不消费」）存在摩擦与不满，当新方案的任务完成度/成本比显著更优时发生「转换」（switch）。因此分析单位不是用户画像而是「情境-任务-方案」三元组：同一用户在不同情境雇用不同产品，不同用户在相同情境雇用相同产品。需求洞察的对象是任务结构，不是人群统计。
  causal_chain: 情境触发 → 进步任务被定义（功能/情感/社会） → 现有方案的摩擦积累 → 新方案以更优任务完成度被雇用 → 转换发生
  variables:
    inputs:
    - 情境描述
    - 任务的进步定义
    - 现有方案的不满与代价
    moderators:
    - 转换成本（习惯、学习、关系）
    - 新旧方案的可比性
    - 情境频率
    mediators:
    - 任务完成度感知
    - 转换动机（push of 旧不满 + pull of 新想象）
    outputs:
    - 雇用/解雇决策
    - 使用情境黏性
    - 创新机会识别
  evidence:
    supporting:
    - Christensen 学派对奶昔等经典案例的深度访谈与复盘（书籍案例）
    - 深度访谈法（switch moment 访谈）在产品发现实践中的有效性支持（实践证据）
    conflicting:
    - JTBD 作为理论框架的学术检验有限：任务结构缺乏统一测量，「任务稳定性」等命题主要靠案例支撑（学术讨论）
    - 与 Ehrenberg-Bass 的品类购买习惯视角存在张力：多数购买是习惯性低卷入，而非可叙述的任务求解（框架间争论）
    replication:
    - 作为洞察方法被广泛使用；无严格实证复制传统，属 C 级实践理论
    meta_analysis: []
  evidence_grade: C
  boundary_conditions:
  - 适用于转换时刻可识别、情境差异大的品类（创新发现场景）；纯习惯性购买（盐、纸巾）的任务分析价值有限
  - 任务陈述必须包含情境（「当……时我想……」），脱离情境的任务抽象会失效
  failure_conditions:
  - 把 JTBD 做成功能清单（「用户需要一个更快的马」陷阱：任务层面的洞察被方案层面的提问替代）
  - 人口属性与任务混淆：按人群设计而非按情境任务设计
  common_misinterpretations:
  - 「JTBD=用户需求调研」——JTBD 的独特性在于分析单位是情境任务而非用户；用传统问卷问「你想要什么」恰恰绕过了任务结构
  - 把 job 等同于功能：job 总是包含情感与社会维度（「在同事面前显得专业」与「备份文件」是同一任务的不可分割部分）
  ethical_risks:
  - 利用情感与社会维度的任务（身份焦虑、地位竞争）做剥削性产品钩子
  examples:
    original_cases:
    - 《Competing Against Luck》中的牛奶昔案例（通勤者雇用奶昔完成「无聊车程+抗饿」任务）
    research_cases: []
    modern_cases:
    - Airbnb 对「不像游客地旅行」任务的雇用
    - 知识付费被雇用完成「通勤时间不浪费」的情感任务
    - 便利店咖啡雇用「体面且不耽误下一件事」的职场任务
  communication_implications: 内容以情境任务为标题与开头（「当你不得不在周五晚交报告时」），而非产品功能；用户证言应完整呈现情境-不满-转换的过程叙事。
  community_implications: 社群定位可用任务语言描述（「帮助完成 X 任务的人」）；社群内容按成员的真实任务场景组织（模板库、场景方案库），而非按产品功能分类。
  content_applications:
    body: 正文采用「情境→任务→摩擦→更好的完成方式」结构，让读者在情境描述中自我代入
    narrative: 用户故事完整呈现 switch 时刻（之前用什么、不满在哪、现在如何），switch 叙事是 JTBD 的天然内容形态
    sharing: 分享物按任务场景命名（「周五交报告救急包」），被检索与被转发的都是任务语言
    comments: 官方提问用任务语言（「你一般在什么时候遇到这个问题」）收集情境素材
  platform_implications: 搜索行为直接暴露任务语言：搜索词是任务的自然语言表达，平台 SEO/内容策略应围绕任务短语而非产品参数组织（原则性判断）。
  related_nodes:
