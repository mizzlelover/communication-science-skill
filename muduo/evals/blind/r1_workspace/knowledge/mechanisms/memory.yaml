- id: spaced_repetition
  canonical_name_en: Spaced Repetition (Spacing Effect)
  canonical_name_zh: 间隔重复（间隔效应）
  aliases:
  - 间隔效应
  - distributed practice —— 与 mere_exposure 的区别：单纯曝光目标是好感，间隔重复目标是记忆保持；两者对重复安排的结论同向
  domain: memory
  definition: 相同总时长下，间隔安排的复习比集中安排产生更持久的记忆（spacing effect）。Ebbinghaus 1885 的遗忘曲线研究奠基；最优复习点大致位于将忘未忘之际。
  core_claim: 间隔化的重复接触显著提升长时记忆，即使总接触时间完全相同。
  mechanism: 间隔迫使出现部分遗忘，使下一次提取更费力，费力而成功的提取产生更强巩固（与 testing_effect 协同）；集中复习当下流畅但缺乏提取难度，短期可看、长期速朽。遗忘曲线定义了间隔的节奏依据。
  causal_chain: 间隔安排 → 部分遗忘 → 提取难度上升 → 成功提取的巩固增强 → 长期保持
  variables:
    inputs:
    - 重复次数
    - 间隔长度
    - 间隔递增安排
    moderators:
    - 材料稳定性
    - 目标保持期
    - 学习者水平
    mediators:
    - 提取难度
    - 巩固过程
    outputs:
    - 延迟记忆成绩
    - 遗忘速率
    - 触达效率
  evidence:
    supporting:
    - Ebbinghaus 1885 的记忆与遗忘曲线经典研究
    - Cepeda 等 2006 的间隔效应元分析
    - Zielske 1959 的广告记忆与遗忘现场研究传统
    conflicting:
    - 间隔过长导致遗忘超过可提取范围；最优间隔随目标保持期而变
    replication:
    - 间隔效应是记忆研究中最稳健的现象之一，跨越实验室与真实课堂
    meta_analysis:
    - 元分析确认间隔优于集中的平均优势，并支持扩展间隔安排（Cepeda 2006 一手 EP 未建，已建包 EP S191）
  evidence_grade: A
  boundary_conditions:
  - 间隔需要落在部分遗忘但可提取的区间
  - 目标保持期越长，最优间隔越宽
  failure_conditions:
  - 考前突击（集中学习）短期可用、长期速朽
  - 品牌投放一次集中轰炸后归于沉寂
  common_misinterpretations:
  - 集中曝光一周就够——遗忘曲线决定持续小幅触达优于集中爆发（对记忆目标而言）
  - 把间隔重复误解为机械重复——必须配合提取练习才有完整效果
  ethical_risks:
  - 利用间隔推送制造永远在线的依赖感（策略性唤醒与召回轰炸）
  examples:
    original_cases:
    - S76 的触达优先与持续性投放原则提供了营销层的对应
    research_cases:
    - Ebbinghaus 的无意义音节节省法；广告现场研究中分散投放的回忆优势
    modern_cases:
    - Anki 类工具；社群的回访节奏设计；广告投放的脉冲策略与频次规划
  communication_implications: 传播是遗忘管理：与其赌一条爆款，不如设计可预期的重复节奏，让正确信息在遗忘发生前再次出现。
  community_implications: 社群的回访与唤醒体系（新人 7 日路径、老客月度召回）本质是对间隔效应的运营化。
  content_applications:
    title: 系列内容按递增间隔推送（当天、三天、一周）
    body: 同一核心信息的不同变体而非原样复读
    cta: 在遗忘拐点安排下一次触达（关注、订阅、预约）
  platform_implications: 平台频次控制与重访召回算法是间隔机制的工程实现；跨平台记忆分散要求运营者自建触达节奏。
  related_nodes:
  - testing_effect
  - mere_exposure
  - encoding_specificity
  - mental_availability
  - context_cue_stability
  - hedonic_adaptation
  source_ids:
  - S04
  - S76
  - S191
  - S211
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Ebbinghaus 1885、Cepeda 等 2006 元分析、Zielske 1959 广告现场研究均为教科书/经典文献，三者一手 EP 均未建；S04
      EP 无间隔内容、S76 EP 无『触达节奏与记忆』内容，证据来自记忆蒸馏；2026-09-09 一手 EP 已建（S191）
    effect_size: 间隔复习优于集中复习（方向由教科书级共识支撑；一手元分析未建包）
    replication_status: 『跨实验室与真实课堂稳健』『Cepeda 2006 meta』为记忆级转述，未核一手 EP
    context_dependency: 最优间隔随目标保持期而变（遗忘拐点）
    downgrade_upgrade_reason: 2026-09 反向审计：三项核心证据（Ebbinghaus 1885/Cepeda 2006/Zielske 1959）均未建 EP，S04/S76
      EP 亦无对应内容，grade 由 A 降为 C，validation_status 回退 MEMORY_BASED，待建 Cepeda 2006 元分析 EP 后升级
  provenance:
    primary_sources:
    - S191
