- id: verb_concreteness_action_language
  canonical_name_en: Action Language and Verb Concreteness
  canonical_name_zh: 动作性语言与动词具体性
  aliases:
  - 行动语言
  - action verbs
  - 动词主导表达
  domain: language_rhetoric
  definition: 以具体动作动词（『打开、勾选、转账、复盘』）而非状态与抽象名词（『提升、优化、认知、体系』）组织语言对可执行感的影响：动作句让读者在阅读中模拟行为，缩短『知道』到『做』的距离。新兴应用方向，与具体性效应及实施意图研究相邻。
  core_claim: 动词驱动的句子让读者边读边『预演』行为，行为句密度高的内容有更高的行动转化——但证据处于新兴阶段。
  mechanism: 动作动词触发运动系统的具身模拟（embodied simulation）：阅读『拧开瓶盖』时运动皮层有可测量的激活，动作句因此比名词句更『可执行』；名词化表达（『实现对效率的优化』）把行为封装进抽象容器，模拟无从发生。行为句结构与
    implementation intentions 同构（何时-何地-做什么），阅读即预演；但具身模拟对高阶抽象行为的模拟强度有限（模拟『复盘』弱于模拟『拿起笔写』），行为句需落到可感知动作。
  causal_chain: 动作动词暴露 → 运动系统具身模拟 → 行为预演 → 执行意向激活 → 实际行动转化提升
  variables:
    inputs:
    - 动词与名词的比例
    - 动词的可感知度（身体动作>抽象行为）
    - 行为句的三要素完整度（何时何地做什么）
    moderators:
    - 行为与读者的日常经验距离
    - 行为的复杂度（复杂行为需分解为动作链）"
    - 受众的既有行为基础
    mediators:
    - 具身模拟
    - 执行意向激活
    - 行为可行性知觉
    outputs:
    - 行动意向提升
    - 行为转化提升
    - 内容的『可操作性』知觉
  evidence:
    supporting:
    - 具身模拟的动作词加工研究（动作句的运动系统激活证据）
    - implementation intentions 的行为句效应（何时何地做什么显著提升执行）
    - 《Magic Words》对语言形式与行为影响的分析（S70）
    conflicting:
    - 具身模拟的可复制性存在争议（具身认知的部分发现复制不稳）
    - 动作句优势在决策型（需要思考）而非执行型任务中减弱
    - 行为转化证据多为应用观察而非受控实验
    - S70 EP 载反例边界：身份语言（『你想成为什么样的人』）比行动语言更能激励坚持（饮食目标研究）——动词化并非总占优，须与目标类型匹配
    replication:
    - 动作词的运动激活方向有支持也有复制波动
    - 与 implementation intentions 的结合应用证据较稳（后者本身是行为科学稳健发现）
    meta_analysis:
    - implementation intentions 的元整合支持具体行为句对执行的强效应（本节点最可靠的邻近证据）
  evidence_grade: C
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 行为可分解为可感知动作（何时何地做什么）
  - 读者具备行为的基础能力（动作句不解决能力缺失）
  - 内容目标是行动转化（认知讨论类内容无需）
  failure_conditions:
  - 抽象高层行为（『建立体系』）无法直接模拟——需先分解
  - 过度动作化损伤深度思考类内容（分析、论证需要名词概念承载）
  - 具身模拟的个体差异（运动经验相关）
  common_misinterpretations:
  - 把动词化等同于口语化——动作句是精确的行为描述（『每晚睡前把手机放到客厅充电』），不是随便的白话
  - 以为动词越多越好：概念讨论需要名词承载，混合体裁按段配比
  ethical_risks:
  - 动作句的自动化执行诱导（把高风险操作写成一键动作降低审慎）
  - 简化复杂决策为动作清单（掩盖风险提示义务）
  examples:
    original_cases:
    - 《Magic Words》对语言形式与行为的关系讨论（S70）
    - 《Tiny Habits》的行为句式设计（『在我X后，我就做Y』，S16 的实践框架）
    research_cases:
    - 动作句的运动系统激活实验（具身认知方向）
    - implementation intentions 的执行提升实验
    modern_cases:
    - 健身 App 的动作指令（『起身、双脚与肩同宽、下蹲』）
    - 理财内容的行为句（『发薪日先转10%到单独账户』）
    - 反例：『赋能、抓手、闭环』式黑话（名词封装行为的反面教材）
  communication_implications: 行动指引部分执行『动词审计』：把每个抽象名词还原为动作链（『优化资产配置』→『打开App、点持仓、卖掉单一基金超过30%的部分』）；概念分析部分保持名词精度——两种语言按内容目标分区使用。
  community_implications: 社群的行动号召（打卡、作业、活动报名）全部用动作句+最小第一步；群公告模板把『希望大家积极参与』替换为『今晚8点，点接龙，写下第一行』——社群活跃度的差距常在动词密度。
  content_applications:
    body: 行动段执行动词审计：每条指令含动词+对象+触发条件（『每周日晚上，打开持仓页，看一眼单一资产是否超过30%』）
    cta: CTA 用最小动作句（『现在点收藏，周末按清单过一遍』）而非状态句（『建议关注起来』）
    title: 标题植入动作词提升可执行预期：『每周只做一件事：检查这张表』
    comments: 打卡引导用行为句接龙（『我今晚做的第一步是……』），成员补全动作即完成自我承诺
  platform_implications: 平台的小程序挂载与一键组件把动作句产品化（读到即做到）；AI 生成内容趋向名词化综述腔，动作性语言（真实行为细节）是人类创作者的差异化信号——这也让动作句成为『人味』检测的代理特征之一。
