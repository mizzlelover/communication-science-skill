research_question: "酒店环保提示牌如何更有效地促使客人重复使用毛巾？"
core_claims:
  - "使用描述性规范（'多数客人会重复使用毛巾'）的提示牌优于传统纯环保呼吁提示牌"
  - "当规范信息描述与个体当下情境最匹配的行为（provincial norms，'本房间多数客人重复使用毛巾'）时效果最强"
  - "两个现场实验证实该效应"
method: "两个现场实验：在真实酒店客房浴室轮换投放不同版本的提示牌，以毛巾重复使用率为因变量"
results: "描述性规范版优于环保呼吁版；'本房间'（provincial）版优于泛化描述性规范版"
limitations: "酒店场景单一；未取得原文未核验具体效应量；季节/客群波动未在此登记中核实"
boundary_conditions: "规范信息需与受众当下情境匹配；适用于亲环境等低成本、可见行为"
