- id: endowment_effect
  canonical_name_en: Endowment Effect
  canonical_name_zh: 禀赋效应
  aliases:
  - 禀赋效应
  - WTA-WTP gap
  - 拥有感定价
  domain: behavioral_economics
  definition: 禀赋效应指一旦拥有某物，对其的估值（愿意接受的卖价 WTA）即高于未拥有时的估值（愿意支付的买价 WTP）。Thaler 1980 提出，Kahneman、Knetsch 与
    Thaler 1990 的马克杯实验是经典证据。证据评级 A-（按枚举记 A）。与 loss_aversion 的关系：禀赋效应常被解释为把放弃拥有物编码为损失。
  core_claim: 拥有状态本身提高物品的主观估值，买卖价差（WTA-WTP gap）是稳健的实验现象。
  mechanism: 拥有使放弃被编码为损失（损失侧权重更大）；拥有物与自我概念融合，抬高情感价值；参照点因拥有而移动。实验范式（随机赠与马克杯后测买卖意愿）控制了选择效应，支持估值而非筛选的解释（S01、S12）。
  causal_chain: 获得拥有状态 → 参照点移动+自我关联 → 放弃被编码为损失 → 估值上升（WTA>WTP）
  variables:
    inputs:
    - 拥有状态
    - 持有时长
    - 拥有物与自我的关联度
    moderators:
    - 物品可替代性
    - 交易经验
    - 物品的情感与身份意义
    mediators:
    - 损失编码
    - 自我延伸
    - 参照点移动
    outputs:
    - WTA-WTP 价差
    - 退货率下降
    - 收藏品溢价
  evidence:
    supporting:
    - Kahneman、Knetsch 与 Thaler 1990 马克杯交易实验（经典实验）
    - 消费与收藏领域的多次重复（S12 综述）
    conflicting:
    - 市场经验丰富者与可替代商品的禀赋效应较弱；部分研究提示注意力与交易惯例的角色（边界研究）
    - S129（Gal & Rucker 2018）：经典马克杯范式或可由惯性/现状维持而非损失敏感解释（替代解释）
    replication:
    - 多国、多品类复制稳健。评级按枚举记 A（A- 水平）
    meta_analysis: []
  evidence_grade: A
  boundary_conditions:
  - 对有实物/数字载体的可持有物最明显；纯服务体验较弱
  - 拥有需被感知（领到、配置、定制）而非仅登记
  - 价值明确/为转售持有则效应消失（代币券 V/V*=1.0）
  failure_conditions:
  - 高频交易者对标准化商品估值接近无偏
  - 拥有体验差（加载失败、客服恶劣）时拥有感崩塌
  common_misinterpretations:
  - 把禀赋效应等同于『敝帚自珍』的性格描述；它是估值层面的系统偏移，有明确实验范式
  ethical_risks:
  - 制造虚假拥有感（预装、默认拥有）再以失去威胁促成续费
  examples:
    original_cases:
    - Nudge（S11）与 Misbehaving（S12）中的马克杯与拥有感讨论
    research_cases:
    - 马克杯随机赠与实验系列
    modern_cases:
    - 免费试用期的数据积累、游戏皮肤与虚拟装扮、定制商品高退货心理成本
  communication_implications: 让用户在付费前『拥有』一部分（试穿的虚拟形象、已导入的数据、可配置的空间），提高留存与升级意愿。
  community_implications: 让成员产出可累积的痕迹（作品集、等级、纪念墙），拥有感即沉没的关系资产。
  content_applications:
    body: 教程让用户在第一课就产出署名作品，制造早期拥有感
    cta: 『这份数据已经属于你，带走它只需一步』
  platform_implications: 平台的迁移成本设计本质是禀赋效应的工程化（数据、创作、关系）；数据可携带性监管是对其的制度制衡。
  related_nodes:
