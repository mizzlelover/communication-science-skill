    mechanism_links: [cocktail_party_effect, selective_attention]
    fact_type: industry_consensus
    note: "@功能为产品规则（普通成员可@单个人，@所有人需群主/管理员）[权限规则：产品界面可观察，官方文档待实读]；'点名触发响应'为认知机制（cocktail_party_effect），共识层。"
    evidence_level: L3
    source_ref: none
    last_verified: "2026-09"
  - pattern: "红包破冰与关键动作激活"
    mechanism_links: [reciprocity_norm, immediate_vs_delayed_rewards]
    fact_type: industry_consensus
    note: "红包把'利益互惠'前置，领取后的回应义务显著提高消息穿透率。"
    evidence_level: L3
    source_ref: "N/A（行业共识，无官方文档直接支持）"
    last_verified: "2026-09"
  - pattern: "接龙/接龙式报名制造承诺链"
    mechanism_links: [commitment_consistency, social_proof]
    fact_type: industry_consensus
    note: "看到已报名名单降低决策不确定（informational_influence），接龙链越长加入摩擦越低。"
    evidence_level: L3
    source_ref: "N/A（行业共识；接龙为产品可观察功能，无官方文档直接载明）"
    last_verified: "2026-09"
  - pattern: "群公告+置顶群规建立行为规范"
    mechanism_links: [descriptive_injunctive_norms, community_governance]
    fact_type: industry_consensus
    note: "入群时刻是规范灌输的黄金窗口；无规范的大群必然滑向刷屏与广告。"
    evidence_level: L3
    source_ref: "N/A（行业共识；群公告/置顶为产品可观察功能，无官方文档直接载明）"
    last_verified: "2026-09"
  - pattern: "分层小群运营（大群广播、小群深耕）"
    mechanism_links: [network_density, social_reinforcement, sense_of_community]
    fact_type: industry_consensus
    note: "小群内成员互识率与回复率更高；密度而非规模决定社群质量。"
    evidence_level: L3
    source_ref: "N/A（行业共识，无官方文档直接支持）"
    last_verified: "2026-09"
  - pattern: "固定栏目化运营（早报/答疑日/作业打卡）"
    mechanism_links: [habit_loop_cue_routine_reward, community_rituals, implementation_intentions]
    fact_type: industry_consensus
    note: "固定时间+固定动作让成员形成参与预期，降低发起互动的成本。"
    evidence_level: L3
    source_ref: "N/A（行业共识，无官方文档直接支持）"
    last_verified: "2026-09"

