      effect_size: "假新闻传播速度快于真新闻（Vosoughi 2018 数据）"
      replication_status: "假新闻速度优势在 Twitter 数据多源复现"
      context_dependency: "新奇性/情绪唤起/机器人放大调制"
      downgrade_upgrade_reason: "2026-09 实取 S99 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
