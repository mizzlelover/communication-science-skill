- id: curiosity_gap
  canonical_name_en: Curiosity Gap (Information Gap Theory)
  canonical_name_zh: 好奇缺口（信息缺口理论）
  aliases:
  - 信息缺口
  - information gap —— 与 zeigarnik_effect 的区别：好奇是信息缺口动机，蔡格尼克是任务中断动机；与 suspense_structure 的区别：好奇是机制，悬念是对机制的时序编排实践
  domain: prediction_surprise
  definition: 知道的与想知道的之间的缺口会引发类似剥夺感的好奇状态（Loewenstein 1994 的信息缺口理论；S144 仅摘要级支持，经教学资源二手交叉确认）。缺口适度时好奇最强——全然无知与全知都不产生好奇。Berlyne
    传统（经 S144 综述转述）把好奇区分为知觉性与认识性。
  core_claim: 信息缺口产生剥夺感并驱动寻求闭合的行为；缺口大小存在最优区间。
  mechanism: 部分知识使缺口凸显——你必须先知道自己不知道什么的具体轮廓，才会痒；闭合缺口带来即时奖赏（与预测误差的正向信号连通）。标题党是本机制的最小化应用：给轮廓不给答案。
  causal_chain: 部分知识暴露 → 缺口轮廓显现 → 剥夺感与好奇 → 寻求闭合（点击、阅读、追问）
  variables:
    inputs:
    - 已知部分
    - 缺口大小
    - 缺口与自我相关性
    moderators:
    - 受众先验知识
    - 主题卷入度
    - 缺口闭合成本
    mediators:
    - 剥夺感
    - 闭合预期奖赏
    outputs:
    - 点击率
    - 完读率
    - 追问行为
  evidence:
    supporting:
    - Loewenstein 1994 对信息缺口理论的系统阐述
    - Berlyne 关于好奇的早期实验传统（经典文献，未建包）
    conflicting:
    - 效应依赖受众恰好知道一点点；缺口过小显得无聊、过大显得无关
    replication:
    - 信息缺口引发寻求行为的核心主张稳健；具体到点击率的量级随场景浮动
    meta_analysis: []
  evidence_grade: B
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 需要受众已有部分相关知识作为缺口轮廓
  - 标题承诺与内容兑现的落差会累积为信任折旧
  failure_conditions:
  - 滥用导致标题党疲劳——受众学会从标题反推答案，缺口失效
  - 缺口永不闭合（无限滚动式延迟）训练出厌烦与逃离
  common_misinterpretations:
  - 起个悬念标题就有点击——受众必须恰好知道一点点，缺口才有轮廓
  - 把好奇缺口等同于标题党——真正的缺口设计在正文结构中同样有效
  ethical_risks:
  - 永不闭合的缺口设计制造粘性焦虑（无限下拉的再等一下）
  - 缺口诈骗：承诺答案却交付广告
  examples:
    original_cases:
    - S65 用信息缺口解释叙事好奇；S40 的意外原则提供了相邻框架
    research_cases:
    - 好奇实验：预先暴露问题轮廓的被试对答案的记忆与寻求更强（Loewenstein 综述的证据群）
    modern_cases:
    - 为什么 99% 的人不知道……式标题；知识付费试听卡点；百科条目的缺一脚设计
  communication_implications: 好奇是给读者的预付款：先展示缺口轮廓（问题、反常现象、半截故事），再承诺闭合路径，点击与完读同源于此。
  community_implications: 社群提问文化（每周抛出一个未解问题）制造集体缺口，是持续讨论的燃料。
  content_applications:
    title: 标题给缺口轮廓：现象加问号，不剧透答案
    opening: 把缺口具体化（你可能一直以为 X，但有一个例外）
    body: 分层闭合：先小闭合给满足，再开新缺口维持阅读
    cta: 闭合后的余味问题引导评论
  platform_implications: 平台点击率指标奖励缺口标题，形成标题通胀；算法随后用完读率惩罚不兑现者，倒逼缺口必须真实闭合。
