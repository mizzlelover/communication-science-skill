research_question: "为什么'常识'（common sense）无法预测复杂社会现象？社会科学的正确路径是什么？"
core_claims:
  - "常识是事后自圆其说：成功不存在必然逻辑——音乐实验室实验（同一批歌曲，独立评分组与可见他人下载的社交组结果完全不同，从众/随机/传播顺序权重远超内容质量）"
  - "'关键意见领袖'神话被修正：流行根基是海量普通人的弱关系传播；移除头部网红传播仅小幅放缓，移除中层普通传播者热度归零"
  - "专家长期预测不如极简统计模型（Tetlock 20 年研究：专家预测略好于随机、低于简单模型；越自信误差越大）"
  - "运气（随机性）是多人竞争赛道的核心区分变量；群体智慧有严苛前提，现实中群体常放大偏见（群体愚蠢）"
  - "历史是单一不可重复的偶然路径，不能作为预测工具；需要更好的测量与中层理论（对比物理学 Kepler 阶段）"
method: "社会科学研究综合（音乐实验室/社交网络大数据/Tetlock 专家预测）+ 批判论证"
results: "（理论批判）常识推理的局限系统化；'影响者神话'修正的普及版"
limitations: "批判性论证为主（非新实验）；'运气主导'强解读有争议"
boundary_conditions: "适用于复杂社会系统预测；简单可控情境常识仍有效"
