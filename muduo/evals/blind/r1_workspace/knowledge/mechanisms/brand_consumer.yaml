- id: positioning_mechanism
  canonical_name_en: Positioning Mechanism
  canonical_name_zh: 定位机制
  domain: brand_consumer
  definition: '定位（positioning）由 Al Ries 与 Jack Trout 在 1970 年代《广告时代》系列文章及《Positioning: The Battle for
    Your Mind》中提出：传播过载环境中，营销的战场不在工厂与货架，而在潜在顾客的心智——品牌必须在品类心智阶梯上占据一个清晰、有利且未被占据的位置。它是对消费者类别化认知与可得性结构的实践应用框架。'
  core_claim: 心智对品类信息的容量极其有限（每个品类通常只稳定记住少数品牌），品牌应通过简化的、与既有认知挂钩的定位语句，占据品类阶梯上的一个具体位置，而非追求全面优势。
  mechanism: 定位机制建立在两个认知现实之上：（1）类别化存储：心智按品类（category）归档品牌，消费者以「品类→需求触发→品牌检索」的顺序决策；（2）容量限制：每个品类的活跃记忆槽位极少，且先进入者占据默认位置。因此定位的操作是：选择品类与参照系（在什么品类里竞争）、绑定既有认知（挂靠消费者已知的锚点）、占据一个词或一种属性（简化到一句话可复述）、并保持长期一致（槽位的占用需要重复维护）。与其改变心智，不如利用心智中已存在的结构。
  causal_chain: 选择参照品类 + 绑定既有认知 + 简化定位语 → 品类检索时被激活 → 槽位占用与巩固 → 购买情境中的默认地位
  variables:
    inputs:
    - 品类参照系选择
    - 定位语句的简化度
    - 与既有认知的匹配度
    moderators:
    - 品类心智槽位的占用情况
    - 竞品定位的重叠度
    - 传播预算与持久性
    mediators:
    - 品类联想建立
    - 记忆槽位占用
    outputs:
    - 品类检索激活率
    - 考虑集位置
    - 定位语的可复述性
  evidence:
    supporting:
    - Ries & Trout 的定位理论及其大量案例复盘（从业者经典）
    - 与 Ehrenberg-Bass 的品类进入点研究在「情境激活」逻辑上相通（理论呼应）
    - 类别化认知与记忆容量限制的认知心理学基础（确证的认知机制）
    conflicting:
    - 「占领一个词」在多品类延伸与复杂购买中解释力有限；过度简化可能牺牲品牌延展性（营销学术讨论）
    - 定位的成功案例存在事后归因风险（幸存者偏差，实践框架通病）
    replication:
    - 作为实践框架被广泛使用五十年；无严格对照检验，属从业者经验（按 EVIDENCE.md 须显式标注）
    meta_analysis: []
  evidence_grade: D
  boundary_conditions:
  - 适用于心智槽位有限、低卷入重复购买的品类；复杂决策（企业采购、医疗）更依赖证据与关系而非一句话槽位
  - 定位是长期资产：需要多年一致的传播投入才能占用并保持槽位
  failure_conditions:
  - 定位语内部视角化（技术黑话而非消费者认知锚点），无法被检索
  - 频繁重新定位：每次改动都放弃已占用的槽位
  common_misinterpretations:
  - 「定位=广告语」——广告语是表达，定位是选择在哪个品类、对谁、占哪个位置的决策；先有位置再有语句
  - 把 positioning_mechanism 当作实证定律引用——它是优秀的实践框架（D 级），其底层认知机制（类别化、容量限制、可得性）才是有实证支持的 A/B 级知识
  ethical_risks:
  - 定位中的恐惧诉求与身份贬低（「不用 X 的人不专业」）
  examples:
    original_cases:
