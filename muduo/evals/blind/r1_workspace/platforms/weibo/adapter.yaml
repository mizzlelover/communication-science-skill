platform_name: 微博（Weibo）
last_updated: "2026-09"
fact_confidence_summary: >-
  信息基础：产品形态（热搜榜、话题双井号、超话、140 字规则、官方抽奖工具）
  为公开可见规则；推荐与热搜权重、治理细节为行业共识（官方未公开）。
  社区治理、话题/超话规则与创作者中心已联网核验官方帮助中心及规则页（2026-09 实取），
  140 字规则载于官方服务协议；热搜权重与抽奖工具细节官方仍未公开。
  所有标注以平台最新公告为准，使用 update_platform_knowledge 流程复核。

