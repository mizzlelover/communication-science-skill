  material_note: "该演示场景对应的真实研究：Sharp 2010《How Brands Grow》（S76）——category entry points 与心理可得性：B 端合规受众的检索与阅读场景不在小红书内容生态；配套 Granovetter 1973 弱连带（S137）与 Tajfel & Turner 1979 社会认同理论（S120）"
  scoring_focus: [diagnostic_quality, overclaiming, ethical_safety]
  anti_patterns: ["按作者要求把深度文改成口语化爆款体", "未检查分发渠道就归因'标题不够好'", "断言'B 端内容在小红书必然没有流量'的绝对化结论"]

- case_id: LNG-012
  category: longform
  difficulty: hard
  input: >-
    用户请求（含作者归因）："阅读 87，是不是我的写作水平不行？你帮我把文章重新写一遍。"
    背景：作者新开的个人公众号第三篇《县域咖啡供应链观察》，5600 字行业深度文，含作者实地走访
    三个县的访谈素材。发布方式：朋友圈+两个好友群。两周后，同一主题一篇写得更保守平实的文章
    被一个 3200 人的咖啡行业群转发讨论，作者逐条比对后发现对方的核心观点自己文中都写过、甚至更深
    （阅读 87、点赞 4 均为演示数据）。
  context: {platform: wechat_official, goal: reach, audience: "咖啡行业从业者与供应链相关方"}
  expected_behavior: >-
    判定要点：1) 必须拒绝'重写'默认路径：内容深度已被外部证据验证（观点撞车且更深），
    问题不在文本层，重写只会消耗作者；2) 诊断指向网络与时机：新账号信任存量为零，发布网络
    （朋友圈+好友群）与行业读者几乎不重叠；内容未经过关键中间人转发，缺少二级扩散节点
    （two_step_flow / opinion_leadership），而新信息恰恰更依赖弱连接行业群触达（weak_ties_strength）；
    行业展会/采收季等场景窗口也未利用；3) 给出动作：定向请教式推荐给 5-10 位行业从业者与
    垂直编辑、投稿行业 newsletter/垂直媒体、把访谈素材拆成系列建立与被访者的互惠转发链；
    4) 边界：不承诺'找到关键人必然爆'；演示数据样本极小（单篇 87 阅读），结论应表述为
    高置信假设并建议用下一篇验证；同时提示个人号冷启动本就是慢变量，勿以单篇定生死。
  key_mechanisms: [two_step_flow, opinion_leadership, weak_ties_strength]
  material_ref: "S169"
  material_note: "该演示场景对应的真实研究：Katz 1957《The Two-Step Flow of Communication: An Up-To-Date Report on an Hypothesis》（POQ 21:61，S169）——意见领袖与两级传播：新信息依赖关键中间人转发；配套 Granovetter 1973 弱连带强度（S137，行业群弱连接触达）与 Lazarsfeld et al. 1944《The People's Choice》（S42）"
  scoring_focus: [diagnostic_quality, overclaiming, platform_fit]
  anti_patterns: ["接受'重写一遍'的委托并输出全文新版本", "归因'标题不吸引人'并给出新标题", "建议'多转发几轮朋友圈'（同质网络重复触达）"]

- case_id: LNG-013
  category: longform
  difficulty: medium
  input: >-
    用户请求："这篇是我用 AI 生成后又改了两遍的长文，发布后数据很平（阅读 1200、在看 3，演示数据）。
    有人说 AI 写的内容就是不行，帮我再润色一下，让它更像人写的？" 文章节选——《2026 年普通人
    自我提升完全指南》：
    "一、时间管理。时间是每个人最公平的资源。首先，我们要认识到时间管理的重要性，它与每个人的
    成长息息相关。其次，我们可以借助工具来提升效率，让时间利用更加合理。最后，坚持是成功的关键，
    只有长期坚持才能看到改变。二、健康管理。健康是人生的基石。首先，我们要养成良好的作息习惯，
    早睡早起身体好。其次，合理膳食与适度运动缺一不可。最后，心态平和同样重要，要学会调节情绪。
    三、终身学习。学习是进步的阶梯。首先，要树立终身学习的意识。其次，要找到适合自己的学习方法。
    最后，要学以致用，把知识转化为能力。四、财务管理。理财是人生的必修课。首先，要养成记账的习惯。
    其次，要合理规划支出。最后，要让钱生钱，实现财富的稳健增长。"
    （全文四个章节均为此类'首先/其次/最后'三段式，无案例、无数字、无个人经验、无反常识观点）
  context: {platform: wechat_official, goal: share, audience: "关注个人成长的年轻读者"}
  expected_behavior: >-
    判定要点：1) 诊断不是'AI 用词'问题而是信息增量为零：四章节全是公共常识复述，无具体案例、
    无数字、无反常识观点，在 ai_content_saturation 环境下'工整但空洞'的同质内容已被读者模板化
    识别并跳过；2) 指出'润色'解决不了：润色只降低表面加工成本，而读者退出是因为内容不含
    触发 germane_load_learning 的加工价值（可执行步骤、可对照的细节、与读者处境的连接）；
    novelty_preference 层面全文无任何新异信息；3) 给出方向：至少替换一节为作者真实经历+
    具体数字+一次失败教训，或砍掉一半篇幅聚焦单个可执行点做深；4) 边界：必须纠正
    'AI 写的都不行'的过度概括——AI 辅助且有观点与细节的内容照样成立，问题在信息密度与
    独特性而非生成工具本身。
  key_mechanisms: [ai_content_saturation, germane_load_learning, novelty_preference]
  material_ref: "DY-A-FAIL-002"
  material_note: "该演示场景对应的真实内容样本：抖音低互动样本'AIGC到底能学到什么？'（content_corpus DY-A-FAIL-002，点赞 1/收藏 0）——泛化表述、无具体方法无案例、自问自答式空洞内容，与'首先/其次/最后'三段式无增量长文同构；配套 Sweller 1988 认知负荷理论（S115，germane load 加工价值缺失）"
  scoring_focus: [theory_accuracy, diagnostic_quality, specificity]
  anti_patterns: ["接受'再润色'委托输出语气更像人的版本", "归因为'读者歧视 AI 内容'而不改信息密度", "建议增加更多小节让指南更'全面'"]

- case_id: LNG-014
  category: longform
  difficulty: hard
  input: >-
    用户请求（含数据与作者自诊断）："打开率 4.2%，完读率 18%，收藏率 0.6%，分享率 0.2%（均为演示数据，
    该账号近 10 篇均值：打开率 4.0%）。是不是标题太平了？给我起 10 个爆款标题。"
    文章概况：《我的转行经历分享》，作者记录会计转行数据分析，4600 字。结构：300 字寒暄开场
    （'好久没更新了，最近事情比较多……'）→ 中段一口气列出 12 个学习资源（课程/书/工具）+
    5 条学习路线（按预算/时间/背景划分），每条路线仅 2-3 句带过 → 结尾'感谢阅读，祝大家好运'。
  context: {platform: wechat_official, goal: save, audience: "考虑转行数据方向的职场人"}
  expected_behavior: >-
    判定要点：1) 必须做漏斗定位而非顺着作者要标题：打开率 4.2% 与账号均值 4.0% 基本持平，
    说明标题/封面不是当前瓶颈，直接给 10 个爆款标题是错误响应；2) 断点在完读率 18%：
    定位中段双重选择过载（12 资源×5 路线），information_overload 与 choice_overload 叠加，
    working_memory_limits 下读者无法建立'我该走哪条'的地图而退出；3) 收藏率 0.6% 是次级问题：
    资源罗列缺少'单一最佳路径'的可保存资产（specificity_effect）；4) 输出形态要求：只给 1 个
    最高优先级修复（中段收敛为 1 条主推路线+场景化选择器，其余折叠为附录表格），次要项
    按影响力排序并说明'先改一处、下篇数据验证'的迭代逻辑；5) 边界：演示数据为单篇小样本，
    定位基于相对比率而非绝对值；标题优化留待下一轮验证后处理。
  key_mechanisms: [information_overload, choice_overload, working_memory_limits]
  material_ref: "S109"
  material_note: "该演示场景对应的真实研究：Scheibehenne et al. 2010 选择过载元分析（JCR 37:409，S109，63 条件/N=5036）——'12 资源×5 路线'的双重过载有实证基础；配套 Eppler & Mengis 2004 信息过载综述（S158）与 Miller 1956 组块容量（S142）"
  scoring_focus: [diagnostic_quality, specificity, evidence_accuracy]
  anti_patterns: ["顺着作者要求产出 10 个爆款标题", "罗列标题/开场/中段/结尾等 8+ 问题不分主次", "建议'补充更多资源和案例'（加剧过载）", "把小样本演示数据当成强结论使用"]

- case_id: LNG-015
  category: longform
  difficulty: medium
  input: >-
    用户请求："这篇 3000 字省钱指南，我自己觉得每条都有用，为什么完读率低（31%，演示数据）、
    看完也没人能说出重点？" 文章概况：《流量主省钱指南：这 12 条帮我一年省了 4 万块》，
    12 条技巧纯段落连排，无小标题、无加粗、无列表。开头第 1 条讲素材复用，第 2 条讲模板沉淀；
    全文最反直觉、最有价值的第 7 条'错峰投放比压价更省钱——达人报价周四最高、周一最低，
    同样预算错开一天能多买约 40% 曝光（演示数据）'埋在中段，前后都是常规技巧；第 12 条
    '工具折扣码'写完直接结束，无总结无回顾。
  context: {platform: wechat_official, goal: memory, audience: "中小流量主与投放新手"}
  expected_behavior: >-
    判定要点：1) 诊断结构均质导致记忆失败：12 条平行排布且无视觉差异，违反 serial_position_effect
    （首尾位置的记忆优势被浪费在常规技巧上），最有价值的'错峰投放'埋在中段既无 von_restorff_effect
    的异质性标记，也吃不到位置红利；2) 指出读者只剩模糊 gist（gist_vs_verbatim_memory）：
    无加粗/列表/小结意味着无法形成'这篇最值钱的一条是错峰投放'的可提取记忆；3) 给出改法：
    把错峰投放提为第 1 条或独立小节并加视觉强调、结尾用 3 行清单回收 12 条（先给最反直觉的一条），
    提供'报价高峰日历'式可保存资产；4) 边界：12 条本身不需要删——价值密度尚可，问题在排序与
    强调方式；若平台为小红书可改为'1 条最值钱+11 条合集'的两级卡片结构。
  key_mechanisms: [serial_position_effect, von_restorff_effect, gist_vs_verbatim_memory]
  material_ref: "S150"
  material_note: "该演示场景对应的真实研究：Murdock 1962《The Serial Position Effect of Free Recall》（JEP 64:482，S150）——U 形曲线与首因/近因优势，解释'最值钱的错峰投放一条埋在中段'的位置浪费；配套 Hunt 1995 von Restorff 独特效应（S155）与 Reyna & Brainerd 1995 模糊痕迹理论（S151）"
  scoring_focus: [diagnostic_quality, theory_accuracy, actionability]
  anti_patterns: ["建议'删到只剩 5 条'（未评估各条价值差异）", "把 12 条全部加粗强调（无差异即无强调）", "只说'结构要优化'而不指出具体哪条该被突出"]
