- id: minority_influence
  canonical_name_en: Minority Influence
  canonical_name_zh: 少数派影响
  aliases:
  - Moscovici 少数派影响
  - 少数派影响理论
  domain: social_proof
  definition: Serge Moscovici 提出的社会影响方向：一致、自信的少数派虽难以在公开层面取胜，但能在私下与延时层面改变多数派的判断（转换作用，conversion），与多数派的即时公开从众形成互补。
  core_claim: 多数派改变公开行为（顺从），少数派改变私下信念（转换）；少数派的有效性取决于其一致性、确定性与风格而非人数。
  mechanism: 多数派信息导致注意力集中于『做什么才对』（横向冲突：我与多数的差异），引发公开顺从但认知加工浅。少数派信息引发对议题本身的纵向加工（『他为什么这么坚持』），被影响者更系统地审视论点，从而在延时测试与私密判断中出现真实改变（conversion）。少数派需保持行为一致性（时间上稳定）与主体间一致性（成员间一致），并避免显得僵化固执。
  causal_chain: 一致的少数派坚持立场 → 多数派对冲突归因（他为何坚持） → 系统加工论点 → 私下/延时态度转换 → 长期规范迁移
  variables:
    inputs:
    - 少数派一致性（时间与成员间）
    - 立场的确定性表达
    - 论据质量
    moderators:
    - 少数派规模（少数但非单一）
    - 多数派的开放度
    - 议题的利害与身份绑定度
    mediators:
    - 对冲突源的归因
    - 系统加工深度
    - 转换（延时态度改变）
    outputs:
    - 延时判断改变
    - 私下接受
    - 创新扩散的早期种子
  evidence:
    supporting:
    - Moscovici 的蓝色-绿色幻灯实验：一致回答『绿色』的少数派使部分多数派在后续私密判断中出现色觉判断偏移（Moscovici 蓝绿幻灯实验，未建包）
    - 延时与私密测试中的少数派效应在多项研究中重复
    - 少数派一致性对效应的关键作用获得支持
    conflicting:
    - 效应量总体偏小，且对实验操作敏感
    - 公开对抗性强的少数派可能反而强化多数派防御
    - 真实政治与市场情境中少数派常被边缘化而非转换
    replication:
    - 延时转换效应在部分复制中稳健、部分存在波动
    - 该方向整体证据状态中等，属稳健但幅度有限的效应
    meta_analysis:
    - 少数派影响研究的整合综述支持延时效应存在但幅度小且条件依赖
  evidence_grade: B
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 少数派保持一致且自信但不僵化
  - 议题允许延时与私下层面的重新评估
  - 少数派不是多数派身份认同的核心威胁（否则触发防御）
  failure_conditions:
  - 少数派内部不一致或摇摆
  - 被知觉为固执或利益相关（收钱说话）
  - 议题已高度阵营化，少数派立场被解读为敌对身份信号
  common_misinterpretations:
  - 误以为少数派靠音量取胜——一致性比强度更重要
  - 混淆公开说服与私下转换：多数派影响看即时公开行为，少数派影响看延时私下态度
  ethical_risks:
  - 利用一致性表演（水军扮少数派）制造伪草根（astroturfing）
  - 以『少数清醒者』话术包装营销立场
  examples:
    original_cases:
    - Moscovici 的蓝色-绿色幻灯实验（社会影响研究传统，EP 未建包）
    - Moscovici 关于少数派主动性的理论阐述
    research_cases:
    - 延时测试中少数派引发的色觉偏移
    - 少数派一致性的操纵实验
    modern_cases:
    - 早期加密货币布道者对主流的长期渗透
    - 素食、环保理念从边缘到主流的数十年转换
    - 社群中的长期反共识意见领袖最终改变群体规范
  communication_implications: 新观念的传播早期应追求深度转换而非即时流量：小而一致的核心受众比大而浅的曝光更能沉淀真实改变；对高认同受众允许延时验证的内容（可复检的事实）优于即时情绪高潮。
  community_implications: 社群应保护一致的少数派意见（避免被即时多数压制）：他们的延时影响是社群规范演化的引擎；设少数派保护机制（冷静期、结构化辩论）可防止群体思维固化。
  content_applications:
    body: 反共识内容须展示长期一致性（过往观点记录、可验证的跟踪），而非单次强势输出
    comments: 对少数派评论给予结构化回应而非压制，将其转化为延时转换的种子
    evidence: 用可延时验证的开放式证据（预测记录、时间戳）替代即时断言，适配转换型加工
  platform_implications: 算法偏好即时多数互动（点赞量），系统性削弱少数派内容的曝光——少数派影响在平台结构上处于劣势，需社群与关注关系链作为替代通道（对应 complex contagion
    的强连带需求）。
