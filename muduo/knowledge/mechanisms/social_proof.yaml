      Asch 1951/1955 原始实验
    effect_size: 一致多数派产生显著公开从众；同伴支持大幅降低从众率
    replication_status: 基本范式多文化重复；现代复制整体从众率有波动
    context_dependency: 判断公开性与任务模糊度是关键调节；异见者提供保护
