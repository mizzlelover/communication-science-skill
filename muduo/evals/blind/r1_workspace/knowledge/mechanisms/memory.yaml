# memory — 记忆（Memory）：被留下来的才是真正传播过的
domain: memory
nodes:
- id: encoding_specificity
  canonical_name_en: Encoding Specificity
  canonical_name_zh: 编码特异性
  aliases:
  - 提取线索匹配
  - cue-dependence —— 与 context_cue_stability 的区别：本节点是记忆的编码-提取匹配原则，后者是行为设计的线索稳定性原则
  domain: memory
  definition: 提取效果取决于提取线索与编码时情境的匹配程度（Tulving 的编码特异性原则）。记忆不是录像带，而是按线索重建的过程：编码时伴随的环境、心境与任务框架都会成为未来的提取线索。
  core_claim: 记忆提取的成功率由编码情境与提取情境的匹配度决定，而非记忆痕迹的绝对强度。
  mechanism: 编码时激活的关联网络（环境、情绪、语义）成为记忆痕迹的一部分；提取时线索与编码特征重叠越多，激活扩散越容易到达目标。Godden 与 Baddeley 1975 的潜水员实验提供了最著名的展示：水下学的单词水下回忆更好，陆地同理（经典文献，已建包
    EP S214）。
  causal_chain: 编码情境特征被存储 → 提取情境提供线索 → 线索重叠度决定提取成功率
  variables:
    inputs:
    - 编码环境
    - 心境状态
    - 编码任务框架
    moderators:
    - 间隔时长
    - 线索类型（物理或语义）
    mediators:
    - 线索重叠度
    - 激活扩散
    outputs:
    - 回忆率
    - 再认率
    - 应用迁移
  evidence:
    supporting:
    - Tulving 与 Thomson 1973 的编码特异性原则论文
    - Godden 与 Baddeley 1975 的潜水员情境依存记忆实验（经典文献，已建包 EP S214）
    conflicting:
    - 心境依存效应弱于情境依存效应，复制结果波动较大
    replication:
    - 线索匹配总原则稳健；物理环境线索的作用随间隔拉长而衰减
    meta_analysis: []
  evidence_grade: A
  boundary_conditions:
  - 语义线索通常强于物理环境线索
  - 环境线索对短间隔回忆影响大，长间隔后衰减
  failure_conditions:
  - 在教室学、在家里用——提取场景与编码场景断裂
  - 文案语境与投放场景不匹配，记忆无法在购买现场被激活
  common_misinterpretations:
  - 只要记住了随时都能用——孤立记忆常因缺线索而调用失败
  - 以为重复次数决定记忆——线索匹配往往比次数更关键
  ethical_risks:
  - 上下文广告制造与场景错配的熟悉感，误导消费判断
  examples:
    original_cases:
    - S04 对编码与提取关系的系统阐述
    research_cases:
    - 潜水员实验：学习与回忆环境一致组的自由回忆显著更好
    modern_cases:
    - 收银台旁的最后一眼陈列复现广告信息（在购买场景重建线索）；社群打卡的固定时间与固定地点
  communication_implications: 让品牌信息在与购买决策相似的情境中出现，等于给记忆装上现场钥匙；内容要内置未来被提取的场景词。
  community_implications: 社群仪式固定时间固定场景（每周三晚直播），是把编码情境制度化为提取线索。
  content_applications:
    body: 在内容中预埋使用场景句（当你准备……的时候）
    opening: 用受众真实使用场景开场，绑定未来的提取线索
    cta: 把行动指令与具体场景挂钩（下次开会前打开这条）
  platform_implications: 平台的情境标签（地理位置、时段推送）是线索匹配的工程化；跨平台投放的线索断裂是记忆资产流失的暗坑。
