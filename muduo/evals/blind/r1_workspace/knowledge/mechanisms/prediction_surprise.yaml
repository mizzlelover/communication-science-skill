- id: schema_violation
  canonical_name_en: Schema Violation
  canonical_name_zh: 图式违背
  aliases:
  - 预期违背
  - expectation violation —— 与 von_restorff_effect 的区别：隔离效应是列表内的知觉异类优势，图式违背是知识层面的预期破坏；与 prediction_error
    的关系：图式违背是预测误差在语义知识层的表现
  domain: prediction_surprise
  definition: 违背既有图式（知识与事件预期结构）的信息获得注意与编码优先。图式提供预测基线，违背标注了模型需要更新的位置；Bartlett 1932 的故事复述研究是该领域奠基。
  core_claim: 意外之所以有认知特权，是因为它指向受众既有模型的失效点——但前提是该图式真实存在且违背可被同化。
  mechanism: 共享图式提供稳定预期，违背触发定向反应与更深编码（连 prediction_error）；但违背必须能被同化——皮亚杰意义上的顺应：无法解释的违背被忽略、遗忘或在传播中被驯化回图式（Bartlett
    的复述变形，与 S05『bias：当前信念对过去的回溯性扭曲』的记忆扭曲方向同向）。
  causal_chain: 共享图式建立预期 → 信息违背图式 → 定向反应与深编码 → 可同化则更新模型，不可同化则被驯化或遗忘
  variables:
    inputs:
    - 图式强度
    - 违背幅度
    - 违背的可解释性
    moderators:
    - 受众共享度
    - 铺垫充分性
    - 文化背景
    mediators:
    - 预测误差
    - 定向反应
    outputs:
    - 注意与记忆优先
    - 传播性
    - 理解成功率
  evidence:
    supporting:
    - Bartlett 1932 的战争之鬼系列复述实验（经典文献，未建包）
    - 图式与违背对记忆影响的实验传统
    conflicting:
    - 怪异度对记忆优势的研究结果混合——过强或无法归类的违背不产生稳定优势
    replication:
    - 图式影响记忆与理解的总模式稳健；违背收益的边界条件研究持续
    meta_analysis: []
  evidence_grade: B
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 违背针对受众所共享的图式才有效，圈层梗对外人只是噪音
  - 顺序很重要：先建立图式再违背，无铺垫的反转无收益
  failure_conditions:
  - 受众没有该图式时，违背只是混乱（知识断层场景）
  - 违背与品牌无关时记住了梗忘了品牌（与隔离效应同款边界）
  common_misinterpretations:
  - 反转等于高级——没有铺垫的反转没有认知收益，只有困惑
  - 把违背当成流量密码——可同化的违背才转化为理解与记忆
  ethical_risks:
  - 用违背预期的虚假内容博流量（假新闻的典型结构）
  examples:
    original_cases:
    - S40 的意外原则（SUCCESs 的 U）建立在图式违背之上
    research_cases:
    - Bartlett 的复述实验：与英国受试者文化图式冲突的民间故事在传递中被系统驯化
    modern_cases:
    - 广告反转梗；品牌人设反差（硬核工程师卖萌）；反常识科普的走红逻辑
  communication_implications: 意外必须长在受众已有的常识上：先复述他们相信什么，再展示例外，理解与记忆同时达成。
  community_implications: 社群内部梗的更新就是图式违背的游戏化——但新梗必须锚定老梗，否则新成员与老成员分裂成两个语境。
  content_applications:
    title: 标题引用常识再打破（你以为……其实……）
    opening: 先花一句复述受众的既有预期，为违背付铺垫成本
    body: 违背之后立即给出解释，避免停留在困惑
    cta: 邀请读者说出自己被打破的预期
  platform_implications: 算法对高互动反转内容的奖励催生虚假违背（标题与内容两张皮）；事实核查体系是对虚假图式违背的制度对抗。
