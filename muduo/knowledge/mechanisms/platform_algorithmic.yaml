  - id: cold_start_dynamics
    canonical_name_en: Cold Start Dynamics
    canonical_name_zh: 冷启动动态
    aliases: ["cold start problem", "冷启动"]
    domain: platform_algorithmic
    definition: 新账号、新内容或新产品在缺乏行为数据时，系统无法评估其价值而给予极低曝光的结构性困境；以及破解该困境的策略空间（初始种子用户、相似人群外扩、付费加速等）。
    core_claim: 冷启动期的传播策略与成熟期完全不同：核心不是内容优化而是"制造初始信号"，包括精准种子人群与互动密度。
    mechanism: 推荐系统依赖历史数据做匹配，新对象无数据可依，只能按内容特征与账号特征做粗匹配试探。此时初始曝光人群是否精准、互动密度是否高于基准线，直接决定是否进入放大通道（algorithmic_amplification）。产品层面同理：网络效应产品在用户不足时无法提供价值，需先解决"单边可用"（Chen, S97）。
    causal_chain: "无历史数据 → 特征试探性匹配 → 小流量测试 → 互动密度达标 → 进入推荐通道"
    variables:
      inputs: ["账号/产品历史数据量", "内容特征完备度（标题/标签/封面）", "初始人群精准度"]
      moderators: ["平台新号扶持政策", "品类竞争密度", "私域可导入流量"]
      mediators: ["初始互动密度", "互动人群与目标人群的重合度"]
      outputs: ["是否突破冷启动", "推荐标签收敛速度"]
    evidence:
      supporting: ["S97 The Cold Start Problem 对网络产品冷启动的系统分析", "S96 Platform Revolution 中平台冷启动章节", "平台官方的新号扶持与内容冷启动说明（official_rule 层）"]
      conflicting: ["扶持政策各平台差异大且频繁调整", "买量冷启动在低信任品类可能带来负面信号（高点击低转化）"]
      replication: ["结构性困境普遍成立；具体扶持机制随平台变化"]
      meta_analysis: []
    evidence_grade: "B"
    boundary_conditions: ["有网络效应的产品/社群最明显", "工具型单边产品冷启动压力小", "自带私域流量的账号可用导入策略绕过部分困境"]
    failure_conditions: ["用买量泛流量做种子——互动密度虚高但标签混乱，反而污染推荐", "冷启动期频繁更换内容方向，标签永不收敛", "把冷启动期的低数据归因为内容质量差而全盘推翻策略"]
    common_misinterpretations: ["把冷启动期数据当成熟期数据解读", "认为粉丝量解决冷启动——标签错位时大号同样扑街", "忽视'初始人群精准度'这个最大杠杆"]
    ethical_risks: ["刷量买粉制造虚假初始信号，破坏系统与自身标签"]
    examples:
      original_cases: ["S97 中 dating 产品与网络产品的冷启动案例（Tinder 校园推广等实践案例）"]
      research_cases: []
      modern_cases: ["新账号用垂直内容连续发布收敛标签", "品牌自播用私域导入首批观众冲互动密度"]
    communication_implications: 冷启动内容应优先保证"对一小群人极度相关"而非"对所有人有点相关"：具体人群、具体问题、具体场景，让初始互动密度高于基准。
    community_implications: 社群冷启动遵循相同逻辑：先服务好 10 个精准成员（制造初始互动与口碑信号），而非拉 500 个泛成员（寂静群）。
    content_applications:
      title: "标题包含目标人群身份词，提升初始人群精准命中"
      opening: "第一屏显式声明'这条内容是给谁的'"
      body: "垂直深耕直到账号标签稳定，再考虑扩域"
    platform_implications: 各平台新号扶持与标签收敛机制不同（见各 adapter 的 distribution_model），跨平台冷启动不可复制粘贴。
    related_nodes: ["algorithmic_amplification", "critical_mass_threshold", "ranking_signal_weighting", "social_proof"]
    conflicting_nodes: []
    source_ids: ["S96", "S97"]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Parker 等 2016《Platform Revolution》（S96，鸡生蛋八策略）+ Chen 2021《The Cold Start Problem》（S97，五阶段/原子网络/困难侧/三效合一）"
      effect_size: "先做密小市场再复制；困难侧优先（行业案例方向一致，D 级实践成分）"
      replication_status: "冷启动策略为平台实践共识；多为案例证据"
      context_dependency: "网络效应强度/供需结构调制；跨平台冷启动不可复制粘贴"
      downgrade_upgrade_reason: "2026-09 实取 S96/S97 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S97]
      supporting_evidence: [S96]
      last_verified: "2026-09"
    last_reviewed: "2026-09"

  - id: creator_incentive_structures
    canonical_name_en: Creator Incentive Structures
    canonical_name_zh: 创作者激励结构
    aliases: ["创作者经济", "creator economy"]
    domain: platform_algorithmic
    definition: 平台与市场为创作者提供的变现路径（流量分成、广告、电商带货、知识付费、打赏、接单）及其反向塑造内容形态的机制。
    core_claim: 变现结构决定内容形态：佣金驱动的内容偏向转化话术，流量分成驱动的内容偏向时长与互动，私域驱动的内容偏向信任积累——创作者不是'选择'风格，而是被激励结构筛选。
    mechanism: 创作者对激励敏感：哪条变现路径的边际收益高，内容就向其形态漂移。流量分成模式（按播放/时长计费）鼓励拉长时长与连续钩子；电商模式鼓励强卖点与逼单结构；打赏/订阅模式鼓励人格化与陪伴感；接单模式鼓励稳定人设与专业标签。平台通过调节激励结构即可大规模改变生态内容形态，无需直接命令。
    causal_chain: "平台激励规则 → 创作者理性响应 → 内容形态漂移 → 用户预期变化 → 平台再调整规则"
    variables:
      inputs: ["平台变现工具组合", "分成比例", "准入门槛"]
      moderators: ["品类变现效率差异", "创作者规模层级（头部/腰部/新人路径不同）"]
      mediators: ["创作者的内容-收益函数"]
      outputs: ["内容形态分布", "平台生态质量"]
    evidence:
      supporting: ["S95 The Platform Society 对平台经济架构的分析", "S92 The Hype Machine 中关于平台商业模式的讨论", "S48 The Attention Merchants 的注意力商业逻辑", "S100 Filterworld：创作者内化算法——在分享前预演内容将如何被算法表现、选择可能流行的而非冒险的选题（文化评论级证据）"]
      conflicting: ["人格化创作者可能主动牺牲变现效率换取调性", "不同层级创作者的最优策略差异大，单一结论易过度概括"]
      replication: ["激励响应方向在多平台观察一致；具体形态随平台政策快速变化"]
      meta_analysis: []
    evidence_grade: "B"
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions: ["商业化程度高的平台显著", "兴趣驱动非变现创作者受影响小", "规则变动窗口期行为混乱"]
    failure_conditions: ["平台突然改版激励规则", "监管介入（如广告标识要求）改变变现形态", "多平台分发稀释单一激励绑定"]
    common_misinterpretations: ["把创作者内容选择全归因于个人品味而忽略激励筛选", "以为激励只影响头部——新人路径同样被塑造", "忽视平台'规则即生态'：改一条分成规则等于改全站内容"]
    ethical_risks: ["带货激励催生夸大宣传与软广不标（监管风险）", "知识付费激励催生焦虑营销（反模式库条目）"]
    examples:
      original_cases: []
      research_cases: []
      modern_cases: ["视频号创作者转向直播带货的内容迁移", "B站充电与商单并行的中间路线", "公众号读者赞赏与私域转化的组合"]
    communication_implications: 做内容策略必须先问"这个账号靠什么赚钱"：变现路径决定内容结构、更新频率与平台选择。为品牌做投放时，识别创作者的激励类型可预判其内容倾向与合规风险。
    community_implications: 社群运营者设计成员激励同理：积分/地位/权限等激励结构决定成员行为（status_systems 的运营对应物）。
    content_applications:
      cta: "CTA 类型应与变现路径一致：带货内容引导购买链路，私域内容引导关注与入群"
      body: "流量分成型内容设计'继续看'结构；转化型内容设计'立即用'结构"
    platform_implications: 各平台变现工具不同（视频号微信生态闭环、抖音电商闭环、B站充电、小红书蒲公英），适配时把激励结构纳入平台选择依据。
