# motivation — 动机（Motivation）：人为什么开始、坚持与放弃
domain: motivation
nodes:
- id: self_determination_needs
  canonical_name_en: Self-Determination Needs (Autonomy, Competence, Relatedness)
  canonical_name_zh: 自我决定三需要（自主/胜任/归属）
  aliases:
  - SDT 三需要
  - 基本心理需要
  - basic psychological needs
  domain: motivation
  definition: 自我决定理论（Self-Determination Theory, SDT；Deci & Ryan）提出三项基本心理需要：自主感（autonomy，行为出于自愿认同）、胜任感（competence，感到有效）、归属感（relatedness，与他人真实相连）。三需要的满足程度预测内在动机、坚持与幸福感。注意与流行简化『需求金字塔』区分：SDT
    是动机过程理论，不是静态层级清单。
  core_claim: 三需要满足度越高，内在动机、投入与坚持越强；削弱任一需要的激励设计会损害动机质量。
  mechanism: 当环境允许自主选择、提供最优挑战（可胜任）并回应联结需要时，人把外部要求内化为自我认同的一部分，行为从『不得不』转为『我想做』；内化程度决定持久性。控制性干预（监视、奖惩压迫、期限胁迫）即使短期见效，也削弱自主感，长期降低动机质量（S14）。
  causal_chain: 环境支持自主/胜任/归属 → 三需要满足 → 内在动机与规范内化 → 投入、坚持与自发传播
  variables:
    inputs:
    - 选择权设计
    - 挑战-技能匹配
    - 联结与回应信号
    - 反馈质量
    moderators:
    - 文化背景
    - 领域对个体的意义
    - 个体的需要强度差异
    mediators:
    - 自主感
    - 胜任感
    - 归属感
    outputs:
    - 内在动机
    - 参与频率与坚持度
    - 幸福感
    - 自发口碑
  evidence:
    supporting:
    - Deci & Ryan 2000（S118，Psych Inquiry 11:227，abstract_only；S118 仅摘要级支持）与 Ryan & Deci 2017（S14，著作级背景）对三需要结构的理论整合与多领域证据（理论与综述）
    - 教育、工作、运动、健康领域的跨文化问卷研究重复出现需要满足-动机联结（多来源实证）
    conflicting:
    - 三需要的普适性表述被部分学者质疑带有西方个人主义预设；需要强度的个体与文化差异存在（理论争论）
    replication:
    - 大规模跨文化研究总体支持三因素结构，测量工具效度是主要争议点。评级按枚举记 A
    meta_analysis:
    - 多项元分析支持基本需要满足与内在动机、幸福感、工作绩效的稳健关联（如 Van den Broeck 等的工作动机元分析方向；EP 外方向，未建包）
  evidence_grade: A
  boundary_conditions:
  - 适用于解释自愿性、持续性动机；对一次性强约束任务解释力有限
  - 三需要间存在权衡（如强归属规范可能压低自主感），需整体设计而非单点最大化
  failure_conditions:
  - 把需要满足话术化（说『你可以自由选择』但实际无选择）会触发反向解读
  - 任务本身无意义时，需要支持只能维持短期参与
  common_misinterpretations:
  - 把 SDT 等同于马斯洛需求层级的换皮；两者构念与机制不同
  - 以为归属感只是『拉群』；归属感以被回应和被认可为前提
  ethical_risks:
  - 伪自主设计（表面给选择、实际操纵默认项）长期损害信任，属于对需要系统的欺骗
  examples:
    original_cases:
    - Self-Determination Theory（S14）中教育、医疗、运动场景的三需要支持案例
    research_cases:
    - Deci 的奖赏与内在动机实验系列；Ryan 与 Deci 的跨领域内化研究
    modern_cases:
    - 用户可自选学习路径的社群课程；开源社区对贡献者自主与胜任的双向支持
  communication_implications: 内容与服务话术从『你应该』改为『你可以选择』+『你已能胜任』+『这里有人同路』三件套，比单纯利益点更能驱动长期关系。
  community_implications: 社群角色设计（可选择的参与阶梯、可见的胜任成长、被回应的归属信号）应覆盖三需要，而非只做激励积分。
  content_applications:
    title: 用『你可以……』替代『你必须……』的标题句式
    body: 给每一步行动附上『为什么值得做+你已具备什么』，同时支持胜任与自主
    cta: 提供可选路径（轻参与/深参与）而非单一强指令
  platform_implications: 平台的推送与推荐若以打断和诱导为主，会系统性削弱用户自主感；长期表现为通知疲劳与卸载。
  related_nodes:
