- id: double_jeopardy_law
  canonical_name_en: Double Jeopardy Law
  canonical_name_zh: 双危机定律
  aliases:
  - 双危险定律
  - 双重危机
  domain: brand_consumer
  definition: 双危机定律（double jeopardy law）由 Andrew Ehrenberg 提出、Byron Sharp 在《How Brands Grow》中综合推广：市场份额较小的品牌遭受双重劣势——不仅购买者更少（第一重危机），而且其购买者的购买频率与忠诚度也更低（第二重危机）。小品牌不是拥有「更小但更忠诚」的客群，而是拥有更小且更不忠诚的客群。
  core_claim: 品牌间的购买者行为差异主要由市场份额这一单一变量解释：小品牌的购买者买得更少、忠诚行为（独占购买、复购频率、态度忠诚）全面更弱；「小而美的小众忠诚品牌」在重复购买数据中系统性稀缺。
  mechanism: 双危机的统计根源在于购买行为的随机性与品类结构：品牌的购买者主要来自品类的「浅层偶发购买者」池，购买行为近似带品牌份额权重的随机过程（Dirichlet 模型传统）。市场份额决定品牌从品类购买池中被抽中的概率；小品牌被抽中次数少，其购买者自然表现出更低频率与更弱独占（因为是同一批品类购买者的偶发选择）。因此小品牌的「忠诚度低」不是品牌失败，而是购买结构的数学结果——但这同时意味着靠「深耕忠诚」翻盘的空间远小于预期，增长的主路径是扩大购买者基数。
  causal_chain: 小市场份额 → 从品类购买池被抽中概率低 → 购买者少且人均购买频率低 → 双危机；增长需扩大被抽中的基数（渗透）而非提升既有购买者频率
  variables:
    inputs:
    - 品牌市场份额
    - 品类总购买频率
    - 品牌在心智与渠道的可得性
    moderators:
    - 品类特征（购买频率、碎片化程度）
    - 品牌间真实的差异化程度
    mediators:
    - 品类购买池中的被选择概率（Dirichlet 过程）
    outputs:
    - 购买者数量
    - 人均购买频率
    - 独占购买率
    - 态度忠诚指标
  evidence:
    supporting:
    - Ehrenberg 及 Ehrenberg-Bass 学派对多国、多品类、长时间跨度扫描数据的大量重复验证（数据研究传统，这是该定律的核心证据形态）
    - 《How Brands Grow》中的综合呈现：小品牌的忠诚度劣势跨品类稳定出现
    conflicting:
    - 真正的差异化利基品牌（功能独特、亚文化绑定）在部分数据中偏离双危机模式（「真正的利基」讨论）
    - 服务与小样本新兴品类中的适用性证据较弱（数据条件限制）
    replication:
    - 在快消、零售、耐用品与部分服务品类的重复扫描数据中高度稳定复现，是营销科学中最稳健的经验规律之一
    meta_analysis: []
  evidence_grade: B+
  boundary_conditions:
  - 基于重复购买品类的扫描数据；耐用品与低频高卷入品类的检验证据较少
  - 描述市场结构规律，不否认个别通过强差异化偏离定律的品牌存在（它们是少数且难以事前识别）
  failure_conditions:
  - 以「提升忠诚度」为核心的小品牌增长策略：在双危机结构下，小品牌的忠诚天花板天然更低，深耕策略的增长空间被数学结构限制
  - 把定律误读为「小品牌不可能成功」：定律描述的是结构约束，通过扩大渗透（新购买者）突破的路径依然成立
  common_misinterpretations:
  - 「我的小品牌粉丝特别忠诚」——双危机的证据恰恰表明这通常是错觉：小品牌的重复购买数据几乎总是显示更低的忠诚；确有例外但事前无法识别
  - 把 double_jeopardy_law 与 80/20 法则混为一谈：80/20 描述单品牌内部的购买集中度，双危机描述品牌间的结构关系（大小品牌的行为差异）；两者在 Ehrenberg-Bass
    数据中都已检验——80/20 的「重度用户贡献 80%」被证实为夸大（重度用户贡献远低于神话版本）
  ethical_risks:
  - 以定律为依据否定中小品牌的生存价值（定律描述结构，不设价值判断）
  examples:
    original_cases:
    - Ehrenberg 学派对英美德多品类洗涤剂、饮料等的购买面板数据分析（研究传统）
    research_cases:
    - Dirichlet 模型对品牌购买的拟合与预测研究（营销学传统，方向一致）
    modern_cases:
    - 电商数据中新品牌复购率普遍低于成熟品牌的现象
    - 「小众品牌粉丝更忠诚」的营销迷思在数据面前的系统性证伪
  communication_implications: 内容与投放策略应以触达新购买者（渗透）为第一目标：把「让没用过的人第一次试」置于「让老用户买更多」之前；内容矩阵覆盖浅层受众，而非在铁粉圈层内做深度饱和。
  community_implications: 对品牌社群的规模预期要现实：小品牌的社群天然更小、更不活跃（双危机在社群数据中的投影）；社群运营的核心价值是提高渗透（成员带来新用户）而非仅服务存量忠诚。
  content_applications:
    body: 正文面向「第一次听说我们的人」写作（自足的背景与低门槛入口），而非默认读者都是老粉
    sharing: 分享机制优先服务拉新（新人体面版分享物），转化设计以首次购买为核心漏斗
    comments: 对新提问者的耐心回应是渗透策略的评论区版本（每个新提问者代表一批沉默的同类）
  platform_implications: 平台的品牌词搜索、推荐位与旗舰店结构共同构成数字货架上的可得性分配，直接决定被抽中概率；平台的「扶新」机制是小品牌对抗双危机的结构性变量（原则性判断）。
