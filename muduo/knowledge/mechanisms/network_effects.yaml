- id: preferential_attachment
  canonical_name_en: Preferential Attachment
  canonical_name_zh: 优先连接
  aliases:
  - 富者愈富
  - Barabási-Albert 模型
  - scale-free network（无标度网络）
  domain: network_effects
  definition: 优先连接（preferential attachment）由 Barabási 与 Albert 于 1999 年提出：网络通过「增长 + 新节点优先连接已有较多连接的节点（富者愈富）」的机制，自发形成少数枢纽（hubs）拥有极多连接、多数节点连接很少的
    scale-free（无标度）结构。该机制被用于解释网页链接、引用网络与社交网络的头部集中现象。
  core_claim: 在增长型网络中，连接（注意力、粉丝、引用）的分布天然趋向头部集中：先发者与已有声望者获得新连接的概率更高，枢纽地位会自我强化。
  mechanism: 新进入者面对庞大网络时，利用可见度作为质量捷径——连接多的节点更显眼、更可信、更易被找到，于是获得新连接的概率与其现有连接数成正比。这一正反馈使早期微小优势指数放大为枢纽地位。但需注意适用性边界：并非所有网络都是无标度的，近年对真实网络的大规模检验发现严格的幂律分布其实较少见；平台环境中的枢纽形成还叠加了算法推荐与运营干预，不纯粹是优先连接的产物。
  causal_chain: 网络增长 → 新节点依据可见度选择连接目标 → 高连接节点获得更高连接概率 → 枢纽自我强化 → 头部集中分布
  variables:
    inputs:
    - 网络增长速率
    - 新节点的连接选择规则
    moderators:
    - 节点「fitness」（内在质量差异；Bianconi-Barabási 2001 fitness 模型，未建包，EP 外方向性讨论）
    - 算法推荐的可见性分配
    - 先发时间窗
    mediators:
    - 可见度与可信度的正反馈
    outputs:
    - 度分布的头部集中度
    - 枢纽节点存续
  evidence:
    supporting:
    - Barabási & Albert 1999 对万维网等网络的幂律度分布发现（经典论文）
    - 引用网络、合作网络等多类增长网络呈现头部集中（网络科学综述）
    conflicting:
    - 对真实网络的大规模重检验发现严格幂律并不普遍，多种分布均能拟合（网络科学方法学讨论，方向性结论）
    - 平台枢纽的崛起常由运营与算法扶持驱动，优先连接只能解释部分（平台研究讨论）
    replication:
    - 「头部集中 + 优势自我强化」的方向被广泛复制；「严格无标度」的普适性已不被主流接受
    meta_analysis: []
  evidence_grade: B+
  boundary_conditions:
  - 适用于开放增长、连接成本低、可见度透明的网络；封闭小社群或需要维护成本的关系网络不典型
  - 节点质量差异（fitness）会修正纯优先连接：后来但更优者仍可快速崛起
  failure_conditions:
  - 平台算法改变可见性分配（去中心化推荐、流量再分配）时，先发优势被显著削弱
  - 把幂律当作宿命：网络类型不同（如强约束的邻里网络、双边匹配市场）未必呈现头部集中
  common_misinterpretations:
  - 「头部集中是算法的错」——优先连接是人类网络与增长过程的固有倾向，算法只是放大或削弱其强度
  - 把 preferential_attachment 与 long_tail_demand 混为一谈：前者是网络形成机制，后者是需求分布描述；两者相关但层面不同
  ethical_risks:
  - 富者愈富的马太效应固化注意力不平等；平台若利用该机制售卖「维持可见度」的服务，等于把结构性优势货币化
  examples:
    original_cases:
    - Barabási 书中对万维网枢纽与「富者愈富」的论述（《Linked》）
    research_cases:
    - 引用网络中论文引用分布高度偏斜的重复发现（网络科学综述）
    modern_cases:
    - 短视频平台头部账号涨粉速度远超腰部（同等内容质量下）
    - 新平台早期的「流量红利期」实为优先连接未被固化的时间窗
  communication_implications: 在增长网络中，起步阶段（网络尚未固化枢纽）的投入回报最高；内容策略应优先抢占早期平台与新兴圈层的「未被占据的连接位」。
  community_implications: 社群内的声望系统天然趋向优先连接（老成员更易被提及、被关注）；新成员需要制度化的曝光设计（新人秀、轮值主持）对冲马太效应。
  content_applications:
    body: 早期内容优先做「可被引用/被转发」的节点型资产（清单、数据、观点卡），主动积累连接位
    narrative: 用「第一批关注者见证成长」的叙事，把时间先发优势转化为关系资产
    sharing: 分享物突出账号/社群的独特身份标识，让每次转发都在为新节点做可见度广告
    comments: 积极回评早期评论者，在低连接阶段手动完成「优先连接」的种子积累
  platform_implications: 平台是优先连接的裁判：推荐算法决定新连接的初始分配，可在「扶新」与「保头部」间选择；平台政策变化（如扶持腰部创作者）直接改写度分布（原则性判断）。
