- id: nudge_mechanism
  canonical_name_en: Nudge (Choice Architecture)
  canonical_name_zh: 助推（选择架构）
  aliases:
  - 助推
  - 选择架构
  - choice architecture
  domain: behavioral_economics
  definition: 助推（Thaler 与 Sunstein，S11）指不禁止选项、不显著改变经济激励，通过调整选择架构（默认、排序、提示、框架、反馈）改变行为的方式。证据评级 C（按 EVIDENCE.md）：Maier
    等 2022 对助推文献的元分析与发表偏差校正显示，校正后平均效应大幅缩水；默认类与提醒类工具相对稳健，效应按具体助推类型高度分化。它是伞形机制：default_option_effect 与 friction_reduction
    是其证据最强的实例。
  core_claim: 重构选择架构可以改变行为，但平均效应远小于早期文献宣称；有效性集中于少数工具（默认、提醒、简化）与具体情境。
  mechanism: 助推利用直觉加工的默认倾向与低成本通道（与 dual_process_theory 相通），在不改变选项集的前提下移动行为分布；Maier 等 2022 的再分析表明原始文献存在发表偏差，小样本强效应在校正后收缩，『助推万能』的叙事不成立；机构级大规模应用（各国行为洞察团队）提供了政策现场的混合证据（S11、S20）。
  causal_chain: 调整选择架构（默认/排序/提示/框架/简化） → 直觉加工走低成本通道 → 行为分布移动（幅度因工具与情境而异）
  variables:
    inputs:
    - 工具类型（默认/提醒/框架/简化/社会比较反馈）
    - 行为类型
    - 实施者可信度
    moderators:
    - 行为的既有习惯强度
    - 受众异质性
    - 透明度与正当性感知
    mediators:
    - 注意引导
    - 摩擦变化
    - 规范信号
    outputs:
    - 目标行为率
    - 效应量（分化大）
    - 公众信任
  evidence:
    supporting:
    - Nudge（S11）的理论体系与政策应用；各国行为洞察团队的大规模现场试验积累（S20）
    - 默认选项等具体工具的多项稳健研究（见 default_option_effect 节点）
    conflicting:
    - Maier 等 2022：元分析与发表偏差检验后，助推的平均效应大幅缩水，仅部分工具保持有效（EVIDENCE.md 定级 C 的依据）
    replication:
    - 作为伞形概念的平均效应不可靠；应按具体工具（默认、提醒、简化）分别评估。评级按枚举记 C
    meta_analysis:
    - Maier 等 2022 是助推文献的关键再评估；早期元分析结论需带发表偏差校正解读
  evidence_grade: C
  boundary_conditions:
  - 对低卷入、低习惯强度的行为最有效
  - 需配合透明的伦理框架（可察觉、可拒绝、可低成本退出）
  failure_conditions:
  - 对强动机冲突或结构性障碍问题（收入不足），助推只能边缘修补
  - 助推被识破为操纵后触发反弹与信任损耗
  common_misinterpretations:
  - 『助推=行为经济学万能杠杆』：再分析已显著下修其平均效力
  - 把一切设计改动都称助推；改变选项集或激励的干预不属于此定义
  ethical_risks:
  - 不透明的助推滑向操纵（暗黑模式）；合法性依赖『容易察觉、容易退出』的透明性标准
  examples:
    original_cases:
    - Nudge（S11）中的 cafeteria 摆放、器官捐献默认、Save More Tomorrow 案例群
    research_cases:
    - 各国行为洞察团队的现场试验；Maier 等 2022 的再评估
    modern_cases:
    - App 的健康提醒、绿色能源默认套餐、订阅流程的合规化改造
  communication_implications: 内容行动设计优先选用证据最稳的子工具（默认、简化、提醒），并对受众透明说明『为什么这样默认』。
  community_implications: 社群把期望行为（发言规范、活动报名）做成默认与简化路径，同时保留明显退出选项，防止 nudging 滑向 coercing。
  content_applications:
    cta: 默认勾选理想选项并显式展示修改入口，附一句透明说明
    body: 把行动说明压缩到三步以内，删除非必要表单字段
  platform_implications: 平台是最大的选择架构师；助推平均效应的缩水提示平台治理应把透明性与用户控制权纳入设计审计。
  related_nodes:
  - default_option_effect
  - friction_reduction
  - social_proof
  - descriptive_injunctive_norms
  - choice_overload
  source_ids:
  - S11
  - S20
  - S12
  - S108
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Maier et al. 2022 PNAS（S108 已实读 PMC 全文）：RoBMA 校正发表偏倚后无 nudge 有效性稳健证据
    effect_size: 校正后无证据（Egger b=2.10 判定为严重偏倚；BF01>1 支持零假设）
    replication_status: 存在同行回应（Szaszi 2022 支持；Mertens 2022 Reply 反对），证据仍具争议
    context_dependency: 平均无证据 ≠ 具体 nudge 无效；应按具体干预类型/领域评估
    downgrade_upgrade_reason: 2026-09 补充一手复核证据全文（S108，full_text），由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED；EVIDENCE.md
      nudge→C 获一手全文级支撑
  provenance:
    primary_sources:
    - S108
    supporting_evidence:
    - S11
