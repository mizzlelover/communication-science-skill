- id: category_entry_points
  canonical_name_en: Category Entry Points
  canonical_name_zh: 品类进入点
  aliases:
  - CEP
  - 品类进入线索
  domain: brand_consumer
  definition: 品类进入点（category entry points, CEPs）是 Ehrenberg-Bass 的核心操作概念：触发消费者想起并进入某品类购买的情境、需求、时机与场景（「早上没精神→咖啡」「朋友生日→礼物」「周末聚餐→酒水」）。品牌的心理可得性由其与品类进入点的联想广度与强度决定——被多少种进入点情境下的消费者想起。
  core_claim: 品牌增长的直接杠杆是扩大并巩固与品类进入点的联想网络：在越多的购买触发情境中被想起，心智渗透越高；CEP 联想广度决定心智渗透并与市场份额正相关（S76）。
  mechanism: 消费者的品类购买由情境线索触发，而非由品类需求自觉启动：进入点（时间、场合、情绪、人群、问题）是记忆检索的钥匙。品牌与进入点的联想通过「品牌信息 × 进入点情境」的重复配对建立（广告把品牌绑定到场景，内容把品牌绑定到问题）。联想网络越大（覆盖越多进入点）且越强（每个联想的检索容易度越高），品牌在随机出现的购买情境中被激活的概率越大。这也是
    mental_availability 的测量与操作化路径：数品牌被多少 CEP 激活。
  causal_chain: 品牌信息 × 进入点情境重复配对 → CEP-品牌联想建立 → 购买情境中品牌被检索 → 进入考虑集并购买 → 心智渗透与份额增长
  variables:
    inputs:
    - 进入点情境的覆盖广度
    - 品牌与情境的配对一致性
    - 暴露频率
    moderators:
    - 品类进入点总量与碎片化程度
    - 竞品的 CEP 占位情况
    - 媒介的场景承载能力
    mediators:
    - CEP 联想强度
    - 检索容易度
    outputs:
    - 心智渗透率
    - 考虑集进入率
    - 市场份额
  evidence:
    supporting:
    - Ehrenberg-Bass 对 CEP 与心智渗透、市场份额关系的研究（《How Brands Grow》及 Romaniuk 等人的研究传统）
    - CEP 联想数量预测品牌被考虑的概率（品牌追踪研究，方向一致）
    conflicting:
    - CEP 优先的策略对强差异化/亚文化品牌的适用性讨论（利基路径与广度路径之争）
    replication:
    - 「CEP 联想广度与市场份额正相关」在多品类品牌追踪数据中方向稳定
    meta_analysis: []
  evidence_grade: B+
  boundary_conditions:
  - 需要品类存在可识别的多个进入点（碎片化情境品类最有效：食品、饮料、日化）
  - CEP 建设是长期重复投入：短期campaign 无法建立稳定检索联想
  failure_conditions:
  - 品牌信息与进入点情境的配对含糊（漂亮但无场景的广告）：曝光不建立 CEP 联想
  - 频繁变换绑定的进入点（今天绑定早餐明天绑定加班）：单个联想强度无法累积
  common_misinterpretations:
  - 「CEP=使用场景」——进入点不仅包括使用场景，还包括问题、时机、人群、情绪等一切触发品类进入的线索；用「场景」一词会窄化 CEP 清单
  - 把 category_entry_points 与 jobs_to_be_done 混淆：JTBD 是个体情境任务的深度洞察框架（为什么雇用），CEP 是品牌层面的联想广度策略（在多少触发点被想起）；JTBD
    帮你选准任务，CEP 帮你铺满触点，两者互补而非替代
  ethical_risks:
  - 将品牌绑定到焦虑、匮乏等负面情绪进入点（放大不安以触发购买）
  examples:
    original_cases:
    - Ehrenberg-Bass 研究中对咖啡、啤酒等品类进入点清单与品牌联想的分析传统
    research_cases:
    - Romaniuk 等人对 CEP 数量与品牌增长关系的品牌追踪研究（方向一致）
    modern_cases:
    - 饮料品牌全年按节点铺设场景内容（春节聚餐、夏日运动、加班深夜）
    - 内容营销的关键词策略按「问题触发词」而非产品词组织（「周五晚吃什么」而非「预制菜品牌」）
  communication_implications: 内容矩阵按 CEP 清单组织：为品牌识别 20-50 个进入点，逐个生产绑定内容并监测各 CEP 的检索联想变化；每条内容只绑定一个进入点，宁多勿混。
  community_implications: 社群运营按成员的 CEP 时刻组织活动（早八打卡、周五复盘、季末规划）：社群日程本身就是成员生活节奏中的进入点植入。
  content_applications:
    body: 正文开头显式呈现进入点情境（时间+场合+情绪），结尾复现同一情境巩固配对
    narrative: 用户故事保留完整的进入点触发叙事（「那天加班到十点……」）
    sharing: 按不同 CEP 制作多版本分享物，让转发发生在正确的情境（朋友圈晚安卡 vs 工作日午餐卡）
    comments: 评论区征集「你通常在什么时候想起/需要这个」，UGC 直接扩充 CEP 清单
  platform_implications: 搜索联想词、场景化推荐（「看了火锅视频推饮料」）是平台的 CEP 基础设施；平台的场景识别能力越强，CEP 策略的数字化执行效率越高（原则性判断）。
