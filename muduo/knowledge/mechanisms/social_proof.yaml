- id: descriptive_injunctive_norms
  canonical_name_en: Descriptive vs Injunctive Norms
  canonical_name_zh: 描述性规范与指令性规范
  aliases:
  - 规范焦点理论
  - focus theory of normative conduct
  - Cialdini 规范双轴
  domain: social_proof
  definition: Cialdini, Reno 与 Kallgren 的规范焦点理论将社会规范分为两轴：描述性规范（descriptive norms，多数人实际在做什么）与指令性规范（injunctive
    norms，多数人赞成/反对什么）。Bicchieri 进一步把规范界定为『有条件的从众偏好』——个体只有在相信他人遵守且期待自己遵守时才遵循，为规范诊断提供了博弈论工具。
  core_claim: 只展示『别人在做』（描述性）而忽略『别人怎么评价』（指令性）的传播常制造回旋镖效应；两轴必须同时诊断、匹配使用。
  mechanism: 描述性规范提供效度信息（大家都这么做），指令性规范提供奖惩预期（做/不做会被如何对待）。单独使用描述性信息会让本就低于均值的人理直气壮（大家都浪费，我浪费点没事）——回旋镖效应；Schultz
    等 2007 能耗实验表明，在描述性反馈上叠加指令性信号（笑脸/赞许标记）可消除回旋镖。Bicchieri 的诊断框架进一步要求测量『经验期待与规范期待』的分布，判断规范是否真的存在于人群中，而非仅是沟通者的想象。
  causal_chain: 规范线索暴露 → 描述性（效度信息）与指令性（奖惩预期）分别加工 → 两者方向一致时行为改变最大；描述性单独作用时偏离均值者可能反向移动（回旋镖）
  variables:
    inputs:
    - 描述性规范信息（实际行为分布）
    - 指令性规范信息（赞成/不赞成信号）
    - 规范的显著性
    moderators:
    - 参照群体界定（对谁而言的多数）
    - 个体当前位置相对均值的方向
    - 规范来源可信度
    mediators:
    - 规范期待（Bicchieri：他人遵守+期待我遵守的信念）
    - 社会认同感
    outputs:
    - 顺从行为
    - 回旋镖效应（低分布群体反向移动）
    - 规范内化
  evidence:
    supporting:
    - Cialdini, Reno 与 Kallgren 1990 弄脏环境系列实验：向被试展示一个被丢弃传单的环境（描述性规范线索），乱扔垃圾行为显著上升；加指令性信号后行为再次转向
    - Schultz 等 2007 能耗反馈实验：描述性规范使高能耗家庭降低能耗，但也使低能耗家庭能耗上升（回旋镖）；叠加赞许提示后回旋镖消失
    - Goldstein 等酒店毛巾实验：『同一房间曾住客多数重复使用』（本地化描述性规范）比泛化环保呼吁更有效
    - Bicchieri 的规范诊断框架在多国田野干预中得到应用验证（S28）
    conflicting:
    - 规范的效应受参照群体界定影响极大，错误的『多数』定义会使干预失效
    - 部分情境下指令性信息引发逆反（psychological reactance）
    replication:
    - 规范信息干预的元整合证实平均效应存在，但异质性高
    - 回旋镖效应在能源、饮酒、健康行为等多个领域得到重复
    meta_analysis:
    - 规范信息干预的 meta 综合显示描述性规范平均有效，但方向修正依赖指令性信息的加入
  evidence_grade: A
  boundary_conditions:
  - 受众在意『多数』所属的参照群体并认同之
  - 描述性信息对低分布群体（低于均值者）单独使用时须警惕回旋镖
  - 规范须真实存在（Bicchieri 诊断），虚假规范易被识破
  failure_conditions:
  - 受众处于均值以下且无指令性修正时，描述性规范使其合理化现状
  - 参照群体被受众视为外群体时，规范线索失效甚至反效果
  - 规范信息与受众身份认同冲突时触发防御
  common_misinterpretations:
  - 把『突出问题的普遍性』当动员策略——『大家都欠债』式描述性信息会降低还款/储蓄意愿
  - 混淆『法律明文规定』与指令性规范——后者是社会期待而非条文
  ethical_risks:
  - 用描述性规范正当化有害行为（『男人都这样』）
  - 伪造规范数据操纵群体行为
  examples:
    original_cases:
    - Cialdini《Influence》规范焦点理论章节（S32）
    - Bicchieri《Norms in the Wild》的规范诊断与变革框架（S28）
    research_cases:
    - Cialdini, Reno 与 Kallgren 1990 传单实验
    - Schultz 等 2007 能耗反馈实验
    modern_cases:
    - 『90% 的人不会配置养老金』类内容会降低受众的行动意愿，应改为『越来越多同龄人已开始』+具体行为示范
    - 社区团购的『本小区已有 XX 户参与』
    - 健身 App 的群组平均值展示对落后者的回旋镖风险
  communication_implications: 动员型内容必须同时给出描述性（很多人在做）与指令性（做了被认可/不做被不齿）双重线索；警示类内容避免用『普遍性』吓人，应用『正在增长的趋势』框架。
  community_implications: 社群规范诊断应分两步：先测量成员真实行为分布与期待分布（Bicchieri 框架），再决定是传播描述性规范（行为已普遍）还是指令性规范（期待已共识但行为未跟上）。
  content_applications:
    body: 用『越来越多的同龄人已经…』（趋势性描述）替代『大多数人都不…』（问题普遍化），避免制造不作为的借口
    evidence: 呈现具体行为证据（多少人做了什么）+社会评价证据（他们因此获得了什么认可）双轨
    cta: CTA 后即时展示指令性反馈：『已完成的伙伴会收到XX认证』，让规范闭环
    title: 标题避开『XX%的人不知道』——描述无知不改变行为，用『聪明人已经在做X』替代
  platform_implications: 平台的可见指标（浏览数、点赞数）本质上只传递描述性规范；指令性规范需靠评论氛围、社区公约与互动方式传递——运营者应主动建设指令性信号层（置顶共识、价值声明）以补足平台默认缺失的维度。
