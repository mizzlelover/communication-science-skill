  - id: mood_congruence
    canonical_name_en: Mood Congruence
    canonical_name_zh: 心境一致性
    aliases: [心境一致效应, mood-congruent memory]
    domain: emotion
    definition: "心境一致性指当前心境使同效价的材料更易被注意、学习、回忆，并被判断为更真实或更可能发生。与 affect_heuristic 的区别：affect heuristic 是对象层面的判断替代，mood_congruence 是状态层面——当下心境为整批信息染色。"
    core_claim: "改变受众当下心境，可同向改变其对模糊信息的回忆、评价与真实性判断。"
    mechanism: "心境作为检索线索提升同效价记忆的可得性；心境同时作为信息来源被并入判断（『我感觉好，所以事情应该不错』）；正向心境还拓宽注意与认知分类，负向心境收窄并聚焦威胁。Forgas 的情感注入模型（Affect Infusion Model）指出注入程度取决于加工策略：启发式加工时最强，动机性加工时可被抵消（库外文献，EP 未实取）。"
    causal_chain: "当下心境 → 同效价材料可得性与真实性判断上升 → 记忆、评价与决策被心境染色"
    variables:
      inputs: [受众当下心境, 信息效价, 模糊性]
      moderators: [加工动机, 心境来源是否被意识到, 时间压力]
      mediators: [检索可得性, 判断中的心境并入]
      outputs: [回忆率, 评价倾向, 真实性与可能性判断]
    evidence:
      supporting:
        - "Bower 团队的心境一致性记忆系列实验（实验研究）"
        - "Forgas 情感注入模型的现场与实验室研究（库外文献，EP 未实取）"
      conflicting:
        - "强目标导向任务中，心境效应被任务结构抵消（边界研究）"
      replication:
        - "实验室复制并非稳定：后续心境依赖检索复制不完全稳定（Bower & Mayer 1985 自身报告复制失败），催眠诱发方法存在生态效度争议（S164 EP 原文）；效应量随任务与测量方式波动较大。评级按枚举记 B"
      meta_analysis: []
    evidence_grade: B
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions:
      - "信息足够模糊、可作多效价解读时效应最强"
      - "受众未把心境来源归因于无关事件时"
    failure_conditions:
      - "受众意识到坏心情来自无关事件（如下雨）并做归因校正时"
      - "信息完全清晰、无需解释空间时"
    common_misinterpretations:
      - "把心境一致性当成『好心情万能』；负向心境在威胁监督内容（如风险警示）中反而提高接受度"
    ethical_risks:
      - "刻意把受众置于特定心境后投放匹配信息（如深夜悲情内容后推高风险产品），构成对状态性脆弱的利用"
    examples:
      original_cases: ["The Seven Sins of Memory（S05）中记忆偏差维度对心境与记忆交互的讨论"]
      research_cases: ["Bower 的心境一致性记忆实验；Forgas 的情感注入现场实验"]
      modern_cases: ["音乐/氛围内容后接种草信息；用户在负面舆情事件后对同品牌其他内容的宽容度下降"]
    communication_implications: "发布时机与前置体验决定解读滤镜：同一内容在庆祝场景与危机场景中的传播结果完全不同，需按场景排期与调性校准。"
    community_implications: "社群重大负面事件后应暂停促销性内容推送，先修复氛围再恢复商业信息。"
    content_applications:
      opening: "用与目标心境一致的场景开场（轻松内容配轻快开场，警示内容配严肃开场）"
      body: "减少与目标心境冲突的杂讯（如严肃提醒中插入娱乐梗）"
    platform_implications: "平台展示环境（前后内容、时段）构成心境前菜，程序化投放若不考虑环境上下文，素材效果测量会系统性失真。"
    related_nodes: [affect_heuristic, availability_heuristic, emotional_contagion, encoding_specificity, peak_end_rule]
    source_ids: [S05, S01, S164]
    provenance:
      primary_sources: ['S05', 'S01', 'S164']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: empathy_induced_helping
    canonical_name_en: Empathy-Induced Helping
    canonical_name_zh: 共情-助人
    aliases: [共情利他, empathy-altruism]
    domain: emotion
    definition: "对具体个体的共情唤起（共情关怀）可独立于自利考量驱动帮助行为，即 Batson 的共情-利他假说；『可识别受害者效应』（identifiable victim effect，库外文献、EP 未实取）进一步显示：一个具体、有名有姓的受助者比统计意义上的群体获得更多援助。"
    core_claim: "指向具体个体的共情唤起增加帮助行为，即使帮助不能带来声誉或回避内疚等自利收益。"
    mechanism: "共情把他人福祉纳入自我关切，具体形象使痛苦变得可想象、可回应；统计数字触发分析加工与无力感（『帮不过来』），具体个人触发行动脚本（可识别受害者效应）；叙事与视角采择增强心理联结，从而提高帮助意愿与投入（S21）。"
    causal_chain: "具体受助者的生动呈现 → 共情关怀唤起 → 帮助动机与行动 → 捐助/支援行为"
    variables:
      inputs: [受助者具体性, 故事生动度, 视角接近性]
      moderators: [受助群体规模（越多越稀释）, 与受众的身份距离, 成本与效能感知]
      mediators: [共情关怀, 心理联结, 自我效能感]
      outputs: [捐助金额与转化, 志愿报名, 分享扩散]
    evidence:
      supporting:
        - "Batson 系列实验：在排除多种自利解释的条件下，共情仍提升帮助（实验研究）"
        - "Small 与 Loewenstein 等的可识别受害者效应实验：具体个体比统计群体获得更多资源（库外文献，EP 未实取）"
      conflicting:
        - "共情可被操纵且存在圈层偏向（偏向可识别的、与我相似者），可能造成资源错配（理论争论）"
      replication:
        - "可识别受害者效应方向多次重复，但幅度与条件（是否提示统计背景）有波动。评级按枚举记 B"
      meta_analysis: []
    evidence_grade: B
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions:
      - "帮助成本适中、受众有可执行的行动路径时最有效"
      - "受助者与受众存在可感知的相似性或联结点"
    failure_conditions:
      - "呈现过多需要帮助者的『统计画面』引发无力感与 Compassion fade（共情衰减，库外文献、EP 未实取）"
      - "受众怀疑故事真实性或认为组织低效时，共情被信任缺失抵消"
    common_misinterpretations:
      - "把共情叙事等同于悲情营销：过度悲情化会同时损害受助者尊严与组织可信度"
    ethical_risks:
      - "虚构或夸大个体苦难故事骗取捐助；未经同意展示受助者可识别信息构成隐私与尊严伤害"
    examples:
      original_cases: ["The Social Animal（S21）对旁观者干预与助人研究的综合讨论"]
      research_cases: ["Batson 的共情-利他实验范式（S165）；可识别受害者效应系列实验（库外文献，EP 未实取）"]
      modern_cases: ["公益平台的具体受助者故事页；众筹项目以单个家庭叙事而非群体统计呈现"]
    communication_implications: "公益与求助内容遵循『一个具体的人+一个可完成动作』结构；规模数据放在行动之后作补充，而非开头的说服主角。"
    community_implications: "社群互助板块把请求结构化（具体需求+可交付动作+进度反馈），把共情转化为持续参与而非一次性感动。"
    content_applications:
      title: "以具体人物与具体困境命名标题，避免『数百万人的危机』式开头"
      cta: "给出单一、明确、成本可感知的帮助动作（捐一餐、转一次）"
      narrative: "受助者作为主角呈现能力与处境，而非纯粹被拯救对象"
    platform_implications: "平台对公益内容的信任标签与资金透明度展示，决定共情能否转化为行动；纯情绪内容在信任机制薄弱的平台转化率受限。"
    related_nodes: [anecdote_vs_statistics, story_character_identification, narrative_transportation, reciprocity_norm, ostracism_effects]
    source_ids: [S21, S165]
    provenance:
      primary_sources: ['S21', 'S165']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"
