- id: scarcity_mindset
  canonical_name_en: Scarcity Mindset (Tunneling / Bandwidth Tax)
  canonical_name_zh: 稀缺心态（隧视野与带宽税）
  aliases:
  - 稀缺心态
  - 带宽税
  - tunneling
  - bandwidth tax
  domain: behavioral_economics
  definition: 稀缺心态（Mullainathan 与 Shafir，S13）指资源稀缺（钱、时间）捕获认知带宽：稀缺感使注意收窄于稀缺对象（隧视野），削弱其他任务的认知控制与决策质量，形成『稀缺→短视→更稀缺』的循环。证据评级
    B/C（按枚举记 C）：Mani 等 2013 的甘蔗农研究提供了标志证据，但后续大规模复制中部分效应缩水，需携带边界说明。与 Cialdini 影响力中的『稀缺原则』（限量话术）区分：那是说服线索（A3
    层），本节点是认知状态（A2 层），两者不可混用。
  core_claim: 资源稀缺状态捕获注意与执行控制，系统性地降低非稀缺域的决策质量；效应存在但强度有复制争议。
  mechanism: 稀缺使稀缺对象在注意竞争中获得优先级（与 inattentional_blindness 的盲区机制相通），其他事务被挤出；同时焦虑与反复计算占用工作记忆资源（带宽税），导致借贷、拼单等短期修补行为，长期加剧稀缺（S13）。Mani
    等 2013 在收获前（穷）与收获后（相对宽裕）比较同一批农民的认知任务表现；Carvalho 等 2016 的田间研究在部分认知指标上未能复现同等强度；更大规模的复制中效应缩水。
  causal_chain: 资源稀缺 → 注意隧视野+带宽占用 → 非稀缺域决策质量下降 → 短视修补行为 → 稀缺加深（循环）
  variables:
    inputs:
    - 财务/时间稀缺程度
    - 稀缺的即时压力
    - 安全网缺失
    moderators:
    - 稀缺的持续性
    - 决策辅助的可得性
    - 个体经验
    mediators:
    - 注意优先级
    - 执行控制资源
    - 焦虑水平
    outputs:
    - 非稀缺域任务表现
    - 借贷与消费决策
    - 计划失误率
  evidence:
    supporting:
    - Mani 等 2013 甘蔗农收获前后比较与配套实验室实验（期刊论文）
    - S13 中时间稀缺（繁忙）情境的实验与观察证据
    conflicting:
    - Carvalho 等 2016 方向的田间研究未在所有认知指标复现；后续大规模复制中部分效应缩水（EVIDENCE.md 定为 B/C）
    replication:
    - 相关性证据稳健（贫困与认知负荷共存），因果强度有争议；应用建议必须标注情境依赖。评级按枚举记 C
    meta_analysis: []
  evidence_grade: C
  boundary_conditions:
  - 稀缺需达到捕获注意的强度（轻微预算紧张不足以触发）
  - 对财务脆弱人群的实证支持最强，外推到一般『忙』情境需谨慎
  failure_conditions:
  - 把一切拖延与低效归因『带宽税』的心理化滥用
  - 在无稀缺感的受众上使用该解释设计产品
  common_misinterpretations:
  - 把稀缺心态当成性格缺陷（『穷人不会规划』）；它是对稀缺环境的认知适应副作用，干预应改环境而非指责个人
  ethical_risks:
  - 针对财务脆弱人群在稀缺时点投放高息产品（ payday 式营销），利用其隧视野牟利
  examples:
    original_cases:
    - Scarcity（S13）中的机场托运、农民收获周期等案例
    research_cases:
    - Mani 等 2013 的农民认知任务研究；Carvalho 等 2016 的后续田间研究（含不一致结果）
    modern_cases:
    - 发薪日前后的消费与信贷行为差异；deadline 高峰期的课程完课率下降
  communication_implications: 面向财务或时间稀缺人群的内容必须极简、单任务、可延迟（存下来稍后看），避免多选项与紧迫操纵。
  community_implications: 社群对忙季成员提供异步参与通道与摘要，而不是同步打卡要求；帮助性提醒选在稀缺缓解后发送。
  content_applications:
    body: 给稀缺人群的内容做『一行结论+可保存』结构，降低当下带宽需求
    cta: 『没时间？先收藏，明早两分钟看完』——尊重隧视野而非对抗它
  platform_implications: 信贷类平台的推送时机选择是稀缺操纵的高风险区；负责任的节奏是稀缺缓解期（发薪后）再触达非紧急决策。
