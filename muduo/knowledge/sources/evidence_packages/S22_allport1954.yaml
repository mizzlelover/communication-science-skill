research_question: "偏见的心理机制与社会条件是什么？如何减少群际偏见？"
core_claims:
  - "偏见=基于错误僵化的过度概括形成的对某群体的敌意或负面态度；放在人格（功能自主性/特质）与社会（刻板印象/替罪羊）的交叉处分析"
  - "接触假说（contact hypothesis）：减少群际偏见的主要方式是与外群体在最佳条件下接触"
  - "最佳接触四条件：①平等地位 ②共同目标 ③群际合作（非竞争）④权威与法律支持"
  - "后续实证：群际接触减少偏见的结论被广泛验证（Pettigrew & Tropp meta；随机室友分配研究）；最优条件对多数群体预测更强（Tropp & Pettigrew 2005）"
method: "人格与社会心理学理论专著 + 大量案例与既有研究综合"
results: "（理论奠基）偏见研究经典；接触假说成为减少偏见的标准路径"
limitations: "专著为理论综合（1954 年代证据基础）；接触效应的因果强度需现代随机分配研究支撑"
boundary_conditions: "接触需满足四条件才有减小偏见效果；未满足条件的接触可能无效或反效"
