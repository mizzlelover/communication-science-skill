- id: fairness_preferences
  canonical_name_en: Fairness Preferences
  canonical_name_zh: 公平偏好
  aliases:
  - 公平感
  - 不平等厌恶
  - inequity aversion
  - 最后通牒博弈
  domain: behavioral_economics
  definition: 公平偏好指人们愿意付出自身成本惩罚不公平：最后通牒博弈中提案者分出过低份额会被拒绝（双方皆空），Güth 等 1982 的经典实验确立了这一『非自利』行为；Fehr 与 Schmidt
    1999 的不平等厌恶模型将其形式化。公平感是社会规范（S27）与互惠规范（A3）的决策基础，也是定价与分配行为的红线传感器。
  core_claim: 人们为拒绝不公平分配愿意牺牲自身利益，公平阈值跨越即触发惩罚行为。
  mechanism: 公平分配涉及多重规范（平等、按贡献、按需要）的情境权重；被不公平对待激活愤怒与惩罚动机（与互惠规范相通），即使惩罚无利可图；公平判断参照本地规范与历史，跨文化阈值差异显著（Henrich
    等的跨社会研究）；第三方惩罚扩展该偏好至非当事者（S12、S27）。
  causal_chain: 分配结果低于公平阈值 → 不公平感与愤怒 → 自损式惩罚/拒绝 → 规范执行信号扩散
  variables:
    inputs:
    - 分配比例
    - 分配规则透明度
    - 双方关系与身份
    moderators:
    - 文化规范
    - 惩罚成本
    - 是否可匿名报复
    mediators:
    - 不公平感
    - 愤怒与惩罚动机
    - 规范期望
    outputs:
    - 拒绝率
    - 惩罚行为
    - 口碑报复（差评、抵制）
  evidence:
    supporting:
    - Güth 等 1982 最后通牒实验（经典实验）
    - Fehr 与 Schmidt 1999 不平等厌恶模型及大量后续实验；Henrich 等跨社会比较（实验与田野研究）
    conflicting:
    - 跨文化阈值差异大；高匿名、高关系距离下自利行为增强，公平偏好的普适强度有边界（研究观察）
    replication:
    - 拒绝低额分配在多数文化中重复；强度与规范情境高度相关。评级按枚举记 B
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 当事方在关系与声誉约束下（可被记住）公平执行最强
  - 分配规则被预先接受并透明时，不均结果可被容忍（程序公平缓冲）
  failure_conditions:
  - 完全匿名的市场交易中，公平约束主要靠品牌与制度承载
  - 把惩罚成本抬高到超出群体承受后，惩罚行为衰减
  common_misinterpretations:
  - 把公平偏好等同于平均主义；人们接受按贡献与规则产生的差距，敏感的是规则被暗改
  ethical_risks:
  - 大数据杀熟、差别定价被曝光后触发集体公平惩罚（抵制、舆情），远超短期收益
  examples:
    original_cases:
