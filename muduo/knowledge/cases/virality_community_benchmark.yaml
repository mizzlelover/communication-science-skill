  material_ref: "https://static.nfnews.com/content/202401/31/c8563320.html"

- case_id: "VCB-007"
  quadrant: low_interaction_high_retention
  case_type: benchmark_case
  context: "家族微信群（'相亲相爱一家人'类）：以血缘关系为边界绑定的微信家庭大群，中国微信生态中最普遍的群形态之一。典型状态：多数成员常年潜水不发言，但几乎无人退群（退群的社会成本极高），并保持'偶尔点开看看'的弱参与。树洞倾诉 2026-08-14 发布《2026'群聊潜水'调查》：2026 年 8 月 7 日-13 日调查 50 位 18-35 岁年轻人，88% 自述在大多数群聊中潜水，家族群典型状态为'我就看我爸妈他们聊天，抢红包我最快，说话我从来不在'（受访者原话）。"
  mechanisms: [strong_ties_support, need_to_belong, reciprocity_norm, community_rituals]
  result: "可公开核实：多个公开来源独立指向同一现象——家族群低互动、高留存。树洞倾诉 2026-08 调查（50 位 18-35 岁受访者）88% 自述潜水，'工作群、家族群、同学群，大部分群都是免打扰，偶尔点开看看，从来不说话'；小宇宙播客《41.家庭群聊的数字囚笼》（Think&Talk，约 2025 年发布，WebFetch 实取）以家庭微信群为切入点，分析其演变为'算法化亲情监狱'：情感压迫、被动接收、不能自由回应、'数字逃亡：沉默、潜水、退群'；头条自媒体文章《家庭群里，为什么越来越沉默？》描述'大部分亲戚常年潜水、从不发言、默默围观'但保持群成员关系。"
  original_material: "搜狐·树洞倾诉《2026'群聊潜水'调查：群里99+，我一句话不说》（2026-08-14，WebSearch 实取全文；调查口径为自媒体自报，非严谨抽样）https://m.sohu.com/a/1062676391_122854318/ ；小宇宙播客《41.家庭群聊的数字囚笼》（WebFetch 实取节目纲要）https://www.xiaoyuzhoufm.com/episode/6813213547ebeede7e53aa21"
  observable_outcome: "可观察事实：家族群成员留存率极高（血缘绑定+退群社会成本高，普遍经验现象，多篇公开文章独立印证）；日常互动趋近于零，仅剩节日红包、'早上好'问候、长辈转发养生内容等低频仪式性发言；成员保持'偶尔点开看看'的弱参与（观察性留存）。"
  outcome_status: MEDIA_REPORTED
  causal_status: case_inference
  lesson: "对比结论：家族群证明'低互动+高留存'可以完全由关系约束驱动而非价值创造驱动——成员留下来是因为'不能退、不该退'（血缘义务、面子、社会规范），不是因为有归属回报。归属基本需要（need_to_belong）要求'频繁互动+持久关怀框架'两个条件，家族群满足后者（血缘承诺天然持久）却长期缺乏前者，成员以'潜水'维持最低限度的在场（第三空间式低义务在场，third_place 的弱形态）。对运营者的警示：高留存率本身不证明社群健康，必须区分'约束性留存'（人走不了）与'吸引力留存'（人不想走）——前者是负债不是资产，任务式、义务式的'回来'不能当作社群价值证据。"
  corpus_status: SOURCE_CONFIRMED
  material_ref: "https://www.xiaoyuzhoufm.com/episode/6813213547ebeede7e53aa21"

- case_id: "VCB-008"
  quadrant: low_interaction_high_retention
  case_type: benchmark_case
  context: "毕业班级微信群：以共同求学经历为边界的学生班级群（小学/初中/高中/大学群）。普遍生命周期：毕业初期热闹（晒近况、回忆杀），3-10 年内集体沉默为常态（小学群变僵尸群、初中群分裂、大学群潜水、高中群只剩零星发言），但成员几乎不退群（'想退群又犹豫不决'），群在关键时刻（同学聚会、老师募捐、校庆、新年红包）可被唤醒。"
  mechanisms: [collective_identity_narrative, sunk_cost_fallacy, fear_of_missing_out, strong_ties_support]
  result: "可公开核实：网易新闻（何圣君，2026-01-31）《同学微信群，是怎么变成'死群'的？》描述同学群从热闹到沉默的路径：'群还在，人散了'，成员'默默开启免打扰，有人干脆退群，更多人选择潜水'，但多数人'看着死寂的同学群，想退群又犹豫不决'；搜狐（牧场数字大脑，2025-07-09）《毕业后的同学群，为什么越来越安静了？》同样描述低互动状态与'屏蔽群消息，甚至退出群聊'的个体差异；头条自媒体《毕业10年，所有同学群全凉了！》描述'大学群：毕业三五年就集体潜水'、'红包发了有退回，张罗10周年聚会四五十人凑不出5个'。"
  original_material: "网易·何圣君《同学微信群，是怎么变成'死群'的？》（2026-01-31，WebSearch 实取全文）https://c.m.163.com/news/a/KKJKROCH0544BBTK.html ；搜狐·牧场数字大脑《毕业后的同学群，为什么越来越安静了？》（2025-07-09，WebSearch 实取全文）https://www.sohu.com/a/912178278_122425606"
  observable_outcome: "可观察事实：班级群成员数量长期保持满员（几乎无人退群）而日常发言趋近于零；沉默后仍可被低频事件（聚会、募捐、新年红包）部分唤醒；公开文章普遍描述'潜水/沉默/不发言但不退群'为绝大多数成员的行为模式。"
  outcome_status: MEDIA_REPORTED
  causal_status: case_inference
  lesson: "对比结论：班级群的低互动高留存由'关系资本存量'（共同经历、青春记忆形成的集体身份叙事）而非'当下的互动供给'驱动——成员承诺的对象是'这段关系'而不是'这个群'本身。留存机制是组合的：集体记忆（collective_identity_narrative）提供情感锚点、沉没成本（sunk_cost_fallacy：多年群龄与同学身份，退群=承认关系终结）阻止退出、怕错过（fear_of_missing_out：怕错过聚会/消息/人情）维持弱在场。对运营者的启示：社群可以在零互动的状态下长期存在，'留存'要配合'关键时刻唤醒成功率'一起看；靠记忆存量维持的社群是'休眠资产'，一旦唤醒失败（聚会凑不齐人），沉默会进一步自我确认，最终连唤醒通道也关闭。"
  corpus_status: SOURCE_CONFIRMED
  material_ref: "https://c.m.163.com/news/a/KKJKROCH0544BBTK.html"
