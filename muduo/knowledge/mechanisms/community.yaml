- id: collective_identity_narrative
  canonical_name_en: Collective Identity Narrative
  canonical_name_zh: 集体身份叙事
  aliases:
  - 集体叙事
  - we-story（我们故事）
  domain: community
  definition: 集体身份叙事（collective identity narrative）指社群关于「我们是谁、我们从哪里来、我们反对什么、我们正在创造什么」的共享故事结构：起源故事（创始与关键时刻）、成员原型（典型成员画像）、对手与共同敌人（外部张力）、价值主张（我们与众不同之处）。它是社群的身份自传，随时间被成员共同书写与修订。
  core_claim: 社群的身份感由共享叙事而非共同特征直接产生：成员通过理解并复述「我们的故事」获得身份，叙事被讲述的频率与一致性预测社群认同强度。
  mechanism: 个体通过叙事整合自我经验（叙事身份理论），集体同样如此：起源故事回答「我们为何存在」，危机与转折故事回答「我们共同经历了什么」，英雄与原型故事回答「理想的我们是什么样」。叙事把离散的事件组织成有意义的连续体，使新成员能通过「读到故事—代入角色—复述故事」完成身份内化。集体叙事与仪式相互构成：仪式重演叙事，叙事为仪式提供脚本；叙事还是社群的传播资产——成员对外讲述「我们的故事」就是社群的自然增长引擎。
  causal_chain: 共同经历 → 被组织成叙事（起源/危机/英雄/价值） → 成员内化并复述 → 集体身份感 → 反向塑造行为规范与新事件的意义解读
  variables:
    inputs:
    - 起源故事的清晰度
    - 成员故事的采集与传播
    - 对手与价值的表述
    moderators:
    - 叙事的开放性（新成员能否写入自己的章节）
    - 讲述场合的频率
    - 内部多样性的容纳度
    mediators:
    - 身份认同
    - 意义共享
    - 集体记忆
    outputs:
    - 认同强度
    - 成员对外代言意愿
    - 社群文化一致性
  evidence:
    supporting:
    - 社会认同理论：群体身份通过比较与共享表征形成（Tajfel & Turner 传统）
    - 叙事心理学：叙事作为身份的组织机制（个体与集体层面，McAdams 等人的研究传统）
    - 参与式文化研究对粉丝社群共同叙事的观察（Jenkins《Convergence Culture》）
    conflicting:
    - 统一叙事可能压制内部分歧：过度一致的「官方故事」制造沉默的少数派（社群研究讨论）
    replication:
    - 「共享叙事与群体认同正相关」方向稳定；叙事内容的具体效应高度情境化
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 叙事需要真实共同经历的素材；凭空编造的「我们」故事（虚假起源、伪造历史）会被长期成员识破
  - 叙事必须允许更新：僵化的起源叙事会拒绝新成员与新时代，社群老龄化
  failure_conditions:
  - 叙事只有官方版本且不容修订：成员失去「作者身份」，叙事沦为宣传
  - 对手叙事失控：共同敌人从「观念」扩大到「具体人群」，社群滑向攻击性
  common_misinterpretations:
  - 「拉个群就有了集体身份」——身份来自叙事的被讲述与被复述，不是群名与群头像
  - 把 collective_identity_narrative 与 identity_signaling 混淆：叙事是群体的故事结构（我们是谁），signaling 是个体的符号展示行为（我属于谁）；叙事为
    signaling 提供符号弹药
  ethical_risks:
  - 集体叙事制造内群体神圣化与外群体妖魔化（「我们是觉醒者，他们是愚蠢大众」）
  - 叙事被用于掩盖社群内部问题（用「我们的美好故事」压制批评）
  examples:
    original_cases:
    - Jenkins 对粉丝社群共享叙事与集体创作的分析（《Convergence Culture》《Textual Poachers》传统）
    research_cases:
    - 叙事心理学对集体叙事与群体认同关系的研究（McAdams 传统）
    - 社会运动研究对运动叙事与动员的分析（方向一致）
    modern_cases:
    - 运动品牌跑团的「我们是一起扛过雨战的人」叙事
    - 开源项目的「从车库两个创始人到全球贡献者」起源故事
    - 网络文学社群的圈内黑话与共同梗史
  communication_implications: 把品牌/社群内容组织为「我们的故事」连载：起源篇（为什么开始）、同行者篇（成员故事）、里程碑篇（共同成就）、分歧与和解篇（真实的张力）；让用户从读者变成共同作者（UGC
    征集）。
  community_implications: 指定「叙事采集」为常规运营动作：记录每个关键时刻（第一次线下聚会、第一次危机、成员的重要转变），并邀请成员亲口讲述；叙事库是社群最独特的资产，竞品无法复制。
  content_applications:
    body: 正文以集体口吻（我们）而非品牌口吻（本产品）书写，引用真实成员原话与细节
    narrative: 维护起源故事的讲述纪律（关键细节不漂移），同时每季更新「我们这一年」章节
    comments: 征集成员故事并正式收录（「你的故事会成为社群历史的一部分」），赋予作者身份
    sharing: 把起源故事与里程碑做成可对外讲述的叙事卡片，供成员对外代言使用
  platform_implications: 平台的「年度回顾」「置顶精华」「共同标签」功能是集体叙事的载体；算法驱动的内容流偏好个体爆款，会侵蚀需要长期沉淀的叙事积累（原则性判断）。
