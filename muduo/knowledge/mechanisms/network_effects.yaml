- id: network_threshold_models
  canonical_name_en: Threshold Models of Collective Behavior
  canonical_name_zh: 网络阈值模型
  aliases:
  - 阈值模型
  - Granovetter 阈值
  domain: network_effects
  definition: 阈值模型（threshold models）由 Granovetter 于 1978 年提出，用于解释集体行为的突然爆发：每个人加入某一行为（参与、购买、转发）都有一个「阈值」——需要看到多少人已经行动自己才行动。群体的总体结果不取决于平均阈值，而取决于阈值在整个群体中的分布。
  core_claim: 集体行为的爆发与否由个体阈值的分布形态决定：两个平均阈值完全相同的群体，可能一个爆发一个沉默，仅仅因为阈值分布的方差不同。
  mechanism: 个体决策是相互依赖的递归过程：我看到 k 个人行动后若超过我的阈值就加入，我的加入又成为他人的观察信号。这个过程是自我放大的：低阈值者启动，中阈值者跟进，最终高阈值者也被卷入，形成雪崩式级联；若低阈值者太少或断档，级联在中间熄火。因此「多数人其实都愿意」但「没人先动」的
    pluralistic_ignorance 困境，与「少数激进者点燃全场」的爆发，都能在同一框架内解释。
  causal_chain: 阈值分布 + 初始行动者 → 相互观察的递归采用 → 达到或未达到自持级联 → 集体行为爆发/熄火
  variables:
    inputs:
    - 个体阈值分布
    - 初始行动者数量与位置
    moderators:
    - 网络可见性（能否看到他人行动）
    - 行为的风险与可逆性
    mediators:
    - 相互观察的信号传递
    outputs:
    - 集体行为是否爆发
    - 爆发规模与速度
  evidence:
    supporting:
    - Granovetter 1978 的形式化模型与暴动/罢工/谣言传播/投票等集体行为案例的逻辑解释（S138 EP 实载：分布形状而非均值决定结局、暴动 0-99 级联）
    - 网络科学教材把阈值模型作为扩散基本模型之一系统讲授（Easley & Kleinberg 教材）
    conflicting:
    - 真实个体阈值难以直接测量，多数应用依赖事后拟合，预测检验有限（方法学讨论）
    replication:
    - 模型逻辑在模拟与多种情境（集体行动、技术采纳、时尚）中被广泛重演；直接田野复制较少
    meta_analysis: []
  evidence_grade: B+
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 个体能看到他人的行动信号（可见性是模型的隐含前提）；匿名或隔离环境中阈值机制无法运转
  - 阈值稳定于观察窗口内；若风险或奖励随时间剧变，分布本身在移动
  failure_conditions:
  - 把「平均阈值低」当成爆发保证——分布的形状（低阈值者是否足够且连续）才是关键
  - 用模型解释需要深思熟虑的慢决策；阈值模型最适合快速、可见、相互依赖的简单决策
  common_misinterpretations:
  - 「找到最先行动的人就能引爆」——初始行动者的数量、网络位置与阈值断档共同决定结果，单点点火常熄火
  - 把阈值模型与 critical_mass_threshold 混为一谈：阈值模型是自下而上的个体异质性模型，临界规模更多用于网络产品与集体收益语境
  ethical_risks:
  - 阈值机制被利用做「托儿」：制造虚假行动者信号操纵他人跟进（虚假抢购、虚假热度）
  examples:
    original_cases:
    - Granovetter 1978 论文中的 riot 模型：相同平均阈值、不同方差的两个群体结局相反
    research_cases:
    - 对集体行动与技术采纳的模拟研究重演阈值效应（教材转述）
    modern_cases:
    - 直播间「扣1」氛围的相互依赖爆发（前几十条的可见性决定后续）
    - 股市挤兑与银行挤提的相互观察结构
    - 线下活动「冷场 vs 全场合唱」的阈值断档现象
  communication_implications: 制造可见的早期行动者（真实案例、首批参与者展示）是为中阈值人群提供「允许自己加入」的信号；内容设计要让「已经有很多人在做」可见且可信。
  community_implications: 社群活动的冷启动就是阈值问题：运营者要亲自扮演低阈值行动者，并让行动可见（接龙列表、报名榜），把个体犹豫变成集体惯性。
  content_applications:
    body: 正文展示「已行动者」的具体清单或故事，给中间阈值读者提供跟随的正当性
    narrative: 讲述「第一个人如何犹豫、如何行动、其他人如何跟上」的过程叙事
    sharing: 转发按钮旁展示真实参与人数与熟人动态，激活阈值观察
    comments: 运营以真实身份带头示范行动（而非灌水），并置顶真实参与者的反馈
  platform_implications: 平台的计数器（点赞数、参与人数）就是阈值模型的信号基础设施；平台可以自由「显示什么数字」，从而实质性地操纵集体行为阈值（原则性判断）。
