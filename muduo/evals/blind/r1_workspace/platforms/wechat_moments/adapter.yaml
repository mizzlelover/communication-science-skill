content_units:
  - "图文（最多 9 图）"
  - "纯文字"
  - "短视频"
  - "链接/文章转发卡片"
  - "广告（信息流原生插入）"

dominant_user_intent:
  - "关系维护（看熟人在做什么、回应熟人）"
  - "自我表达与印象管理（发什么=我是谁）"
  - "窥视与比较（upward_social_comparison 的日常发生地）"

distribution_model: >-
  无算法、无推荐：纯时间流+共同好友可见性，触达=好友数×刷朋友圈比例×停留时长。
  这是全平台唯一"分发由关系完全决定"的主流场景——不追热点、不投算法，
  唯一的杠杆是关系链本身与发布时机。
  [official_rule-产品形态（共同好友可见性机制见 S1/S2）＋industry_consensus-触达公式观察]

recommendation_model: >-
  无推荐系统 [official_rule-产品形态]：可见性由发布时间与好友关系唯一决定；
  任何"朋友圈算法权重"说法均属误传。

social_graph_characteristics: >-
  双向强关系：互为好友才可见、才可互动；好友规模数百级且多为同事/家人/同学，
  规范压力大（norm_enforcement_reputation）——所有人都在看着"你这个人"。
  [official_rule-产品形态（双向好友可见性见 S1/S2）＋industry_consensus-规范压力观察]

content_lifecycle: >-
  极短：小时到 1-2 天。超过 24 小时的内容几乎不再被看到（时间流冲刷）；
  无搜索长尾、无推荐复活——发布时刻就是全部。
  [industry_consensus-行为观察]

primary_entry_points:
  - "发现页朋友圈入口（首屏一级入口）"
  - "红点提醒（新动态提示）"

attention_environment: >-
  快速滑动扫视：每条动态停留 1-3 秒，无标题无封面竞争——
  首图与首行文字是仅有的注意力入口；用户处于低戒备高信任的"熟人滤镜"状态。
  [industry_consensus-行为观察]

user_behavior: >-
  点赞是最低成本的关系货币（reciprocity_norm 的日常维护）；
  评论仅共同好友可见，是半私密对话；分组与屏蔽是常态化的印象管理工具
  （self_presentation_impression_management）。
  [industry_consensus-行为观察；分组/屏蔽功能官方机制见 S1]

interaction_signals:
  - "点赞：关系维护信号，语义最弱但频率最高 [industry_consensus-行为观察]"
  - "评论：私密性对话，仅共同好友可见 [official_rule-产品形态]"
  - "转发好友内容到自己的朋友圈：把别人的表达变成自己的自我表达，背书强度最高 [official_rule-转发产品功能见 S2＋industry_consensus-背书强度判断]"
  - "屏蔽/不看TA：负向信号不可见但真实存在 [verified_observation-产品提供分组与屏蔽功能]"

sharing_mechanism: >-
  朋友圈本身就是分享的目的地：文章/视频/小程序卡片经由好友转发进入关系链。
  阻碍在于社交扣分——营销感过重会被"分组""屏蔽"甚至删除好友；
  商业内容的存活依赖"人设先于卖货"的信任储蓄（trust_calibration）。
  [official_rule-外链卡片与诱导分享治理见 S3/S4＋industry_consensus-社交扣分观察]

search_mechanism: >-
  无公开搜索价值：内容不可被陌生人检索 [official_rule-产品形态]；
  仅支持用户本人检索自己的历史内容。做"朋友圈 SEO"是伪命题。

community_mechanism: >-
  朋友圈不是社群空间而是印象管理舞台：无身份分层、无话题聚合、无组织结构；
  社群功能需迁移到微信群。它的价值是持续曝光个人人设（mental_availability）。
  [official_rule-产品形态（无关注/无话题聚合为界面公开可见）＋industry_consensus-定位判断]

algorithmic_features:
  - "自然内容无算法 [official_rule-产品形态]"
  - "朋友圈广告按人群定向投放 [official_rule-产品存在，定向逻辑不公开]"

content_constraints:
  - "[official_rule] 图文上限 9 张（以平台最新公告为准）"
  - "[industry_consensus] 纯文字过长会被折叠为一行（约数行以上触发，阈值未公开，以平台实际显示为准）"
  - "[industry_consensus] 链接卡片展示为固定结构（标题+缩略图），不可自定义布局"

title_role: >-
  无标题元素：首行文字即标题；超过折叠线的内容物理性不可见——
  首行必须在折叠线上完成钩子（serial_position_effect + 折叠机制叠加）。
  [industry_consensus-行为观察（折叠阈值为产品显示行为，无官方数值）]

cover_role: >-
  无封面：九宫格首图承担封面职责，居中第一格视觉权重最高
  （visual_hierarchy + gestalt_grouping 的九宫格完形）。
  [industry_consensus-策略观察；图文 9 张上限官方（见 content_constraints）]

opening_role: >-
  首行即开场即标题：折叠线以上是全部阅读率的战场；
  "前半句给场景、后半句留缺口"是常见有效结构 [industry_consensus]。

tag_role: >-
  话题标签无流量分发作用 [official_rule-产品形态]；
  @提醒好友是个别点名工具，是朋友圈里最接近"定向触达"的机制 [official_rule-产品形态]。

comment_role: >-
  点赞=关系货币（礼尚往来的最低成本形态）；
  评论=共同好友可见的半公开剧场，评论互动常比内容本身更能维系关系；
  作者回复他人评论强化温度。
  [official_rule-产品形态（评论仅共同好友可见，界面公开可见）＋industry_consensus-关系观察]

follow_role: >-
  无关注机制：好友即关系资产。商业视角下"加好友"是比"涨粉"更重的承诺
  （双向同意），因此清洗率与信任门槛都更高。
  [official_rule-产品形态（朋友圈无关注机制为界面公开可见）＋industry_consensus-商业观察]

risk_factors:
  - "[industry_consensus] 广告感触发社交扣分：被分组/被屏蔽不可见但累积，最终表现为互动归零"
  - "[industry_consensus] 频繁刷屏占用公共时间流：好友的隐性反感（规范压力）"
  - "[official_rule] 诱导分享类内容受平台规则限制（以最新规则为准）"
  - "[industry_consensus] 私域人设崩塌不可逆：强关系场景里信任破坏直接传导到现实关系"

known_platform_patterns:
  - pattern: "首行折叠线钩子（把关键信息放在折叠线上方）"
    mechanism_links: [selective_attention, serial_position_effect]
    fact_type: industry_consensus
    note: "折叠让'首行之外'的内容接近零触达；首行承担 100% 的停留决策。"
    evidence_level: L3
    source_ref: "N/A（行业共识；折叠阈值为产品显示行为，无官方数值）"
    last_verified: "2026-09"
  - pattern: "九宫格首图 C 位设计"
    mechanism_links: [visual_hierarchy, gestalt_grouping, bottom_up_attention_capture]
    fact_type: industry_consensus
    note: "九宫格被视为一个完形，首图定义整组的解读框架。"
    evidence_level: L3
    source_ref: "N/A（行业共识；'图文最多9张'为产品可观察限制，无官方文档数值）"
    last_verified: "2026-09"
  - pattern: "分组可见的场景化表达（对谁说什么话）"
    mechanism_links: [self_presentation_impression_management, social_identity_theory]
    fact_type: industry_consensus
    note: "用户本能地做观众隔离；商业内容同理——给客户看的内容别让同事看到。"
    evidence_level: L3
    source_ref: "S1、S2（'分组可见/朋友权限/非双向好友不可见'产品能力有官方 FAQ 支持；观众隔离的运营手法为行业共识）"
    last_verified: "2026-09"
  - pattern: "求助式/福利式内容互动率更高"
    mechanism_links: [reciprocity_norm, empathy_induced_helping]
    fact_type: experience_speculation
    note: "经验观察：给好友'帮上忙'的机会（提问/投票/福利）比单向展示更易引发评论。"
    evidence_level: L4
    source_ref: "N/A（经验推测，无官方文档，需个体 A/B 验证）"
    last_verified: "2026-09"
  - pattern: "硬广改写为'生活切片+使用痕迹'"
    mechanism_links: [authenticity_perception, psychological_reactance]
    fact_type: industry_consensus
    note: "赤裸推销触发心理抗拒与屏蔽；真实使用语境降低推销感。"
    evidence_level: L3
    source_ref: "N/A（行业共识，无官方文档直接支持）"
    last_verified: "2026-09"
  - pattern: "发布时间跟随目标好友的刷圈时段"
    mechanism_links: [context_cue_stability, attention_economics]
    fact_type: experience_speculation
    note: "时间流冲刷机制下，发布时刻=触达上限；无算法兜底，时机即分发。"
    evidence_level: L4
    source_ref: "N/A（经验推测，无官方文档，需个体验证）"
    last_verified: "2026-09"

