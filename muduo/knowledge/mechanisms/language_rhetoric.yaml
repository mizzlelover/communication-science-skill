- id: rhetorical_question_engagement
  canonical_name_en: Rhetorical Question Engagement
  canonical_name_zh: 设问与反问的参与效应
  aliases:
  - 设问效应
  - rhetorical questions
  - 疑问句说服
  domain: language_rhetoric
  definition: 以问句形式（设问：自问自答；反问：无需回答）呈现信息对加工深度与说服的影响：ELM 传统的研究表明设问的效果呈交互模式——高卷入受众对设问信息加工更深（与后续论据协同增强说服），低卷入时设问本身作为表面线索起作用。
  core_claim: 设问改变加工方式而非单向增强说服：它让高卷入者更认真地想（好论据被放大），让低卷入者留下浅印象（坏论据同样被放大）。
  mechanism: 问句触发隐式回答倾向：读者被诱导生成内部反应（自我参照+认知反应生成），从而改变 elaboration 水平——高动机读者在设问后投入更多论据审查（中心路径增强），低动机读者只处理问句本身并可能留下错误的肯定感。反问句（『难道不是吗？』）附带预设与压力，可能触发
    reactance；设问句（『为什么会这样？』）打开信息缺口（curiosity gap）驱动继续阅读。
  causal_chain: 设问呈现 → 隐式回答与认知反应生成 → 加工深度改变（高卷入增强审查、低卷入浅处理） → 论据说服力被同向放大
  variables:
    inputs:
    - 问句类型（开放设问/引导反问/选择问）
    - 问句与后续论据的衔接
    - 论据本身的质量
    moderators:
    - 受众卷入度与动机
    - 论据质量（设问是放大器而非修正器）"
    - 预设的争议性（反问的隐含立场）
    mediators:
    - 认知反应生成
    - 加工深度改变
    - 信息缺口（curiosity）
    outputs:
    - 高卷入+强论据：说服增强；高卷入+弱论据：反噬加深
    - 低卷入：浅印象与错误肯定感
    - 继续阅读动机（设问的悬念功能）"
  evidence:
    supporting:
    - Petty, Cacioppo 与 Heesacker 的设问×卷入度实验：高卷入下设问增强论据加工（一手实验 EP 未建，标注记忆级）
    - 问句与 curiosity gap 的研究（信息缺口驱动注意，见 A1 域）
    - 标题问句对点击的影响（媒体与营销应用研究）
    conflicting:
    - 设问效应高度依赖论据质量与卷入度交互，单向『问句更吸引人』的普及说法证据薄弱
    - 反问的对抗性在防御敏感受众中触发逆反
    - 标题党问句的过度使用造成期待违约（点进无答案）
    replication:
    - ELM 设问范式的基本交互可复制
    - 应用层（标题、开场）的证据多为观察与A/B测试，严格实验少
    meta_analysis:
    - 无独立 meta-analysis；并入 ELM 与问句研究综述
  evidence_grade: C
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Petty, Cacioppo & Heesacker 1981 设问×卷入实验为教科书级文献（一手 EP 未建，标注记忆级）；S34 EP 仅载 ELM
      双路径框架，未收录该实验
    effect_size: 设问×卷入度交互方向（高卷入放大论据审查）；无一手效应量可引
    replication_status: ELM 设问范式的基本交互见诸综述转述（记忆级），本库未核一手 EP
    context_dependency: 效应高度依赖论据质量与受众卷入度的交互
    downgrade_upgrade_reason: 2026-09 反向审计：核心实验证据未建 EP，S31（社会影响手册目录，未载设问）自 refs 移除，grade 维持 C 并如实标注记忆级，待建
      Petty/Cacioppo/Heesacker 1981 EP 后升级
  boundary_conditions:
  - 问句后必须衔接真实答案或论据（设问必有后文）
  - 高卷入场景中论据质量过硬（放大器前提）
  - 问句预设与受众立场不过度冲突
  failure_conditions:
  - 问句后无答案（期待违约，信任损耗）
  - 反问对防御敏感受众（逆反触发）
  - 低卷入场景中弱论据配设问（浅肯定被放大）
  common_misinterpretations:
  - 把设问当万能开场——设问是加工放大器：放大好论据也放大坏论据，弱内容配设问死得更快
  - 把反问当强调——反问在书面语境中常被解读为对抗姿态
  ethical_risks:
  - 以设问误导（只问不答、预设诱导式问句——『你还在用XX吗？』的贬损预设）
  - 标题党问句的期待违约
  examples:
    original_cases:
    - Petty, Cacioppo 与 Heesacker 的设问实验（ELM 传统，S34 收录方向）
    - 《Thank You for Arguing》对修辞问句的分类讨论（S67）
    research_cases:
    - 设问×论据质量×卷入度的交互实验
    - 信息缺口与标题问句的注意研究
    modern_cases:
    - 标题的钩子问句（『为什么你的基金总亏？』→ 正文必须真给答案）
    - 直播话术的连环设问（『有没有人遇到这种情况？弹幕打1』）
    - 反例：『是什么让他们如此成功？』点进去全是软广（期待违约）
  communication_implications: 设问的正确用法是『真问题的入口』：用受众真实困惑开场（你有没有过X困惑？），正文结构直接回应问题（先给答案再展开）；避免装饰性问句与诱导性反问——每次问而不答都在消耗信任账户。
  community_implications: 社群运营的提问是参与引擎：每周抛真问题（成员真实困境）而非反问式说教（『难道不该坚持吗？』）；结构化提问（选项+经验征集）比开放空问（大家聊聊？）产出高数倍。
  content_applications:
    opening: 开场用受众真实困惑的原话式设问（『为什么明明没乱花钱，就是存不下钱？』），正文首段直接给答案梗概
    title: 标题问句必须在正文兑现答案（问句是承诺，不是诱饵）
    comments: 评论区用选择型问句（A还是B？）降低发言门槛，用开放问句（你的情况是？）收集素材
    body: 设问作为段落转轴（答案揭晓前的小停顿），控制每千字不超过2个，避免问句通胀
  platform_implications: 平台的互动组件（投票、提问贴纸）把设问产品化；算法偏好问句标题的点击但惩罚失望停留（完播/跳出反馈）——设问标题的存活率取决于兑现率，标题党问句会被数据自然淘汰。
