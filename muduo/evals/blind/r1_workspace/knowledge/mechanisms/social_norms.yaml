- id: norm_enforcement_reputation
  canonical_name_en: Norm Enforcement and Reputation
  canonical_name_zh: 规范执行与声誉
  aliases:
  - 第三方惩罚
  - altruistic punishment
  - 声誉机制
  domain: social_norms
  definition: 社会规范依赖奖励与惩罚的执行而存在，其中『第三方惩罚』（未受害的旁观者付出成本惩罚违规者）与声誉机制（合作/违规记录影响未来互动）是维持大规模合作的两大支柱；Bicchieri
    的博弈论框架把规范执行嵌入互惠与声誉的博弈结构（S27）。
  core_claim: 规范靠『被看见的执行』而非条文存在：没有可信的奖惩与声誉记录，规范迅速退化为建议。
  mechanism: 公共品实验传统显示：允许成员对搭便车者施加成本惩罚后，合作水平维持并上升——即使惩罚对惩罚者无物质收益（利他惩罚）；惩罚的威慑力来自声誉（未来合作机会的丧失）与群体可见性。执行必须满足可信性（会被真的执行）与相称性（过度惩罚反噬规范合法性）。在小群体中人情与直接互惠即可支撑执行；大规模匿名社群必须依赖制度化声誉系统。
  causal_chain: 违规行为可见 → 第三方惩罚/声誉记录 → 违规成本上升 → 规范遵从提高 → 执行者获得声誉收益 → 执行可持续
  variables:
    inputs:
    - 违规行为的可见性
    - 惩罚机制的存在与可信度
    - 声誉记录系统
    moderators:
    - 群体规模与匿名性
    - 惩罚的相称性
    - 执行者声誉
    - 二阶搭便车（不愿执行）问题
    mediators:
    - 违规的预期成本
    - 声誉关切
    - 群体认同
    outputs:
    - 规范遵从率
    - 合作水平
    - 社群秩序稳定
    - （过度时）寒蝉效应
  evidence:
    supporting:
    - 公共品博弈中的利他惩罚实验传统：允许惩罚后合作水平显著维持——惩罚由受益群体成员付出成本实施（Fehr 与 Gächter，S179）
    - Bicchieri 对规范与互惠、声誉系统关联的理论与实验整合（S27）
    - 网络社群的封禁、信用分等治理实践与理论预测一致
    conflicting:
    - 惩罚在小群体中有效，但大规模匿名环境下二阶搭便车问题使执行难以自发维持
    - 过度惩罚引发逆反与对执行者的反噬
    replication:
    - 惩罚维持合作的实验结果高度稳健（行为经济学重复性最好的发现之一）
    - 真实社群中的外推有效性随平台治理结构而异
    meta_analysis:
    - 行为经济学公共品实验的整合综述支持惩罚对合作的维持作用
  evidence_grade: A-
  boundary_conditions:
  - 违规行为可被观察或记录
  - 惩罚成本可承受且程序被认为公正
  - 社群存在未来互动预期（声誉有长期价值）
  failure_conditions:
  - 完全匿名且无未来互动预期的场景（声誉失效）
  - 执行者不被信任或惩罚过度（合法性反噬）
  - 规范本身缺乏共识基础（执行变成派系斗争）
  common_misinterpretations:
  - 以为公布规则=规范存在——规范的实体是可预期的奖惩，不是文档
  - 把惩罚当唯一手段，忽视声誉奖励对规范的正向维持往往更持久
  ethical_risks:
  - 过度惩罚与公开羞辱（挂人）造成的寒蝉效应
  - 惩罚机制被派系劫持成为清除异见的工具
  examples:
    original_cases:
    - 公共品博弈中的利他惩罚实验传统（Fehr 与 Gächter，S179）
    - Bicchieri《The Grammar of Society》对规范、互惠与惩罚的博弈论整合（S27）
    research_cases:
    - 公共品实验中的利他惩罚研究
    - 惩罚相称性与合作维持的实验研究
    modern_cases:
    - 电商平台的信用分与封号机制
    - 开源社区的 code of conduct 与贡献者声誉体系
    - 社群中的『信用分』、禁言、公示制度
  communication_implications: 内容中展示『规范被执行的证据』（违规被处理的公示、正面行为的公开表彰）比反复重申规则更能维持规范；透明、相称的执行叙事本身是信任内容。
  community_implications: 社群规范治理三件套：可见的奖（荣誉体系）、可信的罚（分级、相称、可申诉）、公开的执行记录；核心风险是二阶搭便车——管理员倦怠导致执行断档，需把执行权分散给可信骨干。
  content_applications:
    body: 在社群公约类内容中呈现真实执行案例（匿名化处理）：『上季度处理了 X 起引流违规』——执行可见性本身就是内容
    comments: 对规范执行做出即时、透明、可申诉的公开回应，把每次处置变成规范传播机会
    title: 标题用规范信号筛选：『本群禁广告，这里只聊真问题』——前置规范提升社群纯净度预期
    cta: 加入类 CTA 明示规范与奖惩：『进来先看规矩，守规矩的都能获得XX』
  platform_implications: 平台的信用分、封禁、举报系统是规范执行的制度化基础设施；算法治理（限流）作为新型惩罚出现，其不透明性引发寒蝉效应争议——平台治理透明度直接决定规范执行的合法性。
