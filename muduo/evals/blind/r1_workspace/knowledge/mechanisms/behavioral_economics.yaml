  - status_quo_bias
  - mental_accounting
  - sunk_cost_fallacy
  source_ids:
  - S01
  - S12
  - S131
  - S129
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Thaler 2015《Misbehaving》（S12，禀赋效应：拥有→估值上升）+ Kahneman 2011（S01，损失厌恶框架）
    effect_size: 拥有同一物品后的估值提升（经典实验，方向稳定）
    replication_status: 禀赋效应为行为经济学最稳健发现之一（Kahneman/Knetsch/Thaler 传统）
    context_dependency: 所有权/参照点/交易情境调制；非市场背景效应减弱
    downgrade_upgrade_reason: 2026-09 实取 S12 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
