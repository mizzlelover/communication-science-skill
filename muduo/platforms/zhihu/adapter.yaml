platform_name: 知乎（Zhihu）
last_updated: "2026-09"
fact_confidence_summary: >-
  信息基础：产品形态（问答结构、话题体系、热榜、盐选）为公开可见规则；
  回答排序与推荐权重为行业共识（官方未完全公开）。
  社区治理与盐选投稿机制已联网核验《知乎原则》及知乎官方发布内容（2026-09 实取），
  认证/冒充治理与盐选投稿路径获官方条文佐证；回答排序权重官方仍未公开。
  所有标注以平台最新公告为准，使用 update_platform_knowledge 流程复核。

