  - id: attention_economics
    canonical_name_en: Attention Economics
    canonical_name_zh: 注意力经济学
    aliases: ["attention scarcity", "注意力稀缺"]
    domain: platform_algorithmic
    definition: 把注意力视为稀缺资源、把内容生产视为对注意力的竞争性收割的经济分析框架。源自 Herbert Simon 的洞见：信息的丰富造成注意力的贫乏。
    core_claim: 内容供给越过剩，单条内容获得注意力的成本越高，注意力的"筛选层"（平台、算法、AI 中介）越掌握定价权。
    mechanism: 人类信息处理带宽恒定（attention_capacity_limits），而内容供给以指数增长，供需失衡使注意力单价上升。平台通过控制分发获得"注意力税"；创作者被迫在"争夺初始注意"上加大投入（更强的钩子、封面、标题）。Tim Wu（S48）把这一逻辑追溯为现代媒介史的主线：从报纸到广播到信息流，商业模式始终是注意力的收割与转售。
    causal_chain: "带宽恒定 + 供给爆炸 → 注意力稀缺加剧 → 筛选层权力上升 → 内容方竞争性内卷"
    variables:
      inputs: ["内容供给总量", "用户可用时长"]
      moderators: ["筛选层效率（算法/AI 是否降低搜寻成本）", "内容品类饱和度"]
      mediators: ["分发权配置"]
      outputs: ["单内容获客成本上升", "头部集中", "钩子军备竞赛"]
    evidence:
      supporting: ["Herbert Simon 1971 关于注意力经济的经典论述", "S48 The Attention Merchants 的商业史论证", "S49 The Shallows 关于深度注意被侵蚀的证据综述"]
      conflicting: ["AI 答案中介可能降低搜寻成本、改变（而非单纯加剧）竞争形态（见 ai_information_intermediaries）", "长尾理论曾预测供给过剩利好小众——实际头部集中度仍高（S80 及其后续修正）"]
      replication: ["稀缺方向稳定成立；结构性后果仍在演化"]
      meta_analysis: []
    evidence_grade: "A-"
    boundary_conditions: ["适用于开放竞争的内容市场", "封闭私域（会员制/订阅制）中注意力交易形态不同", "强品牌内容受稀缺冲击小于无品牌内容（mental_availability 缓冲）"]
    failure_conditions: ["用户总时长停止增长且再分配（存量博弈）时，结论从'变贵'转为'转移'", "新型分发层出现时竞争规则重置"]
    common_misinterpretations: ["'注意力经济'被当成涨粉话术而失去分析含义", "以为稀缺只是'更难'——它同时改变权力结构（筛选层＞生产层）", "忽视注意力质量差异：深度注意与碎片注意价值完全不同"]
    ethical_risks: ["注意力收割逻辑滑向成瘾设计（variable_ratio_reward 滥用）与 dark pattern", "以焦虑为杠杆夺取注意力（反模式库条目）"]
    examples:
      original_cases: ["Herbert Simon 的原始论述（信息消耗注意力）"]
      research_cases: ["Gloria Mark 对知识工作者注意片段化的长期观测（S03）"]
      modern_cases: ["信息流对传统媒体的广告收入转移", "'黄金三秒'军备竞赛"]
    communication_implications: 在注意力稀缺框架下，内容价值公式=被选中的概率×选中后交付的价值。前者靠分发层优化（标题/封面/算法适配），后者靠留存与信任（长期资产）。只优化前者=短期博弈，只优化后者=没有入场券。
    community_implications: 社群的本质是把"竞争来的注意力"转化为"留存的关系资产"（从 Reach 到 Community 的跨越，见 Virality≠Community）。
    content_applications:
      title: "把标题视为注意力市场的定价工具：相关性承诺越具体，点击成本越低"
      opening: "首屏兑现标题承诺，避免透支注意力信任"
      cta: "争夺'下次再来'（关注/收藏）比争夺单次点击更具资产价值"
    platform_implications: 平台即注意力市场：分发模型=市场结构。adapter 层分析某平台注意力竞争强度（content_lifecycle 与流量池机制）。
    related_nodes: ["attention_capacity_limits", "algorithmic_amplification", "creator_incentive_structures", "mental_availability", "ai_information_intermediaries"]
    conflicting_nodes: []
    source_ids: ["S03", "S48", "S49", "S80", S45, "S185"]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Tim Wu 2016《The Attention Merchants》（S48，book 级：注意力收割史/便士报起源）+ Postman 1985（S45，娱乐化）+ Carr 2010（S49，中断系统）"
      effect_size: "注意力商业结构（信息充裕→注意稀缺）；平台以注意转售为收入模式"
      replication_status: "注意力商品化模式多平台重复（媒介史反复模式）；'文化殖民'强判断有争议"
      context_dependency: "广告支撑的免费平台最强；订阅/付费墙平台结构不同"
      downgrade_upgrade_reason: "2026-09 实取 S48/S45/S49 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S48]
      supporting_evidence: [S45, S49, S185, S03, S80]
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: algorithmic_gaming
    canonical_name_en: Algorithmic Gaming
    canonical_name_zh: 算法博弈
    aliases: ["gaming the algorithm", "逆向工程算法"]
    domain: platform_algorithmic
    definition: 创作者、营销方与黑灰产针对平台算法信号进行策略性操纵（标签堆砌、标题党、互赞群、刷量、诱导互动），以及平台随之进行的反操纵升级，构成的持续攻防动态。
    core_claim: 任何可被测量的信号都会被博弈，平台与博弈者的军备竞赛使纯技巧红利持续衰减；可持续优势只能来自信号背后真实价值的兑现。
    mechanism: 算法以代理信号做决策，Goodhart 定律随之生效：当代理指标成为目标，它就不再是好的度量。创作者把资源从"做好内容"转移到"制造信号"（互赞群、诱导、关键词堆砌），信号与真实价值的相关性下降，平台被迫加入新信号/惩罚机制，博弈者再适应——循环往复。技巧性优势在单次博弈中真实存在，但衰减速度由平台反博弈强度决定。
    causal_chain: "算法用代理信号 → 博弈者操纵信号 → 信号失真 → 平台升级检测 → 博弈策略失效 → 新一轮博弈"
    variables:
      inputs: ["算法信号构成（ranking_signal_weighting）", "检测技术强度"]
      moderators: ["平台反博弈投入", "博弈策略可见度", "违规成本（限流/封号）"]
      mediators: ["信号-价值相关性衰减"]
      outputs: ["技巧红利衰减", "平台惩罚风险", "生态信任损耗"]
    evidence:
      supporting: ["SEO 行业关键词堆砌被搜索引擎降权的公开历史（verified_observation）", "平台规则文本对诱导互动/刷量的明令禁止（official_rule 层）", "Goodhart 定律与指标博弈的社会科学讨论"]
      conflicting: ["部分'灰术'在窗口期确实有效——但这不改变其衰减与风险结构", "平台检测能力外部不可知，风险量化困难"]
      replication: ["攻防循环方向稳定；单轮博弈结果不可复现"]
      meta_analysis: []
    evidence_grade: "B"
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions: ["信号可低成本伪造的领域博弈最烈（互动量/粉丝数）", "强交易信号（真实成交）伪造成本高，博弈空间小", "平台早期宽容度高于成熟期"]
    failure_conditions: ["平台批量识别与连坐处罚", "信号本身改为难伪造指标（如真实复购）", "合规成本低于博弈收益时理性选择退出博弈"]
    common_misinterpretations: ["把'别人也在刷'当成正当性论证", "把窗口期红利当成可持续策略写进方法论", "忽视连坐风险：博弈失败惩罚的是整个账号资产而非单条内容"]
    ethical_risks: ["刷量与虚假互动直接构成 fake social proof（反模式库条目）", "误导合作方与平台，法律责任风险（虚假宣传）"]
    examples:
      original_cases: ["早期 SEO 关键词堆砌与 Google 反升级史（公开可考）"]
      research_cases: []
      modern_cases: ["短视频平台打击互赞互评群", "电商虚假交易治理", "AI 生成内容批量号农与平台原创识别的对抗"]
    communication_implications: 方法论定位：短期技巧=指数衰减资产；信号背后真实兑现（标题承诺→内容兑现）=唯一复利项。诊断时若发现账号依赖博弈技巧，应视为风险项而非能力项。
    community_implications: 社群中刷数据（虚假活跃）同理破坏信任基础设施，宁可小而真。
    content_applications:
      title: "标题技巧可用但要与内容兑现闭环，'点开即跳'会被负信号反噬"
      body: "把博弈预算转投内容价值密度"
    platform_implications: 各平台反博弈强度不同（检测技术、处罚梯度），adapter 的 risk_factors 与 known_platform_patterns 记录当前博弈高发区与风险。
    related_nodes: ["ranking_signal_weighting", "engagement_optimization_bias", "trust_signals_content", "bot_amplified_social_proof"]
    conflicting_nodes: []
    source_ids: ["S94"]
    grade_justification:
      independent_studies: "实际支撑为平台规则文本（L1 verified_observation/official_rule 层）与 SEO 降权公开历史、Goodhart 定律讨论；S92/S94/S95 为背景书系非直接证据，S94 仅作平台反操纵治理背景间接来源"
    provenance:
      primary_sources: ['S94']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: platform_power_gatekeeping
    canonical_name_en: Platform Power as Gatekeeping
    canonical_name_zh: 平台权力与守门
    aliases: ["platform gatekeeping", "平台守门人"]
    domain: platform_algorithmic
    definition: 平台通过技术架构、规则设定与算法排序掌握"什么内容被谁看见"的决定权，成为数字时代的新型守门人（gatekeeper）；这一权力如何影响传播结果与公共讨论的机制分析。
    core_claim: 在平台中介的传播中，内容方不直接掌握分发权：触达是平台授予的、可调整的、随时可撤回的——任何传播策略都必须以'平台权力结构'为边界条件。
    mechanism: 传统守门人（编辑、频道）被平台取代，但守门功能未消失而是被算法化、规模化为 van Dijck（S95）所说的平台化基础设施。平台的守门手段包括：分发排序（可见性）、变现资格（经济准入）、功能限制（限流/禁评论）、规则解释（治理裁量）。内容方的传播结果=内容质量×平台准入×算法放大系数，后两项完全在平台掌控中。Gillespie（S94）强调：平台'不是管道'，其排序选择即编辑行为。
    causal_chain: "平台掌握分发基础设施 → 排序与准入规则 = 隐形编辑 → 内容方传播结果受制于平台决策 → 平台规则变动重塑生态"
    variables:
      inputs: ["平台规则与算法设计", "监管环境", "平台间竞争格局"]
      moderators: ["内容方对平台的依赖度（单一平台vs多平台）", "平台商业模式（广告vs订阅）"]
      mediators: ["分发权配置", "变现资格"]
      outputs: ["内容方权力不对等", "生态级内容形态变迁", "传播不确定性"]
    evidence:
      supporting: ["S95 The Platform Society 的平台化理论框架", "S94 Custodians of the Internet 的守门人分析", "S91 Convergence Culture 与 S90 Spreadable Media 对新旧守门权转移的讨论", "S98 Algorithms of Oppression：搜索排序嵌入商业利益与偏见、技术中立是迷思（对象为搜索引擎而非内容审核；自 moderation_governance 移挂的平台把关权力批判）"]
      conflicting: ["去中心化方案（自建私域、邮件列表、多平台矩阵）部分稀释平台权力", "头部创作者获得与平台议价的例外权力", "监管介入（数据/互操作法规）重塑权力边界"]
      replication: ["权力不对称的结构性结论稳定；具体形态随竞争与监管变化"]
      meta_analysis: []
    evidence_grade: "B+"
    boundary_conditions: ["强平台依赖（单一分发渠道）的内容方受影响最大", "多平台矩阵+私域资产结构可对冲", "监管强市场（如中国对平台算法的备案要求）权力边界受约束"]
    failure_conditions: ["平台竞争白热化期（拉新）对内容方让利", "内容方掌握独立触达渠道（邮件/APP/社群）时权力再平衡"]
    common_misinterpretations: ["把平台规则当成稳定环境做长规划——平台规则是设计变量而非自然常数", "以为内容好就能对抗平台结构——'内容为王'在有界分发权下不成立", "把平台扶持期的红利误认为自身可持续能力"]
    ethical_risks: ["平台裁量权不透明的滥用风险（S98 的批判方向）", "内容方反过来迎合平台权力牺牲公共价值"]
    examples:
      original_cases: ["S94/S95 中的平台治理与架构分析"]
      research_cases: []
      modern_cases: ["平台改版导致账号流量断崖的行业普遍现象", "外链限制与私域引流规则的演变", "多平台矩阵+微信私域的对冲结构成为行业标配"]
    communication_implications: 战略层结论：a) 传播资产要沉淀在平台外可带走的形态（品牌认知、私域关系、邮件/社群列表）；b) 单平台依赖度是风险指标；c) 平台规则变动是传播复盘的外生变量，复盘时必须先剥离。
    community_implications: 社群是内容方对抗平台权力的核心对冲资产：关系与信任沉淀在自己可控的容器（微信群/知识星球/邮件）中。
    content_applications:
      cta: "每条内容设计一个'平台外资产沉淀'动作（关注/入群/搜索品牌词）"
      title: "品牌词露出帮助平台外搜索资产积累（mental_availability 联动）"
    platform_implications: 平台 adapter 的 distribution_model 与 risk_factors 即本节点的实例化；跨平台策略（矩阵）是对冲手段。
    related_nodes: ["moderation_governance", "algorithmic_amplification", "attention_economics", "gatekeeping_dynamics", "two_step_flow"]
    conflicting_nodes: []
    source_ids: ["S90", "S91", "S94", "S95", "S98"]
    validation_status: PARTIALLY_VALIDATED
