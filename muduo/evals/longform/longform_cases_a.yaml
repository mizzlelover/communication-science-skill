# Long-form Intelligence 评测案例 A 组
# 共 25 案例：longform_wechat ×10（LFGZ-001..010）/ longform_research ×10（LFRE-001..010）/ longform_methodology ×5（LFME-001..005）
# 覆盖 12 类长文专项问题（delayed_thesis / argument map / 语义压缩 / 润色 vs 结构 / 证据审计 / 认知疲劳 / 概念漂移 / 超长文分块 / 平台错配 / 记忆锚点 / AI 检测 / 类型区分）
# 所有节选均为原创演示数据，不取自任何真实文章；机制 ID 仅取自可用清单；诊断输出须遵守 Macro before Micro / 两遍优化 / 分层输出（先 Top 3 Critical）
- case_id: LFGZ-001
  category: longform_wechat
  difficulty: hard
  input: >-
    用户请求："这篇 8000 字的长文发出去反响一般，帮我看看问题在哪。"
    材料信息：公众号深度文章，全文约 8000 字，共 6 节；前 3 节（约 3200 字）均为行业背景与案例铺垫，全文核心论点第一次出现是在第 3 节末尾（约 37% 处）：
    "私域做得好的公司，往往不是把私域当渠道做的公司——它关乎组织、预算结构与 KPI 设计。"后 3 节才是围绕该论点的论证。（演示数据）
    节选（第 1-2 节开头，约 0-28% 处）：
    "随着数字化浪潮的不断深入，企业的营销环境正在发生深刻变化。流量红利见顶、获客成本攀升，这些词我们已经听得太多，以至于几乎失去了感觉。但变化确实在发生。
    回看过去十年，从 PC 互联网到移动互联网，从平台电商到社交电商，每一次渠道变革都重塑了一批企业的命运。2015 年前后入场的品牌吃到了淘宝的天量流量，2018 年布局抖音的品牌享受了内容红利，而今天，所有人都在谈论私域。
    所谓私域，简单来说就是不依赖平台分发的自有用户池，通常以微信生态为载体。企业微信、社群、小程序、公众号，共同构成了私域的基础设施。某美妆品牌靠社群把复购率做到行业三倍的说法流传很广，某咖啡品牌的小程序订单占比也常被引用。
    但在我们过去两年深度服务二十多家消费品牌的过程中，发现一个被普遍忽略的事实：私域做得好的公司，往往不是把私域当渠道做的公司。这个区别，比大多数讨论触及的要深得多——它关乎组织、关乎预算结构、关乎 KPI 怎么定。这也是本文真正想讲清楚的事。"
  context: {platform: wechat_official, goal: comprehension, audience: "关注私域运营的品牌方从业者"}
  expected_behavior: >-
    必须先完成 Central Thesis Extraction，明确指出核心论点在约 37% 处（第 3 节末）才首次出现、前 3200 字为背景铺垫，判定为 delayed_thesis 型 P0 结构问题；
    必须把 Thesis 前移列为 Top 3 Critical 的第一优先级，给出"论点前置 + 背景压缩为导语"的重排方向，并说明 Entry 阶段（0-10%）每一句都在经受离开决策；
    必须引用 information_foraging / curiosity_gap 解释前三千字流失读者的机制；必须遵守 Macro before Micro：诊断阶段不给句子级改写，先出结构方案并以 Rewrite Options 交用户选择。
    不得先润色语言，不得只建议"开头写得更吸引人"，不得一次平铺全套诊断而不分层。
  key_mechanisms: [information_foraging, curiosity_gap, argumentation_structure]
  scoring_focus: [diagnostic_quality, theory_accuracy, specificity]
  anti_patterns: ["只夸观点好并直接逐段润色", "建议把重要观点提前却定位不到具体位置", "用开头金句方案替代结构重排"]
- case_id: LFGZ-002
  category: longform_wechat
  difficulty: medium
  input: >-
    用户请求："我写了一篇会员体系的长文，感觉干货很多但没人读完，帮我诊断下。"
    材料信息：公众号文章，全文约 6500 字，共 7 节；各节为并列主题（等级设计 / 积分规则 / 权益配置 / 双轨设计 / 系统落地等），全文找不出一句话中心命题，作者自评"信息密度很高"。（演示数据）
    节选（第 3 节，约 35-50% 处）：
    "会员体系有很多值得展开的细节。首先是等级设计，等级间距太大用户没有奔头，太小又失去稀缺感，行业里常见的做法是 4-6 个等级。其次是积分规则，积分的获取与消耗要形成闭环，很多品牌的积分池长期净流入，最终变成财务负债。再次是权益配置，权益要能被感知，某外卖平台的会员权益曾被用户吐槽发了等于没发。此外还有成长值有效期、付费会员与免费会员的双轨设计、储值与会员的耦合方式。
    数据方面，某零售品牌上线会员体系后复购率提升明显；另一家茶饮品牌的付费会员客单价高出普通用户六成；也有反例，某服饰品牌重金搭建会员体系，一年后活跃会员占比不到 3%。
    团队在落地时还涉及系统选型、跨部门协作、客服话术等一系列问题，都需要统筹考虑。"
  context: {platform: wechat_official, goal: comprehension, audience: "零售与会员运营从业者"}
  expected_behavior: >-
    必须先做 Central Thesis Extraction 并明确指出：全文抽不出一句话中心命题 = P0 结构问题，信息多为并列堆叠而非论证；
    必须产出 argument map（中心命题 + claim 清单 + 证据/反例归类），示例化展示如何把并列话题归并到 2-3 个支撑 claim 之下（正反例数据应被组织为对同一 claim 的检验而非罗列）；
    必须引用 argumentation_structure 与 chunking 解释"无结构导致信息无法被组块化记忆与转发"；必须遵守 Macro before Micro 与分层输出（Top 3 Critical 先行）。
    不得逐段点评，不得用"加小标题"替代论证重建，不得评价"干货很足只需微调"。
  key_mechanisms: [argumentation_structure, chunking, information_foraging]
  scoring_focus: [diagnostic_quality, theory_accuracy, actionability]
  anti_patterns: ["逐段点评而不建 argument map", "夸信息全面仅建议加小标题", "一次平铺二十条建议"]
- case_id: LFGZ-003
  category: longform_wechat
  difficulty: medium
  input: >-
    用户请求："这篇自我感觉文笔不错，但编辑说太啰嗦，帮我优化。"
    材料信息：公众号文章，全文约 5500 字，共 5 节；核心观点"信任先于转化"在全文出现 4 次（第 2/3/4/5 节各一次），四处措辞不同、文笔质量相当，各处之间还穿插其他内容。（演示数据）
    节选（该观点在第 2/3/4 节的三处表述）：
    第 2 节："在流量越来越贵的今天，信任成了最稀缺的资源。用户不会因为一条广告就下单，他们会先关注你，看你发的内容，看你怎么回复评论，甚至看你翻车时怎么处理。信任是在这些细节里一点点攒出来的。"
    第 3 节："说到底，转化率的本质是信任水平。一个社群的成交转化高不高，不取决于你发了几次折扣，而取决于成员相不相信你这个人。信任建立之前，一切促销都是催促。"
    第 4 节："我们对 30 个私域社群的观察显示，转化好的社群有一个共同点：运营者在卖货之前，先花了大量时间做信任储备——答疑、做内容、处理投诉。先有信任，后有交易，这个顺序不能颠倒。"
  context: {platform: wechat_official, goal: comprehension, audience: "私域运营从业者"}
  expected_behavior: >-
    必须先运行 Redundancy Detection，识别"信任先于转化"在 4 处的语义重复组（duplicated_claim），并对比四处表述的信息增量（第 4 节含 30 个社群的观察数据、信息密度最高）；
    必须给出语义压缩方案：保留最优一处（含数据的版本），其余删除或降级为过渡句，并说明压缩后不影响全文结构与论证完整性；
    必须引用 processing_fluency / cognitive_fatigue 解释重复被读者识破后的弃读风险；必须遵守 Delete before Rewrite。
    不得把四处重复"润色成四种风格"全部保留，不得机械按字数等比例删减，不得只夸语言流畅而不处理重复。
  key_mechanisms: [information_foraging, processing_fluency, cognitive_fatigue]
  scoring_focus: [diagnostic_quality, actionability, writing_quality]
  anti_patterns: ["把四处重复全部改写成四种风格保留下来", "只夸语言流畅不处理语义重复", "机械按字数比例删减"]
- case_id: LFGZ-004
  category: longform_wechat
  difficulty: hard
  input: >-
    用户请求："这篇差不多写完了，帮我润色一下，语句通顺一点就行，别的不用动。"
    材料信息：公众号文章，全文约 4800 字，共 4 节；开头承诺"把这个问题讲透"，但正文只回答了"内容营销与内容发布的区别是什么"，未交付任何论证框架或判断标准，结尾以"没有标准答案，大家在实践中摸索"收束。（演示数据）
    节选一（第 1 节开头）：
    "内容营销这个词被说滥了，但大部分团队做的其实不是内容营销，是内容发布。两者的区别在于：有没有策略。这篇文章我想把这个问题讲透。"
    节选二（第 4 节结尾）：
    "回到开头的问题。内容营销和内容发布的区别，其实不在于形式，而在于你有没有想清楚为谁、解决什么问题、凭什么持续。想清楚这三件事，很多执行层的困惑会自动消失。至于具体怎么做，每个团队情况不同，没有标准答案，大家可以在实践中摸索适合自己的节奏。"
  context: {platform: wechat_official, goal: authority_building, audience: "市场部负责人"}
  expected_behavior: >-
    必须先做结构诊断再响应"润色"指令：诊断应发现 P0——开头承诺"讲透"但全文未交付中心命题与判断框架，promise→delivery 断裂，属于工作流"禁止跳过诊断直接润色"的触发场景；
    必须明确提示用户：Structural Editing 优先于 Line Editing，当前存在 P0 结构问题，只润色会把问题埋得更深，并征得确认后再继续；
    必须给出两条路径选项（A：先补中心论点与判断框架、再做两遍优化的 Pass 2 润色；B：坚持仅润色，同时书面提示遗留风险）；
    必须引用 argumentation_structure 说明缺陷。不得遵照指令直接逐句润色，也不得未征得确认擅自大改结构。
  key_mechanisms: [argumentation_structure, information_foraging, information_scent]
  scoring_focus: [diagnostic_quality, actionability, specificity]
  anti_patterns: ["遵照润色指令直接逐句改写", "只给 line-level 建议不提 P0 结构问题", "未征得确认直接大改结构"]
- case_id: LFGZ-005
  category: longform_wechat
  difficulty: hard
  input: >-
    用户请求："一篇讲增长方法论的长文，后台好多读者说读到一半就读不下去了，帮我查查原因。"
    材料信息：公众号文章，全文约 6000 字，共 6 节；第 3、4、5 节（约全文 40%-65% 区间）连续为抽象理论论述，无案例、无数据、无小结，术语密度高。（演示数据）
    节选（第 3-5 节开头句连排）：
    第 3 节："增长的前提是理解增长的约束条件。任何增长模型都可以还原为流量、转化、留存、客单四个变量的乘积，而变量之间的二阶交互，决定了局部最优解往往不是全局最优解。"
    第 4 节："在约束条件下讨论增长，必须引入边际分析框架。边际获客成本随投放规模递增的函数形态，与品类决策链长度共同决定了渠道组合的有效前沿。"
    第 5 节："有效前沿的移动依赖组织能力的长期积累。所谓能力租，是指组织在特定环节沉淀的、难以被竞争对手复制的效率优势，它源于学习曲线的时序领先与数据资产的复利效应。"
  context: {platform: wechat_official, goal: comprehension, audience: "增长从业者"}
  expected_behavior: >-
    必须产出逐节认知负荷曲线（LOW/MEDIUM/HIGH/VERY_HIGH），指出第 3-5 节连续 HIGH/VERY_HIGH 违反"禁止连续多节 HIGH"，且该区间正落 Fatigue Zone（40-70%），是"读到一半读不下去"的直接原因；
    必须给出结构补偿处方：把全文最强案例或阶段性结论放入该区、把第二难的概念移出该区、插入小结/转折/新问题，并引用 cognitive_fatigue、working_memory_limits、information_overload；
    必须遵守 Reader State before Word Count：禁止用"把解释写得更详细"对抗疲劳（那是加倍负荷），处方必须是结构性的；输出须分层，先 Top 3 Critical。
  key_mechanisms: [cognitive_fatigue, working_memory_limits, information_overload, information_scent]
  scoring_focus: [theory_accuracy, diagnostic_quality, actionability]
  anti_patterns: ["建议把抽象部分解释得更详细", "给每节配等量案例的平均主义方案", "用语言再生动一点代替结构补偿"]
- case_id: LFGZ-006
  category: longform_wechat
  difficulty: medium
  input: >-
    用户请求："帮我看看这篇讲内容复用的文章还有哪里可以提升。"
    材料信息：公众号文章，全文约 5000 字，共 5 节；内容基本正确、覆盖完整，但通篇没有给方法命名，没有对比、类比或模型图，结尾为通用客套。（演示数据）
    节选一（第 2 节）：
    "内容复用的第一步是盘点。把过去一年发过的内容按主题、格式、数据表现三个维度整理出来，你会发现大量被埋没的素材。第二步是拆解，一篇万字报告可以拆成十几条短内容。第三步是重组，把拆出来的素材按新的主题线重新编排。第四步是分发，不同平台用不同版本。第五步是复盘，记录每一版的传播数据，反哺下一轮拆解。"
    节选二（第 5 节结尾）：
    "总的来说，内容复用不是简单的搬运，而是一套涉及盘点、拆解、重组、分发、复盘的工作方法。每个环节都有自己的注意事项，也需要团队在实践中不断磨合。希望这些内容对大家有帮助，也欢迎在评论区交流你的经验。"
  context: {platform: wechat_official, goal: action, audience: "内容运营从业者"}
  expected_behavior: >-
    必须运行 Memory Design 检查并判定：全文列不出 3-5 个可记住的框架/关键词/对比 = 记忆设计缺失（P1）；
    必须给出 memory_anchors 设计建议 3-5 个（如为五步法命名一个可复述的框架名、建立"搬运 vs 复用"的对比锚点、用一个类比固定"拆解-重组"概念），并说明锚点应在结尾被显式回收；
    必须引用 retrieval_cue_design、schema_formation、gist_vs_verbatim_memory（读者记住的是要旨与结构而非全文）。
    不得以"结尾加一句金句"为唯一方案，不得替作者发明与内容脱节的花哨概念，不得承诺具体记忆率/完读率数字。
  key_mechanisms: [retrieval_cue_design, schema_formation, gist_vs_verbatim_memory]
  scoring_focus: [actionability, theory_accuracy, specificity]
  anti_patterns: ["唯一建议是加一句金句", "发明与内容无关的花哨框架名", "承诺具体记忆率或完读率数字"]
- case_id: LFGZ-007
  category: longform_wechat
  difficulty: medium
  input: >-
    用户请求："帮我评估一下这篇《用户运营全景图》，准备当深度长文发布。"
    材料信息：公众号文章，全文约 7000 字，共 5 节（用户运营 / 内容运营 / 活动运营 / 数据运营 / 组织配套）；每节结构完全相同——"在 XX 时代……变得愈发重要。首先……其次……最后……缺一不可"，节间过渡均为"接下来，我们来看看……"；全文无任何具体数据、案例或操作细节。（演示数据）
    节选（第 2 节与第 3 节）：
    第 2 节："在数字化时代，用户运营变得愈发重要。首先，企业需要建立完善的用户标签体系；其次，企业需要设计精细化的触达策略；最后，企业需要构建闭环的数据反馈机制。这三者相辅相成，缺一不可。接下来，我们来看看内容运营。"
    第 3 节："在注意力稀缺的时代，内容运营变得愈发关键。首先，团队需要搭建清晰的内容选题库；其次，团队需要制定差异化的分发策略；最后，团队需要沉淀可复用的内容资产。这三环环环相扣，缺一不可。接下来，我们来看看活动运营。"
  context: {platform: wechat_official, goal: authority_building, audience: "运营从业者"}
  expected_behavior: >-
    必须运行 AI 生成内容检测并输出命中报告：逐条列出命中类型并给节内证据——每节完全同构（"在 XX 时代…首先/其次/最后…缺一不可"）、空过渡（"接下来我们看看"）、语义重复、零具体证据（无数据/案例/操作细节）；
    必须判定问题在生成层而非润色层，该文不具备直接发布质量；
    必须给出去同构化的结构手术方向（每节按信息类型差异化组织、过渡改为"为什么现在讲下一部分"、补充真实案例或收缩篇幅），并引用 information_scent（同构句式让 scent 失效）与 processing_fluency。
    不得认为"结构工整 = 质量合格"，不得建议局部润色掩盖同构骨架，不得只换修辞不提示 AI 痕迹的发布风险。
  key_mechanisms: [information_scent, processing_fluency, cognitive_fatigue]
  scoring_focus: [diagnostic_quality, theory_accuracy, specificity]
  anti_patterns: ["认为结构工整即质量合格", "只做局部润色掩盖同构", "给每节换不同修辞但不改同构骨架"]
- case_id: LFGZ-008
  category: longform_wechat
  difficulty: easy
  input: >-
    用户请求："这篇结构我自己改过三稿了，内容别动。帮我直接发到小红书做成笔记。"
    材料信息：公众号深度文章《为什么你的品牌做不好内容》，全文约 6000 字，共 5 节；结构完整、论证闭环，作者明确要求不改内容；目标平台为小红书（笔记体量通常为数百字级，重视封面钩子、口语化表达与收藏价值）。（演示数据）
    节选（第 1 节开头）：
    "做不好内容的品牌，问题几乎都不出在文笔上。我们拆过 47 个品牌的公众号，其中 31 个的图文质量高于所在品类的平均水平，但只有 6 个号的数据进入品类前 20%。这个剪刀差说明：内容质量是必要条件，不是充分条件。真正拉开差距的是三件事：选题与搜索需求的匹配度、内容与购买决策的距离、发布的持续性。这三件事都不属于写作，而属于经营。后文我会逐一拆解这三件事，并给出每个品牌的自查清单。"
  context: {platform: xiaohongshu, goal: reach, audience: "小红书泛运营兴趣用户"}
  expected_behavior: >-
    必须尊重"不改内容"的约束，把诊断落点放在平台错配而非文章质量：6000 字论证闭环的公众号深度文与小红书笔记的长度习惯、封面钩子、口语化表达、save value 收藏逻辑不匹配；
    必须给出不改写原文的平台适配方案（如拆为系列笔记、以第 1 节"剪刀差"数据单独成篇做钩子、结尾加导流原文的引用结构、给封面文案方向）；
    必须引用 chunking 与 information_scent 说明小红书场景的分块与 scent 逻辑（平台适配规范：小红书长文 = chunking / 封面 / save value）。
    不得擅自改写用户已定稿的文章，不得把"全文压缩成一篇长笔记"当成唯一方案而不提示其论证损耗。
  key_mechanisms: [chunking, information_scent, retrieval_cue_design]
  scoring_focus: [platform_fit, actionability, diagnostic_quality]
  anti_patterns: ["擅自改写用户已定稿的文章", "建议压成 800 字仍作为一篇笔记发布", "忽略平台规范硬套公众号逻辑"]
- case_id: LFGZ-009
  category: longform_wechat
  difficulty: easy
  input: >-
    用户请求："这篇开头是不是有点平？帮我看看。"
    材料信息：公众号文章，全文约 4500 字，共 4 节，主题为用户增长方法；第 1 节开头为典型宽泛承诺式起笔。（演示数据）
    节选（第 1 节开头）：
    "在市场竞争日益激烈的今天，用户增长成为每个企业都必须面对的课题。增长不仅关乎企业的生存与发展，更关乎企业的未来。本文将系统探讨用户增长的方法与实践，深入分析增长的本质与规律，帮助读者全面了解增长、掌握增长。增长是一个宏大的命题，涉及产品、运营、市场、技术等多个方面，任何一个环节的短板都可能成为增长的瓶颈。接下来，让我们从增长的本质说起。"
    补充信息：第 1 节其余约 300 字继续铺垫增长的重要性；全文第一个具体观点出现在第 2 节——"增长公式里的留存变量，被九成团队跳过了"。
  context: {platform: wechat_official, goal: retention, audience: "泛互联网从业者"}
  expected_behavior: >-
    必须定位问题在 Entry 阶段（0-10%）的承诺设计："系统探讨""全面了解"为无边界承诺，specificity 缺失导致 information_scent 弱，读者无法预期读完的回报；
    必须给出具体诊断证据（逐句指出"在……的今天"式空转、第一具体观点迟至第 2 节）；
    必须给出改写方向（把"留存变量被九成团队跳过"前置为具体承诺 + 回报地图），同时说明本文仅 P1 开头问题、无 P0 结构伤，可在两遍优化的 Pass 2 处理开头文字；
    必须引用 information_scent、curiosity_gap、specificity_effect。不得只说"开头要抓人"而不给具体改法，不得在诊断阶段直接重写整段，不得用加感叹号式方案替代承诺具体化。
  key_mechanisms: [information_scent, curiosity_gap, specificity_effect]
  scoring_focus: [diagnostic_quality, platform_fit, writing_quality]
  anti_patterns: ["只说开头要抓人不给具体改法", "诊断阶段直接重写整段开头", "建议加感叹号增强吸引力"]
- case_id: LFGZ-010
  category: longform_wechat
  difficulty: easy
  input: >-
    用户请求："这篇私域长文我改了很多遍，就差结尾没定，帮我看看怎么收。"
    材料信息：公众号文章，全文约 5200 字，共 5 节；第 5 节（结尾）为对前四节内容的逐条复述加求赞。（演示数据）
    节选（第 5 节）：
    "以上就是本文的全部内容。我们先讲了私域的本质是用户关系的经营，然后讲了私域演进的三个阶段：从流量池到用户池，从用户池到关系池，从关系池到资产池。接着我们讲了做私域的四个关键动作：引流、承接、激活、复购，每个动作都给出了对应的工具和建议。最后我们讲了私域团队的组织配置和考核指标，包括组怎么搭、KPI 怎么定。希望这篇长文能帮你系统建立对私域的认知。如果觉得有用，欢迎点赞、在看、转发三连，也欢迎添加作者微信交流。"
  context: {platform: wechat_official, goal: action, audience: "私域操盘手"}
  expected_behavior: >-
    必须判定结尾为 summary_repetition（逐条复述前四节）且无 closure 设计，并引用 peak_end_rule 说明结尾体验决定整篇的记忆评价；
    必须给出 Closure 类型选择建议（本文适合 Synthesis + Action：给一个可带走的判断或行动清单，并显式回收 2-3 个 memory anchors），说明禁止复述全文的原因；
    可顺带指出 serial_position_effect（近因位置应留给最有力的收束而非清单复述）。
    不得建议"结尾再完整总结一遍更完整"，不得把求三连当作收尾设计的替代品保留而不改造收尾内容。
  key_mechanisms: [peak_end_rule, retrieval_cue_design, serial_position_effect]
  scoring_focus: [theory_accuracy, actionability, writing_quality]
  anti_patterns: ["建议结尾再完整总结一遍", "沿用复述式结尾仅调换语序", "把求三连当成交互设计亮点"]
- case_id: LFRE-001
  category: longform_research
  difficulty: hard
  input: >-
    用户请求："这是我们部门要发布的年度行业研究，帮我审一审严谨性。"
    材料信息：行业研究报告《2025 消费品牌私域增长白皮书》，全文约 9000 字，共 8 节；全文出现"研究表明 / 研究指出 / 研究显示"共 11 处，均未给出具体文献；第 4 节连用 6 个品牌案例支撑同一结论；报告方法节说明数据来自"公开资料整理与项目经验"。（演示数据）
    节选（第 4 节）：
    "私域运营对复购的提升作用已被广泛验证。研究表明，私域用户的复购率显著高于公域用户；另有研究表明，社群运营可以大幅提升用户生命周期价值；还有研究指出，企业微信触达的转化效率是短信的数倍。某美妆品牌通过私域实现了复购率翻倍；某母婴品牌靠社群贡献了四成的 GMV；某家电品牌的企业微信好友人均贡献利润是普通客户的 2.3 倍；某零食品牌、某家居品牌、某服装品牌也都有类似的成功实践。可见，私域运营是决定复购的核心变量。"
  context: {platform: wechat_official, goal: authority_building, audience: "消费行业从业者与投资人"}
  expected_behavior: >-
    必须执行 Evidence Audit：把 11 处"研究表明"标注为 citation decoration（伪引用），把第 4 节 6 个案例标注为 case stacking（案例数量不等于证据强度：无对比组、无效应量、有幸存者偏差），并指出"可见……核心变量"是从相关到因果的 conclusion_leap；
    必须给出降级表述建议（"研究表明"→"公开报道显示 / 我们观察到 / 一种可能的解释是"），并给出补强路径（补可溯源文献，或改为诚实的经验陈述）；
    必须遵守红线：禁止编造具体文献出处来补引用；必须引用 fluency_truth_effect（"研究表明"借流畅感制造可信错觉）、source_credibility_model、anecdote_vs_statistics。
    不得建议"再多找些研究证明"而不问可溯源性，不得替报告虚构参考文献。
  key_mechanisms: [fluency_truth_effect, source_credibility_model, anecdote_vs_statistics]
  scoring_focus: [evidence_accuracy, ethical_safety, theory_accuracy]
  anti_patterns: ["建议补充更多研究证明而不问可溯源", "编造具体文献出处补引用", "默认案例数量等于证据强度"]
- case_id: LFRE-002
