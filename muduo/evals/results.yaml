    Credibility Model，A-，专业性×可信赖性）的信号层，反而被高教育水平读者识别为红旗——评论区质疑就是证据。缺失的 内容信任信号（Trust Signals Content，B）三件套：具体来源（机构/期刊/年份）、效应量与适用条件、对相反
    证据的说明；"高出 40%"这类精确数字无出处比不给数字更伤信任。改法：逐条处理——可挂真实来源的断言 补来源并区分"较强证据/初步发现"；无法找到真实研究支撑的断言（如蓝光致视网膜不可逆损伤）降级为个人
    经验并明示，或直接删除。边界：本 Skill 禁止编造出处——只能要求作者补真实来源，不得代为虚构引用 （"把研究表明改成心理学研究证实"是伪装不是修复）；公众号医疗健康内容属平台合规收紧区（adapter
    risk_factors）。
