- id: hook_model
  canonical_name_en: Hook Model
  canonical_name_zh: Hook 模型（上瘾模型）
  aliases:
  - 上瘾模型
  - 触发-行动-奖励-投入
  - Hooked model
  domain: habit
  definition: Hook 模型（Nir Eyal，S17）是产品实践框架：外部触发启动行动，行动获得多变奖励，投入阶段储存价值并加载下一轮内部触发，循环形成使用习惯。证据等级 D（从业者经验，非实证结论）：Eyal
    的框架是对强化机制的产品化整合，无系统性独立检验。机制上挂钩 variable_ratio_reward（多变奖励）与 endowed_progress_effect（投入与进度）。
  core_claim: 触发-行动-多变奖励-投入的闭环设计可以提高产品使用频率并形成习惯（实践主张）。
  mechanism: 多变奖励对应可变比率强化（结果不可预期维持尝试）；投入阶段让用户存入数据、关系与内容，提高沉没成本与下一触发的个性化程度；随着循环重复，外部触发逐渐内化为内部触发（无聊时想到打开
    app）。该框架描述的产品机制与 habit_loop_cue_routine_reward 的学术描述对应，但增加了投入环节（S17）。
  causal_chain: 外部触发 → 行动 → 多变奖励 → 投入（储存价值） → 内部触发形成 → 循环
  variables:
    inputs:
    - 触发设计
    - 行动门槛
    - 奖励变异性
    - 投入机会
    moderators:
    - 产品价值密度
    - 用户替代品丰富度
    - 平台治理
    mediators:
    - 奖励期望
    - 沉没投入
    - 线索内化
    outputs:
    - 使用频率
    - 留存
    - 内容与关系沉淀
  evidence:
    supporting:
    - Hooked（S17）中的产品案例与作者实践（从业者框架）
    conflicting:
    - 无系统实证检验；作为经验框架，成功率依赖产品价值本身（D 级定性）
    replication:
    - 复现依赖产品与市场条件，学术界基本不将其作为因果理论引用。评级按枚举记 D
    meta_analysis: []
  evidence_grade: D
  boundary_conditions:
  - 适用于高频、低成本、奖励可设计的数字产品场景
  - 奖励需与用户真实价值相关，否则循环在觉醒后崩塌
  failure_conditions:
  - 产品核心价值不足时，钩子只能延缓流失而不能创造留存
  - 用户识别出操纵结构或平台监管介入后
  common_misinterpretations:
  - 把 Hook 模型当科学定律套用；它是 D 级实践框架，与被检验过的强化机制不同层级
  - 以为多变奖励可以替代产品价值；无价值的变奖励只会加速倦怠
  ethical_risks:
  - 成瘾式设计争议：针对注意力与强迫性使用的伦理批评与监管讨论（尤其未成年人保护）
  examples:
    original_cases:
    - Hooked（S17）中社交产品的触发-行动-奖励-投入案例分析
    research_cases:
    - （无独立实证研究；机制成分见 variable_ratio_reward 与习惯文献）
    modern_cases:
    - 短视频无限流、社交 app 的每日签到与内容投入循环
  communication_implications: 内容产品的钩子设计可借鉴其结构，但应以真实价值为锚：多变的只是呈现，不变的是有用性。
  community_implications: 社群把成员投入（内容、关系、身份）沉淀在社群内，是最稳健的『投入阶段』；纯积分钩子最脆弱。
  content_applications:
    body: 系列内容设计投入点（用户提交案例、问题征集被采纳），让受众从消费者变为共同生产者
    sharing: 把分享设计成投入而非转发任务（生成个人化的年度报告）
  platform_implications: Hook 模型是增长团队的通用语言，也是平台『engagement 优化偏差』的意识形态来源；治理层面需要在留存与福祉之间权衡。
