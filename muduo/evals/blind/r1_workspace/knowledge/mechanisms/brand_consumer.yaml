    effect_size: 心智渗透与市场份额高度相关；轻购买者贡献多数增量
    replication_status: 渗透主导增长与双危机规律在多品类扫描数据中稳定复现（Ehrenberg-Bass 传统）
    context_dependency: 以物理可得性（渠道铺货）为前提；高卷入/耐用品品类适用性需谨慎
