  - id: information_overload
    canonical_name_en: Information Overload
    canonical_name_zh: 信息过载
    aliases: [认知过载 —— 与 choice_overload 的区别：选项过载针对决策选项数量，信息过载针对信息总量与维度；机制同族]
    domain: cognitive_load
    definition: 可用信息量超过认知加工能力时出现的决策质量下降、延迟与回避。信息量与决策绩效的倒 U 关系是该领域共识（S158 综述记录的倒 U 溯源为 Schroder, Driver & Streufert 1967；Jacoby 等 1974 的消费者实验系经 S158 综述传统转引，一手 EP 未建）；S49 与 S13 分别从媒介环境与稀缺带宽角度扩展了该机制。
    core_claim: 信息越多不等于决策越好：超过容量后决策质量下降、决策时间延长、放弃率上升。
    mechanism: 比较维度随信息增加而超线性增长，工作记忆不足以维护全比较，satisficing 与启发式接管；稀缺视角下带宽被占满，深思与自控能力同步下降。结果呈现为三种行为：草率决定、推迟决定、彻底回避。
    causal_chain: "信息量超限 → 比较维度爆炸 → 满意化与回避 → 决策质量下降或决策缺失"
    variables: {inputs: [信息总量, 维度数量, 更新频率, "S158 五类过载原因：组织设计/信息性质（模糊性、新颖性、复杂性）/处理信息的人（态度、资质、经验）/任务与流程/信息技术的使用或误用"], moderators: [时间压力, 任务重要性, 受众专长, 过滤工具质量], mediators: [比较成本, 带宽占用], outputs: [决策延迟, 选择回避, 满意化决策, 后悔率, "S158 症状清单：决策质量降低/决策时间延长/满意度降低/慢性压力"]}
    evidence:
      supporting:
        - "S158（Eppler & Mengis 2004）跨学科奠基综述：五类原因（组织设计/信息性质/人/任务流程/信息技术）、症状（决策质量降低/决策时间延长/满意度降低/慢性压力）与原因-症状-对策循环框架"
        - "Jacoby、Speller 与 Kohn 1974 的信息负荷与品牌选择实验（经 S158 综述传统转引，一手 EP 未建；S158 记录的倒 U 溯源为 Schroder, Driver & Streufert 1967）"
        - "S13 的带宽税证据；S49 对数字环境注意力碎片化的分析"
      conflicting:
        - "个体与任务差异大：简单任务几乎不受影响；良好的信息架构能吸收大量信息"
      replication:
        - "倒 U 主关系稳健；具体拐点因任务与人群而异"
      meta_analysis: []
    evidence_grade: B
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions:
      - "有高质量聚合与过滤工具时，过载可转化为可用性"
      - "专家在熟悉领域的信息处理容量远高于新手"
    failure_conditions:
      - "完全无信息同样导致焦虑与决策失败——问题不是少而是匹配"
      - "以删减关键信息解决过载，制造新的误导"
    common_misinterpretations:
      - "给用户全部数据是尊重用户——超过容量的信息是不知情下的剥夺选择权"
      - "把过载误解为内容太多——结构缺失比数量更致命"
    ethical_risks:
      - "用信息过载阻碍理性比较（保险条款、会员协议的文档海战术）"
    examples:
      original_cases:
        - "S13 对稀缺如何压缩带宽的实验与田野研究；S49 对持续在线信息环境的批判"
      research_cases:
        - "消费者实验：信息维度增加到一定程度后，选择质量先平后降、时间上升、弃选增多"
      modern_cases:
        - "电商详情页信息墙；社群一天千条消息导致退群；订阅列表的无限积压"
    communication_implications: 在过载环境里，策展（curation）本身就是内容价值：替受众完成比较与筛选，比提供更多信息更能赢得信任。
    community_implications: 社群规模扩大后的首要矛盾就是信息过载：分频道、摘要置顶、每周精选是必需品而非可选项。
    content_applications:
      title: "标题承诺替读者做减法（一份清单胜过十篇分析）"
      body: "结论前置加分层展开，允许只读第一层"
      opening: "声明本文已过滤了什么（读完这 500 字等于看完 20 篇）"
      cta: "提供可收藏的结构化摘要作为外置记忆"
    platform_implications: 平台的推荐与摘要功能是对过载的工程缓解，但也把过滤权集中于算法（S93 与 S95 的批判视角）；运营者的对策是自建轻量策展层。
    related_nodes: [choice_overload, working_memory_limits, attention_capacity_limits, satisficing, zero_click_information, filter_bubble_echo_chambers, scarcity_mindset]
    source_ids: [S13, S49, S03, S158]
    provenance:
      primary_sources: ['S13', 'S49', 'S03', 'S158']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: seductive_details_effect
    canonical_name_en: Seductive Details Effect
    canonical_name_zh: 引人分心的细节效应
    aliases: [诱饵细节效应 —— 与 extraneous_cognitive_load 的关系：它是外在负荷中由有趣但无关内容造成的研究子类]
    domain: cognitive_load
    definition: 有趣但与学习目标无关的细节（seductive details）反而损害对核心内容的理解与记忆。教育心理学的 Garner、Mayer 等系列实验系统记录了这一反直觉效应。
    core_claim: 增加吸引力的无关细节会降低而非提升核心信息的学习效果。
    mechanism: 无关的生动细节占用工作记忆（外在负荷）、打断核心因果结构的图式建构，并诱导注意从关键结构滑向娱乐片段；受众记住的恰恰是细节而非要点——与 gist_vs_verbatim_memory 连通，被记住的是无关的逐字痕迹。
    causal_chain: "加入有趣无关细节 → 注意与容量被分流 → 因果连贯断裂 → 核心内容理解与记忆下降"
    variables: {inputs: [细节的生动性, 细节与主题的相关性, 细节位置], moderators: [受众先验知识, 学习动机, 细节数量], mediators: [注意分流, 图式连贯性], outputs: [核心内容回忆, 迁移成绩, 完读率]}
    evidence:
      supporting:
        - "Garner 等 1989 前后的教育心理学系列实验"
        - "Mayer 多媒体学习研究中的连贯性原则（coherence principle）"
      conflicting:
        - "效应边界依赖细节的生动程度与呈现位置；部分研究未发现显著损害"
      replication:
        - "主流方向在多媒体学习文献中较稳定；效应大小随情境波动"
      meta_analysis: []
    evidence_grade: B
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions:
      - "与核心因果结构相关的细节不属此类，反而是必要案例"
      - "叙事框架中服务主题的细节无碍（故事不是诱饵细节）"
    failure_conditions:
      - "纯娱乐内容不需要此原则，娱乐本身就是目标"
      - "高动机受众受影响减弱"
    common_misinterpretations:
      - "加个有趣的段子内容就更好传——段子若无信息功能，是在稀释记忆点"
      - "把完读率当学习目标——留住人与讲明白是两回事"
    ethical_risks:
      - "用猎奇细节掩盖证据薄弱（标题党知识内容的结构性套路）"
    examples:
      original_cases:
        - "S65 对故事张力与主题关系的讨论提供了反面参照：细节必须服务意义"
      research_cases:
        - "教学文本实验：加入生动无关段落的组在核心概念测验上更差"
      modern_cases:
        - "科普视频堆表情包与热梗导致主论点失焦；课程里故事过多、干货被稀释"
    communication_implications: 有趣必须为要点服务：要么删掉诱饵细节，要么把细节改造为论证的组成部分（证据案例而非装饰）。
    community_implications: 社群内容策划中，热梗与趣图应作为入口钩子后迅速收束回主题，否则社群记忆点会停留在梗上而不是方法上。
    content_applications:
      body: "每个故事或段子都要回答它服务于哪个论点，答不出就删"
      opening: "钩子之后立刻给出主论点，避免钩子吞掉正文"
      evidence: "用真实案例替代虚构趣闻，兼顾生动与相关"
    platform_implications: 算法奖励的前期留存指标诱导创作者在前段堆砌诱饵细节，形成学习价值与完播率的系统性冲突。
    related_nodes: [extraneous_cognitive_load, germane_load_learning, anecdote_vs_statistics, gist_vs_verbatim_memory, emotional_arousal]
    source_ids: [S40, S69, S65, S159]
    provenance:
      primary_sources: ['S40', 'S69', 'S65', 'S159']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"
