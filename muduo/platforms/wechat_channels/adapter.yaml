platform_name: 微信视频号（WeChat Channels）
last_updated: "2026-09"
fact_confidence_summary: >-
  信息基础：产品形态（推荐/朋友/关注三页签、双按钮设计、与公众号生态打通）
  为公开可见规则；推荐权重与流量构成为行业共识。
  2026-09-08 已实取官方源并登记于 platform_sources（S1-S3）：《微信视频号运营规范》
  （weixin.qq.com 官方协议页，账号注册/内容规范/违规处置）、腾讯官方《微信视频号直播行为规范》
  （support.weixin.qq.com，更新日期 2026-07-20）、腾讯官方《微信视频号直播间低质量内容认定细则》
  （support.weixin.qq.com，更新日期 2026-06-11）。known_platform_patterns 已逐条标注
  evidence_level（L1=官方文档实际读到并支持；L2=已验证观察；L3=行业共识；L4=推测）、
  source_ref 与 last_verified: "2026-09"。原标注 official_rule 但无官方文档直接载明的条目
  已降为 L3 并在 note 注明。所有标注以平台最新公告为准，使用 update_platform_knowledge 流程复核。

