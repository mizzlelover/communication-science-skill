# =============================================================
# 评测集：短视频 / 口播脚本诊断（15 案例，VID-001..VID-015）
# 被测：muduo（人类传播与社群增长引擎）
# 覆盖：开场问题（无钩子/承诺过强/密度过载）、结构问题（无悬念/价值后置/铺垫过长）、
#       信号问题（完播导向缺失/无互动位/无关注理由）、抖音vs B站vs 视频号跨平台对照、
#       "不要改"（分发/账号层归因）、AI 生成感同质化检测
# difficulty 枚举：easy | medium | hard
# scoring_focus 枚举（9 维）：theory_accuracy, evidence_accuracy, diagnostic_quality,
#   actionability, platform_fit, specificity, overclaiming, ethical_safety, writing_quality
# key_mechanisms 仅允许使用知识库机制 ID 清单中的 ID
# 演示数字均已标注"演示数据"；不引用真实品牌具体数据
# =============================================================

- case_id: VID-001
  category: short_video
  difficulty: easy
  input: >-
    用户投稿一份抖音口播脚本求优化。开场原文："大家好，我是做企业培训的王老师，今天想跟大家聊一聊职场沟通里
    一个很多人都会犯的错误。这个错误其实我十年前刚入行的时候也犯过，后来花了很多年才慢慢总结出来……"背景：
    账号1.2万粉（演示数据），最近5条视频平均播放时长约4秒、3秒流失率78%（演示数据）。用户问："帮我看看
    开场怎么改。"
  context: {platform: "douyin", goal: "retention", audience: "泛兴趣职场用户"}
  expected_behavior: >-
    诊断要点：① 开场约10秒是自我介绍加个人经历铺垫，无信息缺口，在抖音全屏沉浸流里等于把滑动否决权交还给
    用户（应引用 adapter 的 opening_role、attention_environment 字段）；② "3秒流失78%、平均播放4秒"（演示数据）
    指向首句 bottom_up_attention_capture 与 curiosity_gap 缺失——自我介绍后置，首句直接给具体冲突画面或反常识
    断言；③ 给出"内容化钩子"改写示例（首句呈现那个典型错误行为的真实场景），而非营销化标题党开场。
    引用机制：bottom_up_attention_capture / curiosity_gap / zeigarnik_effect。
    边界：钩子必须被正文兑现，假钩子引发信任折价与完播下滑（opening_role 边界声明）；完播权重为
    industry_consensus，不得承诺修改后播放量。
  key_mechanisms: [bottom_up_attention_capture, curiosity_gap, zeigarnik_effect]
  material_ref: "DY-A-FAIL-004"
  material_note: "对应真实样本：行业讨论记录的抖音新号低流量视频——'开头平淡（大家好今天我来教大家…）'钩子缺失、每条播放<500（douyin.itotii.com 行业讨论文，见 content_corpus survivorship_note），与本案'自我介绍+个人经历铺垫式开场'同类失败形态"
  scoring_focus: [diagnostic_quality, actionability, platform_fit]
  anti_patterns: ["建议保留先自我介绍再入正题的写法", "承诺修改后的播放量数字", "用'黄金三秒'等玄学话术替代机制解释"]

- case_id: VID-002
  category: short_video
  difficulty: medium
  input: >-
    知识类账号运营者投稿视频并附数据求助。开场承诺："看完这条视频，你就能把副业月收入做到2万以上，方法简单到
    离谱。"正文实际内容是副业的三种常见类型与心态准备，无任何具体方法与收入路径。数据（演示数据）：点击率6.2%
    高于账号均值，5秒留存81%，但30秒留存跌至19%，点赞率正常，评论区出现"标题党""就这？"。用户问："是不是
    结尾不够炸？想加个更狠的结尾。"
  context: {platform: "douyin", goal: "retention", audience: "想搞副业的泛兴趣用户"}
  expected_behavior: >-
    诊断要点：① 拒绝"改结尾"的归因——数据模式（点击高、早期留存高、中段暴跌、评论区标题党反馈）指向
    expectation mismatch：开场承诺与内容兑现断裂（对应 SKILL.md 漏斗"点击高停留低→查 expectation violation"）；
    ② 机制映射：prediction_error（承诺落空产生负预测误差触发滑动）与 trust_calibration（信任折价影响后续转粉
    与转化）；③ 给出二选一路径——降承诺（把承诺改到内容真实交付的层级）或升交付（正文必须含可执行方法），
    并说明判断标准取决于现有素材能支撑哪边；加码结尾只会加剧错配。
    边界：数据为用户自述演示数据；完播权重为 industry_consensus，不引用具体权重百分比；不承诺数据改善幅度。
  key_mechanisms: [prediction_error, trust_calibration, goal_gradient_effect]
  material_ref: "CASE-FAL-002"
  material_note: "对应真实案例：一般化标题党生命周期——'点开即失望'的预期违背逐次累积、评论区'又被骗'常态化、平台降权后分发崩塌（cases.yaml CASE-FAL-002，素材来自中央网信办标题党治理公告等，见 original_material），与本案'高点击低留存+评论区标题党反馈'同型"
  scoring_focus: [diagnostic_quality, theory_accuracy, actionability]
  anti_patterns: ["顺着用户思路只优化结尾", "建议更强的开场承诺", "把标题党说成无损策略"]

- case_id: VID-003
  category: short_video
  difficulty: medium
  input: >-
    口播脚本开场原文："2026年做个人IP，一定要搞懂三个模型：定位模型、流量模型、转化模型。定位模型又分四步：
    赛道选择、人设锚点、内容矩阵、差异化壁垒；流量模型分公域私域两条链路，公域里又有推荐流、搜索流、关注流
    三层结构……"前20秒无画面停顿、无案例、连续输出约160字概念（演示数据），目标受众是刚起步的个人IP新手。
    用户反馈："感觉全是干货但记不住。"
  context: {platform: "douyin", goal: "comprehension", audience: "个人IP新手"}
  expected_behavior: >-
    诊断要点：① 开场高密度概念轰炸超出 working_memory_limits（工作记忆组块上限），新手无既有图式，概念全部
    变成 extraneous_cognitive_load；② "全是干货但记不住"是 information_overload 信号而非内容质量缺陷，
    不得把"干货多"当优点肯定；③ 建议单条只交付一个组块（如只讲人设锚点），其余系列化承接——引用 adapter
    content_lifecycle（抖音内容是流量事件，长青需系列化与主页沉淀弥补）；④ 每个概念配具体案例提升
    germane_load_learning（帮助加工而非堆积）。
    边界：密度合适与否依赖受众先验知识——对老手同样密度可接受；不建议为降密度注水拉时长（完播反而受损）。
  key_mechanisms: [working_memory_limits, information_overload, germane_load_learning]
  material_ref: "XHS-B-LOW-002"
  material_note: "对应真实内容样本：小红书报告类干货笔记——'33页报告｜看懂数字人营销商机'正文为观点罗列、无故事化无案例落地，收藏79>赞57（coralr-1 数据集 2024-10 快照，见 content_corpus survivorship_note），与本案'全是干货但记不住'同型"
  scoring_focus: [diagnostic_quality, theory_accuracy, actionability]
  anti_patterns: ["把'干货多'直接夸成优点", "建议同一条里继续堆叠更多案例", "忽视受众知识水平差异一刀切"]

- case_id: VID-004
  category: short_video
  difficulty: medium
  input: >-
    一条"如何快速看懂上市公司财报"的抖音口播脚本（约3分钟，演示数据）。结构：第一段直接说"看财报主要看三个
    指标：毛利率、现金流、负债率"，随后用约2分钟逐一定义讲解，结尾是"今天就讲到这里，喜欢的朋友点个关注"。
    用户自评"内容很扎实、很专业"，但平均播放完成度23%（演示数据）。
  context: {platform: "douyin", goal: "retention", audience: "投资小白与泛兴趣用户"}
  expected_behavior: >-
    诊断要点：① 结构为结论先行加平铺定义，全片无信息缺口与递进钩子，中段极易流失；抖音完播导向
    （adapter interaction_signals：完播率最重信号方向，industry_consensus）下此结构吃亏；② 建议保留"三指标"
    骨架但重构叙事序——用真实感案例的异常现象开场（如"这家公司利润翻倍却发不出工资"的演示情境）制造
    curiosity_gap，再逐层揭示三指标如何解释它；③ 每4-5秒一次信息更新（adapter known_platform_patterns 的
    节奏压缩条目），结尾用 peak_end_rule 做回收；④ 指出结尾"点个关注"话术空洞，应给出关注理由。
    边界：结论先行不是绝对错误——在搜索与教学语境（B站、知乎）它是优点，此处按平台目标适配；完播权重为
    industry_consensus。
  key_mechanisms: [suspense_structure, curiosity_gap, peak_end_rule]
  material_ref: "DY-A-MED-007"
  material_note: "对应真实样本：剧集官抖'高播放低点赞'——播放约500万仅6万赞（互动率约1.2%），无有效物料、未透剧情（豆瓣『观众席』社群观察帖，见 content_corpus survivorship_note），与本案'内容扎实但结构平铺无钩子'同型"
  scoring_focus: [diagnostic_quality, platform_fit, actionability]
  anti_patterns: ["认定'结论先行'在任何平台都错", "建议增加无关段子充时长", "把完播率说成官方公开权重"]

- case_id: VID-005
  category: short_video
  difficulty: medium
  input: >-
    用户投稿"5个免费自学网站"口播脚本。前80%篇幅在讲"为什么要自学""自学失败的三种原因"，最后一个部分才
    给出5个网站名单且语速很快带过。数据（演示数据）：平均播放时长约为总时长一半，收藏率低于同类均值。用户
    困惑："精华都在最后了，为什么大家不看完？"
  context: {platform: "douyin", goal: "save", audience: "学生党与自学爱好者"}
  expected_behavior: >-
    诊断要点：① 价值后置加尾部快速带过是双重浪费——serial_position_effect：系列信息中首尾位置记忆与注意
    最优，本片把价值放在内部靠后且弱呈现；② 收藏导向内容需让核心价值前置可感知：名单首条即给出最强的1个并
    演示用法，其余用"第2个更冷门但更好用"式递进钩子维持完播（goal_gradient_effect：可感知的进展推进）；
    ③ 结尾回收汇总强化 peak_end_rule；④ 收藏型内容应设计"暂停截图"节奏点（引用 adapter user_behavior 与
    comment_role 语境）。
    边界：不承诺收藏量；清单类内容仍需满足信息增量要求，避免为前置而空洞化名单。
  key_mechanisms: [serial_position_effect, goal_gradient_effect, peak_end_rule]
  material_ref: "XHS-A-HIGH-001"
  material_note: "对应真实内容样本：小红书高收藏工具教程爆款——'Claude Code 零基础终极教程！'收藏≈172,097>点赞≈117,895，'对我有用先存着'工具化使用（Apify 抓取示例输出，见 content_corpus survivorship_note），作本案收藏导向清单内容的对照（收藏价值需前置可感知）"
  scoring_focus: [diagnostic_quality, actionability, theory_accuracy]
  anti_patterns: ["建议把名单藏进评论区引导互动", "只说'把重点放前面'而不给结构方案", "承诺收藏率数字"]

- case_id: VID-006
  category: short_video
  difficulty: easy
  input: >-
    口播脚本"新手怎么挑笔记本电脑"，总长约3分钟（演示数据）。第0-45秒讲笔记本电脑二十年发展史、行业格局与
    厂商恩怨，第46秒才进入选购参数。用户说："我觉得背景知识对新手有用，不忍心删。"
  context: {platform: "douyin", goal: "retention", audience: "准备买电脑的新手"}
  expected_behavior: >-
    诊断要点：① 用户带着"怎么挑"的任务进来（jobs_to_be_done），45秒与任务无关的背景是 extraneous_cognitive_load，
    叠加 attention_capacity_limits 在开头即崩完播；② 建议把背景压缩到5秒以内或转为字幕侧信息，历史内容拆成
    独立一条满足爱好者（走系列化，呼应 adapter content_lifecycle）；③ 开头直接进入"第一个决定看哪三个参数"的
    具体交付。
    边界：不是所有背景都该删——当背景本身构成悬念或身份共鸣时可保留但需压缩；肯定"背景有用"的判断在图文、
    长视频与搜索场景成立，此处是平台与目标差异而非用户品味错误。
  key_mechanisms: [extraneous_cognitive_load, attention_capacity_limits, jobs_to_be_done]
  material_ref: "XHS-B-LOW-006"
  material_note: "对应真实内容样本：小红书汽车科普低互动笔记——'无人车发展史|看中国崛起'编年体知识盘点+宏大叙事、无当下问题钩子、无个人视角（coralr-1 数据集 2024-10 快照，见 content_corpus survivorship_note），与本案'前45秒讲行业史与厂商恩怨'同型"
  scoring_focus: [diagnostic_quality, actionability, specificity]
  anti_patterns: ["为省时长粗暴建议砍半而不给取舍逻辑", "建议开头加夸张营销式钩子", "否定背景知识的一切价值"]

- case_id: VID-007
  category: short_video
  difficulty: hard
  input: >-
    "冷门历史故事"账号（5万粉，演示数据）投稿脚本：单条完整讲述一个历史事件，全程无分段钩子、无中途悬念
    更新，结尾无回收。账号数据（演示数据）：平均播放时长除以总时长为31%，点赞率4.5%，评论率0.8%。同行同类
    视频时长更短但完成度55%（演示数据）。用户问："我的内容比同类账号详细多了，为什么推不动？"
  context: {platform: "douyin", goal: "reach", audience: "历史爱好者与泛兴趣用户"}
  expected_behavior: >-
    诊断要点：① 不做"细节多等于内容好"的单一归因：对比数据把瓶颈指向完播侧——31%对55%的完成度差距在推荐
    系统里被放大（adapter recommendation_model：完播/复播/互动率为核心加权信号；recommendation_feedback_loop：
    数据差→曝光少→更差）；② 机制映射：无分段钩子导致中段流失（zeigarnik_effect 缺口管理缺失）；③ 建议不
    动选题与详细度偏好，改结构：三分钟拆成"事件反常起点→两段递进反转→结尾回收"，每段留小缺口；④ 可测试
    同一故事的60秒压缩版做变量隔离。
    边界：明确完播权重为 industry_consensus 黑箱，禁止引用任何具体权重百分比；不承诺"改完就起量"。
  key_mechanisms: [ranking_signal_weighting, zeigarnik_effect, recommendation_feedback_loop]
  material_ref: "DY-A-FAIL-001"
  material_note: "对应真实样本：剧集官抖'高曝光-低互动'失败形态——曝光/在看数千万级、点赞仅数万数千，社群诊断'1️⃣不搞笑 2️⃣不抽象 3️⃣无拉扯 4️⃣无记忆：无有效物料'（豆瓣『观众席』讨论帖，见 content_corpus survivorship_note），与本案全程无分段钩子、无中途悬念同型"
  scoring_focus: [diagnostic_quality, platform_fit, evidence_accuracy]
  anti_patterns: ["引用'完播率权重占40%'等具体数字", "断言改完必爆", "忽略复播与转粉等其他信号"]

- case_id: VID-008
  category: short_video
  difficulty: easy
  input: >-
    口播脚本"租房避坑指南"（60秒，演示数据）：干货密度高、从头讲到尾，无任何提问、无留白、无可争论的取舍点，
    结尾直接"祝大家租房顺利"。数据（演示数据）：点赞率5%、评论率0.2%（同类均值约1.5%）、分享率正常。用户问：
    "评论为什么没人说话？"
  context: {platform: "douyin", goal: "engagement", audience: "一线城市租房年轻人"}
  expected_behavior: >-
    诊断要点：① 脚本没有评论触发器——无提问、无留白、无可争论取舍点，adapter comment_role（热评文化：评论区
    是内容的延伸现场）与 known_platform_patterns 的评论区钩子条目完全未被利用；② 引用 adapter
    interaction_signals：评论权重高于点赞（industry_consensus），低评论会拖累分发；③ 建议在内容里自然埋一个
    "两难取舍"（如"地铁远500米省800块，你选哪边"）或留一个可补充的真实经验缺口，并用置顶评论开话题。
    边界：刻意留错引战短期拉评论但损伤专业信任（comment_role 边界声明）；低评论不单一归因于受众。
  key_mechanisms: [rhetorical_question_engagement, social_proof, emotional_arousal]
  material_ref: "XHS-A-MEDIUM-006"
  material_note: "对应真实内容样本：小红书互动型笔记正面对照——'姐妹们哪支口红用得最频繁？'提问式互动钩子，评论901≈点赞80%（Apifox 接口文档真实响应示例，见 content_corpus survivorship_note），与本案'无提问无留白无评论触发器'形成对照"
  scoring_focus: [diagnostic_quality, actionability, platform_fit]
  anti_patterns: ["建议故意写错内容引战", "建议'评论区扣1'式空洞互动", "把低评论单一归因于受众不表达"]

- case_id: VID-009
  category: short_video
  difficulty: medium
  input: >-
    美食探店账号（8万粉，演示数据）：单条数据不差（完播35%、点赞率6%，均为演示数据），但月涨粉仅300且取关率
    偏高（演示数据）。抽查脚本发现：每条结尾都是"这期就到这里，我们下期见"；近期三条内容主题跳跃（火锅探店/
    减脂餐/咖啡测评），无统一人设口头禅、无固定栏目。用户问："要不要在结尾加'关注我领优惠券'？"
  context: {platform: "douyin", goal: "follow", audience: "同城美食消费人群"}
  expected_behavior: >-
    诊断要点：① 单条价值高但账号预期价值弱——对应 SKILL.md 漏斗"观看高关注低→查定位连贯性与
