- id: goal_setting_effectiveness
  canonical_name_en: Goal-Setting Effectiveness
  canonical_name_zh: 目标设定效应
  aliases:
  - 目标设定理论
  - goal-setting theory
  domain: motivation
  definition: Locke 与 Latham 的目标设定理论：具体且困难（且被接受）的目标比『尽力而为』或模糊目标带来更高绩效。注意 SMART 是实践口诀而非实证理论，其核心实证是『具体+困难+承诺+反馈』四要素。
  core_claim: 在个体接受目标且获得反馈的条件下，具体而具挑战性的目标系统性地提升绩效。
  mechanism: 具体目标提供明确的达标标准，把注意导向任务相关活动；困难目标动员更多努力并延长坚持；反馈闭环让个体校准策略；承诺（自我设定或参与设定）决定目标被翻译成行动的程度（S14、S20）。
  causal_chain: 具体+困难目标（被接受） → 注意聚焦与努力动员 + 反馈校准 → 绩效提升
  variables:
    inputs:
    - 目标具体性
    - 目标难度
    - 承诺度
    - 反馈频率
    moderators:
    - 任务复杂度
    - 自我效能
    - 目标来源（指派/参与）
    mediators:
    - 注意聚焦
    - 努力动员
    - 策略搜索
    outputs:
    - 任务绩效
    - 坚持时长
    - 完成率
  evidence:
    supporting:
    - Locke 与 Latham 数十年研究计划与综述：具体困难目标优于模糊目标（研究传统共识，一手 EP 未建）
    - 组织与管理领域大量现场研究（文献方向；S20 政策场景中仅有应用讨论，不含目标设定主效应原文）
    conflicting:
    - 『Goals Gone Wild』方向的批评：过窄目标诱发不道德行为、损害复杂任务的探索与学习（理论争论，Ordóñez 等方向）
    replication:
    - 主效应复制稳健的说法基于研究传统共识（一手 EP 未建）；在复杂、探索性任务上的负面效应同样被记录。评级按枚举记 C
    meta_analysis:
    - 组织心理学中的元分析支持目标难度-绩效关系（在承诺与反馈条件下）
  evidence_grade: A-
  boundary_conditions:
  - 个体接受目标、具备基本能力且能获得进展反馈
  - 任务相对直接；复杂学习任务需配合学习目标（掌握目标）
  failure_conditions:
  - 目标过窄导致指标游戏（只为数字服务、损害质量与协作）
  - 目标被指派且无承诺来源，或难度远超能力引发放弃
  common_misinterpretations:
  - 把 SMART 当成经过验证的理论逐字执行；SMART 是记忆口诀，核心变量是具体性与难度
  - 以为目标越公开越有效；公开对承诺高者有效，对能力不足者只是公开的失败
  ethical_risks:
  - 指标压力诱发数据造假与损害用户利益的达标行为（指标游戏）
  examples:
    original_cases:
    - 行为公共政策文集中关于目标与绩效管理的讨论（S20）
    research_cases:
    - Locke 与 Latham 的目标设定研究计划；组织现场的目标难度实验
    modern_cases:
    - 内容团队用『每周一篇深度稿』替代『好好写』；社群运营的季度活跃目标
  communication_implications: 对用户承诺目标时给出具体可检验的形式（『30 天读完 4 章』），并提供进度反馈机制，而非只有口号。
  community_implications: 社群挑战设计四件套：具体目标+适度难度+进度反馈+群体承诺，缺一而效果锐减。
  content_applications:
    title: 把行动目标写成数字与期限：『21 天，每天 15 分钟』
    body: 内容内嵌自查清单与进度校准，帮助受众获得反馈
  platform_implications: 平台的成就系统即目标设定的规模化实施；难度分层不当会造成精英垄断或大面积放弃。
  related_nodes:
  - implementation_intentions
  - self_efficacy
  - goal_gradient_effect
  - commitment_consistency
  - commitment_escalation
  source_ids:
  - S14
  - S20
  - S118
  - S196
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Locke & Latham 目标设定理论一手 EP 未建；S118（Deci & Ryan 2000）是目标内容×动机调节的不同研究纲领，不支撑『具体困难目标→绩效』主效应；S14（SDT）与
      S118 仅支撑『自主/内在目标内容→持续性』部分，S20 为政策手册辅助；2026-09-09 一手 EP 已建（S196）
    effect_size: 具体困难目标提升绩效（Locke & Latham 元分析方向）——内容来自记忆蒸馏，无一手 EP 载明；自主目标提升持续性有 S14 支撑
    replication_status: 主效应复制为研究传统共识（未建包）；自主性调制持续性有 S14 支撑（SDT 多领域重复）
    context_dependency: 目标具体性/难度/反馈/自主支持调制
