- id: peak_end_rule
  canonical_name_en: Peak-End Rule
  canonical_name_zh: 峰终定律
  aliases:
  - 峰终效应
  - peak-end —— 与 serial_position_effect 的区别：峰终针对整段经历的事后评价与时长忽略，系列位置针对序列材料的即时回忆
  domain: memory
  definition: 对一段经历的回顾性评价主要由峰值时刻与结束时刻决定，经历时长几乎被忽略（duration neglect）。Kahneman 与 Redelmeier 的医疗程序研究确立了这一记忆自我与体验自我的分离。
  core_claim: 记忆自我用峰终重构评价，体验自我的逐时感受在回顾时基本丢失。
  mechanism: 回顾时人依赖代表性时刻（最痛、最爽）与结局做快速重构，而非逐点求和；时长在评价中权重极低，于是更长的痛苦未必换来更差的回忆，更好的结尾可以改写全程记忆。
  causal_chain: 经历展开 → 峰值与终点被采样 → 忽略时长 → 回顾性评价由峰终决定
  variables:
    inputs:
    - 峰值体验强度
    - 结束时刻体验
    moderators:
    - 经历类型
    - 情节边界清晰度
    - 个体差异
    mediators:
    - 代表性时刻重构
    outputs:
    - 回顾性评价
    - 重购与复访意愿
    - 口碑推荐
  evidence:
    supporting:
    - Redelmeier 与 Kahneman 1996 的医疗程序实时与回顾评分研究（经典文献，未建包；S153 EP 明示结肠镜研究非本篇）
    - 冷加压实验的时长操纵研究（S01 论述；S153 EP 载 1993 冷压实验，仅摘要级支持）
    conflicting:
    - 边界依赖：部分持续不适的体验中时长确实影响评价；个体与情境差异明显
    replication:
    - 核心模式被多种经历类型复制，但作为普适定律的表述过强
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 适用于有明确情节边界的经历（一次服务、一次活动、一段剧情）
  - 对连续弥散的慢性体验适用性弱
  failure_conditions:
  - 靠结尾彩蛋掩盖全程糟糕——当预期被识破，结尾反噬信任
  - 平淡无峰的漫长好体验被低估，公平体验得不到公平记忆
  common_misinterpretations:
  - 最后一分钟营销等于全部体验设计——没有峰值的平淡结尾救不了体验
  - 把峰终理解成只做结尾——峰值通常是投入最重的那个环节
  ethical_risks:
  - 演出式客服：结尾热情服务掩盖核心承诺未兑现
  examples:
    original_cases:
    - S01 的结肠镜与冰水实验（结肠镜 1996 研究为经典文献，未建包，S153 EP 明示非本篇）
    research_cases:
    - 医疗程序研究：实时疼痛积分与回顾评价相关性弱，与峰值及终末疼痛相关性强
    modern_cases:
