  - "故事模拟世界（Neverland）：故事让我们在安全的世界中演练、学习、体会，强化道德行为、凝聚社群、定义文化"
  - "故事塑造记忆/身份/社会生活：我们以叙事组织自我经验（自我叙事）、以故事理解他人（心智解读）"
  - "故事普遍存在于一切人类活动：艺术、文学、梦、游戏、幻想、体育（'体育是故事的脊椎'）"
method: "演化视角通俗科学（叙事神经/心理/文学综合，九章）"
results: "（通俗科学）'叙事人'（homo narrans/fictus）的流行科学经典"
