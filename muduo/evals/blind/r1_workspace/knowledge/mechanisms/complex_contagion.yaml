- id: wide_bridges
  canonical_name_en: Wide Bridges
  canonical_name_zh: 宽桥
  aliases:
  - 桥接冗余
  - bridging redundancy
  domain: complex_contagion
  definition: 宽桥（wide bridges）指连接两个社群的多条并行关系通道：不仅「跨出去了」（bridge，桥），而且「跨得宽」（两个群体间存在多条相互冗余的连接）。Centola 与
    Macy 提出：复杂传染要跨过群体边界，需要的是宽桥——单条窄桥（一条弱连接）足以传播信息，但不足以传播需要社会支持的行为。
  core_claim: 跨群体传播有社会风险的行为，依赖两个群体间并行连接的冗余度（桥的宽度），而非单条长程连接的存在。
  mechanism: 窄桥把个体从熟悉的强化环境带出后暴露在孤立状态：桥远端的人没有共同朋友为其背书，采用的成本无人分担，传播熄火。宽桥则在边界两侧维持多条通道，跨界的采用者身边仍有多个已采用的同伴（强化不断线），行为才能带着支持网络一起过桥。宽桥通常由强连接群与跨群弱连接共同构成——这不是对
    Granovetter 弱连接的否定，而是对其适用范围（信息）的限定：宽桥概念将其扩展到有社会成本的行为。
  causal_chain: 群体间多条并行连接 → 跨界采用者仍被已采用同伴包围 → 强化不断线 → 行为跨边界持续传播
  variables:
    inputs:
    - 两群体间并行连接的数量与强度
    moderators:
    - 连接的多样性（不同子群各有一桥）
    - 跨界者的中心位置
    mediators:
    - 跨界后的强化存续
    - 边界信任传递
    outputs:
    - 行为跨群传播成功率
    - 跨圈层扩散广度
  evidence:
    supporting:
    - Centola & Macy 2007 的宽桥理论：基于扩散模型仿真对高社会成本行为传播的再解释，并讨论其对社会运动参与等历史案例的含义（经典论文；库外无 EP，经 S58 转述，EP 待建）
    - 网络实验与仿真均显示聚类跨群结构优于随机长程连接对行为传播的作用（后续研究方向一致）
    conflicting:
    - 对纯信息类传播，宽桥无额外优势：窄桥更快更省（与弱连接优势并不矛盾，属于不同传染类型）
    replication:
    - 宽桥逻辑在受控网络实验中被重复支持；田野层面对「桥宽」的直接测量较少
    meta_analysis: []
  evidence_grade: B+
  boundary_conditions:
  - 针对复杂传染（有社会成本的行为）成立；信息类传播用窄桥即可
  - 桥的宽度指关系冗余而非粉丝数：一个 KOL 单点跨群是窄桥，多个普通成员各自跨群才是宽桥
  failure_conditions:
  - 把宽桥误做成「一个大 V 进驻」：单点跨群无法携带强化网络，行为传播依旧熄火
  - 两群体间并行连接全部依赖同一中介（去中介化风险），桥宽是虚假的
  common_misinterpretations:
  - 「宽桥推翻了弱连接理论」——不是推翻而是限定范围：弱连接传递信息（简单传染），宽桥传播行为（复杂传染），Granovetter 自己的框架本就区分信息流与影响流
  - 把 weak_ties_strength、strong_ties_support 与 wide_bridges 看作竞争理论：三者是分工——弱连接给信息、强连接给支持、宽桥让支持跨过边界
  ethical_risks:
  - 刻意在异质群体间制造宽桥可用于渗透式影响力操作（在对方社群内培养多重内应）
  examples:
    original_cases:
    - Centola & Macy 论文中对高社会成本行为为何难以跨窄桥传播的理论案例讨论
    research_cases:
    - 受控网络实验中「聚类跨群」条件的行为传播优势（《How Behavior Spreads》）
    modern_cases:
    - 品牌同时在多个妈妈群各培养几位真实用户（多桥并行），比赞助一位头部妈妈博主转化更稳
    - 高校社团间联合活动的「多校各来几人」模式使参与习惯跨校传播
  communication_implications: 跨圈传播行为类目标时，做「多桥铺设」而非「单点爆破」：在目标圈层内同时建立多个真实连接点（多位小 KOC、社群互访），让每次跨界都有同伴支持。
  community_implications: 社群增长中的「拉新团建」应成对/成组进行：新成员带着已有伙伴进入新社群（宽桥），比单人空降留存高得多；社群合作互换的是「桥宽」而非「曝光」。
  content_applications:
    body: 面向跨圈层受众的正文同时回应两侧语境（旧群体的质疑 + 新群体的门槛），不让跨界读者感到孤立
    narrative: 讲述「一群人一起跨进新领域」的故事，而非孤胆英雄叙事，示范宽桥结构
    sharing: 发起「带上一位同伴」的参与机制，把分享行为设计成宽桥生成器
    comments: 在跨圈内容下安排多位圈内成员友好迎新，让跨界评论者被已采用者包围
  platform_implications: 平台转发是窄桥机制（一跳直达但无支持网络）；群聊、协作功能等「多对多跨群」空间才承载宽桥——行为类增长策略必须利用后者（原则性判断）。
