  grade_justification:
    independent_studies: Schacter 2001《The Seven Sins of Memory》（S05，七宗罪分类/omission+commission/适应性副产品）
    effect_size: 七宗罪为记忆失误的系统分类（广泛沿用的组织框架）
    replication_status: 七宗罪分类广泛沿用（1999 Am Psychol 论文+专著）
    context_dependency: 各宗罪诱因不同（时间/负荷/暗示/偏差等）
