# prediction_surprise — 预测与意外（Prediction & Surprise）：认知是预测机器，意外是更新的入口
domain: prediction_surprise
nodes:
- id: prediction_error
  canonical_name_en: Prediction Error
  canonical_name_zh: 预测误差
  aliases:
  - 预测偏差信号
  - prediction error signal —— 与 curiosity_gap 的区别：预测误差是学习与注意的信号量，好奇缺口是信息层面的动机状态
  domain: prediction_surprise
  definition: 预测与实际输入的偏差信号（prediction error）。预测加工理论（S10）把认知刻画为预测-比较-更新的循环；在奖赏领域，Schultz 的研究（S145，abstract_only）确立多巴胺神经元编码奖赏预测误差——误差信号驱动学习与追求（wanting），多巴胺≠愉悦本身（S145
    边界条件）。
  core_claim: 认知系统的基本运转方式是预测、比较与按误差更新；误差的大小与方向决定注意、学习与情绪反应。
  mechanism: 大脑层级生成对输入的预测，只有预测失败的部分作为误差向上传播并更新模型（S10）；奖赏域中，正误差触发多巴胺信号驱动学习与追求（wanting），负误差引发警觉与重新评估。没有误差就没有更新——完全可预测的刺激被抑制，完全不可理解的误差被放弃。
  causal_chain: 生成预测 → 与实际输入比较 → 误差信号 → 模型更新与注意定向
  variables:
    inputs:
    - 预测强度
    - 实际结果
    - 误差可理解性
    moderators:
    - 先验质量
    - 情境不确定性
    - 个体开放性
    mediators:
    - 多巴胺信号
    - 注意定向
    outputs:
    - 学习速率
    - 惊讶反应
    - 兴趣或警觉
  evidence:
    supporting:
    - Schultz 关于多巴胺神经元编码奖赏预测误差的系列研究
    - S10 对预测加工框架的综合论证
    conflicting:
    - 误差需要落在可理解范围内才引发学习；完全无法消化的误差触发回避或焦虑
    replication:
    - 奖赏预测误差的神经证据稳健；预测加工作为统一框架仍属理论综合而非单一实证结论
    meta_analysis: []
  evidence_grade: A
  boundary_conditions:
  - 误差须可理解、可归因才转化为学习
  - 预测强度越高，同等误差的信号越强（可预测性是惊讶的前提）
  - 多巴胺≠愉悦本身（S145 边界条件；wanting/liking 区分）
  failure_conditions:
  - 预期过强或剧透消除误差——没有预期就没有意外
  - 误差过大触发拒绝而非更新（超出图式同化能力）
  common_misinterpretations:
  - 意外等于好——只有正向或可消化的意外提升评价，负面意外带来传播但损毁信任
  - 把预测误差当成单纯的营销噱头——它首先是学习机制，操纵不当带来的是拒绝
  ethical_risks:
  - 惊吓式营销与恶意反转透支信任
  examples:
    original_cases:
    - S10 对预测加工的全面阐述
    research_cases:
    - 多巴胺神经元实验：奖励高于预期时放电增强，低于预期时抑制（仅摘要级支持：S145 为 abstract_only，EP notes 明示该放电模式细节待原文核验）
    modern_cases:
    - 推荐系统的探索与利用平衡；剧情反转设计；产品更新的惊喜管理
  communication_implications: 先建立可预测的预期结构，再提供可控偏差——内容的三段论应是搭预期、给误差、帮消化。
  community_implications: 社群节奏的可预测性（固定栏目）与偶发惊喜（突然福利）的配比，决定成员的长期兴趣曲线。
  content_applications:
    title: 标题先锚定预期，再承诺一个偏差
    opening: 用受众熟悉的图式开场，让后面的意外有处可依
    body: 每给出一个反直觉结论，紧接一个可理解的解释
    cta: 把关注定义为持续获得可消化的意外
  platform_implications: 推荐算法本质是预测误差的批发商——它持续寻找让你惊讶又不离开的内容边界；这也解释了刺激性内容对平静内容的系统性优势。
