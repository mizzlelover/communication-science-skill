- id: in_group_favoritism
  canonical_name_en: In-Group Favoritism (Minimal Group Paradigm)
  canonical_name_zh: 内群体偏爱（最小群体范式）
  aliases:
  - minimal group effect
  - 内群体偏好
  - 群内偏爱
  domain: identity
  definition: Tajfel 最小群体范式揭示的现象：仅依据无意义标准（如美术偏好、掷硬币）把人临时分组，成员就会把更多资源、更高评价给予内群体，即使对自己毫无物质收益。它是社会认同理论的行为证据核心。
  core_claim: 『我们vs他们』的分类本身（不含任何利益、历史或接触信息）就足以产生系统性的分配与评价偏向。
  mechanism: 被分组后，归属感与自尊被捆绑于群体结果；把资源让渡给内群体是低成本的身份维护行为。分配策略上，人们常在『最大化内群体绝对收益』与『最大化内外差距』之间选择后者，说明相对地位比绝对所得更接近动机源头。该偏向在分配、评价、记忆、信任实验中广泛出现。
  causal_chain: 最小分类 → 归属激活 → 群体自尊卷入 → 相对优势偏好 → 资源/评价偏向内群体
  variables:
    inputs:
    - 任意分类标准
    - 分类的显著性
    - 分配决策权
    moderators:
    - 分类是否有意义与正当性
    - 群体互动历史
    - 个体社会支配倾向
    mediators:
    - 归属感
    - 群体自尊
    - 相对地位关切
    outputs:
    - 资源分配偏向（有时以牺牲绝对总量为代价）
    - 内群体正面评价与信任
    - 外群体同质化知觉
  evidence:
    supporting:
    - Tajfel, Billig, Bundy 与 Flament 的最小群体实验：无意义分组下出现让渡绝对收益以扩大相对差距的分配
    - 最小群体范式在多国、多年龄样本中的重复
    - 评价、记忆与信任任务中的内群体偏向证据（S25 综合所述）
    conflicting:
    - 部分复制发现效应幅度对任务结构与计分方式敏感
    - 强个人主义者或高互依文化样本中偏向模式存在差异
    replication:
    - 方向性结果高度可复制，是最稳定的社会心理学现象之一
    - 『最大化差距vs最大化收益』的策略占比在不同研究间波动
    meta_analysis:
    - 最小群体文献的综述整合支持偏向的稳健性；无独立权威 meta-analysis
  evidence_grade: A-
  boundary_conditions:
  - 分类标准被被试理解为真实的『某类人』划分时成立
  - 被试意识到自己在做分配决策、决策可见时更强
  - 对儿童与成人样本均成立，但幅度随年龄与文化背景变化
  - 群际接触在满足平等地位、共同目标、合作与制度支持四条件时可抑制偏向（接触假说，S22）
  failure_conditions:
  - 分类被明确标注为随机且无社会含义时偏向减弱但不消失
  - 被更高层共同身份覆盖时偏向被抑制
  - 个体处于强烈个人目标竞争而非群际比较框架时
  common_misinterpretations:
  - 误以为内群体偏爱必然伴随外群体仇恨——最小群体中的偏向主要表现为偏爱而非敌意
  - 误以为需要群体利益冲突才会出现偏向
  ethical_risks:
  - 利用任意分类制造虚假对立以提升参与（拉踩式运营、站队话题）
  - 在内群体保护名义下合理化对外群体的排斥与歧视
  examples:
    original_cases:
    - Tajfel 等的最小群体实验（按 Klee/Kandinsky 绘画偏好分组的资源分配）
    - 社会认同论对『偏爱优先于敌意』的理论阐述（S25）
    research_cases:
    - 分配矩阵实验：被试在保证内群体绝对收益与最大化内外差距间选择
    - 最小群体下的信任与评价实验
    modern_cases:
    - 电商平台粉丝团的应援式打投
    - 游戏公会的阵营对立叙事
    - 社群里『老用户 vs 小白』的隐性分层话语
  communication_implications: 为受众提供一个值得偏爱的『我们』（共同标签、共同敌人是问题不是共同敌人是成就），可显著提升互推、抱团与留存；但要避免以贬损外群体为燃料的廉价动员。
  community_implications: 把内群体偏爱导向建设性出口：成员资格换互助、共创与守护社区规范，而非单纯排他；定期安排跨群体合作任务以抑制偏向硬化为敌意。
  content_applications:
    title: 标题建立『我们』框架：『写给还在犹豫要不要开始定投的新手』而非泛化标题
    cta: CTA 用内群体互惠语言：『转给同在路上的伙伴』
    comments: 置顶内群体成员的真实互助案例，把偏爱转化为社区资产
    body: 叙事中设置共同任务（挑战、打卡、共创），让偏爱有行为出口
  platform_implications: 平台的阵营化话题机制（对立投票、战队、pk 活动）直接调用最小群体逻辑提升互动；标签化分发强化『我们vs他们』的边界感知，需平台治理介入以防止偏向升级为骚扰。
