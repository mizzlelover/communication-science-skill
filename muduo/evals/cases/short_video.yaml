    首条内容处于冷启动期（cold_start_dynamics），当前瓶颈是分发启动与定位验证，不是文案（SKILL.md 铁律6：
    有时"不要改"，先排除分发层）；② 给出行动序列：连发3-5条同主题验证定位、观察可得相对信号（如平均播放
