    使其说服力超过其证据地位，n=1 只能支撑假设与路径展示，不支撑普遍化处方）。Editing Plan 三件套修复结论段：加边界（"适用于品类结构分散、库存占用现金流的早期公司"）、 加机制桥（砍
    SKU 为何起效：现金集中、决策带宽、单位经济变化）、加至少一次反例检验 （哪些公司不该这么做）；"全部积蓄换来的真理"降级为"我们在一个样本上验证过的路径"。 Platform（wechat）：sharing_mechanism
    转发达意句走身份认同，加边界后仍可转； title_role 不放大外推。边界：不删故事换数据堆砌、不只软化"真理"二字保留外推、不 要求补 100 家公司数据后才许下结论。
