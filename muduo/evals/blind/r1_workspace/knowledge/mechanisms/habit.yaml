    effect_size: 习惯=线索驱动的自动反应；习惯强度=行为频率×情境一致性
    replication_status: 综述整合认知/计算/神经证据；行为频率×情境一致性测量有复制
    context_dependency: 情境稳定+重复是形成前提；改变依赖环境重组
