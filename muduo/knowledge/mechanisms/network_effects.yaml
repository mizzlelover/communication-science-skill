- id: network_density
  canonical_name_en: Network Density
  canonical_name_zh: 网络密度
  domain: network_effects
  definition: 网络密度（network density）指网络中实际存在的连接数与可能连接总数之比，衡量群体成员间相互连接的完备程度。高密度网络（如紧密的部落、家族）信息流动快、规范执行强，但信息冗余高、圈外信息少；低密度网络信息多样但协调与信任建立慢。
  core_claim: 网络密度是简单信息传播速度与规范执行强度的正向预测因子，但与信息新颖性负相关——密度是双刃剑，其最优值取决于群体目标。
  mechanism: 在高密度网络中，任何信息可通过多条路径快速到达所有节点，且任何越轨行为都被多个目击者看见，规范执行与集体动员能力强；但成员彼此知道的信息高度重合，网络作为信息源的价值低。低密度网络每个节点连向不同的圈外世界，信息多样但传播慢、信任链长。社群与产品网络的最优密度因此取决于其功能：情感共同体需要高密度，信息集散地需要适度低密度。
  causal_chain: 密度 ↑ → 传播路径冗余 + 违规可见性 ↑ → 信息扩散加速 + 规范执行强化；同时信息冗余 ↑ → 信息新颖性 ↓
  variables:
    inputs:
    - 成员数
    - 实际连接数
    moderators:
    - 群体规模（大群体天然低密度）
    - 连接的方向性与强度
    mediators:
    - 传播路径数
    - 行为可见性
    outputs:
    - 传播速度
    - 规范执行强度
    - 信息多样性
  evidence:
    supporting:
    - 网络科学教材对密度与传播、凝聚关系的标准论述（Easley & Kleinberg 教材；S52 EP 仅实取第 19/21 章，密度论述所在第 2-3 章待补读后再引）
    - Coleman 关于网络闭合（closure）与规范执行的分析传统（经典文献，未建包，方向一致）
    conflicting:
    - 过密网络的群体思维与信息同质化后果在组织研究中被反复指出（组织研究讨论）
    replication:
    - 密度与传播速度的正向关系在模拟与实证中稳定；「最优密度」的具置因群体功能而异，无普适常数
    meta_analysis: []
  evidence_grade: A-
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 密度的效应依赖群体规模：同为「紧密社群」，30 人与 3000 人的可达成密度完全不同
  - 密度对规范执行的作用前提是成员在乎声誉（存在声誉抵押）
  failure_conditions:
  - 把高密度当万能目标：信息型社群过度追密度会陷入信息冗余与闲聊化
  - 人工强行连接所有人（大群互加）制造的是虚假密度——连接存在但无互动
  common_misinterpretations:
  - 「社群越紧密越好」——密度与信息多样性存在权衡（trade-off），运营目标应与社群功能匹配
  - 把密度等同于活跃度：密度是结构指标（连接存在），活跃是行为指标（连接使用），高密度低活跃的死群很常见
  ethical_risks:
  - 高密度网络中的规范执行可演变为群体监视与排斥机制，压制异见的成本极低
  examples:
    original_cases:
    - 教科书对 dense vs sparse 网络传播特性的对比分析（Easley & Kleinberg）
    research_cases:
    - Coleman 关于网络闭合与规范执行的经典分析（经典文献，已建包 EP S210）
    modern_cases:
    - 百人小群的高互动密度与转发速度（一条消息全员可见、规范自发执行）
    - 超大群的低密度与信息沉没（发言无人回应、规范涣散）
  communication_implications: 面向高密度群体（社群、粉丝团）的内容可以预设共识与梗，传播快但需控制重复疲劳；面向低密度受众（公域流量）的内容必须自足且争取算法初始曝光。
  community_implications: 社群运营应按功能管理密度：核心层（高密度强规范）→ 活跃层（中密度）→ 关注层（低密度信息触达）；分层结构比单一「大群」健康得多。
  content_applications:
    body: 高密度群内正文允许指代共同经历（「上次那件事」）；公域正文必须完全自足
    sharing: 高密度群体的分享物做成「接龙/打卡」形态利用路径冗余；低密度场景做成「一次转发」的自足卡片
    comments: 高密度社群用固定互动仪式（每日签到、周度总结）维持连接使用率，防止结构密度变行为死区
  platform_implications: 平台群组功能的产品上限决定可达密度（群人数上限、消息折叠逻辑）；设计者实际上在为社群设定密度天花板（原则性判断）。
