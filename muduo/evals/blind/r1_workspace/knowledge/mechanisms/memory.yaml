- id: zeigarnik_effect
  canonical_name_en: Zeigarnik Effect
  canonical_name_zh: 蔡格尼克效应
  aliases:
  - 未完成情结
  - 未完成任务效应 —— 与 curiosity_gap 的区别：好奇缺口是信息层面的缺口动机，蔡格尼克是任务层面的中断记忆与动机；与 attention_residue 的区别：后者是切换后的资源残留
  domain: memory
  definition: 未完成的任务比已完成的任务更容易被记住，并在心理上持续保持激活（Zeigarnik 1927 受咖啡馆侍者记忆现象启发）。中断让目标维持开启状态，直到完成或被心理上关闭。
  core_claim: 中断的任务保持认知激活，产生侵入性想法与完成动机，完成或关闭后释放。
  mechanism: 目标系统的运行方式是未达成即保持可及性：未完成目标的表征持续处于高激活状态，更容易被想到、也更容易侵入当前思维；目标完成或被合理放弃后激活解除。后续研究显示效应受目标承诺与失败线索调节，并非无条件成立。
  causal_chain: 任务启动 → 中断 → 目标保持激活 → 侵入性想法与完成动机 → 完成后释放
  variables:
    inputs:
    - 任务中断点
    - 任务个人相关性
    - 进度可见性
    moderators:
    - 目标承诺
    - 完成可能性
    - 时间压力
    mediators:
    - 目标激活水平
    outputs:
    - 任务记忆
    - 完成动机
    - 侵入性想法
    - 回访行为
  evidence:
    supporting:
    - Zeigarnik 1927 的中断任务回忆实验
    conflicting:
    - 后续复制结果有波动：效应大小依赖目标承诺与动机，部分研究未发现差异
    replication:
    - 现象被广泛引用且在应用设计中反复奏效，但实验层面的复制一致性中等
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 需要真实的目标承诺——用户不在乎的任务中断不产生效应
  - 进度可见且可完成时动机最强
  failure_conditions:
  - 过多并行未完成任务产生焦虑与逃避而非动力（红点疲劳）
  - 虚假进度被识破后信任崩塌
  common_misinterpretations:
  - 吊胃口永远有效——仅对用户已经承诺的目标有效
  - 把未读红点当万能钩子——超量未完成状态训练出的是关闭而非回访
  ethical_risks:
  - 故意阻断任务体验制造沉没感（自动续费、进度惩罚、倒计时强迫）
  examples:
    original_cases:
    - S17 的触发-行动-多变奖励-投入模型中，投入阶段大量借用未完成效应的直觉
    research_cases:
    - 中断实验：被打断的任务在自由回忆中的再现率高于已完成任务
    modern_cases:
    - 剧集的自动连播与下一集倒计时；拼团进度条；任务清单与学习 streak；红点未读设计
  communication_implications: 内容可以在中途设置未完成点（分集、连载、任务卡）以获得回访，但每个未完成点都必须值得回来。
  community_implications: 社群的成长路径与成就系统用未完成感维持参与，但要控制未完成总量以免焦虑驱逐活跃。
  content_applications:
    opening: 开头声明本系列共几集，制造系列未完成感
    cta: 把行动定义为下一步而非终点（完成第一步，还差两步）
    body: 在关键节点留下明确的进度标记
  platform_implications: 平台的连续性机制（streak、追番列表、收藏夹）把蔡格尼克效应产品化；同时通知过载正在训练用户批量关闭它。
