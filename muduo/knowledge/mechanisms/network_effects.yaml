- id: strong_ties_support
  canonical_name_en: Strong Ties Support
  canonical_name_zh: 强连接支持
  aliases:
  - 强关系支持
  - bonding social capital（黏合型社会资本）
  domain: network_effects
  definition: 强连接（strong ties）指高频互动、情感亲密、彼此投入时间与资源的关系（家人、密友、挚友）。强连接网络提供情感支持、紧急资源援助与高信任影响力，Putnam 称之为 bonding
    social capital（黏合型社会资本）。它与弱连接形成功能互补：强连接支持个体，弱连接连接机会。
  core_claim: 在情感支持、高风险决策与行为深度改变上，少数强连接的影响力与支持力超过大量弱连接。
  mechanism: 强连接建立在高互动频率与相互投入之上，形成情感承诺与声誉抵押（彼此了解对方历史，背书有真实代价）。因此强连接的信息虽冗余但可信度极高，其影响可以承受复杂传染所需的多重确认；在危机时刻强连接是实际的资源来源。代价是强连接网络维护成本高、规模天然受限，且圈外信息稀薄。
  causal_chain: 高频互动与相互投入 → 情感亲密与信任积累 → 高可信度影响 + 实际资源支持 → 深度行为改变与危机缓冲
  variables:
    inputs:
    - 互动频率
    - 情感强度
    - 相互投入历史
    moderators:
    - 关系中的互惠平衡
    - 生活阶段的可支配时间
    mediators:
    - 信任
    - 情感承诺
    - 声誉抵押
    outputs:
    - 情感支持获得
    - 高风险决策影响
    - 紧急资源援助
  evidence:
    supporting:
    - 社会支持研究一致显示强关系网络缓冲压力与危机（综述证据）
    - 健康行为干预研究显示强连接的多重确认更能改变行为（复杂传染方向，Centola 相关研究讨论）
    conflicting:
    - 强连接圈子的信息冗余与同质化可能强化回音室与错误信念的相互担保（研究讨论）
    replication:
    - 强连接的情感与资源支持功能跨文化重复；其网络规模上限因文化个体主义程度波动
    meta_analysis: []
  evidence_grade: B+
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 适用于需要信任与持续投入的情境；信息获取与新机会类需求弱连接更优
  - 强连接的影响依赖关系健康：控制型或毒性关系中「强」意味着更强的伤害能力
  failure_conditions:
  - 强连接网络过度封闭时，形成信息孤岛与群体思维，群体决策质量下降
  - 把社群当强连接机器运营：强连接需要真实时间投入，无法靠运营手段批量制造
  common_misinterpretations:
  - 「社群就是要把所有成员关系做强」——强连接天然规模有限，健康社群是少数强连接核心 + 大量弱连接外围的分层结构
  - 把 strong_ties_support 与 weak_ties_strength 当作对立理论——两者是功能分工：支持 vs 桥接，Putnam 的 bonding/bridging 二分正是此意
  ethical_risks:
  - 利用强连接的信任进行杀熟式营销与传销裂变，是社交信任最高级别的透支
  examples:
    original_cases:
    - Granovetter 对 tie strength 多维度定义的原始讨论（互动频率、情感强度、互惠服务）
    - Putnam 对 bonding vs bridging 社会资本的区分
    research_cases:
    - 社会支持文献中亲密网络对压力缓冲的重复发现（综述转述）
    modern_cases:
    - 家庭群里的健康产品团购（强连接信任的变现）
    - 私密小群（闺蜜群、死党群）中的深度相互影响与高转化推荐
  communication_implications: 面向强连接场景的内容应提供「值得转给最亲近的人」的分量：深度、诚意与实用，而非轻量娱乐；强连接转发是高信任背书，内容质量门槛更高。
  community_implications: 健康社群结构是核心强连接小团体（活跃核心）+ 弱连接大外围；运营目标是保住核心的强连接质量（线下见面、共同项目），同时让外围弱连接随时能被激活。
  content_applications:
    body: 为强连接场景写作时放慢节奏、加深细节：这类读者会读完全文而非三秒划过
    narrative: 讲述真实关系中的故事（陪伴、亏欠、和解），激活强连接语境的情感共鸣
    sharing: 提供「转给在意的人」的深度内容入口（长文、报告），区别于广场式转发
  platform_implications: 平台架构决定连接强度上限：私聊与朋友圈分组可见保护强连接场景，公开广场类产品会把关系自然拉向弱连接化（原则性判断）。
