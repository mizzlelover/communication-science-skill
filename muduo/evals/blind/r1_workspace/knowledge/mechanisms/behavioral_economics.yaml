  - 享乐编辑
  domain: behavioral_economics
  definition: 心理账户（Thaler，1985/1999）指人们把金钱按来源与用途分入不同心理账户，分别评估，违背货币的可替代性：奖金与工资『不同值』，『旅行基金』不能挪作房租。相关推论是享乐编辑（hedonic
    editing）：人们偏好分离收益、合并损失的编排方式。与 gain_loss_framing 的区别：框架效应是选择问题的表述效应，心理账户是持续的认知分账结构。
  core_claim: 等额金钱因心理账户归属不同而被差别对待，分账结构系统性地影响消费与储蓄行为。
  mechanism: 分账简化自我控制与预算追踪（每笔钱有用途标签），代价是牺牲可替代性；账户的开启与关闭伴随情绪规则（享乐编辑：小额收益分开花更快乐，损失合并报更不痛）；来源标签（意外之财、血汗钱）改变其『该花在什么上』的预期（S12、S01）。
  causal_chain: 收入/支出被贴账户标签 → 账户规则约束使用 → 违背可替代性的消费/储蓄行为 → 整体财务结果偏移
  variables:
    inputs:
    - 收入来源标签
    - 支出类别
    - 支付与获得的时间分离度
    moderators:
    - 自我控制需求
    - 家庭财务制度
    - 金额大小
    mediators:
    - 账户归属
    - 享乐编辑
    - 预算松紧感知
    outputs:
    - 消费倾向
    - 储蓄行为
    - 支付疼痛
  evidence:
    supporting:
    - Thaler 1985/1999 的理论化与系列实验（经典研究，S12 综合）
    - 消费行为中来源效应与预算效应的多项观察（S12）
    conflicting:
    - 高财务素养与预算工具使用者更接近可替代性假设；账户边界可被教育松动（边界研究）
    replication:
    - 方向稳健，但强度受金融环境与个体差异调节。评级按枚举记 B
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 对自我控制的主动需求越高，分账越严格
  - 金额越大或越应急，账户边界越易被打破（例外支取）
  - 预先支付产生支付解耦（payment decoupling）：购买与消费感受分离，消费时支付疼痛减弱，易导致超支（S132）
  failure_conditions:
  - 在流动性危机中所有账户合流，标签失效
  - 完全自动化的财务管理使账户标签失去感知
  common_misinterpretations:
  - 把心理账户当成纯营销话术；它首先是家庭财务的微观结构，营销只是借用其标签机制
  ethical_risks:
  - 用『专款专用』话术诱导非必要支出（『这是给孩子的教育金，别动它』式的操控性分账）
  examples:
    original_cases:
    - Misbehaving（S12）中的酒窖、演出票等心理账户案例
    research_cases:
    - Thaler 的心理账户理论论文与实验
    modern_cases:
    - 红包/补贴/返现的差异化使用、专项储蓄罐产品、『一顿火锅钱』式定价话术
  communication_implications: 把价格换算到受众的『小钱账户』（每天一杯咖啡钱）降低支付疼痛，但要防止误导总成本。
  community_implications: 社群基金、积分与现金的分离本身就是心理账户设计：给不同货币不同用途与仪式，减少兑换套利。
  content_applications:
    title: 把价格锚进低敏感账户：『每天不到一杯奶茶钱』
    body: 为产品设定用途标签（学习基金、自我投资），引导归户
  platform_implications: 支付产品的钱包分层（零钱、理财、心愿单）是心理账户的产品化；补贴以独立账户形式发放留存更久。
  related_nodes:
  - gain_loss_framing
  - sunk_cost_fallacy
  - endowment_effect
  - anchoring_effect
  source_ids:
  - S12
  - S01
  - S132
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Thaler 2015（S12，心理账户：来源标签不同→消费行为不同）+ Thaler 1985（S132，心理账户奠基：非替代性/享乐编辑）+ Kahneman
      2011（S01）
    effect_size: 账户隔离导致对等金额的边际消费倾向不同（经典思想实验与实验）
    replication_status: 心理账户现象多情境重复（消费/投资/政策）
    context_dependency: 账户标签显性度/自我控制目标调制
    downgrade_upgrade_reason: 2026-09 实取 S12 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
  provenance:
