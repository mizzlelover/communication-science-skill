# identity — 身份与群体认同（Identity）：人们如何定义"我们是谁"，并据此消费、表态与站队
domain: identity
nodes:
- id: social_identity_theory
  canonical_name_en: Social Identity Theory
  canonical_name_zh: 社会认同理论
  aliases:
  - SIT
  - Tajfel-Turner 社会认同论
  domain: identity
  definition: Tajfel 与 Turner 提出的社会心理学理论：个体自我概念的一部分来自所隶属的社会群体（social identity）。人们经由『社会分类—社会认同—社会比较』过程，从群体成员资格中获得自尊与意义，并倾向于积极评价内群体（in-group）。
  core_claim: 仅凭群体成员资格本身（哪怕是无实义的最低限度分组），就足以引发内群体偏好与内外群体差异评价。
  mechanism: 个体将自己归入某社会类别后，『群体自我』被激活：群体声誉成为自我评价的一部分，维护内群体的积极独特性（positive distinctiveness）等于维护自我价值。社会比较从个体层转移到群体层，资源分配、评价与情感投入随之偏向内群体。这一过程在身份显著（salient）时自动发生，无须真实利益冲突存在；与『情境力量＞性格』的社会心理学一般结论同向（S21）。
  causal_chain: 社会分类 → 身份激活 → 群体自尊卷入 → 内群体偏好/外群体贬损 → 身份一致性消费与公开表态
  variables:
    inputs:
    - 群体成员资格
    - 身份显著性
    - 群体间比较情境
    moderators:
    - 身份认同强度
    - 群体地位与地位稳定性
    - 替代身份可得性
    - 个体自我建构（独立型vs互依型；S19 载独立/互依自我建构的文化差异）
    mediators:
    - 群体自尊
    - 积极独特性需求
    - 内群体情感承诺
    outputs:
    - 内群体偏好
    - 外群体贬损
    - 群体一致性消费与言论
    - 集体行动意愿
  evidence:
    supporting:
    - Tajfel 等的最小群体范式（minimal group paradigm）系列实验：以无意义标准分组仍产生内群体偏爱
    - 社会认同论系列研究（见 S25 综合）：群体身份显著化后评价与行为偏移方向可预测
    - 跨群体、跨文化研究广泛重复出内群体偏爱的方向性
    conflicting:
    - 最小群体情境中的资源分配偏向幅度明显小于真实冲突情境
    - 强群体认同并不必然带来外群体敌意，存在不贬损外群体的积极认同形式
    replication:
    - 最小群体范式在多国实验室中被多次复制，方向稳定
    - 线上社群身份效应多为相关证据，因果证据相对薄弱
    meta_analysis:
    - 无覆盖全域的单一 meta-analysis；以系统综述与理论整合研究为主
  evidence_grade: A-
  boundary_conditions:
  - 身份在当下情境被激活且与自我评价相关时效应最强
  - 群体地位受威胁或存在可用比较对象时，偏向放大
  - 拥有多重身份的个体在身份冲突时更可能切换参照群体而非固守
  failure_conditions:
  - 个体主义自我建构主导、身份线索被刻意淡化的情境
  - 更高层级的共同身份（superordinate identity）被激活时，内群体偏向显著减弱
  common_misinterpretations:
  - 误读为『人天生仇恨外群体』——理论核心是内群体偏爱，外群体敌意是派生且条件依赖的
  - 误以为必须存在真实利益冲突才会出现群体偏向
  ethical_risks:
  - 刻意制造内外群体对立以提升参与度（拉踩营销、身份挑衅式内容）
  - 将用户锁定在单一身份叙事中，加剧极化与污名化
  examples:
    original_cases:
    - Tajfel & Turner 关于社会认同与群体间关系的理论阐述（S25）
    - Goffman 拟剧论视角下的成员符号与身份舞台（S24）
    research_cases:
    - 最小群体实验：按绘画偏好或随机方式分组后，被试仍把更多资源分给『自己人』
    - 群体地位受威胁情境下评价与分配偏移的实验研究
    modern_cases:
    - 品牌社群粉丝名、专属昵称激发身份化消费与自发传播
    - 球鞋圈、汉服圈、理财圈的圈层黑话与『圈内人』认同
    - 平台阵营化话题（a 股 vs 基金、国产 vs 外资）触发站队式转发
  communication_implications: 传播的对象不是抽象个体，而是某个被点名的身份：先给身份肯定再给信息，比单纯罗列功能更能驱动转发与辩护行为；内容一旦被解读为身份攻击，将触发防御而非说服。
  community_implications: 社群应提供可认领的身份阶梯（新人→贡献者→长老），让成员资格可见、可宣称；头衔、徽章、圈内黑话是低成本黏合剂，但需治理机制防止走向排外与党同伐异。
  content_applications:
    title: 标题植入身份词与身份荣耀：『写给每一个熬过熊市的 holders』
    body: 先肯定身份、再给信息：『我们这种人最怕的不是亏钱，是错过周期』，把理性内容绑定在身份叙事上
    comments: 评论区以身份肯定运营：置顶『懂行的人才会注意到这一点』类评论，强化圈层认同
    cta: 邀请性 CTA 优于指令性：『点个赞，让同行的人看到』，把点赞重构为身份仪式
  platform_implications: 算法按兴趣与圈层聚类分发，身份词（黑话、梗、tag）成为特征信号；粉丝牌、等级、专属表情等产品化机制强化社会认同，同时系统性放大冲突性身份内容。
  related_nodes:
