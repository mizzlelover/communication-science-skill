- id: friction_reduction
  canonical_name_en: Friction Reduction
  canonical_name_zh: 摩擦削减
  aliases:
  - 降低门槛
  - 减少摩擦
  - removing friction
  domain: habit
  definition: 摩擦削减指通过移除行为路径上的认知、时间、步骤与信任障碍来提升行为发生率，是行为改变策略中证据最稳的一类。Berger 的 Catalyst（S39）把『减少摩擦』列为核心杠杆之一；英国行为洞察团队的
    EAST 框架亦以 Easy 为首（经典文献，未建包，仅作背景提及）。定级 B（多来源研究支持，边界条件明显）。与 behavior_model_bmap 的关系：摩擦削减是能力（Ability）维度的操作化；与
    default_option_effect 的关系：默认是预设选项，摩擦削减是路径简化，常配合使用。
  core_claim: 在动机不变的前提下，削减行为路径中最窄的瓶颈（步骤、认知、信任）可显著提升行为发生率。
  mechanism: 行为是瓶颈约束下的产物：任何一步的放弃成本都会截流；不确定性像暂停按钮让人推迟行动，解法是让尝试变容易（免费样品、试驾、freemium 降低上手成本）（S39）；削减摩擦同时降低启动成本与决策成本，与执行意图、默认效应等机制协同（S39、S16）。
  causal_chain: 识别最窄瓶颈 → 削减步骤/认知/信任摩擦 → 启动与完成成本下降 → 行为发生率提升
  variables:
    inputs:
    - 步骤数量
    - 认知负荷
    - 等待时间
    - 信任成本
    moderators:
    - 动机强度（动机越低摩擦杠杆越大）
    - 用户熟练度
    - 竞品摩擦水平
    mediators:
    - 启动成本
    - 中途放弃率
    outputs:
    - 转化率
    - 完成率
    - 投诉率
  evidence:
    supporting:
    - Catalyst（S39）整合的多项摩擦实验与现场研究（专著综述）
    - EAST 框架汇总的政策行为干预证据（经典文献，未建包）
    - Fogg B=MAP 行为模型论文（S175）：能力/简化是行为发生的必要成分——削减门槛直接作用于行为发生率（框架论文，无新增实验数据，2026-09-11 补一手来源登记）
    conflicting:
    - 摩擦只是改变的障碍之一（REDUCE 框架）：高卷入改变还常需处理心理抗拒、眷恋现状与距离等非摩擦障碍；框架为研究+访谈归纳，五障碍的独立贡献未量化（S39）
    replication:
    - 方向稳健但幅度依赖具体瓶颈；需要逐一诊断而非通用套用。评级按枚举记 B
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 适用于动机偏低、路径冗长的大众行为场景
  - 摩擦诊断需基于真实行为数据而非猜测
  failure_conditions:
  - 在需要深思熟虑的高风险决策（签约、投资）中取消摩擦，损害双方利益
  - 削减了非瓶颈步骤（瓶颈其实在信任）而无效
  common_misinterpretations:
  - 『越少步骤越好』：对身份与承诺类行为，适度仪式感本身就是价值
  - 把摩擦削减等同于简化 UI；认知与信任摩擦常常更大
  ethical_risks:
  - 对退订、注销、退款流程刻意增加摩擦（单向摩擦），构成对用户的剥夺
  examples:
    original_cases:
    - Catalyst（S39）中的摩擦与注册流程案例；Tiny Habits（S16）的行为极简化
    research_cases:
    - 政府服务简化与政策现场实验（EAST 方向）
    modern_cases:
    - 一键登录、免密支付、课程试看 30 秒、社群双链直达活动页
  communication_implications: 每篇内容结尾的行动路径都要点进实测一遍：链接层级、加载速度、表单长度，任何一处都是截流点。
  community_implications: 入群、报名、发言的流程审计是社群增长的最便宜杠杆；先减摩擦再谈激励。
  content_applications:
    cta: CTA 文案直接描述动作结果（『点这里生成你的报告』）并附单步路径
    body: 教程把环境准备前置成清单，消除执行时的认知摩擦
  platform_implications: 平台对 friction 的工程化（自动填充、快捷支付）塑造了整个转化基线；单向摩擦（退出门槛）则是监管焦点。
