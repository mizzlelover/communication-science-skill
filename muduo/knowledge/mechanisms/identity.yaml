- id: identity_signaling
  canonical_name_en: Identity Signaling
  canonical_name_zh: 身份信号
  aliases:
  - 身份信号理论
  - identity signaling theory
  domain: identity
  definition: 关于消费与言论如何作为身份信号（identity signaling）起作用的理论方向：当某种品味或行为成为群体的标志性信号时，人们会通过采纳或回避它来声明（或保护）自己的群体身份，信号价值常常压过产品本身的效用。（证据定位：EP
    支持为消费-身份教科书框架（S72）与从业者观察（S59/S83/S85）；核心的 Berger & Heath 信号稀释系列实验为经典文献，未建包）
  core_claim: 当消费对象与特定身份强绑定后，『外人是否在场』决定了人们是炫耀它还是抛弃它——信号功能优先于功能价值。
  mechanism: 群体身份需要可见符号来维持与传递；当某符号被广泛识别为『某类人专属』时，使用它就是在向内群体发信号并划清与外群体的界限。一旦该信号被外群体大量采纳（signal dilution），内群体成员会转而放弃或贬低该符号，迁移到新符号上。这解释了品味与潮流的轮转以及『变了味』的社区退出潮。
  causal_chain: 符号与身份绑定 → 符号可见性 → 向内群体发信号/与外群体划界 → 外群体稀释 → 弃用并迁移新符号
  variables:
    inputs:
    - 符号与身份的绑定强度
    - 外群体采纳可见度
    - 观众构成
    moderators:
    - 身份认同强度
    - 身份安全度（secure vs insecure）
    - 符号成本与门槛
    mediators:
    - 信号发送动机
    - 身份威胁感知
    outputs:
    - 选择性展示
    - 符号弃用与迁移
    - 品味轮转
    - 圈层退出
  evidence:
    supporting:
    - 身份信号方向的系列实验与田野研究（Berger 与 Heath 等团队）：观众构成变化导致符号采用与弃用反转（经典文献，未建包）
    - 消费行为研究中身份威胁后转向替代符号的证据（S72 教科书综述）
    - S85 的从业者观察：成熟期社群并非自我维持，成员流失需持续吸引新成员；S83 同向（社群成长靠持续吸引真诚的人与身份培养）
    conflicting:
    - 低身份相关度、高功能价值的品类中，信号效应弱
    - 强身份安全者对外群体稀释不敏感，甚至欢迎扩散
    replication:
    - 实验室内的信号调节效应有多项重复
    - 田野情境中效应大小高度依赖符号的可见性与可模仿性
    meta_analysis:
    - 无专门 meta-analysis；证据以系列实验与案例研究为主
  evidence_grade: B
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 符号必须公开可见且可被观众解读
  - 身份与符号的绑定需在目标人群中已有共识
  - 观众中内/外群体的构成决定信号方向
  failure_conditions:
  - 匿名或无观众情境（信号无接收者）
  - 符号被平台大规模商品化后，原身份群体已整体迁离的场景
  - 纯粹功能型消费、身份关联极弱的品类
  common_misinterpretations:
  - 误以为『破圈』只赚不赔——对身份型社群，破圈即信号稀释，伴随老用户流失
  - 误以为用户买的是产品本身，忽视了购买的是『向谁发信号、发什么信号』
  ethical_risks:
  - 刻意制造身份排他符号实施阶层筛选或价格歧视
  - 用身份焦虑驱动符号性消费（ luxury-ification ）
  examples:
    original_cases:
    - 消费与身份绑定导致符号弃用与迁移的实验证据（S72 教科书所引研究传统）
    - STEPPS 框架中『social currency / 公开性』与身份展示的论述（S59）
    research_cases:
    - 观众构成操纵实验：当目标符号被外群体广泛采纳后，内群体成员的符号采用率下降
    - 身份威胁后转向替代符号的选择实验
    modern_cases:
    - 小众乐队走红后老粉『粉转路人』
    - 某理财术语成为大众梗后，专业投资者改用更小众的表达
    - 汉服圈对『影楼风』的区隔与符号迁移
  communication_implications: 内容本身就是身份信号：转发某篇文章等于佩戴某个符号。想让内容传播，先回答『转发它让转发者看起来像什么人』；同时警惕破圈双刃剑。
  community_implications: 社群扩张应管理符号供给：为老身份保留高门槛符号（进阶认证、内部黑话），为新人设计入门符号，避免核心身份被稀释引发核心用户出走。
  content_applications:
    title: 标题让目标身份『被看见』：『一份只有长线持有者才会收藏的清单』
    cta: 把分享框定为身份声明：『转给你身边那个总说早知道的人』
    sharing: 设计可展示的成果符号（打卡图、持仓年化截图模板），降低转发成本同时提高信号辨识度
    comments: 引导成员用圈内黑话互评，维持符号边界与社区独特感
  platform_implications: 平台推荐加速符号扩散与稀释周期：小众符号从出现到大众化的时间被压缩，身份型社群的『迁居』频率随之提高；平台级符号（头像挂件、粉丝徽章）成为官方身份信号层。
