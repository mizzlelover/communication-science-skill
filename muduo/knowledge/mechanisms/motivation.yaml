- id: implementation_intentions
  canonical_name_en: Implementation Intentions
  canonical_name_zh: 执行意图
  aliases:
  - if-then 计划
  - 如果-那么计划
  domain: motivation
  definition: 执行意图（Gollwitzer）指把抽象目标改写为『若情境 X，则执行行为 Y』的 if-then 计划：预先把情境线索与具体行动绑定。证据评级 A-（按枚举记 A）：多项元分析（如
    Gollwitzer 与 Sheeran 2006）显示中等偏大的稳健效应。与 goal_setting_effectiveness 的区别：目标设定回答『做什么、多难』，执行意图回答『何时何地如何启动』。
  core_claim: 给定同等目标，拥有 if-then 计划者的目标达成率显著高于仅有目标意图者。
  mechanism: if-then 结构把情境线索的选择权交还给计划者，形成『线索-行动』的强关联；当线索出现时，行为几乎自动启动，绕过了当下的意志努力与竞争目标干扰；它同时压缩了『何时做』的决策成本（S14、S20）。
  causal_chain: if-then 计划 → 情境线索与行动强绑定 → 线索出现时自动启动行为 → 达成率提升
  variables:
    inputs:
    - 线索具体性
    - 行动具体性
    - 计划与目标的兼容性
    moderators:
    - 目标承诺
    - 线索出现频率
    - 任务难度与冲突目标数量
    mediators:
    - 线索-行动关联强度
    - 启动即时性
    outputs:
    - 目标达成率
    - 行为频率
    - 放弃率下降
  evidence:
    supporting:
    - Gollwitzer 1999 的理论化与系列实验；Gollwitzer 与 Sheeran 2006 元分析汇总上百项研究显示稳健效应（元分析）
    - 健康、学习、环保等多领域应用研究（S20 政策应用方向）
    conflicting:
    - 线索频繁失效或环境剧变时效果打折；对已被强习惯占据的行为替换较难（边界研究）
    replication:
    - 预注册与多领域复制总体支持。评级按枚举记 A（A- 水平）
    meta_analysis:
    - Gollwitzer 与 Sheeran 2006 元分析是该领域的主要证据汇总
  evidence_grade: A
  boundary_conditions:
  - 目标本身有承诺（执行意图放大动机，不创造动机）
  - if 线索可被稳定识别，then 行动单步可执行
  failure_conditions:
  - 计划过于复杂（多重 if-then 链）导致执行负担
  - 情境大变（换工作、搬家）使线索失效
  common_misinterpretations:
  - 把执行意图等同于定闹钟；核心是情境线索与动作的绑定，闹钟只是线索的一种
  ethical_risks:
  - 营销把 if-then 用于诱导式消费触发（『无聊时打开我们』），将自动化机制用于非用户利益目标
  examples:
    original_cases:
    - 行为公共政策文集中提高疫苗接种、体检等行为达成率的 if-then 应用（S20）
    research_cases:
    - Gollwitzer 的目标 pursuit 实验系列；元分析覆盖的健康与学习任务研究
    modern_cases:
    - 健身社群『下课顺路去健身房』路线规划；学习打卡的『通勤时听一节』绑定设计
  communication_implications: 行动号召给出具体 if-then 模板（『刷完牙后做 10 个深蹲』），把选择成本降为零。
  community_implications: 社群任务的参与说明应包含情境绑定示例，并允许成员自选线索，兼顾自动化与自主感。
  content_applications:
    body: 教程结尾固定给『把这一步放进你已有的一天』的绑定示例
    cta: 『现在选一个你每天都会经过的场景，绑定这个动作』
  platform_implications: 提醒、日历与自动化工具是执行意图的产品化载体；通知泛滥说明许多产品设计只复制了触发器而丢了用户自选线索这一核心。
  related_nodes:
  - goal_setting_effectiveness
  - behavior_model_bmap
  - friction_reduction
  - context_cue_stability
  - habit_loop_cue_routine_reward
  source_ids:
  - S14
  - S20
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Gollwitzer 执行意图研究 + Ryan & Deci 2017（S14，自主内化与目标持续性）+ 政策应用手册（S20）
    effect_size: 如果-那么计划提升目标达成（meta 支持）
    replication_status: 执行意图效应多研究支持（健康/学习/消费场景）
    context_dependency: 线索可及/目标承诺/自主选择调制效应
    downgrade_upgrade_reason: 2026-09 实取 S14 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
  provenance:
    primary_sources:
