  - id: emphasis_vs_equivalence_framing
    canonical_name_en: Emphasis Framing vs Equivalence Framing
    canonical_name_zh: 强调框架与等值框架
    aliases: ["issue framing（议题框架）", "Levin 分类", "框架的类型学"]
    domain: framing
    definition: "Levin, Schneider 与 Gaeth 1998 的框架分类学（分类学文献，未建包）：等值框架（equivalence framing）——同一信息的逻辑等价表述差异（如存活率框架，即 framing_effects 的经典形态）；强调框架（emphasis framing）——从复杂现实的不同侧面选取不同子集呈现（讲就业数据讲哪个行业、讲产品讲哪个卖点），不涉及逻辑等价，而涉及选择性呈现。议程设置研究（McCombs 传统）的属性议程即强调框架的传播学版本。"
    core_claim: "等值框架改变对同一事实的编码（收益vs损失）；强调框架改变事实的构成（说什么不说什么）——后者影响更大、更隐蔽、也更难从伦理上辩护。"
    mechanism: "等值框架作用于单一信息的编码过程（参照点机制；其心理学基础即前景理论的损失厌恶、确定效应、参照点依赖，S01）；强调框架作用于议题的多侧面筛选：现实有无限属性，选择呈现哪些属性即选择受众推理的材料（越强调经济面，评估越按经济逻辑展开）。强调框架的效果通过属性的可达性与权重改变实现——与议程设置的第二层（属性议程设置）同构。等值框架可被对照识破，强调框架则几乎无法被『对照』，因为未被呈现的侧面不在受众的认知现场。"
    causal_chain: "属性子集选择 → 呈现的侧面获得可达性与权重 → 受众按被强调的侧面推理 → 评价与判断偏移"
    variables:
      inputs: [被选择呈现的属性子集, 属性的呈现顺序与篇幅, 等值表述的参照点（等值框架时）]
      moderators: [受众既有知识与对照信源可得性, 议题的复杂性, 媒介生态的多元性]
      mediators: [属性可达性, 属性权重分配]
      outputs: [议题评价改变, 优先级重排, （等值框架时）风险偏好偏移, （强调框架时）议题构成理解改变]
    evidence:
      supporting: ["Levin, Schneider 与 Gaeth 1998 的分类整合（三类框架：risky choice / attribute / goal framing）（分类学文献，未建包）", "属性议程设置的传播学证据（McCombs 传统，S50）", "议程设置研究的量化锚点（S50）：Chapel Hill 研究中媒介报道与公众重要问题判断高度对应（主要项目 r=0.967，次要项目 r=0.979）", "议题框架对政策偏好影响的实验研究"]
      conflicting: ["强调框架的效应在有高知识、多信源对照的受众中减弱", "属性选择的影响在极化议题上被身份立场压过"]
      replication: ["分类学本身被广泛采纳；等值框架的复制状态同 framing_effects", "强调框架多在议题实验中验证，效应量随议题而异"]
      meta_analysis: ["框架研究的整合综述采用并扩展了该分类"]
    evidence_grade: "B"
    boundary_conditions: ["强调框架：受众缺乏对照信源与领域全景时影响最大", "等值框架：低到中卷入、单参照点主导时", "两者都在议题抽象、信息环境单一时增强"]
    failure_conditions: ["受众具备多源对照习惯（强调框架被补全）", "属性间冲突到无法整合（呈现混乱）", "等值框架被透明对照（如双面呈现）"]
    common_misinterpretations: ["把两类框架混为一谈——等值框架是『同一事实换个说法』（可对照识破），强调框架是『选择性呈现事实侧面』（更根本、更难识破）", "误以为强调框架就是撒谎：它是任何传播的必然结构（必须选择），伦理关键在选择性是否系统性地误导"]
    ethical_risks: ["系统性强调框架构成隐性误导（只讲收益面不讲风险面的推荐内容）", "利用强调框架制造对立叙事（同一事件的对抗性侧面选择）"]
    examples:
      original_cases: ["Levin, Schneider 与 Gaeth 1998 的框架分类整合（说服与判断研究传统）", "McCombs 的属性议程设置研究（S50）"]
      research_cases: ["三类框架的对照实验（risky choice / attribute / goal）", "议题侧面选择对政策偏好影响的实验"]
      modern_cases: ["理财产品页面的属性选择：突出历史收益、淡化回撤（强调框架的标准滥用）", "招聘广告的卖点选择（成长空间vs加班文化）", "新闻对同一经济数据的行业侧面选择", "内容创作者的『亮点剪辑』"]
    communication_implications: "强调框架是内容策划的本质工作（必须选择侧面），但可信的长期策略是主动披露『我没说什么』：在结尾列出未呈现的反面侧面，把选择性转为透明性——这在等值框架被普遍识破的 AI 时代是稀缺信任资产。"
    community_implications: "社群的内容规范应明确强调框架的底线（如理财社群要求晒收益必须同时晒回撤）：成员间的内容竞争会自然滑向选择性呈现的军备竞赛，规范把『披露义务』制度化是社群公信力的基础设施。"
    content_applications:
      body: "主动披露侧面清单：文末『本文没讨论的三个反面』——把强调框架的必然选择性做成透明度资产"
      title: "标题的侧面选择与正文承诺一致（标题强调A面，正文必须给足A面并标注B面入口）"
      evidence: "证据呈现遵循属性配平：每个强项侧面配一个限制性侧面（披露义务的最低标准）"
      comments: "对『只说好话』的质疑直接附反面链接，公开维护侧面透明"
    platform_implications: "平台的排序与摘要功能本身就是强调框架的机器（标题+首图+前两行决定呈现侧面）；算法优化点击即优化侧面选择——平台的内容治理（如金融内容的强制风险披露位）是对强调框架滥用的制度化对冲。"
    related_nodes: [framing_effects, metaphor_framing, selective_attention, top_down_attention_guidance, trust_signals_content, gatekeeping_dynamics]
    source_ids: [S50, S01]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "McCombs 2004《Setting the Agenda》（S50，book 级，substantial_excerpt，Chapel Hill 研究 r=0.967/0.979）+ Levin et al. 1998 框架分类"
      effect_size: "属性议程设置（第二层）：媒介强调的属性转移为公众的『该怎么想』"
      replication_status: "议程设置第一/第二层五十余年间大量复制；属性议程在环境传播等议题中稳健"
      context_dependency: "认知层效果；需较长时距与持续报道；社交媒体时代议程主体多元化"
      downgrade_upgrade_reason: "2026-09 实取 S50 议程设置核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S50]
      supporting_evidence: [S01]
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"
