- id: disfluency_deep_processing
  canonical_name_en: Disfluency Leads to Deeper Processing
  canonical_name_zh: 非流畅促进深加工（复制争议）
  aliases:
  - 必要难度滥用版
  - 丑字体效应 —— 与 processing_fluency 的关系：本节点是反流畅性主张，目前复制状态堪忧，默认不得作为建议依据
  domain: processing_fluency
  definition: 该主张认为刻意降低加工流畅性（难读字体、背景噪音、模糊呈现）会迫使受众切换到更系统化的加工模式，从而提升任务表现与记忆。源自 Alter 等的元认知困难研究与 Diemand-Yauman
    等的教学字体实验。
  core_claim: 适度非流畅性触发更审慎的加工并改善学习结果——该主张目前存在严重复制争议，按 E 级处理。
  mechanism: 声称的机制是非流畅体验被解读为此任务需要认真，从而激活分析式加工（S01 的认知紧张轴）；预测是难读条件下的推理与记忆成绩上升。问题在于该解读依赖受众的元认知误归因，而误归因恰是最不稳定的环节。
  causal_chain: 非流畅呈现 → 元认知困难信号 → （声称）分析式加工激活 → 成绩提升（复制存疑）
  variables:
    inputs:
    - 字体可读性
    - 噪音水平
    - 呈现模糊度
    moderators:
    - 加工动机
    - 任务类型
    - 受众水平
    mediators:
    - 元认知困难解读
    - 加工模式切换
    outputs:
    - 推理成绩
    - 记忆成绩（争议中）
  evidence:
    supporting:
    - Alter、Oppenheimer、Epley 与 Eyre 2007 前后的元认知困难实验
    - Diemand-Yauman、Oppenheimer 与 Vaughan 2011 的教室字体实验
    conflicting:
    - 多项独立复制尝试（含预注册研究）未能稳定再现原效应
    - 部分研究发现相反方向：难读文本降低学习动机与坚持时间
    replication:
    - 登记为复制争议节点：原始实验室效应与真实课堂效应之间存在明显落差，效应可能由新颖性或样本特征驱动；在更可靠的证据出现前，本节点仅用于讨论为什么该说法不可靠
    meta_analysis: []
  evidence_grade: E
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 即使效应真实，也仅存在于已有加工动机的受众与适度非流畅范围内
  - 对必须完整阅读的功利性文本，可读性研究强烈支持高流畅
  failure_conditions:
  - 低动机受众遇到非流畅直接放弃——完读率与转化双输
  - 把非流畅当作深度滤镜，实际筛掉的是耐心而非不加思考者
  common_misinterpretations:
  - 把内容做难读显得高级、能筛选真思考者——对营销与传播场景大概率只降低完读率
  - 把 Bjork 的必要难度错当成呈现难读——必要难度指提取与练习难度，不是字体难度
  ethical_risks:
  - 劝退式设计伪装严谨，实际上只是筛选出忍耐力高的付费者
  examples:
    original_cases:
    - S01 对认知紧张与系统 2 激活的论述是该主张的理论背景
    research_cases:
    - 字体实验：难读字体的学习材料组报告了更好的测验成绩，但后续独立复制结果分歧
    modern_cases:
    - 知识产品的硬核排版风潮（评价为伪需求）；以高密度难读文本冒充学术严谨的营销内容
  communication_implications: 在证据落定前，不要为传播场景设计非流畅内容；若目标真的是深思，用提问与自测（testing_effect）比用丑字体可靠得多。
  community_implications: 社群学习材料坚持高可读性，深度的实现靠任务设计而非呈现障碍。
  content_applications:
    body: 保持高可读；把难度放进练习与提问，而不是放进字体
    cta: 用自测题制造有益的提取难度
  platform_implications: 平台完读率与停留指标会直接惩罚非流畅设计，使该主张在真实流量环境中更难以成立。
