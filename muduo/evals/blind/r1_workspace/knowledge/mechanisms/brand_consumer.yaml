    effect_size: 长尾『可服务』成立（亚马逊 1/4 销售额来自尾部）；『长尾胜过头部』被修正（Elberse）
    replication_status: 长尾效应在数字货架中方向成立；头部集中度随平台算法强化（2025 流媒体数据）
