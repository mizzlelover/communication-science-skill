- id: context_cue_stability
  canonical_name_en: Context Cue Stability
  canonical_name_zh: 情境线索稳定性
  aliases:
  - 情境稳定性
  - 线索绑定
  - context-dependent habit
  domain: habit
  definition: 习惯与执行情境（时间、地点、前序动作、情绪状态）绑定：情境稳定则习惯巩固，情境改变则习惯松动。Wood 团队的研究显示，情境剧变是习惯中断与重建的机会窗口（S110 载『可通过改变环境/摩擦干预习惯』『改变需环境重组』；『搬家研究』细节为
    EP 摘录外内容）；Lally 等 2010 的追踪显示自动化程度与情境重复性相关。与 habit_loop_cue_routine_reward 的关系：习惯回路是三要素框架，本节点聚焦其中『线索』的稳定性维度。
  core_claim: 行为自动化的维持依赖触发情境的稳定；情境改变既破坏旧习惯，也为新习惯提供插入点。
  mechanism: 情境线索是习惯的检索键：重复在同一情境中执行行为，使情境表征与反应强关联；情境消失则检索失败，行为回到需要意图驱动的状态；反过来，在无旧习惯的新情境中，行为选择更开放，是植入新行为的窗口（S110，其
    boundary_conditions 载『改变需环境重组/减少线索』）。
  causal_chain: 情境稳定+重复执行 → 线索-反应强关联 → 自动化维持；情境改变 → 旧习惯检索失败 → 新行为可植入
  variables:
    inputs:
    - 时间/地点/前序动作的稳定性
    - 情境剧变事件
    moderators:
    - 行为复杂度
    - 替代行为的可得性
    - 个体意向强度
    mediators:
    - 线索-反应关联强度
    - 检索成功概率
    outputs:
    - 习惯维持率
    - 新行为植入成功率
  evidence:
    supporting:
    - Wood 团队关于情境改变与习惯中断的研究（搬家研究等，现场观察）
    - Lally 等 2010 追踪中自动化与情境重复的关联（现场追踪）
    conflicting:
    - 强意图与支持系统可部分对冲情境变化的影响（边界研究）
    replication:
    - 方向稳健；效应幅度因行为类型差异大。评级按枚举记 B
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 适用于情境触发的日常行为；对身份驱动的高卷入行为解释力有限
  - 新习惯植入需在新情境中有明确的执行计划
  failure_conditions:
  - 在旧情境未变时强行插入新行为，与旧习惯竞争而失败
  - 平台改版或社区迁移摧毁线索生态，用户行为断档
  common_misinterpretations:
  - 把习惯失败归因于意志力；多数失败是线索环境管理问题
  ethical_risks:
  - 平台刻意垄断用户的情境线索（全时段推送、仪式劫持）压缩其自主安排空间
  examples:
    original_cases:
    - Tiny Habits（S16）的锚点（anchor）设计：把新行为绑定既有日常动作
    research_cases:
    - Wood 团队的搬家与习惯改变研究
    modern_cases:
    - 搬家季的健身卡转化窗口、换机迁移、社群固定栏目时间表
  communication_implications: 发布时间稳定化是免费的习惯工程：固定时段+固定栏目名，让用户的生活时段成为你的触发器。
  community_implications: 重大产品改版或迁移时，主动重建线索（旧时间新入口的提醒与仪式），否则活跃度断崖。
  content_applications:
    body: 把新行为绑定到受众已有的稳定动作上（『刷完牙后打开今日三分钟』）
    cta: 提醒文案写明具体情境触发：『午休开始时，先看这 3 行』
  platform_implications: 平台通过时间锚定的功能设计（晨间摘要、睡前模式）占据用户的时段线索；时段所有权是注意力竞争的深层战场。
  related_nodes:
  - habit_loop_cue_routine_reward
  - encoding_specificity
  - implementation_intentions
  - friction_reduction
