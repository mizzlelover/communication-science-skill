source_id: S120
title: "An Integrative Theory of Intergroup Conflict"
authors: "Henri Tajfel; John C. Turner"
year: 1979
journal: In W. Austin & S. Worchel (Eds.), The Social Psychology of Intergroup Relations (pp. 33-47). Brooks/Cole
doi: "无 DOI（书章）"
