- id: fluency_truth_effect
  canonical_name_en: Illusory Truth Effect (Fluency-based Truthiness)
  canonical_name_zh: 流畅性致真错觉（虚幻真相效应）
  aliases:
  - 虚幻真相
  - illusory truth —— 与 availability_heuristic 的区别：易得性是提取容易度影响频率与概率判断，本效应是重复造成的知觉流畅性影响真值判断
  domain: processing_fluency
  definition: 重复陈述更易被判断为真。Hasher、Goldstein 与 Toppino 1977 首次系统报告；后续研究显示即使人们初始明知为假、或已被明确更正，重复仍会推高主观真值。这是错误信息传播最核心的认知机制之一。
  core_claim: 单纯重复即可提高陈述的主观真值，且这一效应在已知为假的情况下也不会完全消失。
  mechanism: 重复提高知觉与概念流畅性，真值判断把流畅误归因为证据强度——感觉像真即被判定为真。与 mere_exposure 共享机制但输出不同：那里输出好感，这里输出真值。重复与更正之间的时间间隔越长，效应越强，这解释了辟谣的困难。
  causal_chain: 重复接触 → 流畅性提升 → 误归因为证据 → 主观真值上升
  variables:
    inputs:
    - 重复次数
    - 重复时间分布
    - 知识水平
    moderators:
    - 与已有知识的一致性
    - 判断时间压力
    - 更正时机
    mediators:
    - 知觉与概念流畅性
    outputs:
    - 主观真值
    - 分享倾向
    - 记忆持久性
  evidence:
    supporting:
    - Hasher、Goldstein 与 Toppino 1977 的首证实验
    - Dechêne 等对真值效应的元分析综述
    - 后续研究显示知识不能完全保护判断不被重复侵蚀
    conflicting:
    - 高知识领域内效应减弱；重复与判断间隔极短或极长时效应变化
    replication:
    - 效应在实验室与部分现场研究中稳健复制，是错误信息研究的支柱发现
    meta_analysis:
    - 元分析确认平均效应为正，且受知识一致性等调节
  evidence_grade: A-
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 对知识感强的主题效应减弱但未消失
  - 重复与判断间隔适中时最强（太近无遗忘，太远流畅性衰减）
  failure_conditions:
  - 高警觉状态（明确被提醒重复即误导）下效应被抵消
  - 反驳信息若同样被重复，也可能反向获得真值加成
  common_misinterpretations:
  - 辟谣一遍就完事——重复谣言的辟谣文可能反而强化谣言的真值感
  - 以为只有无知者受影响——知识不能完全免疫，只能减弱
  ethical_risks:
  - 谣言工厂的策略性重复（bot 矩阵、多账号复读）直接利用本机制
  - 政治与商业抹黑中的谎言复读策略
  examples:
    original_cases:
    - S92 对错误信息在社交媒体传播速度的实验研究背景
    research_cases:
    - 真伪陈述混合呈现的判断实验：重复出现的陈述真值评分系统性上升
    modern_cases:
    - 重要的事说三遍的梗文化；健康谣言在家族群的周期性复读
  communication_implications: 辟谣的黄金法则是用流畅的新叙事替代旧叙事，而不是重复旧叙事加否定词；传播设计中要规划重复的是正确版本。
  community_implications: 社群辟谣需要多次、跨触点的重复更正，并避免转发原谣言截图（重复即喂养）。
  content_applications:
    title: 标题直接陈述正确事实，不用否定句复述谣言
    body: 更正信息以独立叙事呈现，把谣言压缩为一句脚注
    opening: 先给正确模型再谈错误版本，让正确版本占据流畅性优势
    evidence: 重复关键事实至少三次（间隔分布）以建立真值
  platform_implications: 平台的谣言标签与降权是对本机制的工程对抗；但去重策略与辟谣触达的时间差仍是结构性难题。
