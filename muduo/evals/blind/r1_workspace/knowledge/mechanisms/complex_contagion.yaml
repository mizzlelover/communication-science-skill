# complex_contagion — 复杂传染（Complex Contagion）：行为为什么需要多重社会确认
domain: complex_contagion
nodes:
- id: complex_contagion
  canonical_name_en: Complex Contagion
  canonical_name_zh: 复杂传染
  aliases:
  - 复杂传播
  - wide-bridges contagion
  domain: complex_contagion
  definition: 复杂传染（complex contagion）指需要来自多个邻居的多重确认/强化才会被采纳的行为传播——与 simple contagion（简单传染：一次接触即可传播，如消息、疾病、梗）相对。Damon
    Centola 与 Michael Macy 于 2007 年提出该框架，Centola 2010 年发表于《Science》的健康行为网络实验提供了关键实验证据：行为在聚类（高密度）网络中比在随机网络中传播得更广。
  core_claim: 信息走窄桥（单条弱连接即可），行为走宽桥：需要社会成本与多重确认的行为，在高度聚类、多重强连接的网络中传播得远比在随机长程连接网络中好。
  mechanism: 采用一个有社会风险或成本的行为（健康习惯、新技术、抗议参与）会带来质疑、成本与不确定性，单次接触提供的证据不足以克服；来自多个不同来源的重复强化同时提供「确认 + 支持 + 规范许可」，才使个体跨过采用门槛。因此传播路径的结构很关键：聚类网络让接触者被多个已采用者包围（强化充足），而长程桥接网络虽快但接触者只有孤立的单一来源（强化不足，传播常在桥的远端熄火）。这与
    weak_ties_strength 的信息逻辑形成明确对照——那是 simple contagion 的世界。
  causal_chain: 多重社会确认（多个已采用邻居）→ 采用成本与风险被覆盖 → 个体采用 → 接触面内强化密度上升 → 行为在网络中持续传播
  variables:
    inputs:
    - 行为的社会成本/风险
    - 邻居中已采用者数量与可信度
    moderators:
    - 网络聚类程度
    - 接触的可信性与多样性
    - 行为身份显著性
    mediators:
    - 社会强化累积
    - 规范许可感
    outputs:
    - 行为采用率
    - 传播在网络中的广度与持续性
  evidence:
    supporting:
    - Centola & Macy 2007 的理论框架：宽桥（wide bridges）假说（经典论文）
    - Centola 2010《Science》健康社交网络实验：聚类网络中健康行为传播显著广于随机网络（受控网络实验）
    - Centola 团队 2018 年发表于《Science》的大规模广域田野实验：围绕劝说式接触（含逐户上门式劝投方向）推动社会惯例转变，发现少数派规模越过临界点后惯例发生转变（对应 S124
      centola2018tipping；方向性证据，不给数字）
    - 关于深度劝说（deep canvassing）式重复人际对话的田野研究显示多次深入接触可产生较持久的态度改变（方向性证据；库外方向性文献，无对应 EP）
    conflicting:
    - 并非所有行为都是复杂传染：低成本、低风险行为（点击、转发、兴趣表达）更接近简单传染逻辑（研究讨论）
    - 大型观测数据中区分复杂传染与同质性仍困难（方法学讨论）
    replication:
    - 聚类网络促进行为传播的发现被多项后续网络干预实验复制（包括健康、合作与投票领域，方向一致）
    meta_analysis: []
  evidence_grade: A-
  boundary_conditions:
  - 适用于需要克服社会成本、不确定性或规范阻力的行为（健康习惯、新技术、公开表态）；纯信息类内容遵循简单传染
  - 需要接触者能感知「多个来源」的独立性；同一人反复劝说效果远低于多个来源的独立确认
  failure_conditions:
  - 把行为传播当信息传播做「广播式投放」：触达广但强化密度为零，采用率低
  - 强行为进窄桥：只靠一个 KOL 或一条爆款内容推动有社会风险的行为，传播常在桥远端消失
  common_misinterpretations:
  - 「病毒式传播=行为会跟着火」——爆款内容（简单传染）与行为采纳（复杂传染）遵循不同网络逻辑，前者不保证后者
  - 把 complex_contagion 与 social_reinforcement 混为一谈：social_reinforcement 是复杂传染的内在微观机制（多重确认如何起作用），complex_contagion
    是传播过程层面的分类框架
  ethical_risks:
  - 多重确认机制可被操纵：制造大量虚假独立来源（机器人、演员）伪装社会共识，驱动高风险行为采纳
  examples:
    original_cases:
    - Centola 2010 健康网络实验：受试者被随机分配到聚类 lattice 网络或随机网络中报名健康论坛（实验描述见《How Behavior Spreads》）
    research_cases:
    - Centola 2018 年 Science 广域实验：劝说式接触推动社会惯例转变的临界点方向发现
    - 南布朗克斯宽带采用网络干预（《How Behavior Spreads》记述）
    modern_cases:
    - 社区团购的「楼栋多人已拼」比「全网爆火」更能促成下单
    - 线下活动报名显示「同小区/同公司已有 N 人参加」提高转化
  communication_implications: 对行为类目标（打卡、购买、投票、参与），传播设计的关键不是触达量而是「目标人群身边的确认密度」：让用户一次接触中看到多个可信来源已采用（群内多人晒单、评论区多人真实反馈）。
  community_implications: 把新行为先「种」进社群的强连接小团内再外溢：聚类子群是行为传染的孵化器；大水漫灌式广而告之对行为改变几乎无效。
  content_applications:
    body: 正文展示多个独立可信来源的采用证据（不同身份、不同时间的真实反馈），制造多重确认
    narrative: 讲述「一个人身边先后有几个人都这样做了，TA 才跟着做」的过程，示范复杂传染的真实形态
    sharing: 分享卡片展示参与人数结构（多少同小区/同行/同龄人），而非单纯总数
    comments: 运营促成多位真实用户的独立反馈（而非一人刷屏），评论区是复杂传染的强化场
  platform_implications: 推荐算法天然是简单传染的机器（一次曝光即可触达），对复杂传染的「多重确认」不敏感；社群、私域与线下接触是行为改变不可替代的强化结构（原则性判断）。
