- id: normative_influence
  canonical_name_en: Normative Influence
  canonical_name_zh: 规范性影响
  aliases:
  - 规范性社会影响
  domain: social_proof
  definition: 社会影响的两大路径之一（对应 informational_influence）：人们为获得认可、避免排斥而趋同于群体的显性期待——即使私下保留原判断。区分于信息性影响的核心：规范性影响改变公开行为而不必然改变真实信念。
  core_claim: 群体接纳的奖赏与排斥的威胁足以扭曲公开行为，即使个体私下并不认同；其强度由群体吸引力与个体归属需求决定。
  mechanism: 人类演化出对社会排斥的敏感性（排斥威胁激活类似生理疼痛的困扰）；被重要群体接纳是基本需求（need to belong）。当群体期待明确且成员在意归属时，公开表态趋同以维持关系资产。这与承诺一致性机制交互：公开表态一旦做出，后续会经认知失调而部分内化——顺从可能演变为真实态度改变。
  causal_chain: 群体期待明确 + 个体在意归属 → 公开行为趋同（私下可能不变） → 公开承诺 → 经失调减少而部分内化
  variables:
    inputs:
    - 群体显性期待
    - 公开/私密情境
    - 群体监督与反馈
    moderators:
    - 群体吸引力与重要性
    - 个体归属需求
    - 表态的公开性与记录性
    mediators:
    - 对排斥的恐惧
    - 获得认可的期待
    - 自我呈现需求
    outputs:
    - 公开顺从
    - 表态性参与（点赞、转发）
    - 部分态度内化（经公开承诺）
  evidence:
    supporting:
    - Asch 实验中写答条件（私下作答）显著降低从众率——规范性压力的核心载体是公开性（Asch 后续变式实验，未建包）
    - Schachter 对持异见者被排斥的群体动力学研究（社会影响研究传统；Schachter 异见者排斥研究，未建包）
    - 排斥研究（ostracism）：被排斥感迅速降低归属与自尊（社会心理学教材综述）
    conflicting:
    - 低归属需求或群体无关情境中规范性压力趋零
    - 公开表态若引发逆反（reactance）可反向驱动独立表态
    replication:
    - 规范性影响的公开/私密分离效应在多范式中重复
    - 排斥效应的稳健性在神经与行为层面均有支持
    meta_analysis:
    - 无独立 meta-analysis；并入社会影响综述（S31）
  evidence_grade: A-
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 群体对个体重要且期待显性
  - 表态公开且被记录
  - 个体有较强归属需求
  failure_conditions:
  - 匿名或私密作答场景
  - 群体对个体无吸引力或可轻易退出
  - 公开表态被群体惩罚的预期大于奖励
  common_misinterpretations:
  - 误以为公开表态=真实态度改变——规范性影响常只改变外显行为，私下信念可能不变
  - 把规范性影响与信息性影响混为一谈，导致用错杠杆（该给证据时给了压力）
  ethical_risks:
  - 利用群体压力强制表态（站队文化）
  - 以排斥威胁运营社群（不转发的不是真粉）
  examples:
    original_cases:
    - Asch 实验中的公开压力条件（S21、S31 收录）
    - Schachter 的异见者排斥研究传统
    research_cases:
    - 公开 vs 私下作答的从众率对比实验
    - 网络排斥（cyberostracism）对归属感的影响研究
    modern_cases:
    - 直播间点名式互动（让被点名者公开表态后更难离开）
    - 社群打卡与接龙机制
    - 粉丝群体的表态性消费（不买不是真粉）
  communication_implications: 设计公开表态的轻量入口（投票、打卡、贴纸）能利用规范性影响启动行为；但要清楚：靠表态获得的行为在失去群体监督时可能回退——需配合理性内容内化。
  community_implications: 社群通过接纳/排斥机制塑造行为：新手公开自我介绍、打卡接龙、仪式化参与都是规范性影响的制度化应用；应让公开行为的方向与成员长期利益一致，而非仅收割表态。
  content_applications:
    cta: 用轻量公开表态启动参与：『在评论区打个 1，我看看有多少人想看下篇』
    comments: 对表态行为给予即时接纳反馈（回复、置顶、点名感谢），强化规范性循环
    body: 把关键行为设计为公开可记录形式（打卡图、里程碑徽章），借规范性影响固化习惯
  platform_implications: 平台的公开互动（点赞、转发、评论）是规范性影响的默认载体；算法记录与展示公开表态（『好友都在看』），把规范性压力嵌入产品结构，同时也放大表态与真实态度的分离。
