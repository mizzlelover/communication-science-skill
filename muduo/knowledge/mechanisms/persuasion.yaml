  - id: self_persuasion
    canonical_name_en: Self-Persuasion
    canonical_name_zh: 自我说服
    aliases: ["自我生成说服", "self-generated persuasion", "role-playing 说服效应"]
    domain: persuasion
    definition: "个体通过自己生成论点、扮演态度角色或为自己得出结论而发生的说服——说服源是自我而非外部。从 Aronson 与 Janis 的角色扮演实验到自我生成论点研究，证据显示自我生成的论证比接收同样内容的外部论证产生更强的态度改变。"
    core_claim: "人们更相信与自己得出的结论（哪怕引导过程被设计）；说服的最强形态是让对方以为是自己想通的。"
    mechanism: "三个通道：（1）认知投入——生成的论点经历了自己的认知检验，被归因为自己的想法（无外部归因折扣）；（2）一致性压力——公开或内在化的自我陈述触发承诺一致性；（3）角色扮演——在角色中行为（为新立场辩护）经自我知觉反推态度（我这么卖力辩护，说明我真信）。与中心路径加工的区别：中心路径是审视外来论据，自我说服是生成论据——后者多了一层『我的想法』的归因保护。"
    causal_chain: "引导性任务（提问/角色/辩论任务） → 受众自己生成论点或扮演立场 → 自我归因（这是我说的） → 态度向生成内容对齐 → 强且持久的态度改变"
    variables:
      inputs: [引导性提问, 角色扮演任务, 辩论任务（为己方立场辩护）, 选择权的赋予]
      moderators: [生成过程的自主感, 任务的方向引导隐蔽性, 受众的表达能力]
      mediators: [自我归因, 认知投入深度, 一致性压力]
      outputs: [强态度改变（强于被动接收）, 行为预测力, （过度引导被识破时）逆反与被操纵感"]
    evidence:
      supporting: ["Aronson 与 Janis 的角色扮演实验：为不熟悉立场写文章/演讲者，态度向该方向显著改变（经典文献，未建包）", "自我生成论点与被动接收同样论点的对比研究：生成组的更强态度改变", "苏格拉底式提问传统（经典文献，未建包）"]
      conflicting: ["生成质量差（想不出好论点）时效果弱于优质外部论证", "引导痕迹过明显触发被操纵警觉与逆反"]
      replication: ["角色扮演与自我生成说服的基本效应在多研究重复", "效应量中等，对引导设计质量敏感"]
      meta_analysis: ["主动生成vs 被动接收说服的元整合支持生成优势（认知反应传统）"]
    evidence_grade: "B+"
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions: ["受众能生成合理论点（有素材与能力）", "引导过程保有自主感（非明显操纵）", "议题与受众有基础相关性（否则无从生成）"]
    failure_conditions: ["受众无从生成（零知识冷启动）——此时需要先给外部论据", "引导被识破（明显的钓鱼式提问）触发逆反", "生成的论点反方向（引导失控产出反对论点）"]
    common_misinterpretations: ["把自我说服等同于『套路提问』——机械化的引导式问题（你想不想变好？想！）是话术，真自我说服需要真实的生成与探索空间", "忽视风险面：自我说服机制同样被邪教与传销利用（让学员自己说出道理）"]
    ethical_risks: ["操纵性引导设计（预设结论的钓鱼问题链）", "利用角色扮演使人内化损害自身利益的立场（传销的自我合理化）"]
    examples:
      original_cases: ["Aronson 与 Janis 的角色扮演说服实验（经典文献，未建包）", "认知反应传统中的自我生成论点研究"]
      research_cases: ["为陌生立场写文章后的态度改变实验", "自我生成论点vs 被动阅读的对比实验"]
      modern_cases: ["教练式销售（提问让客户自己说出需求）", "社群的复盘文化（自己写总结=自我说服）", "打卡与公开立誓（自我承诺+一致性）"]
    communication_implications: "内容的最高形态不是陈述而是提问：把核心结论转化为读者自己回答的问题（你觉得哪种更适合你？）；留白与填空结构（你来补全这个清单）比完整陈述产生更强的认同。"
    community_implications: "社群的最强说服场景是成员共创：让成员自己写方法、讲经验、主持讨论——运营者退为提问者与结构设计者；成员在共创中完成自我说服，其态度强度远超被动接受运营结论。"
    content_applications:
      body: "以问题链推进正文：每节以设问开头、案例后留思考题——读者的回答就是自我生成的论点"
      cta: "CTA 转化为承诺句式：『在评论区写下你打算从哪一步开始』——写下的承诺经自我说服强化"
      opening: "开场提问替代断言：『你觉得这件事的最大障碍是什么？先别看下文，想 10 秒』"
      comments: "楼主用追问深化评论（你为什么这么判断？），让评论者完成二次自我生成"
    platform_implications: "平台的互动组件（投票、问答、弹幕）是自我说服的规模化基础设施；UGC 生态的本质是让用户在生成内容中完成对自己的说服——这是用户原创内容比官方内容更有说服力的机制根源。"
    related_nodes: [central_route_processing, commitment_consistency, cognitive_dissonance, rhetorical_question_engagement, elaboration_likelihood_model, foot_in_the_door, participation_ladder]
    source_ids: [S35]
    last_verified: "2026-09-09"
    provenance:
      primary_sources: ['S35']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: pre_suasion_attention_channeling
    canonical_name_en: "Pre-Suasion: Attention Channeling"
    canonical_name_zh: 预说服（先导注意引导）
    aliases: ["pre-suasion", "先导注意力引导", "privileged moment for persuasion"]
    domain: persuasion
    definition: "Cialdini 在《Pre-Suasion》中提出的概念：在说服信息呈现之前，先导性引导（提问、情境、线索）将注意力锚定于某些联想，使后续说服在已被预备的心理土壤上进行——『重要的不是说什么，而是先让什么被想到』。"
    core_claim: "先导注意引导改变说服的接受度；但部分底层证据（priming 类）在复制危机中大幅缩水，该框架的实操价值需按条件谨慎使用。"
    mechanism: "注意即筛选：被引导到前景的联想成为解释后续信息的框架。两类相对稳健的通道：（1）注意与关联性引导——问『你觉得自己乐于尝试新事物吗』激活开放自我图式，使后续创新产品推荐更顺；（2）稀缺与未完成（Zeigarnik）的注意锁定。而部分经典通道（如行为 priming：环境线索直接激活行为的部分早期证据）在大规模复制项目中失败——引用与使用该框架时必须区分通道的稳健性。"
    causal_chain: "先导线索/提问 → 注意与联想被锚定 → 后续信息在激活的框架下被解释 → 说服接受度提升（通道稳健时）"
    variables:
      inputs: [先导提问, 情境与场景线索, 序位安排（什么先呈现）]
      moderators: [通道类型（注意引导vs 行为 priming——后者证据弱）, 引导的自然度（被识破失效）, 个体差异（自我意识水平）]
      mediators: [注意锚定, 联想可达性（accessibility）, 解释框架的激活]
      outputs: [说服接受度提升, 议题相关联想的优先级, （通道不稳时）效应不可重复]
    evidence:
      supporting: ["Cialdini《Pre-Suasion》整合的注意引导案例与实验（S33）", "关联性提问提升后续信息接受的研究（自我图式激活方向）", "注意与记忆的认知基础（注意瓶颈、可达性）本身是 A 级证据"]
      conflicting: ["行为 priming 的大规模复制失败（复制危机核心案例之一，见 EVIDENCE.md：E→谨慎）", "先导效应的幅度对情境与个体差异敏感，营销外推常夸大", "部分书中引用的原始研究本身在复制复核中被降级"]
      replication: ["注意引导与联想可达性的通道有认知心理学稳健基础", "『先导线索直接改变行为』的强主张复制失败——使用时必须限定在注意/联想/框架通道"]
      meta_analysis: ["priming 类的大规模注册复制项目（多团队协作）报告效应远小于原始文献，行为 priming 基本不可重复"]
    evidence_grade: "C"
    boundary_conditions: ["限于注意引导与联想激活通道（问什么让受众想到什么）", "引导自然且不被识破为操纵", "后续信息与被激活的联想真实相关（否则落差反噬）"]
    failure_conditions: ["依赖行为 priming 类通道（复制失败的证据基础）", "引导被识破（『他在给我下套』触发逆反）", "先导框架与后续内容脱节（联想错位）"]
    common_misinterpretations: ["把 pre-suasion 当万能前置咒语——其稳健部分（注意引导、提问锚定）价值真实，但其引用的部分 priming 证据已崩塌", "忽视通道区分：『先问开放性问题再推销』（注意引导，可用）与『放个信任符号在页面让人自动变诚实』（行为 priming，不可靠）是两回事"]
    ethical_risks: ["隐蔽的操纵性引导（预埋联想再收割，且受众全程无察觉）", "利用注意锁定制造虚假的『重要时刻』（伪稀缺的先导铺垫）"]
    examples:
      original_cases: ["Cialdini《Pre-Suasion》的先导注意框架（S33）"]
      research_cases: ["关联性自我图式提问的先导实验（S33 引述）", "注意瓶颈与联想可达性的认知基础研究"]
      modern_cases: ["落地页先问痛点问题再给方案（提问式开头）", "直播间先讨论『选品的坑』再上链接", "标题以痛点疑问开头，正文承接"]
    communication_implications: "稳健用法：内容开头的问题决定读者的注意方向——问『你有没有过X经历』比断言『X很常见』更能激活相关联想；先导引导与正文主张必须同向，否则识破即反噬。不可依赖：环境符号自动改变行为的 priming 式设计。"
    community_implications: "社群的议程设置就是制度化的 pre-suasion：先讨论什么话题决定了成员的联想与判断框架；运营者对『本周先抛什么问题』的选择本身就是说服设计，应与社群真实价值同向使用。"
    content_applications:
      opening: "开场以同向提问锚定注意：『你上一次认真复盘是什么时候？』（先激活复盘的自我联想，再谈方法论）"
      title: "标题用疑问先导：『为什么高手都在做X？』——注意锚定在X与高手的关联上"
      body: "关键论点前先铺垫其联想物（讲复利前先讲时间的不可逆），让论点落在已激活的土壤上"
      visual: "视觉先导与主题同向（金融内容先呈现时间/成长意象而非混乱图表），但不依赖符号的『自动效应』"
    platform_implications: "平台的封面、前3秒、标题卡是 pre-suasion 的制度化入口；算法用完播率惩罚先导失当（联想错位即跳出）——平台以数据反馈强制了先导与内容的对齐，这是对 pre-suasion 滥用的自然约束。"
    related_nodes: [selective_attention, top_down_attention_guidance, elaboration_likelihood_model, attitude_strength_accessibility, framing_effects, curiosity_gap]
    source_ids: [S33, S01, S34, S126]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Cialdini《Pre-Suasion》（S33）+ Doyen et al. 2012 行为启动复制失败（S126，paper 级，OA 全文：实验 1 失败/实验 2 期望效应）"
      effect_size: "注意/联想通道稳健；行为 priming 类通道复制失败（E→谨慎）"
      replication_status: "注意引导与联想可达性有认知基础；『先导线索直接改变行为』未获复制"
      context_dependency: "限注意引导与联想激活通道；引导被识破即失效"
      downgrade_upgrade_reason: "2026-09 补充 S126（行为启动复制失败）作为通道区分的关键边界证据，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S33]
      supporting_evidence: [S126, S01]
      last_verified: "2026-09"
    last_reviewed: "2026-09"
