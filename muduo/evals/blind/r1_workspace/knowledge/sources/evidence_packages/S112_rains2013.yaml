source_id: S112
title: "The Nature of Psychological Reactance Revisited: A Meta-Analytic Review"
authors: "Stephen A. Rains"
year: 2013
journal: Human Communication Research 39(1), 47-73
doi: "10.1111/j.1468-2958.2012.01443.x"
url: "https://academic.oup.com/hcr/article/39/1/47-73/4093682"
