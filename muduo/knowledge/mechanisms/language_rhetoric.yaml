  grade_justification:
    independent_studies: 亚里士多德《论修辞》（S66，book 级，公版 Kennedy 英译：ethos/pathos/logos 三诉求）+ ELM 信源研究（S34）
    effect_size: 可信度（ethos）→启发式接受；情感（pathos）→情绪反应驱动判断；逻辑（logos）→论证质量（中央路径）
    replication_status: 三诉求作为说服分类沿用 2500 年；现代实证（ELM/信源可信度）与 ethos/logos 双路径对应
    context_dependency: 三诉求需与受众/情境（kairos 时机）匹配；组合使用最强
    downgrade_upgrade_reason: 2026-09 实取 S66 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
