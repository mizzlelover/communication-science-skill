  grade_justification:
    independent_studies: Thaler 2015（S12，planner-doer 自控模型/现时偏好）+ Thaler & Sunstein 2008（S11，默认与承诺装置）
    effect_size: 即时收益贴现率高于延迟收益（双曲线贴现经典）
    replication_status: 现时偏差为行为经济学稳健发现（贴现实验传统）
    context_dependency: 承诺装置/退出成本/诱惑显性调制
    downgrade_upgrade_reason: 2026-09 实取 S12 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
