research_question: "习惯的认知、动机与神经生物学属性是什么？习惯如何与有意识目标追求交互？"
core_claims:
  - "习惯是人们在重复情境中重复同一反应形成的自动行为倾向"
  - "习惯与有意识目标追求以三种方式交互：①习惯在目标追求中形成（重复同一反应）②计算模型显示习惯与目标追求协同引导行动，习惯是高效默认模式 ③人们常从习惯执行频率推断行为必属有意"
  - "习惯自动性由情境线索触发；可通过改变环境/摩擦干预习惯"
  - "综述覆盖习惯自动性、形成机制（联想+奖赏学习）、测量、计算模型、神经机制、压力/成瘾、改变干预"
method: "Annual Review of Psychology 综述：整合认知、动机、计算（model-free RL）、神经影像证据"
results: "（综述）习惯=线索驱动的自动反应，是行为改变的默认高效通道；习惯强度=行为频率×情境一致性"
limitations: "综述非新实验；测量方法（习惯强度量表）效度有讨论"
boundary_conditions: "习惯形成需情境稳定+行为重复；改变需环境重组（减少线索）或摩擦调整"
