- id: self_presentation_impression_management
  canonical_name_en: Self-Presentation / Impression Management
  canonical_name_zh: 自我呈现与印象管理
  aliases:
  - 拟剧论
  - dramaturgy
  - Goffman 拟剧论
  domain: identity
  definition: Goffman 在《日常生活中的自我呈现》提出的拟剧论（dramaturgy）：社会生活类似剧场，个体在『前台』按社会期望管理形象，在『后台』卸下表演；印象管理（impression
    management）是人们有意无意地控制他人对自己形成印象的过程。
  core_claim: 人的公开行为很大程度上是面向观众的表演，观众缺席时表演会松弛甚至反转。
  mechanism: 个体依据特定观众与舞台定义选择表演区域（front stage / back stage），通过服饰、语言、互动仪式维持『人设』；表演一旦穿帮（失面子）会触发补救行为。社交媒体把前台观众不可见地聚合（context
    collapse，情境坍缩），使印象管理的难度与风险上升：一个面向所有观众的表演必须更含糊、更安全。
  causal_chain: 观众在场 → 表演动机 → 形象管理行为 → 他人印象形成 → 正/负反馈调节后续表演
  variables:
    inputs:
    - 观众构成与可见度
    - 舞台规范
    - 面子 stakes
    moderators:
    - 观众同质性
    - 匿名性
    - 记录与存档可能性
    - 自尊与自我监控水平
    mediators:
    - 面子关切
    - 人设一致性需求
    outputs:
    - 选择性自我暴露
    - 印象修饰行为
    - 失面子后的补救/退场
    - 后台行为转移至私密空间
  evidence:
    supporting:
    - Goffman 的互动民族志观察（S24）奠定了剧场模型，日常互动中广泛可辨
    - 社交媒体研究：匿名度与观众可见度改变自我呈现的强度与真实感
    - 自我监控（self-monitoring）个体差异研究支持印象管理倾向的稳定存在
    conflicting:
    - 印象管理难以完全解释无观众的私人行为；纯内驱行为（兴趣、习惯）表现较少表演性
    - 部分线上行为更真实而非更表演（匿名披露研究）
    replication:
    - 剧场框架作为观察模型被反复应用于线上行为研究
    - 量化复制的难点在于表演强度缺乏统一测量
    meta_analysis:
    - 无统一 meta-analysis；以理论应用研究与质性证据为主
  evidence_grade: B
  boundary_conditions:
  - 存在可感知的观众与互动预期时最强
  - 高面子 stakes 场景（求职、婚恋、公开社群）表演强度更高
  - 匿名小圈子里表演让位于自发表达
  failure_conditions:
  - 完全匿名且无记录的情境
  - 表演成本远高于收益的低利害互动
  - 观众因长期接触而拆穿人设的亲密关系
  common_misinterpretations:
  - 把印象管理等同于『虚伪』——Goffman 认为表演是社会协作的常规部分，不是道德缺陷
  - 误以为线上人设必然崩塌；稳定舞台与稳定观众可长期支撑稳定人设
  ethical_risks:
  - 利用失面子恐惧实施社交操控（人肉、挂人、公开处刑）
  - 以『真实』之名贩卖人设，长期侵蚀信任生态
  examples:
    original_cases:
    - Goffman《日常生活中的自我呈现》的前台/后台、互动仪式与面子工作（S24）
    research_cases:
    - 自我监控与表演倾向的个体差异研究传统
    - 情境坍缩情境下青年用户自我呈现策略的研究
    modern_cases:
    - 朋友圈分组可见、微博小号/大号分离
    - 直播间人设（嘴替型、陪伴型、专业型）与后台花絮的『去表演化表演』
    - 知识博主被扒『后台』引发的信任危机
  communication_implications: 内容要给受众『可表演的素材』：用户转发打卡图、晒收益截图，本质是替他们完成一次低成本高收益的表演；为用户的观众设计内容，而不只为用户本人设计。
  community_implications: 社群是剧场也是后台：需要公共表演舞台（成就展示、案例征集），也需要安全后台（内部吐槽、互助群）——只设计前台会让成员因表演疲劳而流失。
  content_applications:
    opening: 开场降低表演焦虑：『这篇文章你可以收藏但不转发，没人知道你看过』，反而提高完读率
    visual: 提供美观、可晒、带圈层符号的结果模板（截图、证书、海报），替代用户自己做图
    sharing: 分享文案替用户写好『表演台词』：『我刚测完，居然是 XX 型，你呢？』
    comments: 评论区设计安全的『前台互夸』与『后台互怼』双区，满足不同表演需求
  platform_implications: 平台的可见性设计（公开/仅好友/匿名、阅后即焚、小号生态）直接决定表演强度；推荐算法把私人内容推向陌生人时，等于强行扩观众席，触发更保守或更极端的表演策略。
  related_nodes:
  - identity_signaling
  - self_categorization
  - parasocial_relationship
  - authenticity_perception
