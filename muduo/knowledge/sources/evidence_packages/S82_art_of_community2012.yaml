title: "The Art of Community: Building the New Age of Participation（2nd Edition）"
authors: "Jono Bacon"
year: 2012
journal: O'Reilly Media（专著；2009 第 1 版，2012-05-30 第 2 版；中文译名《社区运营的艺术》电子工业出版社 2017）
