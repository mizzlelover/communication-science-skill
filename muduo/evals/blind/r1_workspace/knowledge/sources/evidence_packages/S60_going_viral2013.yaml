research_question: "什么构成'病毒式传播'？信息如何通过社会网络多维扩散？"
core_claims:
  - "病毒性（virality）=内容在短时间内传播到大量用户；数字网络技术基础设施使无限互联成为可能"
  - "网络化守门（networked gatekeeping）：传播由多层守门（平台算法/平台员工/超级节点/普通用户转发）共同决定——传统守门模型扩展到网络时代"
  - "枢纽角色（celebrity/influencer/media professionals）在传播中关键，但普通用户也可凭一条成功信息突破层级"
  - "情绪（敬畏/焦虑/愤怒）驱动分享是病毒性与生物学病毒的关键区别（配套 Berger & Milkman 方向）"
method: "传播学理论专著（案例 + 网络化守门框架）+ 信息科学综合"
results: "（理论框架）网络化守门/病毒性定义成为病毒传播研究标准参考"
limitations: "框架性质（案例为主）；具体传播路径缺乏公开可验证数据"
boundary_conditions: "适用于社交平台网络化传播；不同平台守门权重差异大"
