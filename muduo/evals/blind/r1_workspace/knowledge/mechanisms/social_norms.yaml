- id: reciprocity_norm
  canonical_name_en: Reciprocity Norm
  canonical_name_zh: 互惠规范
  aliases:
  - 互惠原则
  - norm of reciprocity
  - Cialdini 互惠
  domain: social_norms
  definition: Gouldner 将其界定为跨文化的普遍规范：受惠者有回报义务，拒绝回报会引发内疚与道德谴责。Cialdini 将其列为说服六原则之一：先给予（礼物、让步、免费价值）会创设回报债务感，即便最初的给予是未被请求的。
  core_claim: 未被请求的给予会产生回报义务感，其力量足以让人回报自己并不想要的东西——但过度明显的给予策略会触发防御。
  mechanism: 互惠规范之所以强大，是因为它是大规模合作的演化基础：不回报者在群体中丧失合作声誉。给予创设心理债务（内疚、不安），回报消除不适；给予的价值感与其『非交易性』成正比——一旦被识别为套路（免费只是为了卖），互惠感消失甚至反转为警惕。Cialdini
    的让步-互惠变体（door-in-the-face）利用『从大要求退到小要求』制造互惠感：对方退让了，我也该退一步。
  causal_chain: 未被请求的给予 → 心理债务感 → 回报压力 → 回报行为（购买/答应小要求/转发）或（被识破时）警惕与反感
  variables:
    inputs:
    - 给予的价值与时机
    - 给予是否未被请求
    - 让步的可感知性
    moderators:
    - 给予者动机的可归因性
    - 关系历史与文化背景
    - 受惠者对套路的敏感度
    mediators:
    - 心理债务感
    - 回报义务感
    - 对给予动机的解读
    outputs:
    - 购买/转化
    - 小要求顺从（door-in-the-face 效果）
    - 口碑与推荐
    - （被识破时）信任反噬
  evidence:
    supporting:
    - Gouldner 1960 对互惠规范普遍性的跨文化综述（经典文献，已建包 EP S203）
    - Cialdini 等的经典互惠实验：未被请求的小礼物显著提升后续顺从（S32 综述）
    - door-in-the-face 实验：让步策略显著提升对小要求的答应率（见 door_in_the_face）
    conflicting:
    - 高度商业化的给予（满减、试用装轰炸）效应衰减明显
    - 对高警惕人群（有被推销经验者）互惠启动可反转为怀疑
    replication:
    - 互惠对顺从的促进作用在多情境重复
    - 效应量随给予的拟社会性（personalized vs institutionalized）显著变化
    meta_analysis:
    - 无权威 meta-analysis；以系列实验与综述（S32、S38）为主
  evidence_grade: A-
  boundary_conditions:
  - 给予被感知为真诚且非交易性
  - 受惠者保有回报的自由（未被强制）
  - 给予物对受惠者真实有价值
  failure_conditions:
  - 给予被识破为钓鱼策略（先给后宰）
  - 受惠者感到被操控或回报通道被堵死
  - 反复高频索取回报（给予沦为筹码）
  common_misinterpretations:
  - 把互惠等同于促销赠送——制度化的满减与试用不产生人际互惠感，只有拟人化的、个人化的给予才触发回报义务
  - 忽视互惠的反面：被识破的套路给予比不给更糟
  ethical_risks:
  - 以免费为饵制造债务感后高压转化
  - 利用让步-互惠逼单
  examples:
    original_cases:
    - Cialdini《Influence》互惠原则章节与 Krishnan 案例等（S32）
    - Gouldner 1960 互惠规范综述（经典文献，已建包 EP S203）
    research_cases:
    - 互惠对小要求顺从影响的经典实验（S32、S38 收录）
    - 让步-互惠实验（详见 door_in_the_face）
    modern_cases:
    - 知识博主的免费干货策略（先给方法论再卖陪跑）
    - 私域运营的节日问候与资料包投喂
    - Open source 社区的贡献-回报循环
    - 被滥用的反面：扫码送礼引发的警惕
  communication_implications: 先给真实可用的价值（可单独成立的干货、工具、模板），且给予的叙事保持非交易性（不标价、不催促），互惠债务才会自然累积为转化意愿。
  community_implications: 社群互惠系统的设计：新成员的融入靠老成员的主动给予（答疑、分享），运营者应让给予行为可见、可积累声誉（感谢机制、贡献榜），形成互惠循环而非单向索取。
  content_applications:
    body: 正文前 30% 必须是可独立成立的完整干货（真实价值前置），后续再自然引出深度服务
    cta: CTA 保持低压迫：『这份清单拿去直接用，需要陪跑时再找我』——保留自由是互惠生效的前提
    opening: 开场即给小礼物：『先送你一个今天就能用的检查清单』（真实可完成，非钩子）
    comments: 楼主在评论区持续追加免费增量价值（补充资料、答疑），让互惠在公开场景持续累积
  platform_implications: 平台对诱导性给予（关注送XX）有规则限制；算法奖励实质价值内容而非套路互惠，给予-回报循环在平台环境中最可持续的形态是『公开贡献换声誉』而非私下互惠。
