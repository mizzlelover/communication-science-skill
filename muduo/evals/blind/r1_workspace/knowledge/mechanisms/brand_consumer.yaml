  grade_justification:
    independent_studies: Godin 1999《Permission Marketing》（S79，五级许可阶梯/名单即资产）+ Tim Wu 2016（S48，注意力商业史）
    effect_size: 许可式接触优于打断式接触（响应率方向稳定）
    replication_status: 『被期待的信息被深加工』为营销行业共识；许可深浅影响转化（实践证据）
    context_dependency: 许可价值依赖交换物真实价值；浅层许可（一键关注）含金量低
    downgrade_upgrade_reason: 2026-09 实取 S79 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
  provenance:
