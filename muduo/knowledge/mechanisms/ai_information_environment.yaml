    last_reviewed: "2026-09"

  - id: bot_amplified_social_proof
    canonical_name_en: Bot-Amplified Social Proof
    canonical_name_zh: 机器人放大社会认同
    aliases: [刷量, bot-farmed engagement, 虚假互动, astroturfing（伪草根）]
    domain: ai_information_environment
    definition: "机器人放大社会认同指以自动化或半自动化账号批量制造点赞、评论、粉丝、转发等互动信号，伪造『他人都在做、都在认同』的表象，从而操纵受众社会认同判断的行为。AI 使批量账号的文本质量与人格维持能力显著提升。"
    core_claim: "社会认同启发式默认『可见的他人行为是真实信息』；虚假互动在表层伪造该输入，短期操纵有效，但系统性使用会损害平台的信任基础设施，使社会认同信号整体贬值。"
    mechanism: "底层是社会认同（social_proof，Cialdini 框架）：不确定情境中人们以他人行为作为正确性捷径，该捷径的生效前提是信号真实——而这恰是被攻击的对象。批量互动伪造规范性输入，扭曲规范感知准确性（norm_perception_accuracy，个体对『别人怎么想』的感知失真）；AI 生成评论使『看评论判断内容』的二级校准同时失效。个体层面：信息充足或发现刷量时操纵失效并触发信任惩罚，但检测成本持续上升。长期后果是信任紧缩：互动数与评论数的信号价值整体下降，受众与平台转向更强验证的信号。"
    causal_chain: "批量账号制造互动 → 社会认同的输入被伪造 → 受众按被操纵的规范感知行动 → 识别与曝光 → 社会认同信号整体贬值 → 平台信任基础设施受损"
    variables:
      inputs: [虚假互动规模与拟真度, 受众的不确定程度, 信号的可见位置（排行/评论/粉丝数）]
      moderators: [受众的检测能力与警觉, 平台反制（清理、限权、验证）, 决策卷入度（高卷入更谨慎）]
      mediators: [社会认同判断, 规范感知准确性]
      outputs: [短期行为操纵, 被识破时的信任惩罚, 信号体系的整体贬值]
    evidence:
      supporting:
        - "平台与研究者多次披露协同虚假行为（coordinated inauthentic behavior）的存在（平台披露与学术报告方向）"
        - "社会认同对判断与行为的影响有稳固基础（Cialdini 框架；social proof 文献）"
      conflicting:
        - "虚假互动对真实用户行为的净影响难以隔离测量：相关证据多，因果估计少且不一致（方法学讨论）"
      replication:
        - "截至 2026-09：AI 生成账号时代操纵有效性的公开严格对照研究缺乏，多数结论由前 AI 时代的伪草根研究外推；研究快速发展中"
      meta_analysis: []
    evidence_grade: C
    boundary_conditions:
      - "对低卷入、依赖表面信号的决策（浏览、首屏选择）操纵窗口最大；高卷入决策中用户更多依赖私人信源"
      - "平台信号越集中于单一可操纵指标（点赞/粉丝数），该机制的杠杆越大"
    failure_conditions:
      - "刷量被识别（评论区空洞、账号簇被曝光）时不仅无效，还产生反向社会证明"
      - "平台强验证环境（实名、高门槛互动）中伪造成本上升，机制被压缩"
    common_misinterpretations:
      - "『刷点数据没有受害者』——它污染所有依赖该信号的决策者，属于负外部性转嫁"
      - "把机器人操纵当作错误信息传播的主因——传播速度差异的主要驱动是人类（见 misinformation_velocity）"
    ethical_risks:
      - "伪造公众舆论（伪草根）直接破坏规范感知与公共讨论的真实性"
      - "对竞争者反向刷量与举报轰炸构成商业打击与诬陷"
    examples:
      original_cases: []
      research_cases: ["前 AI 时代对 astroturfing（伪草根营销）的案例与实验研究（方向性引用）"]
      modern_cases: ["电商与内容平台持续治理刷单刷评与机器粉（原则性描述）", "AI 生成评论使『评论区可信度』成为新的受众疑虑点（行业观察）"]
    communication_implications: "不购买虚假互动：短期杠杆对应长期信号贬值；将资源投向真实可验证的社会证明（可查证的用户故事与第三方评价）以对冲环境贬值。"
    community_implications: "社群的真实互动密度是防伪资产：小而真的活跃信号在整体信号贬值环境中价值上升；运营者应主动展示真实性证据（成员活跃史、真实案例）。"
    content_applications:
      evidence: "用可核实的第三方评价与具体用户故事替代裸指标（粉丝数/点赞数）作社会证明"
      comments: "运营真实问答与使用细节讨论，使评论区具备伪造者难以复制的信息密度"
      sharing: "避免『已有 N 人在用』式话术，改用具体群体的真实场景证言"
    platform_implications: "反操纵是平台信任基础设施的核心竞争点：识别与清理能力决定信号可信度；平台越依赖互动信号变现，治理与商业利益的冲突越尖锐（原则性判断）。"
    related_nodes: [social_proof, norm_perception_accuracy, trust_calibration, reputation_systems, informational_influence, misinformation_velocity]
    source_ids: [S92, S32, S94, S106]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Vosoughi, Roy & Aral 2018 Science 假新闻传播研究（S106 已实取摘要+SM）"
      effect_size: "假新闻传播速度/广度/深度系统性优于真新闻（摘要级）"
      replication_status: "方向被多项平台谣言研究支持"
      context_dependency: "Twitter 平台数据相关；新颖性与情绪反应为解释变量"
      downgrade_upgrade_reason: "2026-09 补充一手研究证据（S106），升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S106]
      supporting_evidence: [S92, S32]
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: hyperpersonalization_privacy
    canonical_name_en: Hyperpersonalization and Privacy
    canonical_name_zh: 超个性化与隐私
    aliases: [超个性化, data-driven personalization tension, 个性化与隐私张力]
    domain: ai_information_environment
    definition: "超个性化与隐私指个性化能力逼近个体级（行为推断、情境感知、生成式定制）时，与隐私保护、知情同意及脆弱群体保护之间形成的结构性张力：个性化的有效性来自对个人的深入推断，而这种深入本身构成风险。"
    core_claim: "个性化的增益与隐私风险同源于画像深度：画像越精细，内容越相关，但推断越敏感（含用户不自知的敏感状态）、同意越难真实达成、对脆弱群体的暴露面越大。"
    mechanism: "个性化说服（personalized_persuasion）的有效性依赖画像相关性；当画像从声明数据（用户主动填写）扩展到推断数据（从行为猜测情绪状态、财务压力、健康疑虑），三个后果出现：其一，用户对『被知道』的感知滞后且不完整，知情同意失去信息基础；其二，推断出的敏感状态即使不准也会被用于定向（如情绪低谷期的冲动消费投放），脆弱状态被商业利用；其三，个体的自主感与控制感受损，触发心理逆反（psychological_reactance）并使信任校准（trust_calibration）下调。《The Platform Society》的分析指出，平台化个性化把公共价值（隐私、公平、自主）的权衡私有化给了商业平台。"
    causal_chain: "画像深度↑（声明→观测→推断） → 个性化增益↑ 同时 敏感推断↑+同意失效↑ → 脆弱群体暴露↑ → 信任与自主感受损 → 用户反制与监管 → 增益受限"
    variables:
      inputs: [画像数据类型（声明/观测/推断）, 推断目标的敏感度, 用户控制权（查看/修正/退出）]
      moderators: [监管与平台政策, 用户隐私素养与情境敏感度, 品类敏感度（健康/财务/政治最高）]
      mediators: [知情同意的有效性, 被监视感, 心理逆反]
      outputs: [个性化效果曲线, 信任与关系寿命, 脆弱群体的风险敞口]
    evidence:
      supporting:
        - "隐私研究中『个性化—隐私悖论』被反复观察：用户声称重视隐私但行为上接受个性化（综述方向）"
        - "《The Platform Society》对平台个性化与公共价值张力的系统分析（书籍论证）"
      conflicting:
        - "被监视感对接受度的影响因情境而异：明码交换（免费内容换个性化）与隐性追踪的容忍度差异大（研究讨论）"
      replication:
        - "截至 2026-09：生成式 AI 级别个体定制（超个性化）的实证研究极少，多数结论由传统推荐与广告研究外推；研究快速发展中"
      meta_analysis: []
    evidence_grade: C
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions:
      - "在用户理解并主动选择个性化的服务关系中张力可控；在隐性追踪与第三方数据场景中张力最大"
      - "品类敏感度是分界线：通用兴趣个性化与基于脆弱状态（健康、财务、情绪）的个性化风险不可同日而语"
    failure_conditions:
      - "以『用户想要个性化』为一切推断辩护——想要相关性与愿意被推断敏感状态是两回事"
      - "合规形式主义：同意弹窗不构成真实同意，用户照样因『被发现被画像』而反感"
    common_misinterpretations:
      - "『匿名化就安全』——碎片化推断可重建敏感画像，匿名不等于不可识别"
      - "把隐私仅当作合规问题——它同时是说服有效性的变量：被监视感直接削弱说服与信任"
    ethical_risks:
      - "针对脆弱状态（成瘾、债务、情绪危机、未成年）定向营销，构成对弱势者的剥削"
      - "以个性化之名建立用户无法知情、无法反驳的推断体系，损害自主与尊严"
    examples:
      original_cases: []
      research_cases: ["个性化—隐私悖论的问卷与行为研究传统（综述方向）"]
      modern_cases: ["监管对敏感类目定向广告的限制趋势（原则性描述）", "『刚聊过什么就推什么』引发的不适感成为常见舆情话题（行业观察）"]
    communication_implications: "把个性化透明化为一项服务：告知用什么数据、能改什么、怎么退出；避开基于脆弱状态的定向，把相关性建立在用户主动声明的需求上。"
    community_implications: "社群天然提供『用户主动表达的需求』（入群理由、发言、自选标签），是不依赖隐蔽画像也能个性化的健康数据源；社群的隐私惯例本身就是信任资产。"
    content_applications:
      opening: "以用户可见自选的兴趣或场景标签组织内容变体，替代隐性行为推断"
      cta: "在转化路径中给用户选择与控制（选择接收频率/主题），把控制感设计进说服"
      comments: "对『你们在监控我吗』类疑问给出直接、具体的回答与设置入口"
    platform_implications: "平台处于张力中心：个性化是其商业模式核心，而隐私与脆弱群体保护日益成为监管与舆论的刚性约束；平台对敏感推断的自我限制将重塑行业做法（原则性判断）。"
    related_nodes: [personalized_persuasion, trust_calibration, psychological_reactance, nudge_mechanism, self_presentation_impression_management, filter_bubble_echo_chambers]
    source_ids: [S95, S92, S93]
    provenance:
      primary_sources: ['S95', 'S92', 'S93']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"
