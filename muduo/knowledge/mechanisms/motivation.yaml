- id: self_efficacy
  canonical_name_en: Self-Efficacy
  canonical_name_zh: 自我效能
  aliases:
  - 自我效能感
  - perceived self-efficacy
  domain: motivation
  definition: 自我效能（Bandura）指个体对自己能否组织并执行达成特定任务所需行动的信念。它不同于自尊（自我价值判断）与一般自信；自我效能是任务域特定的。注意自我效能与能力可以脱节：高信念低能力即过度自信。
  core_claim: 自我效能水平预测面对困难时的努力、坚持与最终表现，超越单纯能力差异。
  mechanism: 效能信念通过四个来源建立（Bandura 四来源框架，已建包 EP S197）：掌握性经验（成功史，权重最大）、替代性经验（观察相似他人的成功）、言语说服（可信者的鼓励）、生理与情绪状态（把紧张误读为无能）。高效能者把困难解读为可克服的挑战并投入策略搜索；低效能者把失败解读为能力不足并提前退出。与
    SDT 的胜任需要互补：胜任感是需要的满足，自我效能是其信念载体（S14、S15）。
  causal_chain: 掌握/替代/说服/生理状态输入 → 效能信念 → 努力、坚持与策略 → 表现 → 新的成功经验（循环）
  variables:
    inputs:
    - 成功经验
    - 榜样相似性
    - 说服可信度
    - 生理唤起解读
    moderators:
    - 任务难度与模糊性
    - 归因方式
    - 反馈情境
    mediators:
    - 效能信念
    - 目标承诺
    - 策略生成
    outputs:
    - 努力与坚持
    - 表现
    - 抗挫折恢复速度
  evidence:
    supporting:
    - Bandura 1977/1997 的理论与研究计划；学业领域元分析（Multon、Brown 与 Lent 方向）支持效能与成绩关联（Bandura 四来源框架与主效应证据，已建包 EP S197）
    - 恐惧管理与健康行为领域的干预研究（文献方向；S14、S15 仅支撑与 SDT 胜任需要互补的衔接一句，不支撑主效应与四来源框架）
    conflicting:
    - 横断研究中效能与表现的因果方向部分互为因果；干预证据在真实情境的持久性有限（方法学批评）
    replication:
    - 效应方向为研究传统共识（一手 EP 未建），作为干预杠杆的效果随领域与剂量变化。评级按枚举记 C
    meta_analysis:
    - 学业与职业领域的多项元分析支持效能-表现关联
  evidence_grade: B+
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 任务在受众能力可达范围内，效能信念才能转化为表现
  - 反馈环境允许成功经验积累（零成功场景无法建立效能）
  failure_conditions:
  - 只做口头鼓励而无真实小胜利（说服与经验脱节）
  - 榜样的成功被归因于天赋或外力，替代经验失效
  common_misinterpretations:
  - 把自我效能等同于打鸡血；它依赖结构性的小胜利设计而非口号
  - 忽视其域特异性：对写作高效能不等于对直播高效能
  ethical_risks:
  - 制造不切实际的效能承诺（『人人都能月入十万』）诱导付费，失败后归咎学员
  examples:
    original_cases:
    - Flow（S15）与 SDT（S14）中关于胜任与最佳体验的衔接讨论
    research_cases:
    - Bandura 的恐惧管理实验与替代性经验研究
    modern_cases:
    - 社群新手任务给『必赢的第一局』；课程设计先给可完成的小作品
  communication_implications: 教程与活动展示『相似的人如何做到』（替代经验）+拆出必胜的第一步（掌握经验），比展示大神更有动员力。
  community_implications: 新人融入设计以小胜利序列为核心：可完成的首次发言、首次作品、首次被回应。
  content_applications:
    title: 标题给能力许诺而非结果许诺：『哪怕零基础，第一步只要 5 分钟』
    body: 呈现相似背景的真实学员案例，标注起点与路径
  platform_implications: 平台的难度分层与新手引导质量直接决定效能积累速率；把高手内容无差别推给新人会摧毁效能感与留存。
