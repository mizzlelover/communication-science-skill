- id: community_boundaries
  canonical_name_en: Community Boundaries
  canonical_name_zh: 社群边界
  aliases:
  - 成员边界
  - 边界维护
  domain: community
  definition: 社群边界（community boundaries）指区分「成员/非成员」的制度与文化屏障：显性层包括入群门槛、审核、付费墙、邀请制；隐性层包括圈内黑话、规范、共同记忆。边界是双刃剑：对外制造稀缺与认同，对内制造安全与归属，但过强则封闭僵化，过弱则稀释失焦。
  core_claim: 社群凝聚力依赖边界（模糊的「所有人社区」不是社区），但边界强度需要与社群目标匹配：归属感的强度与边界的清晰度正相关，与开放性负相关。
  mechanism: 边界通过三条路径起作用：筛选（门槛确保进入者有基本承诺与匹配度）、认同（「我们是 X」需要「他们不是 X」作为对照，社会认同理论逻辑）、安全（边界内才敢真实表达与求助）。但过强的边界会使社群信息内卷化（同质性回音室）、排外与僵化；过弱的边界使成员资格无意义，搭便车者稀释资源，核心成员因「谁都进」而失去投入动力。
  causal_chain: 边界设定 → 成员筛选 + 内群体认同形成 + 表达安全 → 归属感与投入；边界过强 → 封闭与排外，边界过弱 → 稀释与失焦
  variables:
    inputs:
    - 入群门槛与审核制度
    - 圈内符号与规范的可学习性
    moderators:
    - 社群目标（开放使命 vs 深度联结）
    - 竞争社群的存在
    - 威胁感知
    mediators:
    - 成员资格的感知价值
    - 内群体认同强度
    outputs:
    - 归属感强度
    - 社群开放性/封闭性
    - 成员质量与投入分布
  evidence:
    supporting:
    - 社会认同研究显示群体边界清晰度提升内群体认同（social identity 传统，方向一致）
    - 社区研究与实践传统对门槛、仪式与边界维护的案例支持（社群实践文献）
    conflicting:
    - 强边界的回音室与排外后果在社会网络研究中被反复指出（homophily 与极化文献）
    replication:
    - 「适度边界提升凝聚力」是横跨社会心理学与社区研究的稳定方向；最优边界强度无普适值
    meta_analysis: []
  evidence_grade: B
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 边界强度应匹配社群使命：开放性使命（公益、城市社区）需低边界，深度联结使命（戒瘾、创业者私密组）需高边界
  - 边界需被公平执行：选择性执法比无边界的破坏更大
  failure_conditions:
  - 为增长不断降低门槛导致社群稀释（老成员因归属感下降而退出，出现「劣币驱逐良币」）
  - 为归属感把边界推向极端（纯洁性审查），社群陷入内耗与排外
  common_misinterpretations:
  - 「社群越大越好」与「社群越小越好」都是错的：正确问题是「这个社群的使命需要什么强度的边界」
  - 把边界等同于付费墙：金钱只是筛选维度之一（且是最弱的认同维度），参与贡献式门槛（作品、介绍、邀请）制造的归属感更强
  ethical_risks:
  - 边界维护可演变为歧视性排斥（身份审查、纯洁性清洗）
  examples:
    original_cases:
    - Oldenburg 对第三空间「常客」自然边界形成的描述
    - 社区研究对 gated community（门禁社区）的社会后果讨论
    research_cases:
    - 社会认同实验中最小组群划分即产生内群体偏好的经典范式（Tajfel 传统）
    modern_cases:
    - 知识星球付费门槛与申请制微信群的对比（金钱 vs 贡献筛选）
    - 游戏公会的入会试炼与出勤要求
  communication_implications: 对外传播应讲清「谁适合来、谁不适合」：自我筛选式文案（描述成员画像与门槛）比泛吸引力文案带来更高质量转化；模糊边界的流量是社群稀释的源头。
  community_implications: 定期审计边界：门槛是否仍筛选出与使命匹配的人、老成员的边界特权是否被尊重（新人涌入不应稀释老人的身份价值）、退出是否体面（边界是双向门，不是只进不出的陷阱）。
  content_applications:
    body: 正文直接使用「写给正在经历 X 的你」的定位句式，完成内容层面的边界筛选
    narrative: 讲述社群成员的典型故事时保留真实的身份细节，强化「我们是这类人」的画像
    comments: 对新成员的第一次发言给予有质量的回应（边界内的人情味），而不是冷场
    sharing: 对内与对外传播使用双版本：圈内版可用黑话加深认同，圈外版需解释与降低门槛
  platform_implications: 平台的群组权限体系（审核、邀请链接、分级成员）是边界的执行基础设施；平台若只提供「无门槛大群」模板，社群就只剩边界失效一条路（原则性判断）。
