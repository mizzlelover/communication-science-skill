research_question: "大脑如何加工故事？好故事的认知科学基础是什么？"
core_claims:
  - "大脑是叙事处理器而非逻辑处理器（引 Haidt）：我们体验的世界是大脑构建的'受控幻觉'；故事从'出乎意料的变化'开始，因为感知几乎全基于变化检测"
  - "角色=有缺陷的自我：每个人（角色）都有一个'控制世界理论'，建立在核心错误（神圣缺陷 Sacred Flaw）之上；故事就是角色面对缺陷被迫'固守旧我 vs 进化新我'的选择"
  - "大脑是'英雄制造机'：自我美化叙事（道德英雄）使我们固执己见并自我辩护；故事通过地位博弈与道德义愤吸引我们"
  - "Show don't tell 有效的神经原因：语言触发大脑建模；信息缺口驱动好奇心（Loewenstein）；精确细节产生感官模拟"
method: "神经科学/进化心理学/叙事理论跨学科综合 + 文学分析（《长日将尽》等）"
results: "（通俗科学）'人物驱动'写作方法与大脑友好叙事的流行科学权威"
limitations: "应用性综合（非新实验）；'神圣缺陷'框架为教学工具非检验理论"
boundary_conditions: "适用于理解叙事认知机制与创作应用；实证检验需逐项研究"
