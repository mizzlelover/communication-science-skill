- id: von_restorff_effect
  canonical_name_en: Von Restorff Effect (Isolation Effect)
  canonical_name_zh: 隔离效应（冯·雷斯托夫效应）
  aliases:
  - 隔离效应
  - 独特性效应
  - distinctiveness —— 与 schema_violation 的区别：隔离是列表内知觉层面的异类优势，图式违背是语义知识层面的预期破坏
  domain: memory
  definition: 与背景同质项目显著不同的项目更易被记住（von Restorff 1933）。异类获得记忆优先权——注意被捕获且编码更具区分性，提取时它也是独一无二的线索。
  core_claim: 在同质序列中，唯一的异类享有记忆特权；但异类属性本身不决定好恶。
  mechanism: 异类同时触发两道工序：自下而上的注意捕获与区分性编码（Hunt 的区分性框架）——它被编码为那个不一样的，提取线索因此独一无二。记忆搜索时，普通项目互相干扰，异类无干扰可循。
  causal_chain: 同质背景 + 单一异类 → 捕获与区分性编码 → 独特提取线索 → 记忆优势
  variables:
    inputs:
    - 异类属性强度
    - 背景同质程度
    - 异类的语义相关性
    moderators:
    - 列表长度
    - 呈现通道
    - 受众先验
    mediators:
    - 注意捕获
    - 区分性编码
    outputs:
    - 回忆率
    - 再认率
    - 品牌识别
  evidence:
    supporting:
    - von Restorff 1933 的隔离实验
    - Hunt 对记忆中区分性的理论化与实验传统
    conflicting:
    - 背景同质性不足时效应消失；全部特异等于没有特异
    replication:
    - 列表学习的隔离效应稳健复制；向品牌场景的推广属合理外推而非直接证据
    meta_analysis: []
  evidence_grade: A-
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 依赖背景同质性——在都试图特异的市场中，必须升级特异维度
  - 异类属性最好与品牌语义相关，否则记住了梗忘了品牌
  failure_conditions:
  - 为异而异的猎奇创意（ vampire creativity：创意吸血了品牌的注意力）
  - 行业集体追求同一类特异（全行业都在喊贵）导致差异化抵消
  common_misinterpretations:
  - 只要与众不同就能赢——特异性必须绑定可识别品牌资产与定位语义
  - 把特异理解成怪异——冒犯性差异换来的记忆可能附带负面效价
  ethical_risks:
  - 用冒犯性或争议性差异博取记忆（博眼球的底线竞赛）
  examples:
    original_cases:
    - S40 的意外原则；S76 对可识别品牌资产的强调提供了应用层参照
    research_cases:
    - 字母与数字混合序列中被隔离染色的项目回忆率显著更高
    modern_cases:
    - 品牌色彩与声音符号（固定音效、固定色块）的长期资产化；货架上的异形包装
  communication_implications: 在同质化信息流里，差异是记忆的入场券；但差异必须长在品牌资产上，让记住异类等于记住你。
  community_implications: 社群的独特仪式（只有本群有的梗、口号、称呼）就是成员记忆中的隔离项，是社群区别于群聊的关键。
  content_applications:
    title: 在标题中制造与同类内容的一个显性差异点
    visual: 封面在平台同侪中保持单一独特符号（固定色块或版式）
    body: 核心概念用一个独家隐喻承担区分性编码
    cta: 给社群行动一个专属名称，形成记忆隔离
  platform_implications: 算法对差异的奖励是短期的（新颖性点击），平台模板化又在抹平差异；长期资产要建立在平台外也可识别的符号上。
