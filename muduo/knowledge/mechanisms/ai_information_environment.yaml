  - id: authenticity_premium
    canonical_name_en: Authenticity Premium
    canonical_name_zh: 真实性溢价
    aliases: [真实溢价, verified human premium, 真实性稀缺价值]
    domain: ai_information_environment
    definition: "真实性溢价指：当 AI 可低成本生成高仿真内容时，『可验证的人类真实』（亲历经验、现场在场、人工痕迹、真人关系）相对稀缺度上升，受众愿意为其支付更高注意力、信任与货币价格的现象。"
    core_claim: "AI 内容泛滥抬升了可验证真实的稀缺性，稀缺性按稀缺机制转化为溢价：越难伪造、越易验证的真实性，溢价越高。"
    mechanism: "底层是真实性感知（authenticity_perception）与稀缺机制的结合：真实性判断依赖不完美性、过程痕迹与个人化细节等启发式线索；生成模型能模仿风格表层，却难以自带『这段经历确实发生过』的背景证明。按稀缺原则（Cialdini 框架），感知稀缺放大价值判断——AI 使『风格上像真的』不再稀缺，使『可验证为真的』变得稀缺，价值向后者集中（稀缺心态 scarcity_mindset 的估值逻辑）。边界很重要：溢价属于『可验证或可信的真实』，而非一切自称真实的内容；在合成媒体信任紧缩的环境下（synthetic_media_trust），不可验证的真实性宣称反而可能贬值。"
    causal_chain: "AI 生成内容供给↑ → 风格层真实性不再稀缺 → 可验证真实相对稀缺↑ → 稀缺机制抬升估值 → 真实性溢价（注意力/信任/货币）"
    variables:
      inputs: [AI 内容在品类中的渗透度, 真实性的可验证程度, 个体对 AI 内容的接触密度]
      moderators: [品类对亲历性的依赖度（体验类高于资讯类）, 受众的 AI 暴露与素养, 验证凭证的可得性（联动 content_provenance）]
      mediators: [稀缺感知, 真实性感知线索]
      outputs: [注意力与信任向可验证真实集中, 『人味』成为卖点, 虚假真实宣称的贬值与风险]
    evidence:
      supporting:
        - "对『AI 味』内容的反感与对真人内容偏好上升：行业观察与个案报告（未系统抽样，无已建 EP 的系统性消费者调查支持）"
        - "稀缺提升估值的底层机制有长期实验传统支持（Cialdini 框架内的稀缺原则；S32 仅支持稀缺估值方向，不含消费者调查内容）"
      conflicting:
        - "『真实性』判定高度主观且可被表演：受众并不总能识别伪真实，部分场景中对 AI 内容的偏好并未下降（情境证据）"
      replication:
        - "截至 2026-09：作为市场现象被广泛讨论，定价层面的严格实证仍薄；研究快速发展中"
      meta_analysis: []
    evidence_grade: C
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions:
      - "溢价集中在高亲历性、高信任需求品类（体验、人物、手作、现场）；标准化信息类内容溢价弱"
      - "前提是真实性可被感知或验证；无法验证时，宣称真实不产生溢价"
    failure_conditions:
      - "『伪真实』表演被识破时，惩罚超过普通造假——真实性承诺的违约代价更高"
      - "过度贴『真人/手工』标签导致标签通胀，溢价被稀释"
    common_misinterpretations:
      - "『只要说是真人写的就有溢价』——不可验证的真实宣称在信任紧缩环境下反而触发怀疑"
      - "把真实性溢价与怀旧审美混为一谈——前者是信任经济现象，后者是风格偏好"
    ethical_risks:
      - "把『真实性』做成表演性人设（伪素人、伪手工、伪现场），以真实性之名行欺骗之实"
    examples:
      original_cases: []
      research_cases: []
      modern_cases: ["创作者强调『未使用 AI』『一镜到底』『现场收音』作为内容卖点（行业观察）", "线下体验、现场活动与手作产品在营销叙事中强调不可复制性"]
    communication_implications: "把真实性从『氛围宣称』升级为『可验证供给』：展示过程、保留痕迹、允许核查；溢价的可靠来源是可验证性而非形容词。"
    community_implications: "社群是真实性的天然验证场：长期互动史使成员之间『真』的判定成本低；把老成员的真实经验做成内容，是溢价的最稳来源。"
    content_applications:
      narrative: "讲述失败、修正与过程性细节而非只呈现完美结果，以过程痕迹支撑真实感"
      evidence: "为真实性宣称提供可核查的旁证（时间线、地点、第三方在场）"
      emotion: "用具体个人语境的情绪（何时何地因何）替代通用情绪模板"
    platform_implications: "平台对真人身份与 AI 生成的标识政策直接决定溢价分配：真实身份可低成本验证时溢价流向可验证者；不可验证时溢价流向最会表演者（原则性判断）。"
    related_nodes: [authenticity_perception, scarcity_mindset, synthetic_media_trust, trust_calibration, self_presentation_impression_management, content_provenance]
    source_ids: [S32, S100]
    provenance:
      primary_sources: ['S32', 'S100']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: human_ai_co_creation
    canonical_name_en: Human-AI Co-Creation
    canonical_name_zh: 人机共创
    aliases: [AI 辅助创作, co-creation with AI, 人机协作内容生产]
    domain: ai_information_environment
    definition: "人机共创指人类与生成式 AI 在内容生产中的分工协作：人类负责意图、判断、经验素材与最终把关，AI 承担草稿、变体、扩写与格式化等执行工作。本节点关注分工方式如何影响内容质量与风格同质化，而非工作流本身。"
    core_claim: "共创的质量取决于人类保留判断与独特素材的程度：以人类经验为锚的分工提升效率并保留差异；以 AI 默认输出为锚的分工把产出拉向模型均值，加剧同质化并诱发算法博弈式的内容趋同。"
    mechanism: "生成模型输出本质上是训练分布的高概率表达：未经人类强约束的 AI 草稿天然向『平均答案』收敛（同质化压力）。人类介入点决定结果——若人类贡献独特经验、反常观点与把关标准，产出偏离分布均值、保有差异；若人类只做提示词搬运与采纳，产出趋同，并在创作者激励（creator_incentive_structures）与算法筛选（algorithmic_gaming）下互相模仿，形成『模型均值↔平台热门』的双向收敛回路。这与《Filterworld》描述的算法同质化同构，AI 把同质化从分发端前移到生产端，并与 ai_content_saturation 互为放大。"
    causal_chain: "AI 默认输出偏向分布均值 → 人类介入深度决定偏离度 → 浅介入+算法筛选 → 创作者互相模仿与趋同 → 同质化加剧"
    variables:
      inputs: [人类提供的独特素材量, 人类的把关标准, 提示与约束的深度]
      moderators: [创作者激励结构（奖励差异还是奖励套路）, 平台对同质内容的筛选偏好, 品类的经验依赖度]
      mediators: [产出对模型分布均值的偏离度, 创作者之间的相互模仿]
      outputs: [内容质量分布, 风格同质化程度, 生产效率与差异性的权衡]
    evidence:
      supporting:
        - "写作与创意任务的初步实验显示 AI 辅助能提升个体产出的质量下限，但组内产出差异缩小（初步研究，方向一致）"
        - "《Filterworld》对算法环境导致文化同质化的论证，可谨慎类推至生产端（书籍论证）"
      conflicting:
        - "部分研究发现，得当的人类约束与个人素材注入可同时提效与保差（初步研究，与『必然同质化』相悖）"
      replication:
        - "截至 2026-09：实验多为短周期、单任务、小样本设计，缺乏长期追踪与跨领域复制；研究快速发展中"
      meta_analysis: []
    evidence_grade: C
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions:
      - "在经验依赖型与观点型内容中，人类介入深度对结果影响最大；格式化、信息整合型内容中影响小"
      - "同质化后果取决于平台筛选是否奖励差异：差异化激励可部分抵消均值收敛"
    failure_conditions:
      - "把 AI 当『质量保证』而放弃把关：事实错误与平均化风格同时进场"
      - "以量取胜的共创流水线在饱和环境中边际收益递减，并加速账号信任折旧"
    common_misinterpretations:
      - "『AI 辅助等于提质增效双赢』——效率提升较确定，质量与差异性取决于人类介入深度，非自动成立"
      - "把同质化归咎于工具本身——同质化是『默认输出+筛选激励』的结构产物，同样的工具可用于强化差异"
    ethical_risks:
      - "不披露 AI 参与而冒充纯人工产出，侵蚀真实性溢价的信任基础并可能违反平台披露要求"
      - "用 AI 批量伪造『个人经验叙事』，污染以亲历性为基础的内容生态"
    examples:
      original_cases: []
      research_cases: ["创意写作任务中 AI 辅助组产出趋同的初步实验（初步研究，不给具体效应量）"]
      modern_cases: ["团队将 AI 用于初稿与变体、人类专注选题与事实把关的流程（行业观察）", "『AI 味』成为受众吐槽高频词，反向催生真人过程展示类内容"]
    communication_implications: "把人类独特资产（真实经验、立场、案例库）前置为共创输入，把 AI 限定在执行层；以『能否说出只有我能写的那句话』作为差异检验。"
    community_implications: "社群共创（成员经验+AI 整理）能产出高差异性内容：成员的真实素材正是模型分布之外的部分，社群因此成为共创时代的稀缺素材源。"
    content_applications:
      body: "先用人类经验与观点搭骨架，AI 只做扩写与润色，最后以人类把关收尾"
      narrative: "保留个人叙事中的非标准化细节与不完美表达，避免被 AI 统一腔调"
      comments: "公开说明共创分工与把关流程，以透明化维持真实信任"
    platform_implications: "平台激励决定共创走向：若排序继续奖励已验证的热门模式，共创将向均值收敛；差异化与原创信号加权会改变创作者的分工选择（原则性判断）。"
    related_nodes: [ai_content_saturation, algorithmic_gaming, creator_incentive_structures, processing_fluency, self_efficacy, distinctive_brand_assets]
    source_ids: [S100, S56]
    provenance:
      primary_sources: ['S100', 'S56']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: misinformation_velocity
    canonical_name_en: Misinformation Velocity
    canonical_name_zh: 错误信息传播速度
    aliases: [虚假信息传播速度, falsehood spread, viral falsehood dynamics]
    domain: ai_information_environment
    definition: "错误信息传播速度指虚假或低质量信息相对真实信息在社交平台上的传播速度、深度与广度差异。该方向最著名的实证锚点是 Vosoughi、Roy 与 Aral 于 2018 年发表的大样本 Twitter 研究：在控制机器人因素后，虚假新闻比真实新闻传播得更快、更深、更广，且差异主要来自人类的分享行为而非机器人。本节点对该研究作描述性引用，不引用具体数字。"
    core_claim: "在社交平台环境中，新颖且情绪唤起强的虚假信息系统性获得传播优势；该优势主要由人类分享偏好而非机器人生成驱动，平台机制则将其进一步放大。"
    mechanism: "三条底层机制汇流：其一，新颖性偏好（novelty_preference）——虚假信息常比真实信息更新奇，新奇信息获得更多注意与分享；其二，情绪唤起（emotional_arousal）——虚假叙事常携带更强的高唤起情绪（惊奇、愤怒），而高唤起促进分享（情绪的差异化分享画像 discrete_emotion_sharing_profiles 与之兼容）；其三，算法放大（algorithmic_amplification）——平台排序对早期互动信号的响应使高互动的错误信息获得更大分发。AI 时代的新条件：生成工具降低伪造成本、提高虚假内容的产量与定制化，使具备传播优势的内容供给增加；对速度优势本身，AI 是放大器而非起源。"
    causal_chain: "新奇+高唤起的虚假内容 → 人类分享偏好 → 早期互动信号 → 算法放大 → 相对真实信息更快更深更广的传播"
    variables:
      inputs: [信息的新颖性与情绪唤起水平, 虚假内容供给量, 平台排序机制]
      moderators: [议题的政治化程度, 协同虚假行为的占比, 平台治理强度, 用户分享前的辨识成本]
      mediators: [人类分享行为, 早期互动信号, 算法分发加权]
      outputs: [传播速度/深度/广度的相对差异, 真实信息的可见性劣势]
    evidence:
      supporting:
        - "Vosoughi, Roy & Aral 2018（Science 期刊）对 Twitter 历史大样本的分析：虚假新闻传播更快、更深、更广；机器人对真假新闻的加速程度相当，差异主要归于人类分享（描述性引用，不给具体数字）"
        - "高唤起情绪促进分享的独立证据线（Berger 及其合作者的研究方向）与该发现兼容"
      conflicting:
        - "后续研究对『虚假信息普遍占优』提出情境修正：不同平台、议题与时期的差异幅度不一；部分平台治理与产品调整后速度差距有所收窄（研究讨论）"
      replication:
        - "核心发现被多个平台与国家的数据部分复制，但效应大小随平台、时期与『虚假』的操作化定义而波动；全量转发链分析被视为该领域的重要方法学基准"
      meta_analysis: []
    evidence_grade: B+
    boundary_conditions:
      - "主要基于社交网络的转发结构环境；在强编辑把关（传统媒体）或强治理平台上差异幅度不同"
      - "『更快更深更广』是相对真实新闻的群体层面结论，不意味着任何一条虚假信息都必然胜出"
    failure_conditions:
      - "把结论外推为『人们只信假的』——研究解释的是传播差异，不是相信程度本身"
      - "把一切传播差异归因于机器人——原研究明确指出人类分享是主因（描述性引用）"
    common_misinterpretations:
      - "『假新闻赢是因为水军』——原研究的核心反直觉点恰是人类偏好：机器人无法解释真假之间的差异"
      - "把速度优势等同于影响力优势——传播广度与态度改变之间仍有距离"
    ethical_risks:
      - "速度优势的机制可被反向利用：刻意制造新奇与高唤起以加速传播（包括用 AI 批量生产此类内容）"
    examples:
      original_cases: []
      research_cases: ["Vosoughi, Roy & Aral 2018 的 Twitter 转发链大样本分析（描述性引用）", "高唤起情绪内容更易被分享的独立实验与观测证据线"]
      modern_cases: ["突发事件中未经证实信息早于权威通报扩散的常见时序", "AI 生成的伪造现场图像在事实核查完成前已被大量转发（原则性描述）"]
    communication_implications: "权威信息要参与速度竞争：预置事实基线、缩短从核实到发布的时延、用同等情绪与叙事质量传递真相；慢半拍的真实信息在结构上处于劣势。"
    community_implications: "社群建立『转发前等一等』与快速勘误的规范，能显著改变本群内的速度竞争；管理员对高唤起未证实信息的延迟转发是低成本干预点。"
    content_applications:
      narrative: "辟谣内容避免复述谣言的框架与画面（防止重复强化），以新叙事承载正确信息"
      emotion: "真实信息可采用高唤起但不失实的叙事结构参与竞争，而非仅依赖干瘪通报"
      sharing: "给核心成员提供可立即转发的已核实版本，压缩正确信息的转发延迟"
    platform_implications: "平台排序对早期互动的敏感度直接调节速度差距：慢速审核、快速标签与降权机制都在改变该机制的作用条件（原则性判断）。"
    related_nodes: [emotional_arousal, novelty_preference, algorithmic_amplification, discrete_emotion_sharing_profiles, stepps_sharing_framework, fluency_truth_effect]
    source_ids: [S92, S99, S60, S106]
