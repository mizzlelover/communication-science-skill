# habit — 习惯（Habit）：行为如何被重复自动化，以及如何设计它
domain: habit
nodes:
- id: habit_loop_cue_routine_reward
  canonical_name_en: Habit Loop (Cue-Routine-Reward)
  canonical_name_zh: 习惯回路（线索-惯常行为-奖励）
  aliases:
  - 习惯循环
  - cue-routine-reward
  - 习惯三要素
  domain: habit
  definition: 习惯回路由 Duhigg 在 The Power of Habit（S18）中科普化：稳定线索触发惯常行为，行为获得的奖励反哺该线索-行为联结。其学术对应物是情境-反应自动化关联（Wood
    与 Neal 方向；S110 综述实有表述：习惯与目标追求协同引导行动，习惯是高效默认模式）。与 hook_model 的区别：习惯回路是描述性框架（习惯如何运作），Hook 模型是产品设计流程（如何制造上瘾式使用）；与
    behavior_model_bmap 的区别：B=MAP 解释单次行为为何发生，习惯回路解释重复后的自动化。
  core_claim: 在稳定情境中重复并获得奖励的行为，会转变为由线索自动触发的习惯，降低对动机与意图的依赖。
  mechanism: 重复使行为的控制从目标系统转移到情境线索系统：线索（时间、地点、前序动作、情绪状态）与反应形成直接联结，奖励事后巩固该联结；计算模型显示习惯与目标追求协同引导行动，习惯是行动的高效默认模式（S110）。行为自动化释放注意与工作记忆资源（S110）。
  causal_chain: 稳定情境中重复行为+奖励 → 线索-反应联结巩固 → 行为自动触发 → 去意图化维持
  variables:
    inputs:
    - 线索稳定性
    - 重复频率
    - 行为难度
    - 奖励即时性
    moderators:
    - 情境变化频率
    - 行为复杂度
    - 个体目标变动
    mediators:
    - 情境-反应关联强度
    - 自动化程度
    outputs:
    - 无意识执行频率
    - 行为稳定性
    - 中断后恢复速度
  evidence:
    supporting:
    - Wood 与 Neal 的情境-反应习惯理论与实验综述（学术基础）
    - Lally 等 2010 的习惯形成追踪：自动化随重复增长，中位数约 66 天且个体差异极大（现场追踪研究）
    conflicting:
    - 习惯回路三段式是简化模型；真实习惯的形成受行为类型与复杂度强烈影响，不存在普适天数（对『21 天』流行说法的否定）
    replication:
    - 情境-反应自动化方向稳健；流行版本（21 天养成）为讹传。评级按枚举记 B
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 行为需在相对稳定的情境中重复（动荡环境难成习惯）
  - 奖励需相对即时；远期收益难以巩固习惯
  failure_conditions:
  - 情境改变（搬家、换工作、换平台）切断线索，习惯衰减
  - 行为复杂且奖励遥远（健身、学习）时，仅靠重复难以自动化
  common_misinterpretations:
  - 『21 天养成一个习惯』：原始研究发现中位数约 66 天且范围极大，21 天为商业讹传
  - 把习惯回路当成设计公式照搬；它首先描述行为规律，其次才是设计启发
  ethical_risks:
  - 利用自动化机制绑定非用户利益行为（自动续费、默认勾选）
  examples:
    original_cases:
    - The Power of Habit（S18）中牙膏、咖啡等消费习惯的线索分析
    research_cases:
    - Lally 等 2010 的习惯自动化追踪；Wood 团队的情境改变研究
    modern_cases:
    - 打卡签到、固定栏目更新、睡前刷短视频
  communication_implications: 让内容绑定时点与场景（『早八通勤三分钟』），稳定更新节律本身就是线索建设。
  community_implications: 社群仪式（周报、每周讨论日）是集体习惯回路：固定时间+固定形式+即时反馈。
  content_applications:
    body: 内容系列给固定开场结构（同一问候、同一栏目名），帮助听众建立听觉线索
    cta: 『每晚十点，我们评论区见』——把行为绑定时点
  platform_implications: 平台的推送与默认打开路径是在争夺线索定义权；用户习惯一旦绑定平台，迁移成本成为竞争壁垒。
