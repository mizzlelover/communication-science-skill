- id: sunk_cost_fallacy
  canonical_name_en: Sunk Cost Fallacy
  canonical_name_zh: 沉没成本谬误
  aliases:
  - 沉没成本效应
  - 沉没成本偏误
  - escalation of commitment（相邻）
  domain: behavioral_economics
  definition: 沉没成本谬误指决策被已投入且不可回收的成本（钱、时间、精力）不当影响：已投入越多，越倾向继续投入，即使前瞻期望为负。Arkes 与 Blumer 1985 的剧场票与消费实验是经典证据；Staw
    的承诺升级（escalation of commitment）研究揭示了组织层面的放大机制。与 commitment_escalation（A3）的分工：该节点是决策层的成本-继续机制，A3 节点偏组织与承诺行为的自我辩护面。
  core_claim: 理性决策应只看前瞻成本收益，但实际决策中不可回收的过往投入系统性地推高继续投入的概率。
  mechanism: 已投入成本改变参照点并使继续投入的损失看似『避免浪费』（损失编码是候选解释之一而非唯一解释）；终止意味着承认先前决策错误，触发自我正当化与形象保护（与 commitment_escalation
    相通）；心理账户把已支出金额挂在『未完成项目』账户，关闭账户产生确认损失的痛感（S12、S01）。Sweis 等 2018 的研究发现小鼠与大鼠在觅食任务中也表现出沉没成本敏感性，提示其有深层决策架构根源。
  causal_chain: 已投入不可回收成本 → 参照点改变+自我正当化 → 继续投入的主观价值上升 → 加倍投入/拒绝止损
  variables:
    inputs:
    - 已投入金额/时间/身份
    - 剩余完成距离
    - 责任归属
    moderators:
    - 是否公开决策
    - 沉没成本的可视化
    - 替代选项的清晰度
    mediators:
    - 浪费厌恶
    - 自我正当化需求
    - 账户关闭痛感
    outputs:
    - 继续投入概率
    - 止损延迟
    - 资源错配
  evidence:
    supporting:
    - Arkes 与 Blumer 1985 的剧场票、滑雪等实验（经典实验）
    - Staw 1976 起的承诺升级研究传统（组织情境）
    conflicting:
    - 效应强度受情境与责任归因调节；部分研究者指出实验室外难以分离沉没成本与其他机制（方法学边界）
    - Gal 与 Rucker（S129）：沉没成本等被归因损失厌恶的现象与损失-收益比较无关，系错误归因（替代解释）
    replication:
    - 方向在人类实验与动物觅食研究中均有记录（Sweis 等 2018 方向），幅度因情境而异。评级按枚举记 B
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 沉没成本需被决策者显性感知且与当前决策同账户
  - 责任归属明确（自己拍板的项目）时最强
  failure_conditions:
  - 成本由他人承担或已匿名化时减弱
  - 有制度化的止损规则（预设退出点）被严格执行时
  common_misinterpretations:
  - 把『贵的东西更舍不得扔』全归因沉没成本；禀赋效应与情感依附同样参与
  ethical_risks:
  - 产品设计故意累积用户沉没投入（不可导出的数据、连续打卡）以提高退出成本
  examples:
    original_cases:
    - Misbehaving（S12）中的剧场票与项目续投案例
    research_cases:
    - Arkes 与 Blumer 1985 实验；Staw 的升级承诺实验
    modern_cases:
    - 烂尾项目的追加预算、办卡未用反而续卡、看烂片坚持看完
  communication_implications: 帮用户决策时把沉没与前瞻分开呈现（『已花的不算，从现在看哪个划算』）；续费文案反向利用该机制需守伦理边界。
  community_implications: 社群项目设预设止损点与外部评审，防止集体沉没成本绑架决策。
  content_applications:
    body: 内容提供『止损检查清单』：哪些成本已沉没、继续的唯一理由是什么
    cta: 『已经投入 3 周？先做 5 分钟复盘再决定，别让过去替你投票』
  platform_implications: 平台的成长体系与连续签到把沉没成本做成留存机制；跨平台数据可携带性是制度层面的对冲。
  related_nodes:
  - commitment_escalation
  - loss_aversion
  - mental_accounting
  - endowed_progress_effect
  - endowment_effect
  source_ids:
  - S12
  - S01
  - S131
  - S129
