    effect_size: 等值信息因得失框架呈现产生不同选择（经典框架效应）
    replication_status: 框架效应广泛复制；损失厌恶系数有元分析（Camerer 2024）
    context_dependency: 受众卷入度/信息呈现顺序调制
    downgrade_upgrade_reason: 2026-09 实取 S12 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
