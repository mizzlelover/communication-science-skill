- id: name_pronunciability
  canonical_name_en: Name Pronunciability
  canonical_name_zh: 名称可发音性
  aliases:
  - 名称流畅性
  - phonological fluency —— 与 rhyme_as_reason 的区别：可发音性针对名称本身的发音容易度，押韵针对语句形式规律
  domain: processing_fluency
  definition: 名称与代码的可发音性（发音容易度）影响好感、风险感知乃至信任判断。Alter 与 Oppenheimer 2006 的研究显示，易发音的虚构公司名与股票代码获得更积极的评价与短期市场表现。
  core_claim: 名称越易发音，初始评价越正面——发音流畅性在低信息情境中充当品质代理。
  mechanism: 发音需要动用语音回路，可发音性高的名称加工更流畅，流畅被归因为对象的可信与安全；对新异名称影响最大，因为熟悉名称已有稳定的记忆表征与情感标签，流畅性效应饱和。
  causal_chain: 易发音名称 → 语音加工流畅 → 误归因为品质 → 好感与信任上升
  variables:
    inputs:
    - 音节结构
    - 发音规则符合度
    - 名称长度
    moderators:
    - 名称新颖度
    - 受众语言背景
    - 接触语境
    mediators:
    - 语音流畅性
    outputs:
    - 好感度
    - 可信度
    - 选择倾向
  evidence:
    supporting:
    - Alter 与 Oppenheimer 2006 对虚构公司名与真实股票代码的系列研究
    conflicting:
    - 长期效果依赖真实品质信号；名称熟悉后流畅性差异消失
    replication:
    - 流畅性影响评价的总方向与更广的流畅性文献一致；市场层面证据为相关性证据
    meta_analysis: []
  evidence_grade: B
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 主要作用于首次接触与低信息情境
  - 跨语言市场需按目标语言的发音系统重新评估
  failure_conditions:
  - 强行音译产生负面谐音（进入新市场未查本地语义）
  - 名称易读但品牌体验差时，流畅性反而加速负面口碑
  common_misinterpretations:
  - 名字决定品牌成败——它只影响初始评价窗口，长期由产品与心智可用性决定
  - 以为起个洋名就高级——本地发音流畅度才是关键变量
  ethical_risks:
  - 骗子公司起顺口可信的名字冒充本土或权威机构
  examples:
    original_cases:
    - S70 对词汇选择如何影响评价的讨论
    research_cases:
    - 股票代码实验：可发音代码（如 KAR 对比 RDO）的虚构公司被评更正面，真实市场数据呈同方向相关
    modern_cases:
    - 出海品牌刻意取双音节易读英文名；国内新消费品牌命名趋同于简单双字
  communication_implications: 名字是第一个流畅性触点：品牌名、栏目名、社群名都应在目标人群语言里脱口而出，并在所有触点保持同一读音。
  community_implications: 社群昵称规范与群名直接影响新人检索与转介绍的发音成本——可念出来的社群才容易被推荐。
  content_applications:
    title: 栏目名控制在两到三个音节
    cta: 行动指令里的产品或活动名确保易读
    body: 关键概念自造词时给出发音提示，降低复读与转述成本
  platform_implications: 平台搜索与联想输入对易读名称更友好（拼写容错高），可发音性间接影响被搜到的概率。
