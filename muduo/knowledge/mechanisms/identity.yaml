- id: identity_protective_cognition
  canonical_name_en: Identity-Protective Cognition
  canonical_name_zh: 身份保护性认知
  aliases:
  - motivated reasoning（动机性推理）
  - 身份保护推理
  domain: identity
  definition: 信息加工中的动机性推理（motivated reasoning）形式：当某结论与所属群体的立场绑定后，人们以保护群体身份为首要目标来评估证据——接受群体一致的弱证据，抵制群体不一致的强证据，且认知资源越充裕越擅长『精致地』辩护。
  core_claim: 对身份绑定的议题，加工证据的首要目标不是求真而是守护群体归属，于是聪明与信息量可能只放大偏差。
  mechanism: 群体成员资格承载自尊与关系利益，承认与群体相悖的事实会带来身份代价（被内群体惩罚）。因此证据评估由方向性动机驱动：对不一致证据提高质疑门槛、搜寻反驳框架，对一致证据降低门槛。该过程伴随情绪唤起（被威胁感），且在高卷入、强认同、高知识者身上更强——知识提供了更多『反驳弹药』。
  causal_chain: 议题与群体立场绑定 → 身份威胁 → 方向性动机 → 选择性证据评估 → 立场极化而非信念更新
  variables:
    inputs:
    - 议题与身份的绑定度
    - 证据与群体立场的方向
    - 认知能力与知识水平
    moderators:
    - 群体认同强度
    - 内群体惩罚预期
    - 议题政治化/极化程度
    mediators:
    - 身份威胁感
    - 反驳性论点生成
    - 情绪唤起
    outputs:
    - 信念极化
    - 证据评价双标
    - 立场辩护行为
    - 拒绝改判
  evidence:
    supporting:
    - Kahan 等团队的文化认知（cultural cognition）研究：高科学素养者在争议议题上反而更极化（研究方向，经典文献未建包/未登记 EP）
    - 动机性推理的实验传统（S21、S26 综述所述）：对不一致证据的更严格审查可被实验诱导
    - 政治传播领域的证据评价双标研究（同一证据框架按立场打分不同）
    conflicting:
    - 在议题未与身份绑定时，同样的个体表现出相当水平的准确推理
    - 精度动机（accuracy motivation）被激活（如 accountable 情境）可部分抵消方向性偏差
    replication:
    - 方向性推理的基本范式有多团队重复
    - 『高知识者更极化』的结果在部分议题与样本中存在波动
    meta_analysis:
    - 无权威 meta-analysis；以系列实验与调查-实验结合研究为主
  evidence_grade: B+
  boundary_conditions:
  - 议题已被政治化或阵营化时最强
  - 受众身份依赖该议题阵营时最强
  - 私人推理情境（无问责压力）中更强
  failure_conditions:
  - 议题与身份脱钩、被框定为技术问题而非站队问题时
  - 存在跨阵营的共同身份与问责结构时
  - 成本外显、错误代价即时可见的决策场景
  common_misinterpretations:
  - 误以为『多给事实、多科普』就能纠正——对身份绑定议题，事实供给反而提供弹药
  - 把动机性推理等同于智商问题，忽视了它是关系理性的产物
  ethical_risks:
  - 利用身份威胁制造焦虑以固化受众（恐惧型私域话术）
  - 刻意阵营化议题以收割对抗性流量
  examples:
    original_cases:
    - Haidt 对道德直觉先于推理的论述（S26）：推理常是直觉的律师
    - Aronson 对认知失调与自我辩护的综述（S21）
    research_cases:
    - Kahan 等的文化认知实验：同一数学/科学任务，答案与立场冲突时正确率下降
    - 证据评价双标实验：同一研究摘要，按结论立场被赋予不同的方法学评价
    modern_cases:
    - 投资社群中对负面基本面数据的集体无视
    - 粉丝社群对偶像负面新闻的框架化辩护
    - 健康话题（疫苗、偏方）在家族群的站队式传播
  communication_implications: 对身份绑定议题，传播的第一战场是身份而非证据：降低身份代价（给台阶、给『转变不等于背叛』的叙事）、用内群体信源转述异见信息，比堆证据更有效。
  community_implications: 社群治理应在议题阵营化之前建立事实规范（共同信源、事实官机制）；一旦阵营化，管理员纠正反而被解读为身份背叛，纠错成本随时间指数上升。
  content_applications:
    body: 用『我们曾都以为……后来我学会……』的自我修正叙事，把观点转变框定为身份升级而非背叛
    evidence: 证据由受众内群体的可信者转述（圈内意见领袖引用），而非直接抛出对立阵营信源
    comments: 预置『问得好，我也重新查过』类回应，给质疑者身份肯定以阻止防御升级
    opening: 开场先做身份确认再谈事实：『我们都想把钱管好，所以更值得把这件事看全』
  platform_implications: 算法按互动加权，身份冲突内容获得放大；推荐系统把异见信息推给强认同者时，常触发反驳式互动（负反馈反而加权），形成『越推越偏』的再生产循环。
  related_nodes:
  - cognitive_dissonance
  - in_group_favoritism
  - psychological_reactance
  - social_identity_theory
  - filter_bubble_echo_chambers
  - misinformation_velocity
  conflicting_nodes:
  - source_credibility_model
  source_ids:
  - S26
  - S21
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Haidt 2012《The Righteous Mind》（S26，book 级，substantial_excerpt：社会直觉模型/道德基础）+ Kahan
      文化认知方向
    effect_size: 直觉先行、推理后置（骑象人/大象）；身份绑定议题上证据评估双标
    replication_status: 方向性推理范式多团队重复；高知识者更极化存在样本波动
    context_dependency: 议题与身份绑定；精度动机可部分抵消方向性偏差
    downgrade_upgrade_reason: 2026-09 实取 S26 道德心理学核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
