# Evidence Package — S69 Pinker 2014（The Sense of Style）
# 标准格式。access_level 如实标注。
source_id: S69
title: "The Sense of Style: The Thinking Person's Guide to Writing in the 21st Century"
authors: "Steven Pinker"
year: 2014
journal: Viking（专著）
doi: "无 DOI（专著）"
url: "https://tryathens.com/blog/steven-pinker-writing-advice"
access_level: substantial_excerpt
