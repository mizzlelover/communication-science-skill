- id: network_exposure_effects
  canonical_name_en: Network Exposure Effects
  canonical_name_zh: 网络暴露效应
  aliases:
  - 同伴效应
  - peer effects
  - 三度影响（contested）
  domain: network_effects
  definition: 网络暴露效应（network exposure effects）指个体的态度、情绪与行为受其网络中他人状态影响的现象——朋友的健康行为、情绪状态与消费选择会「外溢」到自己身上。Christakis
    与 Fowler 在《Connected》中提出影响可延伸至「三度人脉」，但该主张存在显著方法学争议。
  core_claim: 网络邻居的行为与状态对个体存在可测量的影响，但影响范围（直接邻接还是三度扩散）与因果强度存在激烈的方法学争论。
  mechanism: 三条通路产生网络暴露：直接影响（同伴示范与劝说）、同质选择（相似者本就聚在一起，行为相关未必是影响）与环境共享（同处一个物理或制度环境）。区分三者是该领域的核心难题：同样的行为相关性，可能来自真实传染，也可能只是物以类聚。严格的因果检验需要随机化或精细的准实验设计。
  causal_chain: 网络邻居行为/状态改变 → 示范、劝说或共同环境 → 个体行为/状态改变（或仅为同质性伪相关）
  variables:
    inputs:
    - 网络邻居的行为分布
    - 暴露频率与强度
    moderators:
    - 关系强度
    - 行为的可观察性
    - 个体易感性
    mediators:
    - 社会示范
    - 规范感知
    - 情绪传染
    outputs:
    - 健康行为、消费、情绪的邻里相关
  evidence:
    supporting:
    - Christakis 与 Fowler 对大型社交网络中健康行为「外溢」的分析（《Connected》及其研究传统）
    - 受控小规模实验（如健康行为网络干预）显示网络结构影响行为改变（Centola 相关研究方向）
    conflicting:
    - 方法学批评指出：未处理的同质选择与环境混淆可产生「伪传染」；三度影响主张被多篇再分析质疑（方法学争论，方向性结论）
    replication:
    - 直接邻接层的同伴效应在实验设计中可重复；三度扩散主张复制不稳定
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 暴露效应需区分直接邻居与远端网络：多数可靠证据集中在一度与二度连接
  - 行为需可观察且与身份相关；纯私密行为的社会外溢弱
  failure_conditions:
  - 把相关性当传染：未分离同质性与共同环境前，任何「朋友的朋友胖了所以我也会胖」式推论都不成立
  - 用网络暴露为干预效果背书时若缺乏对照，几乎必然高估
  common_misinterpretations:
  - 「朋友的情绪会传染到三度之外」——三度影响假说有争议，谨慎使用范围为直接网络
  - 把 network_exposure_effects 与 emotional_contagion 混淆：后者是面对面/媒介互动中的情绪传递机制，前者是网络结构层面的行为相关现象
  ethical_risks:
  - 「你的朋友的数据可以预测/影响你」的网络暴露逻辑被用于隐性画像与诱导，个体并未同意被他人的行为所代表
  examples:
    original_cases:
    - 《Connected》对肥胖、吸烟、幸福感在网络中聚集成片的分析案例
    research_cases:
    - 对「同质性 vs 传染」区分方法的研究争论（S57 EP 实载：Lyons 等方法学批评）
    - 聚类网络干预实验显示行为改变在网络条件间差异（Centola 传统）
    modern_cases:
    - 健身 App 好友排行榜对个人运动量的拉动
    - 「朋友圈都在考研/买房」氛围对个体决策的压力
  communication_implications: 传播设计中使用「你认识的人已经在做」比「很多人在做」更有力——一度人脉示范的因果证据最强；但必须真实，伪造熟人动态是操纵。
  community_implications: 社群干预应按「暴露结构」分组：把想推广的行为先安插在相互连接的小团内，让成员间互为证据；孤立成员接触不到该行为信号。
  content_applications:
    body: 正文引用「同类人群中的真实变化故事」而非抽象统计，激活同伴示范通路
    narrative: 以「社群里大家都开始……」的集体行动叙事呈现，让读者感到行为有网络支撑
    sharing: 展示真实参与者的变化轨迹（用户生成内容），作为可传染的暴露素材
    comments: 促成成员间相互回应（而非只回应官方），让评论层成为真实的暴露网络
  platform_implications: 平台把「好友动态」直接注入信息流，相当于强制提高网络暴露密度；这既是增长杠杆，也是焦虑与比较压力的来源（原则性判断）。
