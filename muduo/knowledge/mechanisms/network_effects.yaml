- id: homophily
  canonical_name_en: Homophily
  canonical_name_zh: 同质性
  aliases:
  - 同配性
  - 相似相吸原则（love of the same）
  domain: network_effects
  definition: '同质性（homophily）指相似的人更可能相互连接、互动与影响的普遍倾向，相似维度包括人口特征、价值观、兴趣与行为。McPherson 等人 2001 年的综述《Birds
    of a Feather: Homophily and Social Networks》系统总结了该现象：我们的人际网络在种族、教育、年龄等维度上远比随机网络更同质（McPherson 2001
    经典综述，未建包，EP 待补）。'
  core_claim: 社会网络因同质性形成高度聚类，导致人们暴露于高度相似的信息、观念与行为环境，这既促进圈内凝聚也造成圈外隔阂。
  mechanism: 同质性通过两条路径产生：机会结构（我们遇到谁由学校、职场、社区等社会分层决定）与选择偏好（我们主动选择相似者交往）。网络一旦同质化，圈内信息冗余、规范相互强化、异见稀缺；同时跨圈信息流动受阻，圈层间的理解与信任衰减。同质性既是社群凝聚的引擎，也是圈层割裂的结构根源。
  causal_chain: 社会分层与选择偏好 → 相似者相互连接 → 高聚类网络 → 圈内强化 + 圈外隔离 → 观念与行为的圈层分化
  variables:
    inputs:
    - 社会分层结构（居住、教育、职业）
    - 个体选择偏好
    moderators:
    - 平台推荐算法的相似性偏好
    - 跨圈层接触制度（如公共空间）
    mediators:
    - 连接形成概率
    - 信息暴露的圈层化
    outputs:
    - 网络聚类系数
    - 圈内规范强化程度
    - 圈层间隔阂
  evidence:
    supporting:
    - McPherson 等人 2001 年综述：个人网络在多个人口维度上的同质性远超随机基准（McPherson 2001 经典综述，未建包，EP 待补）
    - 线上社交平台的好友形成与内容互动同样呈现显著同质性（多篇平台研究，方向一致）
    conflicting:
    - 研究显示线上环境可提供比线下更多跨立场内容暴露（Bakshy 等人 2015 关于算法与个体选择的比较研究，结果混合，S147 EP 已载，另见 filter_bubble_echo_chambers）
    replication:
    - 同质性作为网络形成规律被跨平台、跨文化反复复制，是该领域最稳定的发现之一
    meta_analysis:
    - McPherson 等人的系统综述是该领域的基准文献（综述级证据；McPherson 2001 经典综述，未建包，EP 待补）
  evidence_grade: A
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 同质性是统计倾向而非定律：跨圈连接始终存在，且受制度设计（多元社区、公共空间）影响
  - 不同维度（种族、兴趣、价值观）的同质性强度不同，不能一概而论
  failure_conditions:
  - 把同质性当作设计原则推向极端：完全同质的社群会因信息冗余与观点单一而失去活力与判断力
  - 忽视基率：同质性描述的是连接概率分布，个体层面跨圈友谊完全正常
  common_misinterpretations:
  - 「同质性=回音室」——回音室还需算法或制度强化；同质性本身是中性的连接规律，其后果取决于信息是否有多样性补充
  - 与 filter_bubble_echo_chambers 混淆：homophily 是人类社会网络的古老属性，filter bubble 是算法时代的放大器问题
  ethical_risks:
  - 精准营销利用同质性做群体画像固化与歧视性排除（如差异化定价、信贷歧视）
  - 社群运营刻意制造「我们 vs 他们」的边界强化，助长群体极化
  examples:
    original_cases:
    - McPherson 综述中对个人网络种族与教育同质性的系统量化（描述性发现；McPherson 2001 经典综述，已建包 EP S208）
    research_cases:
    - 线上社交网络好友与互动同质性的平台研究（方向一致，多篇）
    modern_cases:
    - 兴趣算法推荐形成的内容圈层（球鞋圈、母婴圈、投资圈各自的封闭话语体系）
    - 学区房与教育分层造成的儿童网络同质化
  communication_implications: 破圈内容的本质是制造「跨同质性」的共同关注点（灾害、节日、体育、梗）；圈内内容则可放心使用圈层黑话与深度假设。
  community_implications: 同质性是社群凝聚的燃料也是天花板：入群门槛与共同身份带来归属，但过度同质会让社群失去新鲜信息流；健康的社群保留异质性的「有限张力」。
  content_applications:
    body: 圈内正文可用圈层共识作为省略前提；破圈正文则显式补足背景，照顾圈外读者
    narrative: 破圈叙事用普适情感关系（亲情、努力、幽默）替代圈层特定冲突
    sharing: 设计「圈内梗卡」（强化归属）与「圈外解释卡」（帮助转出）双版本分享物
    comments: 对圈外评论者主动补课与欢迎，防止评论区成为同质性的守门层
  platform_implications: 推荐算法以互动预测为目标时会系统性放大同质性（相似内容→相似互动→更多相似推荐）；这是算法时代同质化的加速度来源（原则性判断）。
