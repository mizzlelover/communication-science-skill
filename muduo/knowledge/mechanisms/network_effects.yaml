    effect_size: 新节点优先连接高连接节点→幂律度分布（富者愈富）；对枢纽攻击脆弱
    replication_status: 优先连接机制多网络类型重复；幂律普适性有边界讨论
    context_dependency: 增长型网络（新节点持续加入）最强；静态/小网络需谨慎
