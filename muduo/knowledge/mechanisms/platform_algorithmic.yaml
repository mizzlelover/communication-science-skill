  - id: moderation_governance
    canonical_name_en: Moderation and Platform Governance
    canonical_name_zh: 内容治理与平台治理
    aliases: ["content moderation", "平台审核"]
    domain: platform_algorithmic
    definition: 平台通过规则、算法审核、人工复审与社区自治来决定哪些内容可发布、可分发、可变现的治理体系，及其对内容生态的塑造作用。
    core_claim: 治理不是事后清洁工而是生态塑造力：审核标准与执行强度决定了什么内容值得被生产，进而改变整个内容供给的形态。
    mechanism: 创作者对"什么会被限流/封禁/不可变现"形成预期并提前自我审查（chilling effect 寒蝉效应）；同时平台对特定品类的扶持与豁免（如官方活动流量）构成正向引导。治理边界模糊或不透明的领域（灰色地带）成为博弈区。Gillespie（S94）指出：平台'决定什么可以被人看见'，这正是其核心权力。
    causal_chain: "治理规则 → 创作者预期 → 自我审查与品类迁移 → 内容供给形态变化"
    variables:
