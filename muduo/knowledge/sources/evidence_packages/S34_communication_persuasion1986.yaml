source_id: S34
title: "Communication and Persuasion: Central and Peripheral Routes to Attitude Change"
authors: "Richard E. Petty; John T. Cacioppo"
year: 1986
journal: Springer（专著；ELM 全书版）
doi: "10.1007/978-1-4612-4964-1"
url: "https://wiki.mbalib.com/wiki/Elaboration_Likelihood_model"
