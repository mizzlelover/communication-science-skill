- id: community_governance
  canonical_name_en: Community Governance
  canonical_name_zh: 社群治理
  domain: community
  definition: 社群治理（community governance）指社群内规则制定、执行、冲突裁决与权力分配的制度安排：谁定规则（自上而下 vs 成员共议）、如何执行（管理员裁量 vs 明文条款）、违规如何处置（阶梯式
    vs 一次性）、权力如何交接与问责。开源社区与公共资源治理研究为其提供了最系统的参照。
  core_claim: 可持续社群需要与规模匹配的治理结构：小社群靠人情与共识，中等社群需要明文规则与执行一致性，大型社群必须有权力的分权、问责与修订机制；治理缺位的社群必然走向管理员倦怠或规则暴政。
  mechanism: 治理解决社群的三类协调问题：行为协调（什么可做什么不可做）、冲突处理（成员间争端如何裁决）、权力约束（管理员自身滥权怎么办）。治理的公信力来自程序正义感：规则明确（成员知道边界）、执行一致（同错同罚）、可申诉（处置不是终审判决）、可修订（规则本身可以被成员推动改变）。Elinor
    Ostrom 对公共资源治理的研究表明，由使用者参与制定的规则比外部强加的规则更被遵守——社群治理同理。
  causal_chain: 规则制定参与 → 规则清晰 + 执行一致 + 可申诉 → 程序正义感 → 成员自愿遵守 + 管理公信力 → 社群秩序自维持
  variables:
    inputs:
    - 规则的明确度
    - 执行一致性
    - 成员参与制定程度
    moderators:
    - 社群规模
    - 冲突烈度与频率
    - 平台治理环境（平台规则优先）
    mediators:
    - 程序正义感知
    - 对管理层的信任
    outputs:
    - 违规率
    - 成员安全感
    - 治理成本（管理员倦怠度）
    - 社群寿命
  evidence:
    supporting:
    - Elinor Ostrom 对公共资源自主治理原则的研究传统（多主体参与制定、分级制裁、冲突裁决机制）
    - 开源社区治理与在线社区管理的实践研究（维基百科治理结构的案例研究传统）
    conflicting:
    - 过强的成员共议可能造成决策瘫痪；强人治理在早期更高效但交接脆弱（治理研究讨论）
    replication:
    - 「规则明确 + 执行一致降低违规」的方向在平台研究与实践复盘中稳定；最优治理形态无普适解
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 治理结构需随规模迁移：照搬百人社群的「群主说了算」到万人社群必然崩坏
  - 社群治理嵌套于平台治理之下：平台规则的不可协商约束社群自治空间
  failure_conditions:
  - 规则含糊但执行严厉（「看我心情式执法」）：程序不正义感是最大混乱源
  - 治理完全外包给平台举报机制：社群失去自主规范能力，沦为无主之地
  common_misinterpretations:
  - 「治理=删帖封人」——处置只是治理的末端；规则透明、申诉与修订机制才是治理主体
  - 把 community_governance 与 moderation_governance 混为一谈：前者是社群自治层面的规则与权力安排，后者是平台层面对内容的规模化审核治理
  ethical_risks:
  - 治理权力无问责：选择性执法与裙带关系（管理员小团体特权）
  - 以治理名义实施过度监控（聊天记录审查、隐私侵犯）
  examples:
    original_cases:
    - Ostrom 对自治组织治理设计原则的总结（《Governing the Commons》研究传统）
    - 开源项目治理结构案例（社区实践文献）
    research_cases:
    - 维基百科等大型协作社区的治理机制案例研究（方向一致）
    modern_cases:
    - Discord 社区的公开版规+申诉通道+版主选举实践
    - 微信大群从「群主独裁」向「轮值管理+群规公投」的演进
  communication_implications: 对外传播社群治理透明度（公开版规、公开处置原则）本身就是品牌信任资产；治理黑箱的社群在冲突曝光时舆论代价极高。
  community_implications: 治理三件套最低配置：一页可链接的明文版规（而非聊天记录里的口令）、固定的申诉入口（私聊管理员而非公开对线）、季度规则修订窗口（成员提案权）。
  content_applications:
    body: 把「社群守则」做成可分享的公开内容（置顶、链接），新人入群即读
    narrative: 用真实治理案例（匿名化）讲「这里如何处理一次冲突」，展示程序正义
    comments: 处置争议时公开说明依据（引用版规条目），把执行过程透明化
    sharing: 设置管理员招募与轮值的公开通道，把治理参与设计成地位阶梯的一环
  platform_implications: 平台把社群管理工具（禁言、审核机器人、成员分级）标准化，社群治理被部分「平台化」：自治与平台治理的边界划分是每个社群的真实约束（原则性判断）。
