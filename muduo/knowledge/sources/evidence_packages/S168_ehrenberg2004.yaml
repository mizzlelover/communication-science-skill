title: "Understanding Brand Performance Measures: Using Dirichlet Benchmarks"
authors: "Andrew S. C. Ehrenberg, Mark D. Uncles, Gerald J. Goodhardt"
year: 2004
journal: "Journal of Business Research 57(12): 1307-1325"
doi: "未知（Elsevier PII: S0148-2963(03)00179-6；IDEAS/RePEc 未列 DOI）"
