  - "消费者行为由内外部因素决定：内部（知觉-学习记忆-动机-自我-人格态度）+外部（群体-阶层-亚文化-文化）；'轮子'模型强调个体与社会现实的不可分"
  - "动机过程（驱力/期望/需要层次）、知觉过程（营销刺激的吸收解读）、态度说服（双路径）构成微观基础"
  - "数字时代：数字自我/社媒影响/大数据个性化/决策情境（启动、助推）"
