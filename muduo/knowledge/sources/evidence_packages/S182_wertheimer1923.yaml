# Evidence Package — S182 Wertheimer 1923（Untersuchungen zur Lehre von der Gestalt, II）
# 标准格式。access_level 如实标注。
source_id: S182
title: "Untersuchungen zur Lehre von der Gestalt, II（格式塔组织原则；英文摘译 'Laws of Organization in Perceptual Forms'）"
authors: "Max Wertheimer"
year: 1923
journal: "Psychologische Forschung 4: 301-350"
doi: "未知"
url: "https://pubmed.ncbi.nlm.nih.gov/22670344/"
access_level: substantial_excerpt
research_status: annotated
content_obtained: "渠道1：PubMed/Perception 2012 历史综述（Vezzani 等，确认原文出处『Psychologische Forschung 4 301-350』与地位）；渠道2：格式塔心理学中文百科与英文科普（组织原则清单：近接/相似/闭合/连续）；渠道3：中文学术文献引用确认 Ellis 1950 英文摘译（A Sourcebook of Gestalt Psychology, pp. 71-81）"
research_question: "视觉场中的离散元素依据哪些规则被自动组织为整体（知觉组织）？"
core_claims:
  - "知觉世界依据组织因素（factors of organisation）被组织，整体先于且不同于部分之和"
  - "提出近接（proximity）、相似（similarity）、闭合（closure）、连续（continuity）等经典分组规则（原文为德文，此处为英文摘译/综述转述）"
  - "组织过程自动发生，独立于观察者的意图（原研究以点阵图形的系统实验为基础）"
method: "经典现象学实验：系统变化点阵图形中元素的距离、相似性等维度，观察知觉分组方式"
results: "确立格式塔组织原则体系，成为视觉研究里程碑与后续知觉组织研究的起点"
limitations: "1923 年原文为德文，本包内容基于英文摘译（Ellis 1950 节译 pp. 71-81）与二手综述转述，非原文全文；早期研究以现象学描述为主"
boundary_conditions: "多规则冲突时由相对强度与任务决定分组；文化（如阅读方向）与设计经验调节偏好；元素噪声过高时组织失败"
relevant_nodes: [gestalt_grouping, figure_ground_separation, visual_hierarchy, processing_fluency]
notes: "原文德文，本包按英文摘译+综述转述登记格式塔组织原则（近接/相似/闭合/连续）；未直接获取 1923 原文全文。"
