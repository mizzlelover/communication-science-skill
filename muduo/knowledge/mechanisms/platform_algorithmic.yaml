# platform_algorithmic — 平台与算法中介（Platform & Algorithmic Mediation）
# 平台机制层：算法如何改变底层人类机制的触发条件。只描述机制，不发明理论。
domain: platform_algorithmic
nodes:
  - id: algorithmic_amplification
    canonical_name_en: Algorithmic Amplification
    canonical_name_zh: 算法放大
    aliases: ["algorithmic distribution", "算法分发"]
    domain: platform_algorithmic
    definition: 平台推荐系统根据内容的早期表现信号（点击、完播、互动等）决定是否将其推送给更大范围用户的过程。它是一种动态曝光分配机制：内容不是一次性发布给全部粉丝，而是在逐级放大的"流量池"中被持续评估。
    core_claim: 在算法分发环境中，内容的初始互动信号会非线性地决定其最终曝光量，早期信号质量比总粉丝规模更能预测传播结果（后半句为从业者观察，非所引 EP 直接结论）。
    mechanism: 推荐系统无法预先知道内容质量，只能用早期受众的真实反馈作为代理指标。表现好的内容获得更大测试人群，表现差的内容被压低。这使传播结果呈现重尾分布：少数内容获得绝大部分曝光，多数内容几乎不可见。注意：算法本身不"判定"内容好坏，它只放大它观测到的互动信号——信号的构造方式决定了什么被放大。
    causal_chain: "小范围初始曝光 → 互动信号测量 → 信号达标 → 更大范围曝光 → 再次测量 → 持续放大或衰减"
    variables:
      inputs: ["初始曝光人群", "内容的即时互动信号", "内容发布时间"]
      moderators: ["平台的目标函数（互动/停留/交易）", "账号历史权重", "内容品类竞争强度"]
      mediators: ["互动信号", "负反馈信号（划走/举报/不看）"]
      outputs: ["最终曝光量", "传播曲线形状"]
    evidence:
      supporting: ["平台公开的创作与推荐机制说明（各平台创作者中心）", "对社交平台内容分布重尾结构的网络科学研究（如 Watts、Barabási 方向的流行度分布研究）", "S99 The Chaos Machine 记录的算法放大案例调查", "S56 Everything Is Obvious 音乐实验室实验：可见他人反馈使流行度与内容质量脱钩（从众/传播顺序权重远超内容质量），传播结果难以早期预测", "S147 Bakshy 2015 一手研究：算法排序使跨阵营内容暴露较时间排序约减 15%"]
      conflicting: ["各平台实际权重不公开，外部研究只能间接推断", "平台会主动调整策略，外部结论时效性差"]
      replication: ["重尾分布的宏观结构在多平台观察中稳定；具体单条内容的放大路径不可复现"]
      meta_analysis: []
    evidence_grade: "B+"
    boundary_conditions: ["适用于算法分发占比高的平台", "对纯订阅/关注分发平台（如 RSS、邮件列表）解释力弱", "初始流量池机制在抖音类平台最典型，微博热搜类平台遵循不同逻辑"]
    failure_conditions: ["付费投流可直接购买曝光，绕过自然放大路径", "账号权重高时初始信号要求降低", "小众品类的互动信号天然偏低，可能被系统性压低而非质量问题"]
    common_misinterpretations: ["把'算法推荐'当成黑箱命运，放弃分析可控信号", "认为算法能识别内容质量——它只识别互动信号", "把单次爆款归因于算法偏好而忽略发布时间、初始人群等变量"]
    ethical_risks: ["放大机制天然偏好情绪化、极端化内容（见 engagement_optimization_bias）", "创作者可能为迎合信号而牺牲准确性与伦理"]
    examples:
      original_cases: []
      research_cases: ["对 Twitter/X 等平台内容流行度的网络观测研究显示流行度分布高度重尾且难以早期预测（Watts 方向）"]
      modern_cases: ["短视频平台流量池逐级晋级", "公众号'在看/转发'影响二次分发", "小红书笔记的搜索+推荐双路径"]
    communication_implications: 内容策略必须区分"给人看"与"给算法看"两个层面：先保证初始人群的互动信号（点击、完播、互动），再谈大盘传播。标题/封面/开场承担信号引爆功能。
    community_implications: 社群冷启动期内容难以获得算法放大，需先靠私域与关系链导入初始互动。
    content_applications:
      title: "标题同时服务人类好奇心与算法点击率信号，但不可欺骗（点开即跳出会被负反馈惩罚）"
      opening: "开场必须在前几秒/前几行给出继续的理由，完播与读完全文是核心正信号"
      body: "中段设置'再看一下'的信息点以维持停留信号"
      cta: "明确的互动引导可提升评论率，但诱导互动违反多数平台规则（official_rule 类风险）"
    platform_implications: 不同平台的目标函数不同：短视频平台偏完播与停留，图文社区偏收藏与搜索匹配，社交平台偏转发。同一内容在不同平台的放大路径完全不同——这正是平台适配器存在的原因。
    related_nodes: ["recommendation_feedback_loop", "engagement_optimization_bias", "ranking_signal_weighting", "cold_start_dynamics", "attention_economics"]
    conflicting_nodes: []
    source_ids: ["S92", "S95", "S99", "S56", "S147"]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Aral 2020《The Hype Machine》（S92，book 级，substantial_excerpt：炒作机器三部曲/2018 Science 假新闻）+ van Dijck 2018（S95，平台化框架）"
      effect_size: "算法放大互动信号→重尾曝光分布；假新闻因新颖性与情绪反应传播更快更深"
      replication_status: "重尾分布宏观结构多平台稳定；具体放大路径不可复现"
      context_dependency: "算法分发占比高的平台；纯订阅/关系分发平台解释力弱"
      downgrade_upgrade_reason: "2026-09 实取 S92/S95 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S92]
      supporting_evidence: [S95, S99]
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: recommendation_feedback_loop
    canonical_name_en: Recommendation Feedback Loop
    canonical_name_zh: 推荐反馈循环
    aliases: ["算法回环", "personalization loop"]
    domain: platform_algorithmic
    definition: 用户行为训练推荐模型、推荐结果又塑造用户后续行为，二者互相强化的闭环系统。用户刷到什么会继续看什么，继续看什么就更可能被再推荐什么。
    core_claim: 推荐系统与用户行为形成自增强闭环，使个体信息环境随时间收敛于系统认为该用户偏好的局部区域。
    mechanism: 推荐模型以历史行为为输入预测下一步内容；用户点击/停留又成为新的训练信号。短时间内该循环提升体验（越刷越准），长期则产生路径依赖：探索性内容获得的曝光机会递减，用户兴趣被部分"锁死"。对创作者同理：历史爆款主题会获得更多同类推荐机会，形成选题路径依赖。
    causal_chain: "历史行为 → 推荐输出 → 用户反馈 → 模型更新 → 更强化同类推荐"
    variables:
      inputs: ["用户行为历史", "内容特征", "相似用户行为"]
      moderators: ["探索机制（exploration/exploitation 平衡）", "用户新行为与历史的偏离度"]
      mediators: ["点击与停留信号"]
      outputs: ["个体信息环境收敛", "创作者选题路径依赖"]
    evidence:
      supporting: ["推荐系统文献中的过滤器与信息茧房建模研究", "S93 The Filter Bubble 的概念论证", "S100 Filterworld 对算法同质化文化的观察"]
      conflicting: ["实证上'茧房'强度存在争议：多项研究显示算法也可能增加多样化暴露（取决于度量方式与平台）", "用户主动搜索会打破循环"]
      replication: ["回环存在性获得广泛接受；'茧房'的强度与普遍性结论不一致"]
      meta_analysis: []
    evidence_grade: "B"
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions: ["被动消费场景最强", "有强搜索/主动关注习惯的用户循环被打破", "跨平台多来源使用者受影响小"]
    failure_conditions: ["用户兴趣转变且系统捕捉到偏离信号", "平台刻意引入多样性干预（部分平台有探索位）", "线下关系链推荐（如视频号社交叠加）稀释纯算法回环"]
    common_misinterpretations: ["把回环当成铁笼——用户搜索行为与主动关注是主要逃生通道", "把信息茧房完全归咎于算法而忽略用户自主选择（selective exposure）的贡献"]
    ethical_risks: ["极端化内容经由回环放大", "创作者被回环绑架：偏离既往选题即流量下滑"]
    examples:
      original_cases: []
      research_cases: ["对推荐系统暴露多样性的观察研究结论不一（方向性引用）"]
      modern_cases: ["抖音兴趣电商的'越刷越准'", "小红书搜索词沉淀改变后续内容供给", "B站推荐位与追更行为互相强化"]
    communication_implications: 内容要让算法"读懂你是谁"：垂直度、标签一致性、稳定选题会累积推荐资产；跨域跳转要付出回环重置成本。
    community_implications: 社群内容若长期同质，成员信息环境收敛，易陷入内部回音；需设计跨域内容与外部触点。
    content_applications:
      body: "垂直深耕积累推荐资产，跨界内容用新账号或明确的新系列承接"
      title: "保持标题关键词与内容领域一致，减少信号噪声"
      comments: "引导评论区围绕主题展开，避免跑题稀释信号"
    platform_implications: 平台常在回环中加入探索流量与新内容冷启动扶持，创造者可利用"新内容扶持期"。
    related_nodes: ["algorithmic_amplification", "filter_bubble_echo_chambers", "engagement_optimization_bias", "cold_start_dynamics"]
    conflicting_nodes: []
    source_ids: ["S92", "S93", "S95", "S100"]
    provenance:
      primary_sources: ['S92', 'S93', 'S95', 'S100']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: engagement_optimization_bias
    canonical_name_en: Engagement Optimization Bias
    canonical_name_zh: 互动优化偏差
    aliases: ["engagement bias", "注意力经济的外部性"]
    domain: platform_algorithmic
    definition: 当平台以互动量（点击、评论、停留）作为优化目标时，系统会系统性地偏好更能激起即时反应的内容形态——情绪强烈、立场鲜明、冲突显著、信息差大——而不一定偏好更准确、更有价值的内容。
    core_claim: 目标函数决定放大结果：以互动为目标函数的推荐系统会系统性放大高唤醒、高冲突内容，这是结构性现象而非个别运营失误。
    mechanism: 人类注意力对威胁、冲突、道德违反有自下而上的优先捕获（bottom_up_attention_capture），高唤醒情绪又促进分享（emotional_arousal）。当这些心理倾向被目标函数捕获并当作信号使用时，系统无须任何人刻意作恶，就会在统计上偏向此类内容。这解释了为何极端化内容在算法平台获得不成比例的曝光。
    causal_chain: "人类注意与情绪偏向 → 互动信号差异 → 目标函数放大高互动内容 → 内容生态向高唤醒漂移"
    variables:
      inputs: ["平台目标函数定义", "用户互动行为分布"]
      moderators: ["平台是否引入质量/权威性权重", "负反馈与举报机制强度", "内容品类（新闻vs娱乐）"]
      mediators: ["emotional_arousal", "bottom_up_attention_capture"]
      outputs: ["内容生态情绪化漂移", "极化加剧", "低质量内容挤占曝光"]
    evidence:
      supporting: ["S99 The Chaos Machine 对算法放大极化的跨平台调查", "S92 The Hype Machine 中关于社交平台情绪与传播关系的实验研究", "离散情绪与分享关系的研究（如 awe/anger 促进分享的方向）", "S107 Kramer 2014：Facebook 对约 68 万用户 News Feed 情绪内容的大规模操纵实验，证明平台可大规模调节信息流情绪倾向（按 EP notes 要求并行引用：PNAS Editorial Expression of Concern 伦理关注声明，涉及知情同意与大规模无明确同意干预的伦理边界）"]
      conflicting: ["平台会阶段性调整目标函数（加入'有价值停留'等指标），偏差随之变化", "并非所有品类同幅漂移：工具类、教程类内容受影响小"]
      replication: ["方向性结论在多个平台重复观察到；具体幅度因平台与时期差异大"]
      meta_analysis: []
    evidence_grade: "B+"
    boundary_conditions: ["新闻政治品类最显著", "娱乐/工具/知识品类偏差弱得多", "有强编辑/审核层的平台部分缓解"]
    failure_conditions: ["平台目标函数改为留存/满意类指标", "付费墙/订阅制平台（收入直接来自用户而非注意力转售）结构不同", "强社区规范的小环境（如垂直论坛）自我纠偏"]
    common_misinterpretations: ["把生态偏差当成'用户就爱看这个'的必然——它同时是目标函数的产物", "以此论证'只能做标题党'——偏差描述的是统计倾向，不构成个体策略的正当性"]
    ethical_risks: ["为迎合偏差制造愤怒与焦虑（manufactured outrage）属于反模式库条目", "公共讨论质量受损的外部性"]
    examples:
      original_cases: ["S99 记录的多平台极端内容放大案例（调查报道性质）"]
      research_cases: ["情绪唤醒度与在线分享率的实证关系研究（Berger & Milkman 方向）"]
      modern_cases: ["热点事件中情绪对立内容的曝光优势", "财经/健康领域'焦虑标题'的流量溢价"]
    communication_implications: 理解偏差存在后有两种合法用法：a) 在合理范围内提高内容的情绪价值与立场清晰度；b) 反向机会——在高唤醒红海中提供冷静、可信赖的内容，借助 authenticity_premium 差异化。禁止制造虚假愤怒。
    community_implications: 社群运营需主动设置规范缓冲算法偏差：鼓励长思考内容、惩罚互喷，否则社群互动被高唤醒冲突占据。
    content_applications:
      title: "可提升唤醒但不得伪造事实；愤怒标题的短期信号收益换长期信任损耗"
      opening: "开头呈现真实冲突或张力（而非虚假冲突）是合规的高唤醒来源"
      emotion: "使用真实案例唤起共情而非编造恐惧"
      comments: "预设立场问题引导表达，但避免群体攻击性话题"
    platform_implications: 各平台对此偏差的治理策略不同（权重调整、降权标签、事实核查），平台适配时需评估当前治理强度。
    related_nodes: ["algorithmic_amplification", "emotional_arousal", "bottom_up_attention_capture", "attention_economics", "misinformation_velocity"]
    conflicting_nodes: []
    source_ids: ["S92", "S99", "S59", S45, "S107"]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Fisher 2022《The Chaos Machine》（S99，engagement 优化与愤怒放大调查）+ Aral 2020（S92，算法加权）+ Berger 2013（S59，高唤醒内容）"
      effect_size: "engagement 加权放大高互动/高唤醒内容（平台内部调查+实证研究）"
      replication_status: "engagement 偏差为多来源观察记录（2020-2022 平台文件/调查报道）"
      context_dependency: "平台权重/内容类型/治理强度调制"
      downgrade_upgrade_reason: "2026-09 实取 S99 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S99]
      supporting_evidence: [S92, S59, S45]
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: filter_bubble_echo_chambers
    canonical_name_en: Filter Bubbles and Echo Chambers
    canonical_name_zh: 过滤气泡与回音室
    aliases: ["information cocoon 信息茧房"]
    domain: platform_algorithmic
    definition: 过滤气泡指算法个性化过滤使用户难以见到不同观点的现象（Pariser 2011 提出的概念）；回音室指同质观点在封闭群体内反复回响强化的社会结构。两者常被混用但机制不同：前者是算法过程，后者是社会过程。
    core_claim: 算法个性化与社会同质性都可能收窄信息环境，但实证证据显示其实际强度远低于流行叙事，且两者的贡献需要分开评估。
    mechanism: 过滤气泡假设推荐系统过滤掉分歧内容；回音室机制则依赖同质连接（homophily）与群体规范使异见被沉默或排斥。二者的实证检验结果混合：S147 一手数据显示算法排序使跨阵营内容暴露较时间排序约减 15%，但个体选择（用户主动关注同温层）的贡献大于算法过滤；S93 侧的模拟研究则未复现极端隔离气泡（两 EP 口径存在差异，待进一步一手核验）。即"茧房"更多是人的选择性接触与算法的叠加结果，而非算法单独造成。
    causal_chain: "同质连接 + 选择性接触 → 观点同质化 → 规范强化 →（叠加算法个性化）→ 信息环境收窄"
    variables:
      inputs: ["用户的主动关注与搜索行为", "推荐系统的多样性设计"]
      moderators: ["平台分发模型（社交分发vs算法分发）", "议题政治化程度", "用户教育水平与媒介素养"]
      mediators: ["选择性接触 selective exposure", "homophily"]
      outputs: ["观点极化程度", "跨阵营理解下降（在强场景下）"]
    evidence:
      supporting: ["S93 The Filter Bubble 的概念论证", "同质连接与政治极化关系的观察研究（Bakshy 等对 Facebook 信息暴露的研究显示个体选择是重要贡献者）", "选择性接触理论的长期证据"]
      conflicting: ["模拟研究未复现极端隔离气泡（S93）；算法削减幅度小于个体选择（S147）——两 EP 结论不同，如实并列，待进一步一手核验", "'回音室'在普通用户中的普遍性被高估，多数用户接触面比假设更杂", "议题类型差异大：政治强议题茧房效应明显，日常生活议题几乎不存在"]
      replication: ["'概念存在'被接受；'强度与普遍性'结论不一致，是活跃争议区"]
      meta_analysis: []
    evidence_grade: "B"
