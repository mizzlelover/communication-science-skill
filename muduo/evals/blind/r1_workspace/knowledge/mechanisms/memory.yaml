- id: testing_effect
  canonical_name_en: Testing Effect (Retrieval Practice)
  canonical_name_zh: 测试效应（提取练习）
  aliases:
  - 提取练习
  - retrieval practice
  - 检索练习 —— 与 germane_load_learning 的关系：测试效应是深加工中证据最强的一种具体操作
  domain: memory
  definition: 提取练习（自测、回忆、闭卷作答）比重复阅读更能巩固长期记忆。Roediger 与 Karpicke 2006 的系列实验确立了其独立于重复学习的地位；测试不只是测量，它本身就是最强有力的学习事件之一。
  core_claim: 成功的提取行为本身改变并巩固记忆，其长期效果超过等时的重复阅读。
  mechanism: 提取重建并强化记忆通路，同时增加提取线索的多样性（在不同情境下被成功提取的记忆拥有更多入口）；难度适中的提取构成必要难度（Bjork），失败后立即反馈同样有效。重读则相反——它制造流畅性错觉，让人误以为自己学会了。
  causal_chain: 提取尝试 → 通路重建 + 线索多样化 → 长期保持提升 → 后续提取更容易
  variables:
    inputs:
    - 提取尝试次数
    - 提取难度
    - 反馈及时性
    moderators:
    - 材料难度
    - 学习者水平
    - 提取与反馈间隔
    mediators:
    - 提取成功
    - 线索多样性
    outputs:
    - 延迟测验成绩
    - 迁移能力
    - 学习效率
  evidence:
    supporting:
    - Roediger 与 Karpicke 2006 的学习-测试对比实验
    - 课堂现场的重复实验与多项元分析支持
    - Bjork 的必要难度框架提供了机制解释
    conflicting:
    - 极难或无反馈的提取可能挫伤动机；选择题猜测的收益有限
    replication:
    - 被多国多年龄段样本稳健复制，是认知心理学应用于教育最成功的发现之一
    meta_analysis:
    - 多项元分析确认提取练习优于重读的平均优势（一手元分析 EP 未建，已建包 EP S190）
  evidence_grade: A-
  boundary_conditions:
  - 需要成功或快速反馈的提取，难度要落在可达区间
  - 复杂技能需结合应用情境，不能只靠回忆式自测
  failure_conditions:
  - 纯选择题连猜无加工，收益趋近于零
  - 高焦虑考试情境可能反向损害表现
  common_misinterpretations:
  - 反复读就是复习——重读的流畅性错觉恰恰掩盖了没记住的事实
  - 把测试当压力工具——低风险自测才是正确用法
  ethical_risks:
  - 用挫败感测试制造焦虑再售卖解决方案（伪测评营销）
  examples:
    original_cases:
    - S04 对提取与记忆巩固的讨论
    research_cases:
    - 学习-重读组与学习-自测组的对比：一周后自测组的保持显著更好，尽管当下自我感觉更差
    modern_cases:
    - Anki 与间隔复习软件；社群每日问答打卡；知识付费的结营测验
  communication_implications: 把受众从读者变成答题者：每条内容附一个可自答的问题，是性价比最高的记忆投资。
  community_implications: 社群的问答文化（每周一题、案例复盘提问）把测试效应制度化为集体学习资产。
  content_applications:
    body: 每节末尾加一个自测问题
    cta: 邀请读者先自答再展开评论区对照
    opening: 用一道前置小题激活相关旧知识
  platform_implications: 平台的问答、投票与测验组件是现成的提取工具；但纯互动指标不区分猜测与真提取，效果要靠设计保证。
  related_nodes:
  - spaced_repetition
  - germane_load_learning
  - encoding_specificity
  - gist_vs_verbatim_memory
  - processing_fluency
  source_ids:
  - S04
  - S05
  - S190
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: 提取练习效应方向由教科书级文献共识支撑（S04/S05 相邻概念），但 Roediger & Karpicke 2006 与元分析一手 EP 未建，内容来自记忆蒸馏，待建
      EP 后升级；2026-09-09 一手 EP 已建（S190）
    effect_size: 提取练习优于等时重读（方向由教科书共识支撑；一手元分析未建包，无一手效应量可引）
    replication_status: 『多项元分析确认』『多国多年龄段稳健复制』等表述超出 S04/S05 EP 所载，回退为记忆级转述
    context_dependency: 提取难度/反馈/间隔调制效应
    downgrade_upgrade_reason: 2026-09 反向审计：核心实验证据（Roediger & Karpicke 2006、课堂复制、Bjork 必要难度、多项元分析）在 S04/S05
      EP 均未载且未建包，grade 由 A 降为 C，validation_status 回退 MEMORY_BASED，待建 EP 后升级
  provenance:
    primary_sources:
