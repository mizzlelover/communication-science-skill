  - id: ranking_signal_weighting
    canonical_name_en: Ranking Signal Weighting
    canonical_name_zh: 排序信号权重
    aliases: ["ranking factors", "算法权重"]
    domain: platform_algorithmic
    definition: 推荐系统对各类行为信号（完播率、点赞、评论、转发、收藏、关注转化、负反馈等）赋予不同权重以决定内容排序的原则性描述。此节点只刻画信号类别学，不声明任何具体平台的内部权重数值。
    core_claim: 不同平台因目标函数不同，对信号类别的权重排序不同；理解某平台的信号语义是内容适配的前提。
    mechanism: 平台把目标函数（停留、互动、交易、社交活跃）分解为可观测的代理信号，并按其对目标的预测力赋权。如短视频平台的核心信号是完播与停留（时长型平台），图文种草平台的核心信号是收藏与搜索点击（决策型平台），社交平台的核心信号是转发与评论（关系型平台）。权重还会随品类、时段、账号层级动态调整。
    causal_chain: "平台目标函数 → 代理信号选择 → 信号权重分配 → 内容排序结果"
    variables:
      inputs: ["内容的多维互动信号", "账号历史", "内容特征（文本/视觉）"]
      moderators: ["平台商业目标", "品类", "时段与流量池"]
      mediators: ["用户即时行为"]
      outputs: ["内容分发排序"]
    evidence:
      supporting: ["平台公开的创作者指南会披露信号语义方向（official_rule 层）", "平台算法开源快照（如 X 的推荐算法开源）提供部分信号权重方向", "推荐系统通用文献（协同过滤、多目标排序）"]
      conflicting: ["具体权重数值不公开且频繁调整，任何精确数值宣称都不可靠", "不同品类的实际权重不同，通用指南只能给方向"]
      replication: ["信号类别学稳定；数值权重不可复现验证"]
      meta_analysis: []
    evidence_grade: "C"
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions: ["适用于以机器排序为主的平台", "对纯人工编辑分发场景解释力弱", "本节点是原则层，平台具体状态必须查 platform adapter 与官方公告"]
    failure_conditions: ["平台策略调整后旧结论失效", "用 A 平台信号语义直接套 B 平台", "把行业猜测当成官方权重"]
    common_misinterpretations: ["'收藏权重最高'这类断言脱离平台与时期，多为经验推测", "把公开指南的营销话术当成算法规则", "以为堆砌某个信号（如诱导点赞）可以稳定起量——平台会反博弈"]
    ethical_risks: ["针对信号造假（刷量）违反平台规则并损害生态", "误导客户按不实权重承诺效果"]
    examples:
      original_cases: []
      research_cases: ["X 平台推荐算法开源仓库披露的信号构成（verified_observation 层）"]
      modern_cases: ["小红书收藏率与搜索流量的强关联（行业共识）", "抖音完播率的优化导向（官方公开方向）"]
    communication_implications: 做平台适配时第一步是确认该平台"什么行为算成功"：决策型平台优化收藏与搜索命中，时长型平台优化完播，关系型平台优化转发评论。同一内容在各平台应重构信号设计。
    community_implications: 社群平台化运营时，理解平台信号决定引流策略：搜索型平台靠关键词布局，推荐型平台靠互动率。
    content_applications:
      title: "标题优化目标随平台信号语义变化：搜索平台嵌关键词，推荐平台造好奇"
      opening: "时长型平台把最有价值点前置以保完播"
      cta: "引导与平台核心信号一致的行为（种草平台引导收藏而非点赞）"
    platform_implications: 平台 adapter 的 interaction_signals 字段即此节点的平台实例化。平台权重信息一律标注 fact_type 与时间。
