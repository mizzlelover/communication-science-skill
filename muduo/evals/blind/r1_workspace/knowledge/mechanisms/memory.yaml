- id: serial_position_effect
  canonical_name_en: Serial Position Effect
  canonical_name_zh: 系列位置效应（首因与近因）
  aliases:
  - 首因近因效应
  - primacy-recency —— 与 peak_end_rule 的区别：本效应针对序列材料的即时记忆，峰终定律针对整段经历的事后评价
  domain: memory
  definition: 序列呈现的项目中，开头（首因，依托长时记忆的复述）与结尾（近因，仍留在工作记忆）记忆最好，中间塌陷。Murdock 1962 的自由回忆研究与 Glanzer 与 Cunitz
    1966 对两种成分的分离是经典基础。
  core_claim: 呈现顺序系统性塑造记忆：首位与末位享有记忆特权，中间位置付出代价。
  mechanism: 首因项获得更多复述时间与更深的编码加工，得以转入长时记忆；近因项尚未被替换，直接从工作记忆读出；延迟回忆或插入分心任务会消除近因而保留首因，证明两者机制不同。
  causal_chain: 序列呈现 → 首位获得复述优势 + 末位保持工作记忆 → 首尾回忆优势 → 中间塌陷
  variables:
    inputs:
    - 呈现顺序
    - 序列长度
    - 呈现节奏
    moderators:
    - 延迟与分心任务
    - 项目差异度
    - 受众卷入
    mediators:
    - 复述量
    - 工作记忆保持
    outputs:
    - 自由回忆率
    - 关键信息留存
    - 选择偏好
  evidence:
    supporting:
    - Murdock 1962 的自由回忆系列位置曲线
    - Glanzer 与 Cunitz 1966 用延迟回忆分离首因与近因
    conflicting:
    - 长序列与快节奏会加剧塌陷；高强度独特项目可打破位置规律
    replication:
    - 序列位置曲线是记忆研究最稳定的发现之一
    meta_analysis: []
  evidence_grade: A
  boundary_conditions:
  - 依赖序列长度：超长列表中间塌陷加剧
  - 延迟或分心会消除近因成分
  failure_conditions:
  - 把最想让人记住的卖点放在中段
  - 结尾被无关琐事占据，浪费近因红利
  common_misinterpretations:
  - 平均分配每个卖点的篇幅——忽略位置权重的平摊等于自费放弃首位优势
  - 以为开头只要吸睛——开头还承担最深编码的第一波信息
  ethical_risks:
  - 把免责或费用信息放在记忆最差的中段位置
  examples:
    original_cases:
    - S72 消费者行为教科书中广告位置与记忆的研究传统
    research_cases:
    - 自由回忆实验的位置曲线：首尾高、中间低的 U 形
    modern_cases:
    - 视频前 3 秒与结尾 5 秒的信息卡位；直播讲品的开场与压轴安排；榜单第一名效应
  communication_implications: 结构即记忆策略：最强论点放开头做深编码，行动指令放结尾吃近因，中间只放支撑性内容。
  community_implications: 社群活动的议程设计同理——最重要的事放在开场与收尾，中段用来执行事务。
  content_applications:
    title: 标题首位放核心利益词
    body: 三点式结构中把最不可妥协的论点放在第一点
    cta: 结尾 10 秒重复唯一行动指令
  platform_implications: 信息流位置拍卖本质上是对首位记忆与注意特权的定价；内容端的对策是把位置结构内化到素材自身。
