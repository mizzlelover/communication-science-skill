    modern_cases:
    - 老用户价格更高被曝光的舆情；平台抽成争议；社群资源分配规则的公平性讨论
  communication_implications: 涨价、改规则需提前公告理由并保持程序透明——程序公平能容纳结果不均，暗改则触发惩罚。
  community_implications: 社群规则变更走公示与征求意见流程；奖励分配公示标准，公平感是社群信任的承重墙。
  content_applications:
    body: 涉及定价与规则的内容主动披露分配逻辑（钱去哪了、谁受益）
    comments: 对公平质疑做公开、具体、可核查的回应，而非删除评论
