- id: social_reinforcement
  canonical_name_en: Social Reinforcement
  canonical_name_zh: 多重社会强化
  aliases:
  - 社会强化
  - reinforcing signals
  domain: complex_contagion
  definition: 社会强化（social reinforcement）指个体从多个网络邻居处接收到关于同一行为的重复确认信号，每次额外的独立确认都提高采用概率。它是复杂传染的微观机制：Centola
    的网络实验将采用概率的增长归因于「被多个已采用邻居包围」所产生的累积强化，而非单次曝光的重复堆叠。
  core_claim: 多源确认的促进作用累积上升（S101：采纳概率随已采用邻居数显著上升；曲线形态因行为与人群而异）；同一来源的重复曝光无法替代多个独立来源的确认。
  mechanism: 多源确认同时完成三件事：证据叠加（独立来源都这样做，说明行为真的可行）、风险分摊（「大家都这样」意味着偏离常规的不是我）、身份许可（多重确认把行为从「冒险」重定义为「正常」）。单源重复只完成说服而不完成许可，因此效果弱得多。强化信号还必须是可见且可归因的——用户需要能数出「有多少不同的人」。
  causal_chain: 多个独立邻居已采用 → 累积确认信号 → 证据叠加 + 风险分摊 + 规范许可 → 采用概率累积上升 → 个体采用
  variables:
    inputs:
    - 已采用邻居的数量
    - 来源的独立性与可信度
    moderators:
    - 邻居与个体的关系强度
    - 行为社会成本
    - 强化信号的时间跨度（同期 vs 长期）
    mediators:
    - 证据叠加感
    - 规范许可感
    - 不确定性下降
    outputs:
    - 采用概率的累积上升
    - 采用后的坚持度
  evidence:
    supporting:
    - Centola 的受控网络实验：采用概率随已采用邻居数量上升（实验证据，见《How Behavior Spreads》）
    - 聚类网络条件优于随机网络条件的重复发现，指向强化的累积结构（后续网络干预实验方向一致）
    conflicting:
    - 强化信号存在收益递减：第 5 个确认的边际效应远小于第 2 个（方向性讨论，S101 EP 未载曲线数据）
    - 若多个「来源」被识破为同一组织操纵（水军），强化感崩塌并转为怀疑
    replication:
    - 「多源确认优于单源重复」在受控实验中方向一致；具体强化曲线形态因行为与人群而异
    meta_analysis: []
  evidence_grade: B+
  boundary_conditions:
  - 来源必须被感知为独立且可信；感知到的同源信号不算多重确认
  - 强化的作用窗口有限：确认信号过于分散（隔年一条）难以累积成采用推力
  failure_conditions:
  - 用同一 KOL 反复轰炸代替多源确认——重复曝光带来的是疲劳而非许可
  - 强化信号与用户身份错配（展示完全不同人群在用），确认感无法传导到「像我这样的人」
  common_misinterpretations:
  - 「刷屏=强化」——同源重复是曝光逻辑（注意力），多重独立确认才是强化逻辑（许可）；两者经常被混用导致投放策略错误
  - 把 social_reinforcement 与 social_proof 混为一谈：social_proof 是「看到他人行为」的启发式，social_reinforcement 强调多源累积对采用概率的动态作用，是传染网络层面的概念
  ethical_risks:
  - 伪造多源确认（批量小号、组织化刷评）是对强化机制的高级滥用，比单个假账号更难识别且危害更大
  examples:
    original_cases:
    - Centola 实验中受试者面对多个已报名邻居时采用概率上升的发现（《How Behavior Spreads》）
    research_cases:
    - 网络干预实验中聚类条件对比随机条件的采用差异（方向一致的多项研究）
    modern_cases:
    - 电商评论区「翻了几页都是不同人真实使用图」带来的确认感
    - 知识付费社群内多位学员不同时段的成果打卡（而非官方刷屏）
  communication_implications: 把「让用户数得出来的独立确认」做进内容：多位真实用户的不同表达 > 一位大 V 的重复背书；评论区运营的目标是多样性而非数量。
  community_implications: 社群是天然的强化发生器：让新成员加入时「迎面撞上」多个不同身份老成员的真实使用状态（迎新流程设计），这是转化的黄金时刻。
  content_applications:
    body: 正文并列呈现 3 个以上不同身份使用者的具体经历（职业、场景、时间各异），显式制造独立确认
    narrative: 叙事采用多线结构（几个人各自独立地做出同一选择），让读者体验强化的累积
    sharing: 晒单模板鼓励个性化表达，避免千篇一律（一致性太高会被识破为同源）
    comments: 区分对待：真实多样反馈置顶，同质刷屏清理——评论区的可信多样性是该机制的生命线
  platform_implications: 平台把「确认」数量化（点赞数、评价数），但数量可刷而多样性难造；展示结构化多样性（不同人群标签、时间分布）的平台更能承载强化逻辑（原则性判断）。
