- id: informational_influence
  canonical_name_en: Informational Influence
  canonical_name_zh: 信息性影响
  aliases:
  - 信息性社会影响
  domain: social_proof
  definition: 社会影响的两大路径之一（对应规范性影响）：人们因把他人的行为与判断当作现实证据而趋同——尤其当情境模糊、自身知识不足、他人被知觉为更有信息或类似处境时。原型是 Sherif 的自动运动效应（autokinetic
    effect）实验中群体判断标准的形成与传递（Sherif 自动运动实验，已建包 EP S187）。
  core_claim: 模糊情境中他人反应被当作现实线索，其效果依赖于信源被知觉为『知道真相的人』或『与我处境相似的人』。
  mechanism: 当现实本身模糊（无客观锚点）时，他人的判断提供了认知捷径——不是怕被排斥而跟随，而是真心相信『他们的反应包含信息』。Sherif 的自动运动效应实验中，孤立状态下个体形成各自的判断标准，群体互动后判断标准相互趋同并形成可传递的群体规范（甚至延续到后续的假被试；Sherif
    自动运动实验，已建包 EP S187）。信源的专业性或相似性决定该信息流的可信度权重。
  causal_chain: 情境模糊 + 他人反应可见 → 他人反应被当作现实证据 → 认知标准更新 → 群体标准趋同与代际传递
  variables:
    inputs:
    - 情境模糊度
    - 他人反应的可见性
    - 他人与自身的相似性/专业性
    moderators:
    - 受众对该领域的知识水平
    - 信源可信度
    - 信息的可验证性
    mediators:
    - 对他人判断的信息性信任
    - 认知不确定的降低
    outputs:
    - 私有态度改变（非仅公开顺从）
    - 群体判断标准形成
    - 谣言与集体误判的扩散
  evidence:
    supporting:
    - Sherif 自动运动效应实验：模糊光点运动判断中群体标准形成并传递（社会影响研究的基石实验之一；Sherif 自动运动实验，已建包 EP S187）
    - 危机情境中的从众研究：模糊+威胁下他人反应成为现实线索
    - 危机与谣言传播研究：模糊性是集体误判扩散的关键条件
    conflicting:
    - 清晰无歧义情境中信息性影响减弱（Asch 任务清晰时仍出现从众主要归因于规范压力）
    - 信源被识别为无知或利益相关时信息权重趋零
    replication:
    - Sherif 范式及其传递效应在多研究中重复（Sherif 自动运动实验，已建包 EP S187）
    - 信息性/规范性影响的分离在不同任务类型中得到验证
    meta_analysis:
    - 无独立 meta-analysis；通常并入社会影响综述（S31）
  evidence_grade: A-
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 情境模糊或判断缺乏客观标准
  - 他人被知觉为更知情或处境相似
  - 受众自身知识不足或不确定
  failure_conditions:
  - 情境清晰可验证（直接检验可否定他人判断）
  - 他人被识别为无知或利益操纵者
  - 受众有强专业背景与独立判断资源
  common_misinterpretations:
  - 把所有从众归因于『怕被排斥』——信息性影响下人们是真心相信多数更可能对
  - 忽视负面应用：谣言与恐慌性抢购正是信息性影响的产物（他人抢购被当作短缺证据）
  ethical_risks:
  - 利用模糊情境制造信息性误导（恐慌性谣言、伪稀缺暗示）
  - 雇用『知情者』表演制造虚假现实线索
  examples:
    original_cases:
    - Sherif 自动运动效应实验（社会影响研究传统基石，S21、S31 收录）
    research_cases:
    - Sherif 群体标准形成实验
    - 模糊情境下从众与私下态度改变的分离研究
    modern_cases:
    - 突发公共事件中的『别人都在囤』效应
    - 直播间『内部消息』话术
    - 医疗美容等高模糊决策领域中『同症状用户』经验帖的高影响力
  communication_implications: 在受众不确定的领域，展示『和我处境相似的人如何判断』比展示专家更具说服力（相似性>专业性在高模糊情境）；同时需警惕：不澄清模糊性等于放任信息性误判扩散。
  community_implications: 社群在危机事件中是信息性影响的放大器或校准器：运营者应第一时间提供清晰事实与可验证信源，避免成员相互以对方的反应为现实线索形成集体误判。
  content_applications:
    body: 高模糊决策内容应呈现『相似处境者的真实决策过程』（同症状、同预算、同阶段用户的思考）而非仅权威结论
    evidence: 引用『与你处境相同的人怎么验证』的可操作验证方法，降低模糊性而非利用模糊性
    comments: 评论区置顶事实核查与可验证信源，主动为模糊情境提供锚点
  platform_implications: 平台热榜与实时互动把『他人的反应』（转发、抢购、围观）高频可见化，信息性影响被算法提速；高模糊领域（健康、财经）需要平台级事实核查介入以防止集体误判规模化。
