  - id: hedonic_adaptation
    canonical_name_en: Hedonic Adaptation
    canonical_name_zh: 享乐适应
    aliases: [享乐跑步机, hedonic treadmill, 快乐适应]
    domain: reward
    definition: "享乐适应指人们对持续出现的积极或消极刺激的情绪反应随重复暴露而衰减，回到接近基线的水平；Brickman 与 Campbell 称之为享乐跑步机。经典证据是 Brickman、Coates 与 Janoff-Bulman 1978 年对彩票中奖者与事故截瘫者的研究，但后续研究修正了『一切都会适应』的强版本：失业、慢性噪音等部分事件的适应不完全。"
    core_claim: "重复的同类奖励带来的愉悦感系统性衰减；变动与不可预期性能部分延缓适应。"
    mechanism: "重复刺激降低预测误差（与 reward_prediction_dopamine 衔接）：预期水平上调后，同类奖励不再产生正误差，愉悦感随之回落；注意转移与比较基准更新也在其中起作用。负性事件的适应常不完全，说明基线回归不是绝对定律（S12、S01）。"
    causal_chain: "同类奖励重复 → 预期上调与误差衰减 → 愉悦感回落 → 需要更大或更新的刺激维持同等体验"
    variables:
      inputs: [刺激重复率, 刺激变异性, 比较基准]
      moderators: [个体基线与人格, 刺激的意义感, 社会比较环境]
      mediators: [预期上调, 预测误差衰减, 注意适应]
      outputs: [满意度回落, 奖励贬值速度, 追加刺激需求]
    evidence:
      supporting:
        - "Brickman、Coates 与 Janoff-Bulman 1978 对重大正负事件的适应研究（经典文献，未建包）"
        - "消费与工作情境中重复奖励满意度衰减的大量观察（S12）"
      conflicting:
        - "后续研究显示部分负性事件（失业、慢性病）与部分正性事件适应不完全，强版本『一切回归基线』不成立（修正证据）"
      replication:
        - "衰减方向稳健，速度与下限因事件与个体差异大。评级按枚举记 B"
      meta_analysis: []
    evidence_grade: B
    boundary_conditions:
      - "对可重复、可预期的同类刺激效应最强"
      - "与身份认同或意义感绑定的体验（成长、关系）适应较慢"
    failure_conditions:
      - "用不断加码的同类刺激对抗适应，只会加速贬值并抬升成本"
      - "把适应不完全的事件（失业）当成『会过去的』而不干预"
    common_misinterpretations:
      - "『人对一切都会适应』的强版本：重大负性事件适应不完全，福利与救助设计不应据此推责"
    ethical_risks:
      - "利用适应机制设计升级诱导（越来越贵的奖励阶梯）制造持续消费压力"
    examples:
      original_cases: ["Misbehaving（S12）中的享乐适应与 hedonomics 讨论"]
      research_cases: ["彩票中奖者与截瘫者适应研究"]
      modern_cases: ["游戏奖励池轮换、社群徽章体系迭代、会员权益的年度升级"]
    communication_implications: "奖励与内容体系需要定期轮换主题与形式，把资源投向变化而非同质加量；固定福利会被用户重新定价为理所应当。"
    community_implications: "荣誉体系防通胀：等级与徽章应随社群成长迭代命名与标准，老资格的含金量靠稀缺与意义维持。"
    content_applications:
      body: "系列内容的结构保持一致但素材持续翻新，防止『看标题就猜到全部』"
      emotion: "把仪式感与意义感注入奖励（周年纪念、共同成就），延缓适应"
    platform_implications: "平台以算法调度新鲜度对抗适应（轮换推荐、限时活动）；这同时是留存策略与过度刺激的来源。"
    related_nodes: [variable_ratio_reward, intrinsic_extrinsic_motivation, immediate_vs_delayed_rewards, mental_accounting, engagement_optimization_bias]
    source_ids: [S12, S01, S173]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Thaler 2015（S12，适应与参照点迁移）+ Kahneman 2011（S01，享乐适应）"
      effect_size: "重复刺激后的愉悦增量递减（适应现象）"
      replication_status: "享乐适应跨领域稳健（收入/消费/社交）"
      context_dependency: "变化节奏/新颖度/参照点调制"
      downgrade_upgrade_reason: "2026-09 实取 S12 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S173]
      supporting_evidence: [S12, S01]
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"
