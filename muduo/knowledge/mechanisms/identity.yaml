- id: self_categorization
  canonical_name_en: Self-Categorization Theory
  canonical_name_zh: 自我归类理论
  aliases:
  - 自我分类理论
  - SCT
  domain: identity
  definition: Turner 在社会认同论基础上发展的子理论：自我概念在不同抽象层级（个人—群体成员—人类）之间流动，情境中的比较线索决定哪一层『活的自我』被激活。身份显著性（salience）是输入×准备度（fit）的函数，而非稳定人格属性。（注：三层自我流动与输入×准备度函数为
    SCT 原始文献表述，S25 EP 未载）
  core_claim: 哪个身份被激活取决于当下情境的比较结构，改变情境中的参照框架即可改变人的自我定义与行为。
  mechanism: 当某一分类能最大化组内相似性与组间差异性（meta-contrast 原则，SCT 原始文献表述，S25 EP 未载）时，该分类变得显著；显著身份一旦激活，个体发生自我刻板化（self-stereotyping）——以群体原型校准自己的态度与行为，个体差异被抑制。因此同一个人在不同情境下可以表现出截然相反的从众或独立行为。
  causal_chain: 情境比较线索 → 类别可及性×匹配度 → 身份显著化 → 自我刻板化 → 原型一致性态度与行为
  variables:
    inputs:
    - 比较情境
    - 类别先备可及性
    - 群体原型清晰度
    moderators:
    - 匹配度（比较性vs规范性）
    - 群体规模与地位
    - 个人认同与群体认同的相对强度
    mediators:
    - 自我刻板化
    - 原型感知
    - 去个体化
    outputs:
    - 原型趋同行为
    - 群体规范性言论
    - 内群体情感
    - 群体间区分行为
  evidence:
    supporting:
    - 身份显著性操纵改变行为基线的系列实验（S25 综合所述）
    - 去个体化与群体规模效应研究支持『显著类别化增强原型趋同』（去个体化传统据 S25 综合所述）
    - 社会认同论传统的群际行为研究广泛支持情境依赖的身份激活
    conflicting:
    - 强个人认同者在显著群体身份下的趋同幅度有限
    - 原型模糊的松散社群中，自我刻板化证据较弱
    replication:
    - 显著性操纵的方向性结果在多研究中重复
    - 自我刻板化的强度测量在不同情境间波动较大
    meta_analysis:
    - 无独立 meta-analysis；通常并入社会认同论整体证据评估
  evidence_grade: B+
  boundary_conditions:
  - 类别在个体记忆中可及且与情境匹配时才显著
  - 群体原型清晰可辨时自我刻板化更强
  - 个人认同主导的个体或情境中效应减弱
  failure_conditions:
  - 情境线索互相冲突、无主导比较框架时
  - 群体原型长期模糊或内部分裂的社群
  common_misinterpretations:
  - 把身份当稳定人格标签——自我归类理论强调身份是情境函数，同一个人在不同群聊里是不同的『自我』
  - 混淆 self-categorization theory 与 categorical perception 等认知概念
  ethical_risks:
  - 通过设计比较框架诱导用户进入高唤起的身份类别以操纵消费
  - 利用自我刻板化销售与群体原型绑定的危险产品（如借贷、赌博式投资）
  examples:
    original_cases:
    - Turner 等关于自我归类与群际关系的理论论述（S25）
    - Lewin 的 B=f(P,E) 人-情境视角（S19）；去个体化（原型去个性化）研究传统（S25 综合）
    research_cases:
    - 改变比较维度即可翻转显著身份的实验：同一批被试在不同分组线索下表现出不同原型趋同
    - 群体规模影响身份显著性的实验研究
    modern_cases:
    - 直播间『家人们』称呼瞬间构建临时身份类别
    - ' subreddit、豆瓣小组等场景化标签使人在不同社区切换自我定义'
    - 年终盘点类产品（年度报告）强化『某类人』身份叙事并驱动分享
  communication_implications: 想改变行为，先改变受众当下被激活的类别：『你是一个理性投资者』与『你是被割韭菜的散户』指向同一批人，但唤起完全不同的态度与行动。
  community_implications: 社群运营的关键杠杆是显著性与原型：新场景（活动、危机、里程碑）会重置成员的显著身份；维护清晰、积极的群体原型比堆砌权益更能稳定行为一致性。
  content_applications:
    opening: 开场直接执行类别激活：『点开这条的人，大概率是不甘心只拿死工资的人』
    body: 给出清晰群体原型画像（语言、习惯、困扰清单），让读者完成自我归类
    comments: 用提问引导成员互相确认身份：『你们是不是也这样？』制造原型对齐的回声
    title: 标题用类别词替代产品词：『低欲望青年存款自救指南』优于『某某理财课程介绍』
  platform_implications: 平台的兴趣标签与推荐聚类在结构上持续执行自我归类：算法喂什么比较线索，用户就显著化什么身份；跨圈曝光被削弱时，原型趋同与圈层极化同时增强。
  related_nodes:
  - social_identity_theory
  - in_group_favoritism
  - normative_influence
  - self_presentation_impression_management
  - collective_identity_narrative
  - community_boundaries
  source_ids:
  - S25
  - S19
  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Hogg & Abrams 1988《Social Identifications》（S25，book 级，substantial_excerpt：自我分类+社会比较两过程/原型去个性化）
    effect_size: 身份显著性操纵改变行为基线；自我刻板化以原型校准态度与行为
    replication_status: 显著性操纵方向性结果多研究重复；自我刻板化强度测量波动
    context_dependency: 类别可及且与情境匹配时显著；原型清晰可辨时更强
    downgrade_upgrade_reason: 2026-09 实取 S25 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
  provenance:
    primary_sources:
    - S25
    supporting_evidence:
    - S19
    last_verified: 2026-09
