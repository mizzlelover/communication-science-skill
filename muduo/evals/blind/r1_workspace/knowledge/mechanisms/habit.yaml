    effect_size: 动机×能力×提示三要素齐备时行为才发生（行为设计框架）
    replication_status: FBM 为设计实践广泛采用；未经严格对照检验（D 级框架）
    context_dependency: 能力因素比动机更可靠（6 因素：时间/金钱/体力/脑力/社交偏离/日程）
