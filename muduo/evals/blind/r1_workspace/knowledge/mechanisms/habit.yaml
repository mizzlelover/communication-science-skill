  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Duhigg 2012《The Power of Habit》（S18，线索-惯常-奖赏回路）+ Fogg 2019（S16，锚点行为 B=MAP）
    effect_size: 稳定情境线索提高习惯启动概率（习惯研究传统方向一致）
    replication_status: 情境一致性-习惯强度关联在习惯文献中方向稳定
    context_dependency: 线索需稳定可及；行为需足够简单；注意 S18 为科普框架、S110 为实证综述
    downgrade_upgrade_reason: 2026-09 实取 S18 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
  provenance:
    primary_sources:
    - S18
