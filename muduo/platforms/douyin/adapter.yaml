platform_name: 抖音（Douyin）
last_updated: "2026-09"
fact_confidence_summary: >-
  信息基础（2026-09 实取官方材料后更新）：品类治理与未成年人保护等有官方文档支持
  （L1：社区自律公约/巨量引擎规则中心）；流量池逐级放大、完播率权重、Dou+ 加热等
  仍为行业共识（L3，官方未公开算法细节；Dou+/挑战赛/直播推荐等原标 official_rule 的
  '产品存在'条目本次实取未获官方文档直接支持，已降级标注为 L3）。
  所有标注以平台最新公告为准，使用 update_platform_knowledge 流程复核。

platform_sources:
