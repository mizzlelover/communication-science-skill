research_question: "营销管理的系统框架是什么？企业如何创造、沟通、传递顾客价值？"
core_claims:
  - "营销本质=创造、沟通、传递顾客价值（发现并满足顾客需求，而非只卖产品）"
  - "战略核心 STP：市场细分（Segmentation）→目标市场（Targeting）→定位（Positioning）；组合 4P（产品/价格/渠道/促销），15th ed 扩展数字渠道/体验/可持续"
  - "品牌资产（CBBE，Keller 模型）：品牌识别→含义→响应→关系四阶段；顾客终身价值（CLV）与客户关系管理为核心资产逻辑"
  - "顾客让渡价值（总价值-总成本）；满意度-忠诚度关联（'满意陷阱'：80% 满意客户仍流失）"
  - "整合营销传播（IMC）跨触点统一品牌叙事"
method: "营销管理教科书（首版 1969，历版整合案例/框架/研究）"
results: "（权威框架）全球商学院营销标准教科书；STP/4P/品牌资产标准词汇"
limitations: "教科书规范框架（多为框架性/描述性，非单一实验）；数字时代需补充平台事实"
boundary_conditions: "适用于营销战略与品牌管理分析；具体机制需实证支持"
