platform_name: 微信公众号（WeChat Official Account）
last_updated: "2026-09"
fact_confidence_summary: >-
  信息基础：微信公众平台的产品形态（订阅/推送/留言/搜一搜收录）为公开可见规则，
  群发频率等属官方文档长期载明的约束；推荐与搜索的具体权重为行业共识。
  2026-09-08 已实取官方源并登记于 platform_sources（S1-S3）：腾讯客服《微信公众号群发次数说明》
  （订阅号每日 1 次/服务号每月 4 次）、腾讯客服《公众平台订阅号与服务号有什么区别》、
  腾讯知识产权保护平台《微信公众平台运营规范》内容规范摘录，正文均实际抓取核验。
  known_platform_patterns 已逐条标注 evidence_level（L1=官方文档实际读到并支持；L2=已验证观察；
  L3=行业共识；L4=推测）、source_ref 与 last_verified: "2026-09"。
  后续仍以平台最新公告为准，使用 update_platform_knowledge 流程复核。

