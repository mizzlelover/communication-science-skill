  observed_engagement: 抖音本地生活出现商家退出潮：窄门餐眼3月22日报道北京、杭州、成都餐饮店主在社群反馈"抖音团购ROI持续下滑，一单赚5元，却要付3元佣金+2元达人坑位费，实际不赚钱"；某连锁火锅品牌内部会议纪要显示暂停所有非头部达人合作、收缩抖音投入30%；晚点LatePost
    3月24日报道抖音生服GMV增速从2025年Q4的80%骤降至2026年Q1预估不足25%；中泰证券测算抖音推送式团购核销率仅50%-60%、美团搜索模式90%以上；抖音生服GMV 2021-2024年为110亿/770亿/3000亿/5600亿元、2025年突破8500亿元（均为报道转述口径）
  mechanism_notes: creator_incentive_structures(B)：达人坑位费+平台佣金+低价套餐三层成本挤压商家毛利，当激励结构向达人与平台倾斜时 商家理性收缩或退出，适用条件是商家议价能力弱、依赖达人分发；
    engagement_optimization_bias(B+)："货找人"的兴趣分发带来高GMV低核销——囤券是种草刺激下的即时决策、与到店行为解耦， 适用条件是兴趣推荐主导的本地生活分发逻辑； long_tail_demand(C)：尾部中小商家"赔本赚吆喝"与大型连锁"供应链薄利多销"的分化说明长尾商家成本结构无法消化低价引流模式，
    适用条件是履约成本刚性且无规模效应的尾部供给。 单案例仅作 illustration（D 级）。
