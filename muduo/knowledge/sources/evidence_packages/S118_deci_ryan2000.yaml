  - "动机从外在调节到内在调节的连续谱（内化/整合）；外在奖励对内在动机的挤出效应（overjustification）"
  - "元分析确认（Deci, Koestner & Ryan 1999）：有形预期奖励显著削弱内在动机；口头表扬等正向反馈增强"
method: "理论综述 + 整合大量实验/现场研究 + 元分析（128 项实验）"
results: "（综述）基本需要满足→内在动机/幸福感；外在激励可挤出内在动机"
limitations: "理论综述（Psychological Inquiry 目标文章+评论）；具体效应量需查元分析原文"
boundary_conditions: "挤出效应依赖奖励的预期性与任务原本的内在趣味；自主支持情境是关键调节"
