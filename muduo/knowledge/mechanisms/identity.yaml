  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Tajfel & Turner 1979 社会认同理论奠基书章（S120，abstract_only）+ 最小群体范式系列实验
    effect_size: 任意/最小分类→内群体偏好；分类→认同→比较三阶段过程
    replication_status: 最小群体范式多国实验室复制方向稳定；线上社群身份效应多为相关证据
    context_dependency: 身份显著性与群体地位/威胁情境调节效应强度；跨文化有差异
    downgrade_upgrade_reason: 2026-09 补充 SIT 奠基一手书章（S120，abstract_only 如实标注），由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
