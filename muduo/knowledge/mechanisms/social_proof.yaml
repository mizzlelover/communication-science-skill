- id: conformity_asch
  canonical_name_en: Asch Conformity Experiments
  canonical_name_zh: Asch 从众线段实验
  aliases:
  - Asch paradigm
  - 线段判断从众实验
  domain: social_proof
  definition: Solomon Asch 于 1951/1955 年报告的实验范式：被试在清晰可辨的线段比较任务中，面对一致给出错误答案的多数派，约三分之一的判断跟随了多数，四分之三的被试至少从众一次；少数派（哪怕一人）说出正确答案即大幅降低从众率（Asch
    后续变式实验，已建包 EP S186）。
  core_claim: 即使事实清晰可见，一致的多数派意见仍能系统性扭曲公开判断；而少数异见者提供了关键的保护效应。
  mechanism: 公开情境下，规范性压力（怕被排斥）与信息性怀疑（也许我真的错了）共同驱动从众；任务难度上升时信息性成分增强。同伴支持实验表明，仅需一名异见者就能破坏多数派的一致性从而大幅降低从众率——多数派的规模效应在超过三四人后趋于饱和，且『非一致性』比『多数规模』更关键（Asch
    后续变式实验，已建包 EP S186）。写答（私密作答）条件下从众率显著下降，说明公开承诺是压力的核心载体（Asch 后续变式实验，已建包 EP S186）。
  causal_chain: 一致的多数派错误判断 → 规范压力与自我怀疑 → 公开判断扭曲 → 少数异见出现 → 压力被打破，从众率骤降
  variables:
    inputs:
    - 多数派规模与一致性
    - 任务清晰度
    - 判断的公开性
    moderators:
    - 多数派成员与被试的相似性
    - 任务难度与模糊性
    - 一致性是否被打破
    mediators:
    - 对排斥的恐惧
    - 自我怀疑
    - 与他人的比较需求
    outputs:
    - 公开从众（言语跟随）
    - 私下保留原判断
    - 后续行为扭曲
  evidence:
    supporting:
    - Asch 1951/1955 的系列实验：清晰线段任务中一致多数派产生显著从众
    - 同伴支持实验：一名同盟者给出正确答案即大幅降低从众率（Asch 后续变式实验，已建包 EP S186）
    - 写答 vs 口头报告的对比：公开条件下从众率显著更高（Asch 后续变式实验，已建包 EP S186）
    conflicting:
    - 从众率随任务模糊度、文化、时代变化——部分文化与重复研究中整体从众率下降
    - 约四分之一被试从不从众；个体差异显著
    replication:
    - 基本范式在多文化背景重复成功，但效应量有波动（部分现代复制中整体从众率低于原始报告）
    - 同伴支持的保护效应在多项研究中稳健
    meta_analysis:
    - 从众研究的整合综述支持规范性影响的稳健存在，幅度中等偏小
  evidence_grade: A
  boundary_conditions:
  - 多数派判断一致且公开可见
  - 个体对群体有归属需求（面向陌生临时群体时减弱）
  - 判断公开做出且被记录
  failure_conditions:
  - 任务完全无歧义且个体有强专业自信
  - 多数派出现内部分歧
  - 作答私密进行
  common_misinterpretations:
  - 把 Asch 解读为『多数人天生盲从』——实验恰恰证明约三分之二判断未跟随多数，且异见者保护效应显著
  - 混淆『公开附和』与『私下信念改变』——Asch 中的多数从众是公开顺从而非私下接受
  ethical_risks:
  - 用一致化评论氛围压制异见（控评、水军铺量制造虚假共识）
  - 利用公开承诺场景迫使非自愿表态
  examples:
    original_cases:
    - Asch 1951/1955 线段实验系列（收录于 S21、S31 社会影响研究综述）
    research_cases:
    - 多数派规模与一致性操纵实验
    - 同伴支持实验
    - 公开 vs 私下作答的对比实验
    modern_cases:
    - 直播间弹幕一致刷单氛围对观望者的转化
    - 社群控评形成的虚假共识氛围
    - 品牌粉丝团控评反噬路人好感
  communication_implications: 一致化的可见评论氛围（置顶、精选、弹幕）是现代版 Asch 情境；同时应主动保留真实异见（精选一条温和质疑）以增强可信度——全好评反而降低信任。
  community_implications: 社群讨论中安排『有依据的异见者』是关键治理设计：防止群体思维；在公开投票与表态前先匿名征集意见，再公开汇总，可显著降低公开从众压力。
  content_applications:
    comments: 评论区保留并礼貌回复 1-2 条真实质疑，展示对异见的尊重并利用异见者保护效应增强说服氛围
    body: 引用真实用户的分歧讨论与最终共识过程，而非只呈现一边倒好评
    cta: 公开表态类 CTA（投票、打卡）应配合匿名反馈渠道，降低公开表态压力
  platform_implications: 平台的精选评论、弹幕、实时互动组件制造高可见的一致氛围（Asch 情境的制度化）；同时平台算法偏好一致性互动，会系统性挤压异见内容的曝光，需运营侧主动平衡。
