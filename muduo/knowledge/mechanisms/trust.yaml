  - id: trust_signals_content
    canonical_name_en: Trust Signals in Content
    canonical_name_zh: 内容信任信号
    aliases: ["可信度线索", "credibility cues in content"]
    domain: trust
    definition: "内容内部可提升信任知觉的具体信号：具体细节与数字（specificity）、可验证声明（来源标注、方法论展示）、承认局限、利益披露、引用可追溯证据等。注意：这些是提升信任知觉的信号，与内容实际可靠性相关但可分离——高质量信号可被伪造。"
    core_claim: "具体、可验证、有局限声明的表达系统性提升信任知觉；但信号与真实可靠性可分离，长期依赖信号而内容失实将付出信任崩塌代价。"
    mechanism: "具体细节提高想象可行度与加工流畅，暗示作者『知道内情』（无法编造的细节感）；可验证声明把验证成本转移到读者可控范围（可自己查），降低不确定；局限声明是高成本信号（作者自限利益），难以低成本伪造——因此比全称肯定更具可信度。这些信号在低卷入场景作为启发式被快速读取；高卷入场景中，读者会实际验证，信号必须与实质匹配。"
    causal_chain: "具体细节+可验证声明+局限披露 → 知晓感与可验证感 → 信任知觉提升 → 接受与行动 → （信号与实质脱钩被发现时）信任反噬"
    variables:
      inputs: [细节与数字的具体度, 来源可追溯性, 局限与反面证据的披露]
      moderators: [受众卷入度（高卷入会实际验证）, 领域利害程度, 内容生态的信号通胀度]
      mediators: [知晓感（sense of knowing）, 可验证感, 加工流畅性]
      outputs: [信任知觉, 转化与行动, 长期信源资产或（失实后）信任崩塌]
    evidence:
      supporting: ["具体性提升可信度的实践框架综合（Made to Stick 所综合的 SUCCESs 中 Credibility 维度，S40；非独立检验的因果模型，证据等级 D）", "具体数字提升信念确度的语言研究（S70 Magic Words 方向的配套实验）", "局限声明（two-sided 信息）提升可信度的说服研究传统（EP 未建包）"]
      conflicting: ["具体细节也可是编造的（虚构细节同样提升可信度感知）——信号可被滥用", "过载的具体细节反而触发怀疑或信息过载", "高利害领域信号效应被实际验证行为稀释"]
      replication: ["具体性与可信度的正相关方向稳健", "『信号被伪造』的场景证据来自虚假新闻研究：高细节伪信息同样获得信任"]
      meta_analysis: ["无独立 meta-analysis；以说服研究与语言心理学综述为主"]
    evidence_grade: "B"
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions: ["受众无法即时验证时信号主导（信任知觉效应最大）", "信号与实质长期匹配时积累为信源资产", "低通胀生态中信号边际价值高"]
    failure_conditions: ["受众具备验证能力与动机（信号被检验）", "信号通胀：行业普遍使用同款话术后效应衰减", "细节被证伪一次即触发全面怀疑"]
    common_misinterpretations: ["把信任信号当内容质量——具体好看≠真实正确（伪信息恰恰善用具体细节）", "以为堆砌数据就是可信：无来源无方法的数据反而显得可疑"]
    ethical_risks: ["用编造的具体细节制造虚假可信（伪数据的说服力）", "选择性引用制造片面的『有据』感"]
    examples:
      original_cases: ["《Made to Stick》的 Credibility 维度（S40）", "《Magic Words》对语言形式影响可信度的实验讨论（S70）"]
      research_cases: ["具体数字提升说服的实验（语言心理学传统）", "双面信息（含反面论点）提升可信度的经典说服研究"]
      modern_cases: ["财经内容标注数据来源与更新时间", "测评博主公开采购凭证与测试方法", "AI 内容泛滥后『附上原始链接』成为稀缺习惯"]
    communication_implications: "信任信号的三件套最低配置：具体（可感知细节与数字）、可查（来源与链接）、有局限（适用边界与反面情况）；在 AI 内容时代，『可查』从加分项变成稀缺项。"
    community_implications: "社群内容规范（要求带来源、禁绝对化表述）在成员层面建立信号纪律，长期提升整个社群产出的可信度与对外声誉——信任信号是社区公共品。"
    content_applications:
      evidence: "证据块固定格式：数据+来源链接+采集方法+已知局限，四要素齐备才发布"
      body: "把『不适用条件』写进正文：『如果你是X情况，请勿照搬』——局限声明是高成本可信信号"
      title: "标题避免绝对化，用带边界的具体：『三类人里两类有效，第三类慎用』"
      comments: "对数据质疑评论直接补充来源与计算过程，公开维护信号-实质一致"
    platform_implications: "平台对医疗、财经等内容有资质与来源标注要求；AI 生成内容标注义务正在成为平台规则（与 content_provenance 衔接），信任信号的制度化验证是平台信任层的发展方向。"
    related_nodes: [specificity_effect, concreteness_in_language, source_credibility_model, provenance_verification, fluency_truth_effect, trust_calibration, synthetic_media_trust]
    source_ids: [S40, S70, S34]
    provenance:
      primary_sources: ['S40', 'S70', 'S34']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: reputation_systems
    canonical_name_en: Reputation Systems
    canonical_name_zh: 声誉系统
    aliases: ["信誉系统", "reputation mechanism"]
    domain: trust
    definition: "通过记录、聚合与展示个体历史行为来支撑陌生人信任的制度与技术系统（评分、评价、信用分、贡献榜、背书链）。它把一次性的互动信任转化为可累积、可传递的声誉资产，是平台经济与大规模社群的信任基础设施。"
    core_claim: "声誉系统有效的前提是记录的真实性、维度相关性与抗操纵性；三者任一失守，系统将从信任基础设施退化为操纵对象。"
    mechanism: "声誉系统通过把过去行为转化为未来预期（你上次做得好，这次大概率也行）降低陌生人互动风险；其有效性依赖：反馈的真实性（防刷分、防报复性差评）、维度相关性（评分维度与决策相关）、信号可读性（信息过载时用户依赖简化启发，如星级）。系统也创造新的博弈：刷好评、差评勒索、互刷互赞，因此需要配套反操纵治理（见 norm_enforcement_reputation、platform_power_gatekeeping）。"
    causal_chain: "行为被记录 → 聚合为声誉分数/评价 → 未来互动方据此决策 → 声誉产生真实经济后果 → （反操纵不足时）刷分博弈侵蚀系统"
    variables:
      inputs: [行为与交易记录, 评价反馈的真实性, 聚合算法与展示形式]
      moderators: [系统抗操纵设计, 评价者激励结构, 声誉可迁移性（跨平台/跨场景）]
      mediators: [对声誉信号的信度评估, 声誉预期]
      outputs: [陌生人信任提升, 交易效率, 声誉两极分化（马太效应）, 操纵军备竞赛]
    evidence:
      supporting: ["平台经济学对平台治理与双边市场的论述（S96，间接支撑：EP 登记文本无声誉系统直接内容，仅『过滤器帮用户找到相关价值』间接对应）", "博弈论与实验经济学的声誉机制研究：声誉维持合作的理论与实验证据（S27、S52 为邻近理论传统，EP 登记文本无声誉系统直接内容）", "电商与共享经济平台的声誉-成交关联研究"]
      conflicting: ["声誉分数的维度效度常被质疑（评分混合了品、价、物流等无关维度）", "刷分与操纵的持续侵蚀，系统需要不断更新防御", "声誉的马太效应压制新进入者（冷启动劣势）"]
      replication: ["声誉系统提升合作与交易效率的方向性结果稳健", "抗操纵的具体设计有效性因平台与时代而异（军备竞赛持续）"]
      meta_analysis: ["无跨平台权威 meta-analysis；以平台经济与实验经济学综述为主"]
    evidence_grade: "B"
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions: ["记录真实且不可伪造", "评分维度与决策相关", "互动重复发生（声誉有未来价值）"]
    failure_conditions: ["操纵成本低（刷分灰产）导致信号失真", "一次性互动场景（声誉无未来价值）", "声誉评价与决策质量脱钩（评分通胀）"]
    common_misinterpretations: ["把好评数量当可信度——可操纵的计数是最易失真的信号", "忽视声誉系统的冷启动问题：新进入者无历史即无信任，需要替代背书机制"]
    ethical_risks: ["声誉绑架（以差评威胁勒索）", "评分歧视与算法声誉固化（历史污点永久化）"]
    examples:
      original_cases: ["平台经济学对声誉机制与双边市场的分析（S96）", "Bicchieri 对声誉维持规范与合作的博弈论分析（S27）"]
      research_cases: ["声誉机制维持公共合作的实验研究", "评价系统抗操纵设计的田野研究"]
      modern_cases: ["电商信用评价体系与刷单灰产的军备竞赛", "开源社区贡献记录作为职业声誉资产", "知识付费领域的『避雷』与口碑社群（民间声誉系统的兴起）"]
    communication_implications: "内容可借助外部声誉信号（真实评价、第三方记录、贡献履历）建立可验证信任；『可查证的声誉』比自我声称的资历更抗怀疑，尤其在 AI 生成内容泛滥的背景下。"
    community_implications: "社群声誉系统设计三原则：与核心价值行为挂钩（贡献而非晒单）、抗刷（行为验证）、可积累可展示（等级、履历页）；声誉资产的流动性决定成员留存（离开=声誉清零是强锁定，但也构成公平性争议）。"
    content_applications:
      evidence: "引用可查证的外部声誉：历史项目记录、第三方评价、公开履历链接"
      cta: "CTA 提供声誉核验路径：『我的过往服务记录与评价都在这里（公开可查）』"
      body: "展示行为轨迹而非标签：『三年里完成XX、被XX引用』比『资深专家』更可信"
      title: "标题以声誉锚点替代资历词：『带过37个学生的实操老师』（需真实）"
    platform_implications: "平台声誉系统的算法权重决定创作者行为（评分信号被博弈）；去中心化身份与跨平台声誉协议是正在发展的方向，同时平台的声誉锁定（封号=社会性死亡）成为治理争议焦点。"
    related_nodes: [norm_enforcement_reputation, trust_calibration, platform_power_gatekeeping, status_systems, cold_start_dynamics, trust_signals_content, community_governance]
    source_ids: [S96, S27, S52]
    provenance:
      primary_sources: ['S96', 'S27', 'S52']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"

  - id: provenance_verification
    canonical_name_en: Provenance Verification
    canonical_name_zh: 溯源验证
    aliases: ["内容溯源验证", "source provenance", "出处验证"]
    domain: trust
    definition: "通过技术与社会机制确立内容的来源与修改历史（谁创作、何时、是否被编辑、是否AI生成），使信任判断可以锚定在可验证的出处链上。C2PA（内容出处与真实性联盟）等标准试图为媒体内容建立密码学级的出处凭证（行业标准实践，EP 待补）；在传播层面，溯源也包括引用链、原始文献可达性等弱验证形式。"
    core_claim: "当内容真伪无法靠肉眼判断时，信任判断从『内容本身』转移到『出处链』；谁控制出处验证基础设施，谁就获得新的守门人权力。"
    mechanism: "AI 生成内容使表面真实性通胀（任何文本图像都可被低成本生成），基于直觉的信任判断失效；溯源机制为内容附加机器可读的出处凭证（拍摄设备、时间戳、编辑记录），把验证从『判断内容』转为『验证凭证链』。其有效性取决于：凭证的密码学强度、签发节点的可信度、以及用户端验证工具的普及——凭证存在但无人验证则形同虚设。"
    causal_chain: "内容生成 → 出处凭证附加（签名/时间戳/编辑链） → 传播中被验证或不验证 → 信任锚定于凭证链 → （验证缺位时）凭证通胀或失效"
    variables:
      inputs: [内容本体, 出处凭证（签名、元数据、编辑历史）, 验证工具可得性]
      moderators: [凭证签发生态的可信度, 用户验证习惯, 平台展示凭证的界面设计]
      mediators: [对凭证链的信任, 验证成本感知]
      outputs: [来源可确认的内容信任, 深度伪造的甄别, （无验证时）凭证形同虚设, 守门人权力集中]
    evidence:
      supporting: ["深度伪造与AI内容泛滥带来的溯源需求（平台与行业标准动向，S92、S95 的平台治理讨论）", "密码学签名与出处标准（如 C2PA）的技术可行性（行业标准实践，EP 待补）", "引用规范与同行评审作为弱溯源形式在科学传播中的长期实践"]
      conflicting: ["用户端验证率极低：凭证存在不等于被查验", "溯源标准面临生态碎片化与成本问题", "出处链本身可被伪造或脱节（转发链断裂）"]
      replication: ["技术可行性有工程验证", "社会层面的有效性（实际改变信任行为）证据尚早，属新兴领域"]
      meta_analysis: ["尚无成熟 meta-analysis；属新兴技术与治理交叉领域"]
    evidence_grade: "C"
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions: ["验证工具嵌入用户高频路径（而非要求额外操作）", "签发生态具备广泛可信度与互认", "高利害内容（新闻、证据、财务）优先适用"]
    failure_conditions: ["用户不验证（凭证存在但无人查看）", "签发节点被俘获或标准碎片化互不承认", "内容脱离凭证单独传播（截图、转发剥离元数据）"]
    common_misinterpretations: ["把溯源当真伪保证——溯源证明的是出处与修改历史，不证明内容为真（真实信源也会出错，恶意信源可产出『真实出处』的假内容）", "以为技术上可行就等于会被使用——验证行为的普及是最大瓶颈"]
    ethical_risks: ["溯源基础设施的守门人权力集中（谁有权签发与撤销凭证）", "以『无凭证』为由排斥真实但未经签发的内容（排他性滥用）"]
    examples:
      original_cases: ["C2PA 等内容出处标准的工程实践（技术标准层面）", "科学共同体对引用规范与数据可及性的长期要求（弱溯源传统）"]
      research_cases: ["深度伪造检测与出处验证的人因研究（验证率与界面设计的早期实验）"]
      modern_cases: ["相机原生签名与新闻机构的实拍凭证实践", "平台对AI生成内容的标注政策", "财经内容要求附原始数据链接的社区规范"]
    communication_implications: "在高利害内容中主动提供溯源要素（原始链接、时间、修改记录），把『可验证』本身做成差异化信任资产；同时向受众说明溯源≠真相（出处真实不等于内容正确）。"
    community_implications: "社群可建立轻量溯源文化：要求观点帖附来源、存档原始链接、标注修改。这不依赖密码学，却能在成员层面建立『可查证』的规范，是抗 AI 污染的社群免疫。"
    content_applications:
      evidence: "证据块附溯源三要素：原始来源链接、发布/更新时间、修改说明"
      title: "标题谨慎使用『独家』，改用可验证表述：『数据截至X月，来源链接见文末』"
      body: "正文显式区分：我的观察/引用来源/AI辅助整理，三类信息分层标注"
      comments: "对溯源质疑提供存档链接（网页快照），把验证路径公开化"
    platform_implications: "平台正在引入AI内容标注与出处凭证展示（政策与标准演进中）；溯源展示的界面设计（是否醒目、是否默认展示）将决定其社会效力，也成为平台间竞争与监管的焦点（见 synthetic_media_trust、ai_information_intermediaries）。"
    related_nodes: [trust_signals_content, content_provenance, synthetic_media_trust, trust_calibration, misinformation_velocity, ai_information_intermediaries, authenticity_premium]
    source_ids: [S92, S95, S181]
    provenance:
      primary_sources: ['S92', 'S95', 'S181']
      last_verified: "2026-09-09"
    last_reviewed: "2026-09"
