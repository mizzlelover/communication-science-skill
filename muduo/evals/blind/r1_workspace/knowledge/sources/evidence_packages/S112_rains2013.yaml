research_question: "心理逆反（psychological reactance）的最佳概念模型是什么？逆反可否直接测量？"
core_claims:
  - "Brehm 的逆反理论长期以来被视为不可直接测量的动机状态"
  - "Dillard & Shen 2005 提出逆反可概念化为认知+情感并可直接测量"
  - "meta 分析（K=20, N=4,942）结果支持'交织模型'（intertwined model）：逆反为以愤怒与反驳（counterarguments）为指标的潜在因素，拟合最优"
method: "meta 分析（20 研究/4,942 被试）→ 用路径模型检验竞争性逆反概念模型"
results: "交织模型（anger + counterarguments 作为逆反指标）最佳拟合"
limitations: "以英文健康传播逆反研究为主；原文正文细节未取（订阅墙）"
boundary_conditions: "逆反=自由威胁感知→愤怒+反驳→态度/行为抵制；语言控制性等消息特征可调节"
relevant_nodes: [psychological_reactance]
notes: "OUP 摘要全文实取 → 从 found 升级为 annotated。2025 最新 meta（Li & Shi 2025, HCR）提供后续效应量补充方向。"
