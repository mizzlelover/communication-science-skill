- id: commitment_consistency
  canonical_name_en: Commitment and Consistency
  canonical_name_zh: 承诺一致性
  aliases:
  - consistency principle
  - 承诺一致原则
  - 自我一致性
  domain: social_norms
  definition: Cialdini 六原则之一：人一旦做出公开、主动、自愿的承诺，就产生维持言行一致的压力；小的初始承诺会为后续更大、与初始承诺方向一致的行为铺路（与 foot_in_the_door
    衔接）。承诺的效力取决于其公开性、主动性与付出成本。
  core_claim: 公开、主动、付出过成本的承诺会让人后续行为自动向承诺靠拢，甚至在承诺已明显不利时仍继续（与 commitment_escalation 的危险面衔接）。
  mechanism: 言行一致是重要的社会品质，不一致会被视为不可信或精神混乱；因此承诺形成自我形象锚点，后续行为要么与之一致，要么付出认知失调的代价。公开承诺激活他人监督（规范性影响），主动选择（无外部强迫）激活自我归因（『我是自愿的，说明我真的认同』），付出成本（努力、金钱、时间）提升投入感（与
    endowed_progress_effect、hook_model 的投入存储机制衔接）。三者叠加使小承诺滚雪球为大行为。
  causal_chain: 小的公开主动承诺 → 自我形象更新（我是做X的人） → 后续行为与自我形象对齐 → 更大承诺与投入 → 行为惯性
  variables:
    inputs:
    - 初始承诺的公开性/主动性/成本
    - 承诺的自我形象相关性
    moderators:
    - 承诺自由感（无外部压力时更强）
    - 观众的持续性
    - 承诺的可撤销成本
    mediators:
    - 自我形象更新
    - 认知失调减少动机
    - 他人监督预期
    outputs:
    - 后续一致行为
    - 增量承诺接受度
    - 坏处：不合理坚持与承诺升级
  evidence:
    supporting:
    - Cialdini 等的经典承诺实验：公开书面承诺显著提升后续行为一致性（S32 综述）
    - foot-in-the-door 系列实验（见 foot_in_the_door）
    - 赌徒与沉没成本情境中的承诺升级研究（见 commitment_escalation）
    conflicting:
    - 承诺对无关后续行为的溢出有限
    - 被识破为套路的小承诺（诱导式同意）失效并引发警惕
    - 强外部激励下的承诺（有偿转发）削弱自愿归因
    replication:
    - 承诺-行为一致性的基本效应在多情境重复
    - 效应量中等，且高度依赖承诺的公开性与自愿性这两个条件
    meta_analysis:
    - foot-in-the-door 技术的元整合支持小承诺为大请求铺路的平均效应，效应量中小且异质性明显
  evidence_grade: A-
  boundary_conditions:
  - 承诺公开、主动、无强迫且有一定付出
  - 承诺与自我形象相关（我是负责任的投资者）
  - 承诺被记录且可被回看
  failure_conditions:
  - 承诺经外部强激励诱导（有偿表态）——过度理由效应削弱自愿归因
  - 承诺内容与自我形象无关
  - 观众消失或承诺可无成本撤销
  common_misinterpretations:
  - 把承诺一致性当作逼单话术（不回复=默认同意）——被迫的承诺不产生一致性压力，只产生抵触
  - 忽视承诺升级的危险面：一致性压力会让人在错误方向上坚持（见 commitment_escalation）
  ethical_risks:
  - 用诱导式小承诺层层套牢用户（同意链设计）
  - 利用公开承诺实施社交绑架
  examples:
    original_cases:
    - Cialdini《Influence》承诺一致章节的经典案例（S32）
    - 朝鲜战争战俘营的逐步承诺案例（经典文献，未建包；争议性案例需谨慎使用）
    research_cases:
    - foot-in-the-door 系列实验
    - 公开书面承诺对行为改变的田野实验
    modern_cases:
    - 社群公开立誓打卡（承诺+观众监督）
    - 定投计划的自动续费与公开进度
    - 学习类 App 的每日承诺与 streak 机制
    - 坏例子：沉默的滚动条款与暗模式（dark patterns）
  communication_implications: 让受众先做一个极小、真实、可公开的承诺（点个在看、投个票、写下目标），并让其承诺可见可回看；承诺内容应正向定义自我（『想改变的人』）而非绑定于产品。
  community_implications: 社群的入群仪式（自我介绍、目标宣言、公开规则确认）是承诺一致性的制度化：低成本、高可见、与社区价值绑定；配合 participation_ladder
    让承诺逐级加码，形成行为惯性。
  content_applications:
    cta: CTA 设计为微小公开承诺：『在评论区写下你本周要完成的第一个小目标』——写下即承诺，公开即监督
    opening: 开场引导自我定义式承诺：『点开这篇的你，应该是想认真解决这个问题的人』——用身份承诺预设行为
    body: 提供承诺追踪工具（表格、打卡模板），让承诺行为化、可回看
    comments: 对公开承诺的评论定期回访（一周后翻牌），利用观众监督效应固化行为
  platform_implications: 平台的 streak、徽章、公开收藏夹等产品机制把承诺一致性制度化；算法记录使承诺永久可见，撤销成本上升——这既提高留存也造成承诺绑架风险，暗模式（dark
    patterns）是被监管关注的边界。
