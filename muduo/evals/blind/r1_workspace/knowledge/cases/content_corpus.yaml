# Content Corpus — 平台内容语料（500 条：高表现/中/低/失败分层覆盖）
# 目的：以 high/medium/low/failed 四层配比建立内容语料，系统性防范幸存者偏差
# （不只看爆款）。四层占比：high ~24% / medium ~28% / low ~24% / failed ~24%
# （当前 400 样本实测：96/108/100/96）。
# 平台覆盖（各 50）：小红书 + 抖音 + 微博 + B站 + 知乎 + X + 视频号(channels) + YouTube。
# 采样纪律：
#   1. 仅收录实际检索到的真实公开内容；URL 必须可溯源（含"出处/复现源+站内检索路径"型）。
#   2. 互动数字只写实际可见（含快照口径标注）；不可见一律写"不可见"，禁止编造。
#   3. low/failed 层公开不可见是平台客观现实（低曝光不被收录），以行业诊断/数据集快照/
#      同账号长尾对照组等合法渠道取材并显式标注来源池。
#   4. 机制映射仅使用 knowledge/mechanisms/ 真实节点，单案例仅作 illustration（D 级）。
# 数据快照说明：小红书 B 批来自公开数据集 2024-10 快照；抖音侧为截至报道日快照；
#   微博/B站 C5 批次为 2026-09-08 检索快照（原帖普遍反爬不可直连，以报道/快照/公告为来源池并逐条标注）。
# 下一步：案例总量向 ≥300 推进（15 类覆盖：失败案例、Community、危机/内容/增长案例为缺口主力）。
