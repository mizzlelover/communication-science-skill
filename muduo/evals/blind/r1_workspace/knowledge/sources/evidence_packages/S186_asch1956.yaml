# Evidence Package — S186 Asch 1956（从众线段实验专著级论文）
# 标准格式。access_level 如实标注。
source_id: S186
title: "Studies of independence and conformity: I. A minority of one against a unanimous majority"
authors: "Solomon E. Asch"
year: 1956
journal: "Psychological Monographs: General and Applied, 70(9), 1-70"
doi: "10.1037/h0093718"
url: "https://doi.org/10.1037/h0093718"
access_level: abstract_only
research_status: annotated
content_obtained: "核心结果经多源交叉核实（未取得 70 页专著全文）：①Psychological Monographs 70(9):1-70 与 DOI 经两处独立文献引用核实（PubMed 引文库、OLB-PM-34558062 参考文献表）；②实验设计与结果数字经科普中国科学百科词条（每组 7 人 6 合作者、约 1/4-1/3 保持独立、平均从众 35%、15% 被试从众 75% 次、访谈三型歪曲：知觉/判断/行为）与英文科普综述（37% 关键试次从众、75% 至少从众一次、控制组错误率 <1%）双向核实；③变式证据：单一异议者（说出正确答案）使从众率大幅下降（英文源称下降约 75%）；④2023 年 PLOS ONE 预注册式复制（Franzen & Mader，N=210）：标准线段实验错误率 33%、金钱激励条件降至 25%、政治意见从众 38%"
research_question: "当多数人给出明显错误的判断时，个体会在多大程度上追随多数？哪些条件调节从众？"
core_claims:
  - "控制条件（无群体压力）错误率 <1%；一致多数给出错误答案时，被试在关键试次约 37% 从众（平均从众率约 35%），75% 的被试至少从众一次——事实清晰可见时从众依然发生"
  - "一致性（unanimity）是关键调节变量：哪怕只有一人（不必同意被试，只要偏离多数）打破一致，从众率大幅下降——从众压力主要来自『独自异见』的社会成本"
  - "群体规模调节从众（后续变式；Bond 2005 元分析汇总规模-从众关系）；任务重要性提高从众（Baron 等 1996）"
  - "访谈归纳从众三型：知觉歪曲（真把多数当参考框架）、判断歪曲（意识到不同但认为多数更可能对）、行为歪曲（明知多数错仍跟答）——信息性压力与规范性压力并存"
  - "2023 年 N=210 复制：错误率 33% 复现原始量级，金钱激励降至 25%，从众泛化到政治意见（38%）——效应跨时代稳健但幅度可被激励调节"
method: "实验室线段判断实验：7 人一组（6 名合作者+1 名真被试排最后作答），标准线 vs 三条比较线（差异明显），关键试次合作者一致错答（第 3-12 试次）；系列变式（异议者/群体规模/任务难度）"
results: "（经典+复制）从众可压倒清晰的事实判断；一致性是核心条件；2023 年 N=210 复制维持 33% 错误率量级"
limitations: "本轮未取得专著全文，核心数字经二手转述多源交叉确认（含 2023 复制论文的原始文献引用）；被试为大学生样本；时代与文化外推需带 Bond & Smith 1996 元分析的文化差异边界"
boundary_conditions: "判断任务有明确客观标准时从众依然出现但幅度中等；异议者在场显著削弱；群体规模增大有边际递减（Bond 2005）；政治意见等主观议题从众率更高（38%）"
