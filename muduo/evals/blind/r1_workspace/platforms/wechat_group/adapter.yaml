platform_name: 微信群（WeChat Group Chat）
last_updated: "2026-09"
fact_confidence_summary: >-
  信息基础：群聊为公开可见的产品形态——无算法全量触达、群人数上限、@权限等
  属产品规则；活跃度规律（沉默大多数、刷屏衰减）为运营行业共识。
  2026-09-08 已实取官方源并登记于 platform_sources（S1-S2）：腾讯客服《我能邀请多少朋友加入群聊》
  （微信群最多 500 人、超过 40 人需对方同意、超过 100 人需实名验证）、腾讯知识产权保护平台
  《微信个人帐号使用规范》内容规范（群聊等场景违规内容处理），正文均实际抓取核验。
  known_platform_patterns 已逐条标注 evidence_level（L1=官方文档实际读到并支持；L2=已验证观察；
  L3=行业共识；L4=推测）、source_ref 与 last_verified: "2026-09"。
  原标注 official_rule 但无官方文档直接载明的条目已降为 L3 并在 note 注明。
  所有标注以平台最新公告为准，使用 update_platform_knowledge 流程复核。

