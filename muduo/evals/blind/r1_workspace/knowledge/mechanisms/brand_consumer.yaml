    - SaaS 产品的「For X 场景的 Y 替代品」定位句式
  communication_implications: 所有内容围绕定位语展开并保持一致性：一个品牌在一个时期只讲一个位置；内容矩阵检验标准是「看完十条内容，用户能否用一句话说出你是谁」。
  community_implications: 社群定位同样适用：明确「什么人的什么场景社群」（而非「兴趣大杂烩」）；社群的品类参照与差异化主张决定拉新话术与内容边界。
  content_applications:
    body: 正文结构呼应定位：反复在相同位置出现定位语（开头锚定、结尾复述）
    narrative: 用户故事必须佐证定位（故事主角与场景对准目标位置），偏离定位的 UGC 慎重放大
    sharing: 分享物承载定位语与资产，让转发参与槽位巩固
