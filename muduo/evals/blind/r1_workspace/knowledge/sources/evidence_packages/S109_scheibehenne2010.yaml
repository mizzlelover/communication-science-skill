source_id: S109
title: "Can There Ever Be Too Many Options? A Meta-Analytic Review of Choice Overload"
authors: "Benjamin Scheibehenne; Rainer Greifeneder; Peter M. Todd"
year: 2010
journal: Journal of Consumer Research 37(3), 409-425
doi: "10.1086/651235"
url: "https://ideas.repec.org/a/oup/jconrs/v37y2010i3p409-425.html"
