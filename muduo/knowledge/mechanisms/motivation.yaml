    effect_size: 挑战-技能平衡→深度投入；状态描述方向稳健、个体差异大
    replication_status: ESM 与问卷研究多领域复制；挑战-技能边界被后续修正
    context_dependency: 任务需清晰目标与即时反馈；技能与自愿投入是前提
    downgrade_upgrade_reason: 2026-09 实取 S15 心流理论核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
