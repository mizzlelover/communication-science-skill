      2017（S72，消费者行为的情境-任务视角）
    effect_size: 任务完成度/成本比显著更优时发生转换（案例研究传统）
    replication_status: JTBD 作为洞察方法被广泛使用；无严格实证复制传统（C 级实践理论，如实标注）
    context_dependency: 适用于转换时刻可识别、情境差异大的品类；纯习惯性购买（盐/纸巾）任务分析价值有限
    downgrade_upgrade_reason: 2026-09 实取 S77 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED
