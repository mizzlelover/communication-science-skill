    effect_size: 前台-后台模型与印象管理四策略；情境坍缩下表演策略变化
    replication_status: 剧场框架作为观察模型被反复应用于线上行为研究；量化复制难点在表演强度测量
    context_dependency: 观众可见性与面子 stakes 调节表演强度；匿名与低利害场景表演减弱
    downgrade_upgrade_reason: 2026-09 补充拟剧论奠基专著（S122，abstract_only 如实标注），由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED；2026-09-09
