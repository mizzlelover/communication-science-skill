- id: status_systems
  canonical_name_en: Status Systems
  canonical_name_zh: 地位系统
  domain: community
  definition: 地位系统（status systems）指社群内成员声誉与影响力的分配结构及其符号载体：等级头衔、积分、徽章、排行榜、被提及率、以及非正式的「谁说话有人听」。它是社群内注意力的产权制度——决定谁的贡献被看见、谁的行为被模仿、稀缺的发言权如何分配。
  core_claim: 社群的长期稳定依赖一套成员普遍认可的地位系统：贡献可被累积可见、地位与贡献大体对齐、上升通道可预期；地位系统失灵（贡献不公、纯资历、纯活跃刷量）是核心成员流失的重要内部原因之一（S82/S84
    从业者经验方向支持，无量化排序证据）。
  mechanism: 地位系统把社群稀缺资源（注意力、话语权重、决策参与）的分配规则化，成员通过贡献换取地位，地位带来回报（被回应、被信任、影响力），形成投入-认可循环。健康系统的关键是「地位与贡献对齐」：地位必须可挣得（基于行为而非出身）、可累积（不随遗忘清零）、可体现（他人能看见）且不太可交易（不能纯用钱买，否则贡献者失去意义）。Goffman
    式的自我呈现与社群规范共同定义了「什么算地位」。
  causal_chain: 贡献行为 → 地位信号累积（头衔/提及/认可） → 注意力与影响力回报 → 更多贡献 → 地位系统自我强化
  variables:
    inputs:
    - 贡献行为类型与频率
    - 地位符号的可见性
    moderators:
    - 社群对「什么算贡献」的共识
    - 系统的透明度
    - 规模（大社群更需要形式化系统）
    mediators:
    - 认可感知
    - 身份安全感
    - 影响力回报
    outputs:
    - 贡献持续性
    - 核心层稳定性
    - 社群文化走向
  evidence:
    supporting:
    - 声誉系统与徽章机制对贡献行为的激励效应在在线社区研究中得到支持（多平台研究，方向一致）
    - 组织行为学传统对地位层级与群体稳定性的分析（方向一致）
    conflicting:
    - 外在地位激励可能挤出内在动机（为徽章而贡献者质量下降），也可能引发「刷地位」行为（动机研究讨论）
    replication:
    - 「可见认可促进贡献」跨平台重复；激励扭曲的风险同样反复出现
    meta_analysis: []
  evidence_grade: B
  boundary_conditions:
  - 小社群（<100 人）靠关系即可承载地位，形式化系统多余；规模越大越需要形式化
  - 地位系统有效的前提是社群对「什么算贡献」有共识（知识社群认深度、粉丝社群认产出）
  failure_conditions:
  - 地位可纯用金钱购买（付费头衔碾压贡献者），贡献者退出
  - 排行榜只奖励总量（刷量）不奖励质量：内容生态劣化为灌水
  common_misinterpretations:
  - 「上排行榜就能激励」——排名只激励中上层成员，对底层是劝退；地位系统的第一使命是让「认真做事的人被看见」，不是制造竞赛
  - 把 status_systems 与 participation_ladder 混为一谈：阶梯描述参与分层结构，地位系统描述分层背后的认可与回报机制
  ethical_risks:
  - 地位分层固化为权力世袭（老成员特权阶层），新人上升通道关闭
  - 公开排名机制助长病态竞争与攀比焦虑
  examples:
    original_cases:
    - Goffman 对身份呈现与社会地位符号的分析传统（《The Presentation of Self》）
    research_cases:
    - 在线问答社区声誉分与贡献行为的纵向研究（方向一致）
    - 徽章激励机制对首次贡献的促进研究（多平台）
    modern_cases:
    - Discord 服务器的等级与自定义身份组
    - 开源社区的核心贡献者评审权（committers），论坛的元老勋章
  communication_implications: 内容传播中的地位语言（「资深用户说」「十年经验的人是这么看的」）是可信度杠杆；为社群头部成员制作个人品牌内容（访谈、方法总结）同时放大社群与个体。
  community_implications: 设计地位系统四问：贡献的定义对齐社群使命吗、挣得方式可预期吗、可见载体明确吗、有抗刷量设计吗；并保留「荣誉不可购买」的红线。
  content_applications:
    body: 正文引用具体成员与其贡献（带身份标签），让地位可见化成为内容的一部分
    narrative: 讲述「从新人到被大家信任」的成员成长故事，示范地位的可挣得性
    comments: 官方回应优先给真实贡献者（而非纯活跃者），用回应行为示范认可标准
    sharing: 为高地位成员设计可对外分享的身份资产（嘉宾卡、署名专栏）
  platform_implications: 平台的会员等级、认证标志与创作者分级是平台侧地位系统的强制层；社群自建地位系统必须与平台体系兼容（原则性判断）。
