- id: specificity_effect
  canonical_name_en: Specificity Effect (Numbers and Details)
  canonical_name_zh: 具体数字与细节的效能
  aliases:
  - 精确数字效应
  - specific numbers
  - 细节可信度
  domain: language_rhetoric
  definition: 精确数字与具体细节（『过去37个月，我们回撤最深的一次是11.4%』）相对模糊表述（『长期稳健，回撤很小』）在可信度、记忆与说服上的优势。与 concreteness_in_language
    相邻：concreteness 是语言层的可感性，specificity 聚焦数字精度与细节可信度功能——精确数字暗示作者掌握了底层数据，因而『知道内情』。
  core_claim: 精确数字与独特细节提升可信与记忆（因为编不出），但伪造的精确同样有效——它是信任信号而非真实性保证。
  mechanism: 精确数字的可信路径：小数点与非常规数值（11.4% vs 10%）暗示测量与记录的真实性（凑整像编的，精确像查的），触发『作者有底层数据』的推断；细节的独特性同理（可核查的细节难凭空编造）。记忆路径：具体数字提供锚点与提取线索。但注意边界：精确效应是启发式——编造的精确细节同样提升可信（伪信息的标配手法），且过度精确（小数点后四位）在高卷入受众中反而触发怀疑（你在哪测的？）。
  causal_chain: 精确数字/独特细节暴露 → 『有底层数据』推断 → 可信度与记忆提升 → 接受与转发 → （被核查或过精度时）反噬
  variables:
    inputs:
    - 数字的精确度（整数vs小数）
    - 细节的独特性与可核查性
    - 数字的出现密度
    moderators:
    - 受众核查能力与习惯
    - 领域利害度（高利害触发验证）
    - 数字与论点的相关度
    mediators:
    - 『知晓内情』推断
    - 记忆锚点
    outputs:
    - 可信度提升
    - 记忆留存提升
    - 转发保真度提升
    - （伪造被识破时）信任崩塌
  evidence:
    supporting:
    - 语言形式影响力框架（S70 EP：六类语言与 you vs I、could vs should 等形式对比；其 EP 未载精确数字条目，精确数字一手 EP 未建）
    - 细节具体性对记忆与传播保真的认知证据（gist vs verbatim 传统：具体细节支持逐字记忆）
    - 《Made to Stick》的可信度设计（S40，可信=细节佐证）
    conflicting:
    - 过精度反噬：超高精度的数字在高卷入受众中触发来源质疑
    - 数字密集不等于有效——无关数字是 seductive details
    - 精确效应可被伪造利用（伪精确是虚假信息的标准特征）
    replication:
    - 精确性-可信度关联的方向稳健
    - 最优精度区间因领域与受众而异（缺乏统一处方）
    meta_analysis:
    - 无独立 meta-analysis；以系列实验与语言研究综述为主
  evidence_grade: B
  validation_status: PARTIALLY_VALIDATED
  boundary_conditions:
  - 数字与论点直接相关（支撑同一主张）
  - 精度匹配领域惯例（预算精确到元、占比精确到一位小数）
  - 受众能感知数字获取路径的合理性
  failure_conditions:
  - 数字无法被任何合理途径获得（过精度=露馅）
  - 细节堆砌偏离论点（信息过载）
  - 被受众实际核查且对不上（一次证伪即全盘怀疑）
  common_misinterpretations:
  - 以为数字越多越可信——无关数字是装饰且挤占注意力，只留支撑论点的关键数字
  - 把精确当真实性的替代品：精确是信号不是证明，信号必须可回溯到真实数据源
  ethical_risks:
  - 伪精确（编造小数点数字制造可信感）
  - 精确数字的选择性呈现（真实数字的片面用法，与 emphasis framing 的滥用面相连）
  examples:
    original_cases:
    - 《Magic Words》对语言形式影响力的实验讨论（S70 EP：六类语言/you vs I/could vs should；未载精确数字条目）
    - 《Made to Stick》可信度章节的细节案例（S40）
    research_cases:
    - 精确vs圆整数字的可信度对比实验
    - 细节具体性对逐字记忆与转述保真的研究（gist/verbatim 传统）
    modern_cases:
    - 基金测评披露精确回撤点位与日期
    - 招聘文案的精确描述（『37人团队、平均司龄4.2年』）
    - 反例：编造的『92.7%的用户复购』被扒数据来源后翻车
  communication_implications: 关键主张配 1-3 个支撑数字即可，数字精度以『你能给出处』为上限：能截图的才写到小数点，给不出来的用保守表述；每个数字旁标注时间与口径（截至X月、含/不含X），防止断章。
  community_implications: 社群内容规范应要求数字带口径（数据从哪来、什么时间、含不含什么）：数字口径文化是社群避免幸存者偏差与数字造假的免疫力；管理员带头标注口径，形成成员的数字素养。
  content_applications:
    evidence: 数字三件套：数值+口径（怎么算的）+时间（截至何时），三者齐备才引用
    title: 标题数字优先于形容词：『3个月12篇笔记带来400个咨询』优于『高效获客经验』
    body: 核心数字在文中复现一次即可，重复堆数字触发对数的麻木
    comments: 对数字质疑直接贴原始记录（截图、链接），把核查行为变成可信度展示
  platform_implications: 平台的数字化指标文化（粉丝数、转化率截图）让精确数字成为身份货币，也催生截图造假产业链；平台对虚假数据的治理（成交额注水处罚）与创作者的口径透明化是同一枚硬币的两面。
