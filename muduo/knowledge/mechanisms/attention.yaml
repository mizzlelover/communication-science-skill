  - id: inattentional_blindness
    canonical_name_en: Inattentional Blindness
    canonical_name_zh: 无意视盲
    aliases: [不注意视盲, 非注意盲视 —— 与 selective_attention 的区别：视盲强调未被注意的信息完全无法进入意识报告这一后果]
    domain: attention
    definition: 当注意被占用时，视野内非常显眼的刺激也不会被有意识察觉。最著名的展示是隐形大猩猩实验：专注数传球的人看不见走过画面中间的装扮大猩猩。看过的东西未必被看见——注意而非视网膜决定意识内容。
    core_claim: 未被注意分配的显眼刺激不会进入有意识察觉，无论其物理显著性多高。
    mechanism: 注意是意识报告的瓶颈：未被选择的刺激可能在初级皮层有部分加工，但因缺乏注意增益而无法形成稳定的有意识表征。该效应与眼动无关——即使眼睛注视过该位置，仍可报告未见，说明视盲发生在注意与意识层面而非光学层面。
    causal_chain: "注意被任务占用 → 未注意刺激缺乏增益 → 无法形成意识表征 → 事后报告未见"
    variables: {inputs: [任务负载, 刺激显著性, 刺激与任务的语义关系], moderators: [任务熟悉度, 并行任务数量, 刺激位置与注视点的关系], mediators: [注意增益, 意识表征形成], outputs: [察觉率, 事后记忆]}
    evidence:
      supporting:
        - "Simons 与 Chabris 1999 的持续性无意视盲实验（S09 的实验基础）"
        - "Neisser 1970 年代的选择性观看双事件范式"
      conflicting:
        - "完全无加工有争议：未察觉刺激仍可能留下微弱的残余影响（无意识加工研究）"
      replication:
        - "核心现象被多种范式（视、听通道）稳健复制，成为注意研究的教学标准案例"
      meta_analysis: []
    evidence_grade: A
    boundary_conditions:
      - "负载越高越易发生；主任务越投入视盲越彻底"
      - "与眼动落点无关——注视过仍可能没看见"
    failure_conditions:
      - "刺激与任务语义高度相关（如自己的名字、自己的品牌）时察觉率上升"
      - "极显著的异类刺激在低负载下通常会被察觉"
    common_misinterpretations:
      - "只要出现在屏幕上用户就会看到——视盲说明呈现不等于被看见"
      - "把视盲当作视觉问题——它是注意问题，换更大的屏幕无解"
    ethical_risks:
      - "界面设计利用视盲隐藏关键信息（自动续费勾选、价格拆分项）"
    examples:
      original_cases:
        - "S09 整本书围绕六大注意错觉展开，视盲是其中最著名的一个"
      research_cases:
        - "隐形大猩猩实验：专注数传球者中相当比例未报告看到大猩猩"
      modern_cases:
        - "用户专注填写表单时对页面顶部的安全提示视而不见；开车看导航时错过行人"
    communication_implications: 不要假设曝光等于抵达；关键信息必须嵌入受众当前的任务流，或抢占其注意主任务的位置。
    community_implications: 重要规则若不在成员正在参与的活动流中出现，就会被系统性无视。
    content_applications:
      title: "把关键信息绑定到用户当前任务，而非并列放置"
      opening: "开场即锁定一个具体任务感，避免用户注意游离"
      body: "在用户注意力的高峰位置放置核心主张，而非页尾补充"
      cta: "避免在同一屏放置多个竞争任务"
    platform_implications: 插屏与浮层正是利用任务占用制造视盲以夹带信息；平台规范与广告可见性标准本质上是对视盲的商业化套利。
    related_nodes: [selective_attention, attention_capacity_limits, bottom_up_attention_capture, cocktail_party_effect]
    source_ids: [S09, S02, S141]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Chabris & Simons 2010《The Invisible Gorilla》（S09，1999 大猩猩实验 + 2024 eLife 边界研究）+ Kahneman 1973（S02，容量有限模型）"
      effect_size: "计数任务下约半数被试未察觉显著对象（持续性无意视盲）"
      replication_status: "无意视盲效应多实验室/现场重复；2024 大样本研究细化「完全视盲」边界"
      context_dependency: "任务负荷/对象显著性/期望调制效应强度"
      downgrade_upgrade_reason: "2026-09 实取 S09 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S09]
      supporting_evidence: [S02]
      last_verified: "2026-09"
    last_reviewed: "2026-09"

  - id: attention_residue
    canonical_name_en: Attention Residue
    canonical_name_zh: 注意残留
    aliases: [注意力残留 —— 与 attention_capacity_limits 的区别：本节点解释切换后绩效下降的残留来源；与 zeigarnik_effect 的关系：后者是未完成任务的记忆与动机效应，前者是其在任务切换中的资源后果]
    domain: attention
    definition: 任务切换后，前一任务未完成的部分继续占用注意资源，降低对新任务的投入，这一现象由 Leroy 的研究命名并系统化。多任务不是并行，而是带着残留的串行。
    core_claim: 切换后的绩效下降部分来自前一任务的残留激活，而非仅仅是切换的瞬态成本。
    mechanism: 未完成的目标保持认知激活（与蔡格尼克效应同族），切换后需要认知努力去抑制；S03 的数字工作观察显示知识工作者高频切换后难以回到深度状态，残留使每项任务都在低投入水平运行。
    causal_chain: "任务中断或切换 → 未完成目标保持激活 → 资源被残留占用 → 新任务投入不足"
    variables: {inputs: [任务切换频率, 前任务完成度, 前任务重要性], moderators: [收尾仪式, 任务边界清晰度, 个体工作记忆容量], mediators: [未完成目标的持续激活, 抑制努力], outputs: [新任务绩效, 深度工作时长, 错误率]}
    evidence:
      supporting:
        - "Leroy 2009 的任务切换实验提出并验证注意力残留概念"
        - "S03 对数字环境中高频切换与注意力碎片化的实地观察"
      conflicting:
        - "残留强度受任务性质调节：例行化任务间切换的残留远小于复杂任务"
      replication:
        - "概念较新，独立复制数量有限，多为实验室与现场研究的组合证据"
      meta_analysis: []
    evidence_grade: B
    boundary_conditions:
      - "前任务越未完成、越重要，残留越强"
      - "明确的完成仪式或书面收尾能显著减弱残留"
      - "S163：完成前任务不必然消除残留——完成时无时间压力者同样难以脱离，时间压力是脱离前任务并改善新任务绩效的条件"
    failure_conditions:
      - "前任务彻底结束后切换，残留很小"
      - "极熟练例行任务之间的切换几乎无残留"
    common_misinterpretations:
      - "多任务等于高效并行——实测多为残留状态下的串行降级"
      - "以为回复一条消息只需几秒——脱离主任务的心理成本远大于时间成本"
    ethical_risks:
      - "平台以高频通知把用户切成碎片以最大化广告曝光机会"
    examples:
      original_cases:
        - "S03 记录的知识工作者在通知环境中的高频任务切换观察"
      research_cases:
        - "Leroy 的实验：被中断组在后续任务上的表现劣于允许完成组的被试"
      modern_cases:
        - "开会时回消息，会后仍惦记消息内容；一边带娃一边工作的高错率"
    communication_implications: 长内容需要在设计上容忍残留——段落自含小结、可中断可续读，因为受众几乎必然带着残留来读你。
    community_implications: 社群活动设计要给成员提供清晰的开始与结束边界，帮助清空残留再进入下一段参与。
    content_applications:
      title: "小节自带结论，支持碎片化续读"
      opening: "用一个完成后的小任务（如回答是或否）帮助读者清空残留进入正文"
      body: "每节末尾给一句话收束，降低未完成感的累积"
      cta: "在单一场景中给出唯一动作，避免跨应用的多出口"
    platform_implications: 通知系统是残留的批量制造者；深色模式的专注模式与聚合通知本质是对残留成本的修复。
    related_nodes: [attention_capacity_limits, working_memory_limits, zeigarnik_effect, hook_model, information_overload, attention_economics]
    source_ids: [S03, S02, S163]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Mark 2023《Attention Span》（S03，打断后约 23 分钟回到原任务/自我打断约半）+ Kahneman 1973（S02，容量分配）"
      effect_size: "任务切换残留成本为分钟级（外部打断约 23 分钟回到原任务）"
      replication_status: "切换成本在 HCI/认知领域多源复现"
      context_dependency: "任务复杂度/目标强度调制残留时长"
      downgrade_upgrade_reason: "2026-09 实取 S03 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S03]
      supporting_evidence: [S02]
      last_verified: "2026-09"
    last_reviewed: "2026-09"

  - id: cocktail_party_effect
    canonical_name_en: Cocktail Party Effect
    canonical_name_zh: 鸡尾酒会效应
    aliases: [鸡尾酒会问题, cocktail party problem —— 与 selective_attention 的区别：本节点强调听觉通道的选择聚焦与自我相关信号的穿透现象]
    domain: attention
    definition: 在嘈杂的多说话人环境中，人能选择性追随一个语音流，同时会对未注意流中的自我相关信号（如自己的名字）作出反应。Cherry 1953 的双耳分听研究奠基，Moray 1959 发现未注意耳中的自己名字会穿透（Cherry 1953／Moray 1959 为经典文献，未建 EP；S02 提供双耳分听实验传统背景）。
    core_claim: 听觉注意可高效聚焦于单一语音流（S02 容量模型的经验基础）；自我相关信号的低阈值穿透为双耳分听传统级支持，Moray 1959 为经典文献（未建 EP）。
    mechanism: 双耳分听实验显示，被追随耳的内容可以复述，非追随耳只剩物理特征（性别、音调）被登记；但自我参照信息有特殊优先级，名字等信号能穿透过滤并引发定向反应。这说明过滤器对高个人相关性信息留有旁路。
    causal_chain: "多流语音竞争 → 选择聚焦单一流 → 非流信息仅登记物理特征 → 自我相关信号穿透引发反应"
    variables: {inputs: [多语音流竞争, 目标流信号质量], moderators: [语音流相似度, 个体负载, 自我相关性], mediators: [听觉选择性注意, 自我参照加工], outputs: [追随内容理解, 未注意内容记忆（几乎为零）, 定向反应]}
    evidence:
      supporting:
        - "Cherry 1953 的双耳分听实验确立现象（经典文献，未建 EP）"
        - "Moray 1959 发现未注意通道中自己的名字被察觉（经典文献，未建 EP）"
      conflicting:
        - "语义穿透程度有限：除自我相关信息外，未注意流的语义几乎不加工"
      replication:
        - "现象稳健，是听觉注意研究的标准范式"
      meta_analysis: []
    evidence_grade: A
    boundary_conditions:
      - "穿透主要发生于自我相关或高显著信号"
      - "语义分析程度随负载升高而下降"
    failure_conditions:
      - "极高负载下名字穿透率也下降"
      - "信号高度相似（同性别同音色）时追随错误增多"
    common_misinterpretations:
      - "用户在后台播放播客等于接收了内容——未注意内容几乎不形成记忆"
      - "以为重复播放就能被听到——被听到与被注意是两回事"
    ethical_risks:
      - "用用户姓名做个性化触发的操纵感风险（过度直呼其名）"
    examples:
      original_cases:
        - "S02 的双耳分听/选择性注意实验传统（容量模型的经验基础）"
      research_cases:
        - "双耳分听：追随耳复述良好，未注意耳仅能报告说话人性别等物理特征"
      modern_cases:
        - "群聊里只有被 @ 的消息才让人抬头——平台用 @ 机制复现了名字穿透"
    communication_implications: 在嘈杂信息环境中，自我相关性是最强的穿透器：点名、分群、个性化场景都是现代版的名字穿透。
    community_implications: 社群运营中，@、昵称、专属称呼是低成本高收益的注意唤起手段，但要节制以避免操纵感。
    content_applications:
      title: "让标题对特定人群点名（身份标签式开头）"
      opening: "用你是那种……的人建立自我相关性"
      body: "分段用不同人群的例子，让每个读者都遇到自己的名字时刻"
      cta: "邀请读者以自己身份留言（如 XX 行业的朋友扣 1）"
    platform_implications: 平台的个性化推荐本质是把名字穿透扩展到兴趣层：只有自我相关的内容能穿透信息流噪音。
    related_nodes: [selective_attention, bottom_up_attention_capture, attention_capacity_limits, identity_signaling]
    source_ids: [S02, S09, S141]
    validation_status: PARTIALLY_VALIDATED
    grade_justification:
      independent_studies: "Kahneman 1973（S02，选择性注意容量）+ Chabris & Simons 2010（S09，注意错觉与自我相关性）"
      effect_size: "自我相关刺激（如名字）穿透选择性过滤器"
      replication_status: "鸡尾酒会效应为注意研究经典稳健现象"
      context_dependency: "显著性/自我相关/注意负荷调制效应"
      downgrade_upgrade_reason: "2026-09 实取 S02/S09 核心内容，由 MEMORY_BASED 升级为 PARTIALLY_VALIDATED"
    provenance:
      primary_sources: [S02]
      supporting_evidence: [S09]
      last_verified: "2026-09"
    last_reviewed: "2026-09"
