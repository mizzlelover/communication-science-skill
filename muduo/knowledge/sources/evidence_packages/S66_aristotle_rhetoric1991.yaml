  - "ethos：信誉证明——演讲者的品格/权威/专长（被知觉的信任）；pathos：情感证明——调动听众情绪（愤怒/怜悯/恐惧等）；logos：逻辑证明——论证与证据"
  - "kairos：时机——有效修辞依赖恰当的时机与情境匹配；三诉求组合使用最强（单用效果有限）"
  - "对情绪的定义：'改变人们判断并伴随苦乐的情感'（愤怒/怜悯/恐惧及其对立面）——构成恐惧诉求等现代传播研究的基础"
method: "古典修辞学理论（演讲/公民话语的实践艺术，三卷）"
