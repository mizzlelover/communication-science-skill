- id: intrinsic_extrinsic_motivation
  canonical_name_en: Intrinsic vs Extrinsic Motivation (Overjustification Effect)
  canonical_name_zh: 内在动机与外在动机（过度理由效应）
  aliases:
  - 内在动机
  - 外部奖励
  - overjustification effect
  - 动机排挤
  domain: motivation
  definition: 内在动机指行为本身即目的，外在动机指行为由外部奖惩驱动。过度理由效应（overjustification effect）指对本有内在兴趣的活动施加预期性外部奖励，会削弱之后的自发投入——奖励改变了行为的归因理由（『我做它是因为有奖』）。与
    variable_ratio_reward 的关系：强化程序描述奖励如何塑造行为频率，本节点描述奖励何时侵蚀动机质量，两者构成张力。
  core_claim: 预期性、控制性的外部奖励会降低个体对原本有趣活动的后续自发参与。
  mechanism: 自我知觉与归因：当外部理由足够充分，个体把行为归因于奖励而非兴趣；奖励同时传递控制信号，削弱自主感（S14）。Deci 的实验与 Lepper、Greene、Nisbett 1973
    年对儿童的画画奖励实验是经典证据；Deci、Koestner 与 Ryan 1999 的元分析确认削弱效应主要出现在预期性、实物性、与任务绩效挂钩的奖励上（S118 明文记载，abstract_only）；Eisenberger
    与 Cameron 则对该效应的边界提出有力质疑，认为可感知胜任的奖励反而促进投入——争议聚焦于奖励类型与条件，而非『有无效应』（文献常识，未建包）。
  causal_chain: 预期性外部奖励 → 行为归因从兴趣转向奖励 + 自主感受损 → 内在动机削弱 → 撤奖后参与下降
  variables:
    inputs:
    - 奖励类型（实物/口头）
    - 奖励是否预期
    - 奖励是否与绩效挂钩
    - 任务内在趣味性
    moderators:
    - 奖励的信息性 vs 控制性
    - 奖励规模的突兀度
    - 个体成就取向
    mediators:
    - 归因变化
    - 自主感知损
    - 胜任反馈
    outputs:
    - 无奖励期的自发参与度
    - 创造性表现
    - 长期留存
  evidence:
    supporting:
    - Deci 1971 起的实验系列与 Deci、Koestner、Ryan 1999 元分析（128 项实验）：预期性实物奖励削弱后续内在动机；挤出依赖奖励预期性×任务内在趣味的边界条件（S118
      明文记载：overjustification 效应 + DKR 1999 元分析 + 挤出边界条件，abstract_only）
    - Lepper、Greene、Nisbett 1973 儿童绘画奖励实验（经典实验）
    conflicting:
    - Eisenberger 与 Cameron 的再元分析与批评：奖励若传递胜任信息则增强投入，削弱效应边界被高估（学术争议；文献常识，未建包）
    replication:
    - 削弱效应在预期性、控制性奖励条件下复制较稳；对『一切奖励都有害』的解读不成立。评级按枚举记 B
    meta_analysis:
    - Deci、Koestner & Ryan 1999 元分析与 Eisenberger & Cameron 的再分析构成正反两面证据
  evidence_grade: B
  boundary_conditions:
  - 任务本身具有内在趣味时削弱效应才明显；枯燥任务上外部奖励通常促进投入
  - 奖励 unexpected（意外惊喜）或纯信息性（表扬进步）时，削弱效应弱或反向
  failure_conditions:
  - 把奖励设计成对胜任的反馈（里程碑庆祝）而非交易筹码时
  - 任务完全外部驱动（补贴拉新）且无意培养内在兴趣时，该效应不构成问题
  common_misinterpretations:
  - 『发奖励一定更好』：对兴趣型社区（创作、学习）滥发交易型奖励会赶走真正的核心贡献者
  - 『一切奖励都有害』：信息性、意外性奖励不触发过度理由效应
  ethical_risks:
  - 以补贴制造依赖再撤资，转嫁学习成本给用户与创作者
  examples:
    original_cases:
    - Self-Determination Theory（S14）中的奖励排挤案例与教育情境讨论
    research_cases:
    - Lepper、Greene & Nisbett 1973 儿童绘画实验；Deci 的索玛方块实验系列
    modern_cases:
    - 创作者平台补贴退坡后产量骤减；知识社群从现金激励转向荣誉与成长体系
  communication_implications: 对 UGC 活动少用『投稿就给钱』框架，多用『作品被看见+能力被认证+社群被回馈』框架，奖励作为惊喜而非筹码。
  community_implications: 激励机制分层：交易型奖励留给需要量的任务，荣誉型、成长型信号留给需要质量的贡献。
  content_applications:
    body: 把奖励描述为对过程的认可（『这是对你这轮练习的纪念』）而非完成条件
    cta: 邀请式而非交易式：『来把这件事做得更有趣』优于『做完拿红包』
  platform_implications: 平台的现金激励计划普遍遭遇『补贴依赖→撤资塌方』曲线，印证动机排挤；长期健康度取决于能否把外部理由转换为胜任与归属。
