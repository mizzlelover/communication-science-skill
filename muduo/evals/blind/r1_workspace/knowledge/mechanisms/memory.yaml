  validation_status: PARTIALLY_VALIDATED
  grade_justification:
    independent_studies: Tulving & Thomson 1973 编码特异性原则论文（S149，substantial_excerpt：再认失败范式实验细节经中科院心理所综述+第三方词条多源交叉核实）
    effect_size: S149 实验 1：线索回忆 P(Rc)=0.63 vs 目标词再认 P(Rn)=0.26；『能回忆但不能再认』与反向之比 15:1（ground-COLD 范式）
    replication_status: 编码-提取线索匹配总原则稳健；语义线索通常强于物理环境线索，物理环境线索作用随间隔拉长衰减（Tulving-Wiseman 函数刻画边界条件）
    context_dependency: 线索有效性取决于编码时是否实际加工该信息，而非线索-目标的绝对联想强度
    downgrade_upgrade_reason: 2026-09 反向审计：原 grade_justification 系自 working_memory_limits 错位复制的工作记忆内容（容量
      4±1/语音环 1-2 秒），按 S149 EP 编码特异性本体重写；primary_sources 由 S116 改为 S149（S116 EP 无编码特异性内容）；Godden & Baddeley
      1975 潜水员实验为经典文献未建包，标注记忆级；S04/S05 降为背景；2026-09-09 同书重复登记合并 S116→S04（S04 为 annotated 实质版），引用重定向至 S04，S116
      标 MERGED_INTO 移出注册表
