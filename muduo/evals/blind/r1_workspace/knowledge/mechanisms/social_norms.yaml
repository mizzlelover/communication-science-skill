    effect_size: 方向稳健、效应中等
    replication_status: 描述性规范干预 meta 平均有效、异质性高；回旋镖效应多领域重复
    context_dependency: 回旋镖效应依赖指令性信号补足；参照群体身份匹配是关键
    downgrade_upgrade_reason: 2026-09 补充一手现场实验证据（S102/S103/S104），升级为 PARTIALLY_VALIDATED
