  - id: attitude_behavior_gap
    canonical_name_en: Attitude-Behavior Gap
    canonical_name_zh: 态度-行为差距
    aliases: ["态度行为不一致", "LaPierre 悖论", "Wicker 鸿沟"]
    domain: attitude_change
    definition: "态度与行为之间常出现的系统性脱节：LaPierre 1934 年的经典研究随一对中国夫妇周游美国，绝大多数店家热情接待，但事后书面询问时绝大多数店家表示不会接待中国人——口头态度与实际行为严重背离。Wicker 1969 年的综述进一步指出态度对行为的预测力总体很低，推动了 Ajzen 理性行动/计划行为理论等修正。"
    core_claim: "口头态度本身几乎不预测行为：预测力来自具体性匹配（对具体行为的具体态度）、行为控制感与社会规范的结构化考量（计划行为理论）。"
    mechanism: "脱节的来源：（1）测量错位——一般态度（对群体的笼统态度）vs 具体行为（接待这一对衣着得体的具体客人），抽象层级不匹配则不预测（Fishbein 与 Ajzen 的对应原则，经典文献未建包）；（2）多重决定——行为同时受主观规范（别人会怎么看）、知觉行为控制（我做得到吗）与情境约束影响；（3）社会赞许性——问卷上的表态是印象管理而非真实态度；（4）态度强度低（见 attitude_strength_accessibility）——弱态度不激活、不指导行为。"
    causal_chain: "一般化态度（问卷表态） + 具体情境中的规范/控制/成本约束 → 行为由多重因素决定 → 态度与行为脱节"
    variables:
      inputs: [一般态度, 主观规范, 知觉行为控制, 情境约束与成本]
      moderators: [态度-行为的具体性匹配度, 态度强度与直接经验, 社会赞许性压力, 行为的可观察性]
      mediators: [行为意向（仅当具体性匹配时中介）, 情境中的即时权衡]
      outputs: [表态与行为的分离, 问卷数据的预测失灵, （匹配条件下）态度-行为一致]
    evidence:
      supporting: ["LaPierre 1934 的旅行-问卷研究：实际接待行为与书面态度的巨大反差（经典文献，已建包 EP S198）", "Wicker 1969 的综述：态度-行为相关总体偏低（经典文献，已建包 EP S198）", "计划行为理论（Ajzen）的修正：具体性匹配与行为控制显著提升预测力（经典文献，已建包 EP S198）", "S148 恐惧诉求 meta：强恐惧诉求+高效能信息产生最大的行为改变，强恐惧诉求+低效能信息产生最高水平的防御性反应——唤起不等于行为，效能信息决定走向"]
      conflicting: ["当态度与行为在具体性上匹配、态度强且直接经验形成时，预测力显著回升（整体鸿沟被高估为普遍规律）", "强态度+弱情境下态度预测行为相当好"]
      replication: ["LaPierre 悖论作为现象被广泛复制与扩展", "计划行为理论对意向-行为的预测提升获得大量支持（意向-行为本身仍有鸿沟，即『意向-行为差距』）"]
      meta_analysis: ["态度-行为关系的元整合（Fishbein 与 Ajzen 传统）确认：对应原则下预测力高，错配下预测力低"]
    evidence_grade: "A"
    validation_status: PARTIALLY_VALIDATED
    boundary_conditions: ["测量一般态度并预测具体行为时鸿沟最大", "行为有高社会赞许性压力时表态与行为分离更大", "弱态度、无直接经验时几乎不预测"]
    failure_conditions: ["态度与行为具体性匹配（对『这个月去健身房』的态度预测去健身房）", "强态度+直接经验+弱情境规范压力", "行为成本低且即时（无控制感阻碍）"]
    common_misinterpretations: ["把 LaPierre 悖论解读为『人们都是伪君子』——它更多是测量错位与情境力量的产物（S19 的人-情境视角）", "误以为问卷调查能预测购买行为：表态数据的预测力必须按对应原则校正"]
    ethical_risks: ["利用表态与行为的差距制造虚假民意（问卷操纵、点赞当支持率）", "以口头承诺的表态数据误导商业与政策判断"]
    examples:
      original_cases: ["LaPierre 1934 的美国旅行研究（经典文献，已建包 EP S198）", "Wicker 1969 的态度-行为综述（经典文献，已建包 EP S198）"]
      research_cases: ["LaPierre 的接待行为与问卷对比", "计划行为理论的意向-行为预测研究", "对应原则的测量匹配实验"]
      modern_cases: ["问卷『愿意为隐私付费』vs 实际免费交出数据", "环保态度调查与实际分类回收率", "点赞收藏『收藏=学会』的虚假完成感（表态替代行为的数字版）", "『支持国产』表态与实际购买选择"]
    communication_implications: "不要用表态数据（点赞、问卷、口头支持）估计行为转化：设计行为测量（试用、留存、复购）才是真实指标；内容设计要把『表态』转化为低成本真实行为（下一句话就问：你现在打开 App 看一眼？）以缩小差距。"
    community_implications: "社群调研中的『大家都说好』与实际参与率脱节是常态：用行为数据（到场率、完课率、续费率）校准认知；同时利用承诺一致性把口头支持升级为公开小承诺，缩小表态-行为差距。"
    content_applications:
      cta: "把 CTA 设计为最小真实行为而非表态：『现在就打开 App 完成第一步』优于『觉得有用点个赞』"
      evidence: "用行为数据（留存、复购）替代表态数据（好评数）作为证据呈现"
      body: "正文预判态度-行为断点：读者认同后立即给出消除控制感障碍的具体路径（时间、工具、第一步）"
      title: "标题避免纯表态式共鸣（『说的就是我』），引导到行为预期（『今晚就能做的三件事』）"
    platform_implications: "平台的点赞/收藏/转发是表态层行为，与深层行为（购买、学习、改变）之间存在结构性鸿沟；算法以表态层互动为优化目标，系统性高估『支持度』——这影响推荐、广告定价与创作者对需求的判断。"
    related_nodes: [attitude_strength_accessibility, cognitive_dissonance, normative_influence, implementation_intentions, commitment_consistency, perceived_purchase_risk, self_presentation_impression_management]
    source_ids: [S21, S35, S19, S148, S198, S199]
    provenance:
      primary_sources: ['S198', 'S199']
      last_verified: "2026-09-09"
