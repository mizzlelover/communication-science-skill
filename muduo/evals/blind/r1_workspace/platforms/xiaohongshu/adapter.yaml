platform_name: 小红书（Xiaohongshu）
last_updated: "2026-09"
fact_confidence_summary: >-
  信息基础（2026-09 实取官方材料后更新）：商业报备义务、导流治理、违规处理措施
  有官方文档支持（L1：社区规范/社区公约2.0/蒲公英平台）；双列分发、搜索心智、
  CES 互动评分、封面机制等仍为行业共识（L3，官方未公开算法）。
  图文图片上限 18 张、正文 1000 字等原标 official_rule 的条目本次实取未获官方文档支持，
  已降级标注为 L3。所有标注以平台最新公告为准，使用 update_platform_knowledge 流程复核。

