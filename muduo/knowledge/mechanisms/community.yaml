- id: reciprocity_exchange_networks
  canonical_name_en: Reciprocity and Exchange Networks
  canonical_name_zh: 互惠交换网络
  aliases:
  - 互惠网络
  - social exchange（社会交换）
  domain: community
  definition: 互惠交换网络（reciprocity exchange networks）指社群内成员间资源（信息、帮助、情感支持、机会）的给予-回报流动结构。Gouldner 的互惠规范（norm
    of reciprocity）与社会交换理论（Thibaut & Kelley 的相互依赖理论）共同指出：互惠是人际信任与群体团结的基本生成机制；「平衡的互惠」建立关系，「延迟与不对等的互惠」制造地位差与依赖。
  core_claim: 社群团结感来自成员间可感知的互惠循环（我的给予终将以某种形式回来）；单向索取或纯利他无循环的社群，关系网络稀薄而脆弱。
  mechanism: 互惠通过「给予 → 感激 → 回报 → 关系加深」的循环积累相互依赖与信任：每次给予都是对关系的投资，回报确认了对方的善意，循环往复形成稳定的交换期望。在线上社群中，互惠更多以「广义互惠」形态存在（我帮助陌生人，因为我曾被帮助过）：匿名与规模使逐个偿还不可行，社群通过共同的助人文化承载互惠预期。互惠网络还产生结构效应：频繁互惠的成员形成高密度子群，成为社群的信任核心。
  causal_chain: 给予行为 → 感激与可见认可 → 回报（直接或广义） → 相互依赖与信任累积 → 团结感与网络密度提升
  variables:
    inputs:
    - 成员的给予行为频率
    - 回报的可感知性
    moderators:
    - 社群规模（大社群依赖广义互惠）
    - 助人成本
    - 认可见度（给予是否被看见）
    mediators:
    - 感激与义务感
    - 信任累积
    - 助人文化的规范内化
    outputs:
    - 关系网络密度
    - 求助响应率
    - 社群团结感与韧性
  evidence:
    supporting:
    - Gouldner 对互惠规范作为普适道德原则的论证（经典论文；库外无 EP，经 S179/S30 间接承接，EP 待建）
    - 社会交换理论对关系形成与稳定的实验与调查证据（Thibaut & Kelley 传统）
    - Cialdini 对互惠原则在说服中的应用综合（Influence）
    - Regan 可乐实验（经 S32 EP 转述：25 美分可乐使彩票购买翻倍且独立于喜好）：不请自来的给予触发感激与回报，为「给予→感激→回报」循环提供微观实验证据
    conflicting:
    - 过度记账式的互惠（当面算清）会削弱关系性质；纯市场逻辑与关系逻辑存在张力（交换研究讨论）
    - 「回旋镖式」的主动帮助可能触发亏欠感反感（应用研究讨论）
    replication:
    - 互惠促进信任与合作的方向在实验经济学与社会心理学中被大规模重复
    meta_analysis: []
  evidence_grade: B+
  boundary_conditions:
  - 互惠循环需要给予行为被看见且被归因于给予者（可见性是循环的起点）
  - 小社群可依靠直接互惠；大社群必须建设广义互惠文化（否则逐对互惠不成立）
  failure_conditions:
  - 只索取不回馈的成员比例过高时，助人者倦怠退出（公地悲剧）
  - 用「必须回报」的压迫式互惠（道德绑架）把关系变成债务，触发 reactance
  common_misinterpretations:
  - 「先给红包再求转发」——这是交易不是互惠；互惠的关键是让受助者产生自发的感激与回报意愿，明码标价的给予杀死了这条通路
  - 把 reciprocity_exchange_networks 与 reciprocity_norm 混为一谈：norm 是个体层面的心理规范（Cialdini 六原则之一），exchange network
    是社群层面的资源流动结构
  ethical_risks:
  - 互惠被武器化为「人情债」操纵（先施小恩后索取不成比例的回报）
  - 以互助为名的互惠网络演变为资源私占与排他小团体
  examples:
    original_cases:
    - Gouldner「互惠规范是普遍道德原则」的论证与社会交换理论的经典框架（Thibaut & Kelley）
    research_cases:
    - 实验经济学中信任博弈与礼物交换对互惠稳定性的重复验证（方向一致）
    modern_cases:
    - 知识社群「我解答你的问题，你分享我的文章」的技能交换
    - 开源社区「被帮助后回馈文档/PR」的文化
    - 邻里群拼单与看护轮值表
  communication_implications: 内容营销中的互惠设计（免费深度内容换取关注）必须让「礼物感」真实：不设回报预期、不给回收压力，互惠循环才启动；赠送即索取的「伪互惠」一眼即穿。
  community_implications: 把「让给予可见」作为运营核心机制：公开感谢、求助响应榜、「被帮助过的人来帮新人」的传承设计；监测求助响应率作为社群健康度指标。
  content_applications:
    body: 正文本身就是给予行为：把最有价值的部分免费给出，并在结尾说明「这份整理来自社群成员的共创」（互惠溯源）
    comments: 官方与资深成员示范「认真回评每个真诚提问」，把评论区变成助人规范的展示场
    sharing: 分享物设计为「转给需要它的人」的利他场景，激活广义互惠叙事
  platform_implications: 平台的打赏、感谢与积分功能把互惠部分货币化；货币化提升了给予动力但也可能挤出自发助人（内在动机挤出风险）（原则性判断）。
